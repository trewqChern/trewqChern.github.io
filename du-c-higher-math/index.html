imes 2$ বিপরীত ম্যাট্রিক্সের শর্টকাট","latex":"A = \\begin{pmatrix} a & b \\\\ c & d \\end{pmatrix} \\implies A^{-1} = \\frac{1}{ad-bc}\\begin{pmatrix} d & -b \\\\ -c & a \\end{pmatrix}","whenToUse":"$ad - bc \\neq 0$ হলে যেকোনো $2 \\times 2$ ম্যাট্রিক্সের বিপরীত নির্ণয়ে।"},{"label":"অনুবন্ধী ম্যাট্রিক্সের ধর্ম","latex":"A \\cdot \\operatorname{adj}(A) = |A| I_n, \\qquad |\\operatorname{adj}(A)| = |A|^{n-1}, \\qquad |A^{-1}| = \\frac{1}{|A|}","whenToUse":"$3 \\times 3$ ম্যাট্রিক্সের অনুবন্ধী বের না করেই $|\\operatorname{adj}(A)|$ বা $A\\cdot\\operatorname{adj}(A)$ নির্ণয়ে।"},{"label":"ক্রেমারের নিয়ম","latex":"x = \\frac{D_x}{D}, \\quad y = \\frac{D_y}{D} \\quad (D \\neq 0)","whenToUse":"রৈখিক সমীকরণ জোট থেকে সরাসরি একটি নির্দিষ্ট চলকের মান বের করতে।"}],"symbols":[{"sym":"$\\operatorname{adj}(A)$","meaning":"অনুবন্ধী ম্যাট্রিক্স: সহগুণক ম্যাট্রিক্সের বিম্ব"},{"sym":"$A^{-1}$","meaning":"বিপরীত ম্যাট্রিক্স, যেখানে $AA^{-1} = I$"},{"sym":"$D, D_x, D_y$","meaning":"ক্রেমারের নিয়মে সহগ ও প্রতিস্থাপিত নির্ণায়কসমূহ"}],"example":{"problem":"$k$-এর কোন মানের জন্য $A = \\begin{pmatrix} k-2 & 3 \\\\ 4 & 6 \\end{pmatrix}$ একটি ব্যতিক্রমী ম্যাট্রিক্স হবে?","steps":["ব্যতিক্রমী ম্যাট্রিক্স হওয়ার শর্ত $|A| = 0$।","$6(k - 2) - (3)(4) = 0 \\implies 6k - 12 - 12 = 0$।","$6k = 24 \\implies k = 4$।"],"answer":"$k = 4$"},"tip":"$2 \\times 2$ অনুবন্ধীর কৌশল: 'প্রধান কর্ণে স্থান বদল, অপ্রধান কর্ণে চিহ্ন বদল' ($a \\leftrightarrow d$, $b \\to -b$, $c \\to -c$)।","check":{"q":"$A$ একটি $3 \\times 3$ ম্যাট্রিক্স এবং $|A| = 5$ হলে $|\\operatorname{adj}(A)|$ কত?","a":"$|\\operatorname{adj}(A)| = |A|^{3-1} = 5^2 = 25$।"},"mythBuster":{"statement":"ক্রেমারের নিয়মে $D = 0$ হলে সমীকরণ জোটের কোনো সমাধান থাকে না।","isTrue":false,"why":"$D = 0$ হওয়ার পাশাপাশি $D_x, D_y$ সবগুলো $0$ হলে অসংখ্য সমাধান থাকতে পারে; অন্তত একটি লব অশূন্য হলে তবেই কোনো সমাধান থাকে না।"}}],"mcqs":[{"id":"alg_matrices_q1","cardId":"alg_matrices_c1","qType":"conceptual","conceptGroup":"matrix_type_properties","q":"যেকোনো "id":"alg_matrices_q5","cardId":"alg_matrices_c3","qType":"conceptual","conceptGroup":"det_and_transpose_laws","q":"কোনো নির্ণায়কের দুটি সারি পরস্পর স্থান বিনিময় করলে এর মানের কী পরিবর্তন হয়?","opts":["চিহ্ন পরিবর্তিত হয়","মান শূন্য হয়ে যায়","মান অপরিবর্তিত থাকে","মান দ্বিগুণ হয়ে যায়"],"ans":0,"tags":["board-standard","no-calc-shortcut"],"exp":"যেকোনো দুটি সারি বা কলাম পরস্পর বিনিময় করলে নির্ণায়কটি $-1$ দ্বারা গুণ হয়, অর্থাৎ চিহ্ন উল্টে যায়। কেবল দুটি সারি অভিন্ন বা সমানুপাতিক হলেই মান শূন্য হয়।","variants":[]},{"id":"alg_matrices_q6","cardId":"alg_matrices_c3","qType":"conceptual","conceptGroup":"det_and_transpose_laws","q":"$A$ একটি $n \\times n$ ক্রমের ম্যাট্রিক্স এবং $k$ একটি স্কেলার হলে $|kA|$-এর মান কত?","opts":["$k|A|$","$k^n |A|$","$n k |A|$","$k^{n-1} |A|$"],"ans":1,"tags":["pyq-pattern","formula-trap"],"exp":"$kA$ ম্যাট্রিক্সের $n$টি সারির প্রতিটিই $k$ দ্বারা গুণ হয়, তাই প্রতিটি সারি থেকে $k$ কমন নিলে $k^n |A|$ পাওয়া যায়। $k|A|$ কেবল একটি সারিকে গুণ করলে প্রযোজ্য।","variants":[]},{"id":"alg_matrices_q7","cardId":"alg_matrices_c4","qType":"conceptual","conceptGroup":"singularity_and_cramer","q":"একটি বর্গ ম্যাট্রিক্স $A$-এর বিপরীত ম্যাট্রিক্স $A^{-1}$ বিদ্যমান থাকার প্রয়োজনীয় ও পর্যাপ্ত শর্ত কী?","opts":["$A$ প্রতিসম হতে হবে","$|A| = 0$","$|A| \\neq 0$","$\\operatorname{tr}(A) \\neq 0$"],"ans":2,"tags":["board-standard","pyq-pattern"],"exp":"যেহেতু $A^{-1} = \\frac{1}{|A|}\\operatorname{adj}(A)$, তাই $|A| \\neq 0$ (অব্যতিক্রমী ম্যাট্রিক্স) হলেই কেবল বিপরীত বিদ্যমান থাকে। ট্রেস $0$ হলেও বিপরীত থাকতে পারে, যেমন $\\begin{pmatrix}0 & 1\\\\1 & 0\\end{pmatrix}$।","variants":[]},{"id":"alg_matrices_q8","cardId":"alg_matrices_c4","qType":"conceptual","conceptGroup":"singularity_and_cramer","q":"যেকোনো $n \\times n$ বর্গ ম্যাট্রিক্স $A$-এর জন্য $A \\cdot \\operatorname{adj}(A)$-এর মান কত?","opts":["$I_n$","$|A|$","$|A|^{n-1} I_n$","$|A| I_n$"],"ans":3,"tags":["formula-trap","board-standard"],"exp":"কোনো সারির ভুক্তিগুলোকে নিজস্ব সহগুণক দিয়ে গুণ কর ces_c4","qType":"numerical","conceptGroup":"det_product_inverse","q":"$A$ ও $B$ দুটি $3 \\times 3$ ম্যাট্রিক্স এবং $|A| = 3, |B| = 6$ হলে $|A^2 B^{-1}|$-এর মান কত?","opts":["$1$","$\\frac{1}{2}$","$\\frac{3}{2}$","$54$"],"ans":2,"tags":["pyq-pattern","no-calc-shortcut"],"exp":"নির্ণায়কের গুণন ধর্ম অনুযায়ী $|A^2 B^{-1}| = |A|^2 / |B| = 3^2 / 6 = 9/6 = 3/2$। $|A|$ বর্গ করতে ভুললে $1/2$ আসে।","variants":[{"q":"$|A| = 4$ এবং $|B| = 2$ হলে $|A^{-1} B^3|$-এর মান কত?","opts":["$2$","$4$","$\\frac{1}{2}$","$32$"],"ans":0,"exp":"$|A^{-1} B^3| = |B|^3 / |A| = 2^3 / 4 = 8/4 = 2$।"},{"q":"$|A| = 5$ এবং $|B| = 10$ হলে $|(AB)^{-1}|$-এর মান কত?","opts":["$50$","$\\frac{1}{50}$","$\\frac{1}{15}$","$2$"],"ans":1,"exp":"$|(AB)^{-1}| = \\frac{1}{|A||B|} = \\frac{1}{5 \\times 10} = \\frac{1}{50}$।"}]},{"id":"alg_matrices_q24","cardId":"alg_matrices_c4","qType":"numerical","conceptGroup":"cramers_rule_solve","q":"$2x + y = 7$ এবং $x - y = 2$ সমীকরণ জোটে ক্রেমারের নিয়মে $D_x$ ও $x$-এর মান কত?","opts":["$D_x = -9, \\; x = -3$","$D_x = 9, \\; x = 3$","$D_x = -5, \\; x = \\frac{5}{3}$","$D_x = -9, \\; x = 3$"],"ans":3,"tags":["written-convert","board-standard"],"exp":"এখানে $D = \\begin{vmatrix}2 & 1\\\\1 & -1\\end{vmatrix} = -3$ এবং $D_x = \\begin{vmatrix}7 & 1\\\\2 & -1\\end{vmatrix} = -7 - 2 = -9$, ফলে $x = (-9)/(-3) = 3$।","variants":[{"q":"$3x + 2y = 12$ এবং $x - y = -1$ সমীকরণ জোটে ক্রেমারের নিয়মে $x$-এর মান কত?","opts":["$2$","$3$","$4$","$-2$"],"ans":0,"exp":"$D = \\begin{vmatrix}3 & 2\\\\1 & -1\\end{vmatrix} = -5$ এবং $D_x = \\begin{vmatrix}12 & 2\\\\-1 & -1\\end{vmatrix} = -10$, ফলে $x = (-10)/(-5) = 2$।"},{"q":"$x + 3y = 11$ এবং $2x + y = 7$ সমীকরণ জোটে ক্রেমারের নিয়মে $y$-এর মান কত?","opts":["$2$","$4$","$1$","$3$"],"ans":3,"exp":"$D = \\begin{vmatrix}1 & 3\\\\2 & 1\\end{vmatrix} = -5$ এবং $D_y = \\begin{vmatrix}1 & 11\\\\2 & 7\\end{vmatrix} = -15$, ফলে $y = (-15)/(-5) = 3$।"}]},{"id":"alg_matrices_q25","cardId":"alg_matrices_c3","qType":"numerical","conceptGroup":"vandermo 3x + 2 - 6 = 0 \\implies x^2 - 3x - 4 = 0$।","উৎপাদকে বিশ্লেষণ করে পাই: $(x - 4)(x + 1) = 0$।","অতএব $x = 4$ অথবা $x = -1$।"],"finalAnswer":"$x = 4, -1$","markingTip":"উভয় মূল স্পষ্টভাবে লিখবে; ঋণাত্মক মূল বাদ দিলে ০.৫ নম্বর কাটা যাবে।"},{"id":"alg_matrices_w3","cardId":"alg_matrices_c4","marks":2,"q":"ক্রেমারের নিয়মে $3x + y = 7$ এবং $2x - y = 3$ সমীকরণ জোট সমাধান করো।","steps":["$D = \\begin{vmatrix} 3 & 1 \\\\ 2 & -1 \\end{vmatrix} = -3 - 2 = -5 \\neq 0$।","$D_x = \\begin{vmatrix} 7 & 1 \\\\ 3 & -1 \\end{vmatrix} = -7 - 3 = -10$।","$D_y = \\begin{vmatrix} 3 & 7 \\\\ 2 & 3 \\end{vmatrix} = 9 - 14 = -5$।","সুতরাং $x = \\frac{D_x}{D} = \\frac{-10}{-5} = 2$ এবং $y = \\frac{D_y}{D} = \\frac{-5}{-5} = 1$।"],"finalAnswer":"$(x, y) = (2, 1)$","markingTip":"$D, D_x, D_y$-এর নির্ণায়ক আকার স্পষ্টভাবে লিখবে—অপনয়ন পদ্ধতিতে সমাধান করলে ক্রেমারের নিয়মের কোনো নম্বর পাওয়া যায় না।"}]},{"id":"alg_ineq_real","moduleId":"mod_alg","title":"বাস্তব সংখ্যা, অসমতা, লগারিদম, সূচক ও ধারা","subtitle":"পরমমান অসমতা, সুপ্রিমাম-ইনফিমাম এবং ভর্তি পরীক্ষার সেফটি নেট (লগ, সূচক ও ধারা)","paperRef":"২য় পত্র, অধ্যায় ১ + সেফটি নেট","tier":3,"estMinutes":14,"cards":[{"id":"alg_ineq_real_c1","badge":"পরমমান ও ব্যবধি","title":"ব্যবধি ও পরমমান অসমতা","intuition":"বাস্তব সংখ্যারেখায় পরমমান $|x - m|$ বলতে মধ্যবিন্দু $m$ থেকে $x$-এর দূরত্ব বোঝায়। 'ক্ষুদ্রতর' ($<$) চিহ্ন $x$-কে একটি নির্দিষ্ট ব্যবধির ভেতরে আবদ্ধ করে, আর 'বৃহত্তর' ($>$) চিহ্ন $x$-কে বাইরের দুটি বিপরীত রশ্মিতে বিভক্ত করে।","formulas":[{"label":"ক্ষুদ্রতর পরমমান অসমতা ($c > 0$)","latex":"|ax + b| < c \\iff -c < ax + b < c","whenToUse":"$|ax+b| < c$ বা $\\le c$ আকারের অসমতা দুই ধাপে সমাধান করতে।"},{"label":"বৃহত্তর পরমমান অসমতা ($c > 0$)","latex":"|ax + b| > c \\iff ax + b < -c \\;\\lor\\; ax + b > c","whenToUse":"পরমমান কোনো ধনাত্মক সংখ্যার চেয়ে বড় হলে দুটি আলাদা অংশে ভেঙে সমাধান করতে।"},{"label":"ব্যবধি থেকে পরমমান রূপান্তর","latex":"p < x < q \\iff |x - m| < r, \\quad m = \\frac{p+q}{2}, \\; r = \\frac{q-p}{2}","whenToUse":"ঢাবির িষ্ঠ ঊর্ধ্বসীমা"},{"sym":"$\\inf S$","meaning":"ইনফিমাম বা গরিষ্ঠ নিম্নসীমা"},{"sym":"$\\mathbb{R}, \\mathbb{N}$","meaning":"বাস্তব সংখ্যার সেট ও স্বাভাবিক সংখ্যার সেট"}],"example":{"problem":"$S = \\left\\{ 2 - \\frac{1}{n} : n \\in \\mathbb{N} \\right\\}$ সেটটির সুপ্রিমাম ও ইনফিমাম নির্ণয় করো।","steps":["$n = 1, 2, 3, \\dots$ বসিয়ে প্রথম কয়েকটি উপাদান লেখো: $1, \\frac{3}{2}, \\frac{5}{3}, \\dots$","সবচেয়ে ছোট মান $n = 1$-এ পাওয়া যায়, তাই $\\inf S = 1$ (এবং $1 \\in S$)।","$n \\to \\infty$ হলে $2 - \\frac{1}{n} \\to 2$, তাই $\\sup S = 2$ (যদিও $2 \\notin S$)।"],"answer":"$\\inf S = 1, \\; \\sup S = 2$"},"tip":"সর্বোচ্চ মান (গরিষ্ঠ উপাদান) অবশ্যই সেট $S$-এর সদস্য হতে হয়; কিন্তু সুপ্রিমাম সেটের সদস্য নাও হতে পারে।","check":{"q":"খোলা ব্যবধি $(0, 5)$-এর কি কোনো সর্বোচ্চ উপাদান আছে?","a":"না—এর সুপ্রিমাম $5$, কিন্তু $5 \\notin (0, 5)$ হওয়ায় এর কোনো সর্বোচ্চ উপাদান নেই।"},"mythBuster":{"statement":"কোনো সেট $S$-এর সুপ্রিমাম থাকলে সেটি অবশ্যই $S$-এর একটি উপাদান হবে।","isTrue":false,"why":"$S = (0, 1)$-এর জন্য $\\sup S = 1$, অথচ $1 \\notin (0, 1)$।"}},{"id":"alg_ineq_real_c3","badge":"সেফটি নেট: লগারিদম ও সূচক","title":"লগারিদম, সূচক ও করণীর দ্রুত কৌশল","intuition":"ঢাবি গ-ইউনিটের গণিত অংশে এসএসসি ও এইচএসসি পর্যায়ের লগারিদম, সূচক ও করণীর প্রশ্ন প্রায়ই আসে। সব সংখ্যাকে ক্ষুদ্রতম মৌলিক ভিত্তিতে ($2, 3, 5$) রূপান্তর করলে ২০ সেকেন্ডেই উত্তর মিলে যায়।","formulas":[{"label":"লগারিদমের মৌলিক সূত্র","latex":"\\log_a(MN) = \\log_a M + \\log_a N, \\quad \\log_a(M^k) = k\\log_a M, \\quad a^{\\log_a x} = x","whenToUse":"লগের যোগফল সংকুচিত করতে বা একই ভিত্তির সূচক ও লগ বাতিল করতে।"},{"label":"ভিত্তি পরিবর্তন ও শৃঙ্খল সূত্র","latex":"\\log_a b = \\frac{\\log b}{\\log a}, \\qquad \\log_a b \\cdot \\log_b c = \\log_a c","whenToUse":"ভিন্ন ভিত্তির লগারিদমের ধারাবাহিক গুণফল কাটাকাটি করতে।"},{"label":"দ্বি-করণীর বর্গমূল শর্টকাট","latex":"\\sqrt{(p+q) \\pm 2\\sqrt{pq}} = \\sqrt{p} \\pm \\sqrt{q} \\quad (p > q)","whenToUse":"$\\sqrt{7 + 2\\sqrt{10}}$-এর মতো রাশিকে যোগফল $7$ ও গুণফল m":"$6 + 2 + \\frac{2}{3} + \\frac{2}{9} + \\dots$ ধারাটির অসীমতক সমষ্টি নির্ণয় করো।","steps":["এখানে প্রথম পদ $a = 6$ এবং সাধারণ অনুপাত $r = \\frac{2}{6} = \\frac{1}{3}$।","যাচাই: $|r| = \\frac{1}{3} < 1$, তাই অসীমতক সমষ্টি বিদ্যমান।","সূত্রে বসাও: $S_\\infty = \\frac{6}{1 - 1/3} = \\frac{6}{2/3} = 9$।"],"answer":"$9$"},"tip":"পর্যায়ক্রমে $+,-$ চিহ্নযুক্ত ধারায় (যেমন $4 - 2 + 1 - \\dots$) $r = -\\frac{1}{2}$ ঋণাত্মক হয়, ফলে $1 - r = 1 - (-\\frac{1}{2}) = \\frac{3}{2}$ হয়!","check":{"q":"প্রথম $15$টি ধনাত্মক বিজোড় সংখ্যার সমষ্টি কত?","a":"$15^2 = 225$।"},"mythBuster":{"statement":"$1 + 2 + 4 + 8 + \\dots$ ধারাটির অসীমতক সমষ্টি $S_\\infty = \\frac{1}{1-2} = -1$।","isTrue":false,"why":"এখানে $r = 2$, যা $|r| < 1$ শর্ত মানে না; ধারাটি অপসারী এবং এর কোনো সসীম সমষ্টি নেই।"}}],"mcqs":[{"id":"alg_ineq_real_q1","cardId":"alg_ineq_real_c1","qType":"conceptual","conceptGroup":"abs_ineq_and_triangle","q":"$x \\in \\mathbb{R}$-এর জন্য $|2x - 5| < -3$ অসমতাটির সমাধান সেট কোনটি?","opts":["$\\emptyset$ (কোনো সমাধান নেই)","$(-\\infty, \\infty)$","$(1, 4)$","$\\{1, 4\\}$"],"ans":0,"tags":["formula-trap","no-calc-shortcut"],"exp":"পরমমান সর্বদা অঋণাত্মক ($|2x - 5| \\ge 0$), তাই এটি কখনোই $-3$-এর চেয়ে ছোট হতে পারে না। না ভেবে $3 < 2x - 5 < -3$ লিখলে ভুল প্রান্তবিন্দু আসে।","variants":[]},{"id":"alg_ineq_real_q2","cardId":"alg_ineq_real_c1","qType":"conceptual","conceptGroup":"abs_ineq_and_triangle","q":"নিচের কোন প্রক্রিয়াটি $a < b$ অসমতার দিক সর্বদা উল্টে দেয়?","opts":["উভয় পাশে ঋণাত্মক সংখ্যা যোগ করা","উভয় পাশকে একটি ঋণাত্মক বাস্তব সংখ্যা দিয়ে গুণ করা","উভয় পাশ বর্গ করা","উভয় পাশের ঘনমূল নেওয়া"],"ans":1,"tags":["board-standard","formula-trap"],"exp":"যেকোনো ঋণাত্মক সংখ্যা $k < 0$ দিয়ে গুণ বা ভাগ করলে $a < b$ উল্টে $ka > kb$ হয়। ঋণাত্মক সংখ্যা যোগ করলে চিহ্ন বদলায় না, আর বর্গ করা নির্ভর করে $a, b$-এর চিহ্নের ওপর।","variants":[]},{"id":"alg_ineq_real_q3","cardId":"alg_ineq_real_c2","qType":"conceptual","conceptGroup":"abs_ineq_and_triangle","q":"বাস্তব সংখ্যা $a$ ও $ } + i^{45} + i^{46} + i^{47}$-এর মান নির্ণয় করো।","steps":["প্রথম চারটি ধারাবাহিক ঘাতের সমষ্টি ($i^{43}$ থেকে $i^{46}$) $= 0$।","অবশিষ্ট থাকে কেবল $i^{47}$। $47$-কে $4$ দিয়ে ভাগ করলে ভাগশেষ $3$।","সুতরাং $i^{47} = i^3 = -i$।"],"answer":"$-i$"},"tip":"$i^{2027}$-এর মতো বড় ঘাতের ভাগশেষ জানতে কেবল শেষ দুটি অঙ্ককে $4$ দিয়ে ভাগ করো ($27 \\div 4 \\implies$ ভাগশেষ $3 \\implies -i$)!","check":{"q":"$\\frac{1 + i}{1 - i}$-এর সরল মান কত?","a":"লব ও হরকে $(1+i)$ দিয়ে গুণ করে পাই $\\frac{(1+i)^2}{1^2+1^2} = \\frac{2i}{2} = i$।"},"mythBuster":{"statement":"$\\sqrt{-4} \\times \\sqrt{-9} = \\sqrt{(-4)(-9)} = \\sqrt{36} = 6$।","isTrue":false,"why":"$a, b$ উভয়েই ঋণাত্মক হলে $\\sqrt{a}\\sqrt{b} = \\sqrt{ab}$ সূত্রটি কাজ করে না। আগে $i$-তে রূপান্তর করো: $(2i)(3i) = 6i^2 = -6$।"}},{"id":"alg_complex_c2","badge":"৪-চতুর্ভাগের মুখ্য আর্গুমেন্ট","title":"আর্গন্ড চিত্র, মডুলাস ও মুখ্য আর্গুমেন্ট","intuition":"আর্গন্ড চিত্রে $z = x + iy$-কে $(x, y)$ বিন্দু দিয়ে নির্দেশ করা হয়। মূলবিন্দু থেকে এর দূরত্ব হলো মডুলাস $r$, আর মুখ্য আর্গুমেন্ট $\\theta \\in (-\\pi, \\pi]$ সম্পূর্ণভাবে নির্ভর করে বিন্দুটি চারটি চতুর্ভাগের কোনটিতে অবস্থিত তার ওপর।","formulas":[{"label":"মডুলাসের ধর্ম","latex":"|z| = \\sqrt{x^2 + y^2}, \\qquad |z_1 z_2| = |z_1||z_2|, \\qquad \\left|\\frac{z_1}{z_2}\\right| = \\frac{|z_1|}{|z_2|}","whenToUse":"জটিল গুণফল বা ভাগফল আগে বিস্তার না করে সরাসরি মডুলাস নিয়ে দ্রুত হিসাব করতে।"},{"label":"৪-চতুর্ভাগের মুখ্য আর্গুমেন্ট ($\\alpha = \\tan^{-1}\\left|\\frac{y}{x}\\right|$)","latex":"\\text{Q1: } \\alpha, \\quad \\text{Q2: } \\pi - \\alpha, \\quad \\text{Q3: } -(\\pi - \\alpha), \\quad \\text{Q4: } -\\alpha","whenToUse":"$\\arg(z)$ লেখার আগে সর্বদা $(x, y)$-এর চিহ্ন দেখে চতুর্ভাগ নির্ণয় করো।"}],"symbols":[{"sym":"$\\alpha$","meaning":"সূক্ষ্মকোণ $\\tan^{-1}|y/x| \\in (0, \\frac{\\pi}{2})$"},{"sym":"$\\operatorname{Arg}(z)$","meaning":"মুখ্য আর্গুমেন্ট, যার সীমা $(-\\pi, \\pi]$"}],"example":{"problem":"$z = -1 - i\\sqrt{3}$-এর মডুলাস ও মুখ্য আর্গুমেন্ট নির্ণয় করো।","steps":["মডুলাস: $|z| = \\sqrt{(-1)^2 + (-\\sqrt{3})^2} = \\sqrt{1 + 3} = 2$।","$(-1, -\\sqrt{3})$ বিন্দুটি ৩য় চতুর্ভাগে অবস্থিত ($x < 0, y < 0$)।","সূক্ষ্মকোণ: $\\alpha = \\tan^{-1}(\\sqrt{3}/1) = \\frac{\\pi}{3}$।","৩য় চতুর্ভাগে মুখ্য আর্গুমেন্ট: $\\theta = -(\\pi - \\frac{\\pi}{3}) = -\\frac{2\\pi}{3}$।"],"answer":"$r = 2, \\; \\theta = -\\frac{2\\pi}{3}$"},"tip":"যদি এমসিকিউ অপশনে $(-\\pi, \\pi]$-এর বদলে $[0, 2\\pi)$ সীমায় কোণ দেওয়া থাকে, তবে ঋণাত্মক কোণের সাথে $2\\pi$ যোগ করো (যেমন $-\\frac{2\\pi}{3} + 2\\pi = \\frac{4\\pi}{3}$)।","check":{"q":"$-5$ (ঋণাত্মক বাস্তব সংখ্যা)-এর মুখ্য আর্গুমেন্ট কত?","a":"$\\pi$, কারণ $(-5, 0)$ ঋণাত্মক বাস্তব অক্ষের ওপর অবস্থিত এবং $\\pi \\in (-\\pi, \\pi]$।"},"mythBuster":{"statement":"$z = -1 - i$-এর মুখ্য আর্গুমেন্ট হলো $\\tan^{-1}\\left(\\frac{-1}{-1}\\right) = \\frac{\\pi}{4}$।","isTrue":false,"why":"$\\frac{\\pi}{4}$ হলো ১ম চতুর্ভাগের ($1 + i$) কোণ; $-1 - i$ ৩য় চতুর্ভাগে থাকায় এর মুখ্য আর্গুমেন্ট $-\\frac{3\\pi}{4}$।"}},{"id":"alg_complex_c3","badge":"ডি ময়ভার ও বর্গমূল শর্টকাট","title":"পোলার/অয়লার রূপ, ডি ময়ভারের উপপাদ্য ও $\\sqrt{a+ib}$","intuition":"পোলার আকার $z = r(\\cos\\theta + i\\sin\\theta) = re^{i\\theta}$ ডি ময়ভারের উপপাদ্যের মাধ্যমে ঘাতকে সহজ কোণ-গুণনে পরিণত করে। আর $\\sqrt{a \\pm ib}$-এর মডুলাস শর্টকাট দ্বিঘাত সমীকরণ না করেই এক লাইনে বর্গমূল এনে দেয়।","formulas":[{"label":"অয়লারের সূত্র ও ডি ময়ভারের উপপাদ্য","latex":"e^{i\\theta} = \\cos\\theta + i\\sin\\theta, \\qquad (\\cos\\theta + i\\sin\\theta)^n = \\cos(n\\theta) + i\\sin(n\\theta)","whenToUse":"ত্রিকোণমিতিক জটিল সংখ্যার উচ্চ ঘাত মুহূর্তেই নির্ণয় করতে।"},{"label":"বর্গমূল শর্টকাট ($r = \\sqrt{a^2 + b^2}$)","latex":"\\sqrt{a \\pm ib} = \\pm\\left(\\sqrt{\\frac{r+a}{2}} \\pm i\\sqrt{\\frac{r-a}{2}}\\right)","whenToUse":"$(3,4,5)$ বা $(5,12,13)$-এর মতো পিথাগোরীয় ত্রয়ীযুক্ত $\\sqrt{a \\pm ib}$ নির্ণয়ে।"},{"label":"বিশুদ্ধ কাল্পনিক সংখ্যার বর্গমূল","latex":"\\sqrt{2i} = \\pm(1 + i), \\qquad \\sqrt{-2i} = \\pm(1 - i)","whenToUse":"$\\sqrt{\\pm ki}$-কে সরাসরি স্কেল করে বর্গমূল নির্ণয়ে।"}],"symbols":[{"sym":"$e^{i\\theta}$","meaning":"জটিল সংখ্যার অয়লার সূচকীয় রূপ"},{"sym":"$r$","meaning":"মডুলাস $\\sqrt{a^2 + b^2}$"}],"example":{"problem":"মডুলাস শর্টকাট ব্যবহার করে $\\sqrt{3 + 4i}$ নির্ণয় করো।","steps":["মডুলাস $r = \\sqrt{3^2 + 4^2} = 5$।","বাস্তব অংশ: $\\sqrt{\\frac{5+3}{2}} = \\sqrt{4} = 2$।","কাল্পনিক অংশ: $\\sqrt{\\frac{5-3}{2}} = \\sqrt{1} = 1$।","$+4i$ ধনাত্মক হওয়ায় বর্গমূল $\\pm(2 + i)$।"],"answer":"$\\pm(2 + i)$"},"tip":"এমসিকিউতে $\\sqrt{a+ib}$ এলে অপশনগুলো বর্গ করে ৫ সেকেন্ডেই যাচাই করতে পারো: $(2+i)^2 = 4 - 1 + 4i = 3 + 4i$!","check":{"q":"$e^{i\\pi} + 1$-এর মান কত?","a":"$0$, কারণ $e^{i\\pi} = \\cos\\pi + i\\sin\\pi = -1$।"},"mythBuster":{"statement":"$(\\sin\\theta + i\\cos\\theta)^n = \\sin(n\\theta) + i\\cos(n\\theta)$।","isTrue":false,"why":"ডি ময়ভারের উপপাদ্যের জন্য বাস্তব অংশে $\\cos$ এবং কাল্পনিক অংশে $\\sin$ থাকতে হয়। আগে $\\cos(\\frac{\\pi}{2}-\\theta) + i\\sin(\\frac{\\pi}{2}-\\theta)$ আকারে সাজাতে হবে।"}},{"id":"alg_complex_c4","badge":"এককের ঘনমূল ও সঞ্চারপথ","title":"এককের ঘনমূল ($\\omega$) ও আদর্শ সঞ্চারপথ","intuition":"এককের তিনটি ঘনমূল $1, \\omega, \\omega^2$-এর দুটি সোনালি সূত্র বিশাল রাশিকে মুহূর্তে ধ্রুবকে নামিয়ে আনে। পাশাপাশি আর্গন্ড সমতলে $z$-এর দূরত্বভিত্তিক সমীকরণগুলো সরাসরি বৃত্ত ও লম্ব সমদ্বিখণ্ডকের সঞ্চারপথ নির্দেশ করে।","formulas":[{"label":"এককের ঘনমূলের ধর্ম","latex":"\\omega^3 = 1, \\qquad 1 + \\omega + \\omega^2 = 0, \\qquad \\omega = \\frac{-1 + i\\sqrt{3}}{2}, \\quad \\bar{\\omega} = \\omega^2","whenToUse":"$\\omega^n$-এর ঘাতকে $3$ দিয়ে ভাগ করে ভাগশেষ বসাতে এবং $1+\\omega = -\\omega^2$ প্রতিস্থাপন করতে।"},{"label":"বৃত্তের সঞ্চারপথ","latex":"|z - z_0| = r \\implies (x - h)^2 + (y - k)^2 = r^2 \\quad (z_0 = h + ik)","whenToUse":"বিস্তার না করেই কেন্দ্র $(h, k)$ ও ব্যাসার্ধ $r$ সরাসরি পড়ে নিতে।"},{"label":"লম্ব সমদ্বিখণ্ডকের সঞ্চারপথ","latex":"|z - z_1| = |z - z_2|","whenToUse":"$z_1$ ও $z_2$ বিন্দুদ্বয় থেকে সমদূরবর্তী বিন্দুর সঞ্চারপথ (সংযোগ রেখাংশের লম্ব সম rks":2,"q":"$z = -1 - i\\sqrt{3}$-এর মডুলাস ও মুখ্য আর্গুমেন্ট নির্ণয় করো এবং $z$-কে পোলার আকারে প্রকাশ করো।","steps":["মডুলাস: $r = |z| = \\sqrt{(-1)^2 + (-\\sqrt{3})^2} = \\sqrt{1 + 3} = 2$।","যেহেতু $x = -1 < 0$ এবং $y = -\\sqrt{3} < 0$, তাই $z$ ৩য় চতুর্ভাগে অবস্থিত।","সূক্ষ্মকোণ $\\alpha = \\tan^{-1}\\left|\\frac{-\\sqrt{3}}{-1}\\right| = \\frac{\\pi}{3}$, সুতরাং মুখ্য আর্গুমেন্ট $\\theta = -(\\pi - \\frac{\\pi}{3}) = -\\frac{2\\pi}{3}$।","পোলার আকার: $z = 2\\left[\\cos\\left(-\\frac{2\\pi}{3}\\right) + i\\sin\\left(-\\frac{2\\pi}{3}\\right)\\right]$।"],"finalAnswer":"$r = 2, \\; \\theta = -\\frac{2\\pi}{3}, \\; z = 2\\left[\\cos\\left(-\\frac{2\\pi}{3}\\right) + i\\sin\\left(-\\frac{2\\pi}{3}\\right)\\right]$","markingTip":"আর্গুমেন্ট বের করার আগে অবশ্যই '৩য় চতুর্ভাগে অবস্থিত' উল্লেখ করবে; সরাসরি $\\frac{\\pi}{3}$ লিখলে কোনো নম্বর পাওয়া যায় না।"},{"id":"alg_complex_w2","cardId":"alg_complex_c3","marks":2,"q":"$7 - 24i$-এর বর্গমূল নির্ণয় করো।","steps":["ধরি $\\sqrt{7 - 24i} = x + iy$, ফলে $x^2 - y^2 = 7$ এবং $2xy = -24$।","আমরা জানি $x^2 + y^2 = \\sqrt{7^2 + (-24)^2} = \\sqrt{49 + 576} = 25$।","যোগ ও বিয়োগ করে পাই: $2x^2 = 32 \\implies x = \\pm 4$ এবং $2y^2 = 18 \\implies y = \\pm 3$।","যেহেতু $2xy = -24 < 0$, তাই $x$ ও $y$ বিপরীত চিহ্নযুক্ত হবে; অর্থাৎ বর্গমূল $\\pm(4 - 3i)$।"],"finalAnswer":"$\\pm(4 - 3i)$","markingTip":"$2xy < 0$ দেখে কেন $x$ ও $y$ বিপরীত চিহ্নযুক্ত হলো তা এক লাইনে উল্লেখ করলে পূর্ণ নম্বর নিশ্চিত হয়।"},{"id":"alg_complex_w3","cardId":"alg_complex_c4","marks":2,"q":"$\\omega$ এককের কাল্পনিক ঘনমূল হলে প্রমাণ করো যে $(1 - \\omega + \\omega^2)(1 - \\omega^2 + \\omega^4) = 4$।","steps":["$\\omega^3 = 1$ ব্যবহার করে পাই $\\omega^4 = \\omega^3 \\cdot \\omega = \\omega$।","বামপক্ষ $= (1 + \\omega^2 - \\omega)(1 + \\omega - \\omega^2)$।","$1 + \\omega + \\omega^2 = 0$ থেকে $1 + \\omega^2 = -\\omega$ এবং $1 + \\omega = -\\omega^2$ বসিয়ে পাই।","বামপক্ষ $= (-2\\omega)(-2\\omega^2) = 4\\omega^3 = 4(1) = 4 =$ ডানপক্ষ (প্রমাণিত)।"],"finalAnswer":"প্রমাণিত: $(1 - \\omega + \\omega^2)(1 - \\omega^2 + \\omega^4) = 4$","markingTip":"যে লাইনে $\\omega^3 = 1$ ও $1 + \\omega + \\omega^2 = 0$ ব্যবহার করবে, পাশে বন্ধনীতে সূত্র দুটি উল্লেখ করে দিও।"}]},{"id":"alg_poly","moduleId":"mod_alg","title":"বহুপদী ও বহুপদী সমীকরণ","paperRef":"২য় পত্র অধ্যায় ৪","tier":1,"estMinutes":18,"cards":[{"id":"alg_poly_c1","badge":"মূল উপপাদ্য","title":"ভাগশেষ ও উৎপাদক উপপাদ্য","intuition":"কোনো বহুপদী $P(x)$-কে একঘাত রাশি $(x - a)$ দিয়ে ভাগ করলে ভাগশেষ হয় ধ্রুবক $P(a)$। ভাগশেষ শূন্য হলে $(x - a)$ নিঃশেষে $P(x)$-কে ভাগ করে এবং $a$ হয় সমীকরণটির একটি মূল।","formulas":[{"label":"ভাগশেষ উপপাদ্য","latex":"P(x) \\div (x - a) \\implies R = P(a)","whenToUse":"দীর্ঘ ভাগ না করেই দ্রুত ভাগশেষ নির্ণয়ে।"},{"label":"একঘাত ভাজকের ভাগশেষ","latex":"P(x) \\div (ax + b) \\implies R = P\\!\\left(-\\frac{b}{a}\\right)","whenToUse":"ভাজকে $x$-এর সহগ $a \\neq 1$ হলে।"},{"label":"উৎপাদক উপপাদ্য","latex":"(x - a) \\mid P(x) \\iff P(a) = 0","whenToUse":"অজানা ধ্রুবক $k$ নির্ণয় বা উৎপাদক যাচাই করতে।"}],"symbols":[{"sym":"$P(x)$","meaning":"$x$ চলকের অঋণাত্মক পূর্ণসংখ্যা ঘাতবিশিষ্ট বহুপদী"},{"sym":"$a$","meaning":"একঘাত ভাজক $(x - a)$-এর শূন্য"},{"sym":"$\\deg(R)$","meaning":"ভাগশেষের মাত্রা, যা সর্বদা ভাজকের মাত্রা অপেক্ষা ছোট"}],"example":{"problem":"$(x - 2)$ যদি $P(x) = x^3 - kx^2 + 5x - 6$-এর একটি উৎপাদক হয়, তবে $k$-এর মান কত?","steps":["ভাজক শূন্য ধরে পাই: $x - 2 = 0 \\implies x = 2$।","উৎপাদক উপপাদ্য অনুযায়ী $P(2) = 0 \\implies 2^3 - k(2^2) + 5(2) - 6 = 0$।","সরল করে পাই: $8 - 4k + 10 - 6 = 0 \\implies 12 = 4k \\implies k = 3$।"],"answer":"$k = 3$"},"tip":"সবসময় প্রথমে ভাজক $= 0$ ধরে $x$-এর মান বের করো, তাহলে চিহ্ন ভুল হওয়ার সুযোগ থাকবে না।","check":{"q":"$x^3 + 2x - 5$-কে $(x + 1)$ দিয়ে ভাগ করলে ভাগশেষ কত?","a":"$x = -1$ বসিয়ে পাই: $(-1)^3 + 2(-1) - 5 = -1 - 2 - 5 = -8$।"},"mythBuster":{"statement":"$(x + 3)$ দিয়ে ভাগ করলে ভাগশেষ পেতে $x = 3$ বসাতে হয়।","isTrue":false,"why":"$x + 3 = 0 \\implies x = -3$; তাই ভাগশেষ হবে $P(-3)$, $P(3)$ নয়।"}},{"id":"alg_poly_c2","badge":"ঢাবি হাই-ইল্ড","title":"নিশ্চায়ক ও মূলের প্রকৃতি","intuition":"দ্বিঘাত সমীকরণ $ax^2 + bx + c = 0$ ($a \\neq 0$)-এর নিশ্চায়ক $D = b^2 - 4ac$ বর্গমূলের ভেতরে থাকে। সমাধান না করেই $D$-এর চিহ্ন ও পূর্ণবর্গ হওয়া দেখে মূলদ্বয়ের প্রকৃতি মুহূর্তেই বলা যায়।","formulas":[{"label":"নিশ্চায়ক","latex":"D = b^2 - 4ac","whenToUse":"মূল বাস্তব, সমান, মূলদ নাকি জটিল তা নির্ণয়ে।"},{"label":"মূলের প্রকৃতি","latex":"D > 0,\\quad D = 0,\\quad D < 0","whenToUse":"বাস্তব সহগের ক্ষেত্রে: $D>0$ বাস্তব ও অসমান, $D=0$ সমান, $D<0$ জটিল অনুবন্ধী।"},{"label":"অনুবন্ধী মূল জোড়া","latex":"p \\pm iq\\;(a,b,c \\in \\mathbb{R});\\qquad p \\pm \\sqrt{q}\\;(a,b,c \\in \\mathbb{Q})","whenToUse":"একটি জটিল বা অমূলদ মূল দেওয়া থাকলে দ্বিঘাত সমীকরণ গঠনে।"}],"symbols":[{"sym":"$D$","meaning":"নিশ্চায়ক $b^2 - 4ac$"},{"sym":"$\\mathbb{Q}, \\mathbb{R}$","meaning":"যথাক্রমে মূলদ ও বাস্তব সংখ্যার সেট"},{"sym":"$i$","meaning":"কাল্পনিক একক, যেখানে $i^2 = -1$"}],"example":{"problem":"বাস্তব সহগবিশিষ্ট যে দ্বিঘাত সমীকরণের একটি মূল $2 + 3i$, সেটি নির্ণয় করো।","steps":["সহগ বাস্তব হওয়ায় অপর মূলটি হবে অনুবন্ধী $2 - 3i$।","মূলদ্বয়ের যোগফল $S = (2+3i)+(2-3i) = 4$ এবং গুণফল $P = 2^2 + 3^2 = 13$।","নির্ণেয় সমীকরণ: $x^2 - Sx + P = 0 \\implies x^2 - 4x + 13 = 0$।"],"answer":"$x^2 - 4x + 13 = 0$"},"tip":"$p \\pm qi$-এর গুণফল $p^2 + q^2$ (যোগ), কিন্তু $p \\pm \\sqrt{q}$-এর গুণফল $p^2 - q$ (বিয়োগ)।","check":{"q":"$k$-এর কোন মানের জন্য $x^2 - 6x + k = 0$-এর মূলদ্বয় সমান হবে?","a":"$D = (-6)^2 - 4(1)(k) = 0 \\implies 36 = 4k \\implies k = 9$।"},"mythBuster":{"statement":"$D > 0$ এবং $a, b, c$ বাস্তব হলে মূলদ্বয় সর্বদা মূলদ হয়।","isTrue":false,"why":"মূল মূলদ হতে হলে $a, b, c \\in \\mathbb{Q}$ হতে হবে এবং $D$-কে একটি পূর্ণবর্গ সংখ্যা হতে হবে।"}},{"id":"alg_poly_c3","badge":"কোর শর্টকাট","title":"মূল-সহগ সম্পর্ক ও প্রতিসম রাশি","intuition":"ভিয়েটার সূত্র মূলগুলোর যোগফল ও গুণফলকে সরাসরি সহগের সাথে যুক্ত করে। ফলে মূলগুলো আলাদাভাবে বের না করেই $\\alpha^2 + \\beta^2$ বা $\\alpha^3 + \\beta^3$-এর মতো প্রতিসম রাশির মা _vieta_transform_rules","q":"$ax^2 + bx + c = 0$ ($a, b, c \\in \\mathbb{R}$) সমীকরণে $a$ এবং $c$ বিপরীত চিহ্নবিশিষ্ট হলে মূলদ্বয় কেমন হবে?","opts":["উভয় মূল জটিল অনুবন্ধী","উভয় মূল বাস্তব এবং বিপরীত চিহ্নবিশিষ্ট","উভয় মূল ধনাত্মক","উভয় মূল সমান"],"ans":1,"tags":["pyq-pattern","no-calc-shortcut"],"exp":"$a$ ও $c$ বিপরীত চিহ্নের হলে $ac < 0$, তাই $D = b^2 - 4ac > 0$ (বাস্তব ও অসমান) এবং গুণফল $\\alpha\\beta = \\frac{c}{a} < 0$ (বিপরীত চিহ্ন)।","variants":[]}],"writtenDrills":[{"id":"alg_poly_w1","cardId":"alg_poly_c2","marks":2,"q":"$k$-এর কোন ধনাত্মক মানের জন্য $x^2 - (k+2)x + 9 = 0$ সমীকরণের মূলদ্বয় বাস্তব ও সমান হবে? সেই সমান মূলটিও নির্ণয় করো।","steps":["সহগসমূহ চিহ্নিত করি: $a = 1$, $b = -(k+2)$, $c = 9$।","মূল সমান হওয়ার শর্ত: $D = b^2 - 4ac = 0 \\implies (k+2)^2 - 36 = 0$।","সমাধান করি: $k + 2 = \\pm 6 \\implies k = 4$ (ধনাত্মক) অথবা $k = -8$ (অগ্রহণযোগ্য)।","$k = 4$ বসিয়ে পাই: $x^2 - 6x + 9 = (x - 3)^2 = 0 \\implies x = 3$।"],"finalAnswer":"$k = 4$, সমান মূল $x = 3$","markingTip":"$D = 0$ বসিয়ে $k = 4$ বের করার জন্য ১ নম্বর এবং তা বসিয়ে $x = 3$ দেখানোর জন্য ১ নম্বর।"},{"id":"alg_poly_w2","cardId":"alg_poly_c3","marks":2,"q":"$x^2 - 4x + 2 = 0$ সমীকরণের মূলদ্বয় $\\alpha, \\beta$ হলে $\\frac{\\alpha^2}{\\beta} + \\frac{\\beta^2}{\\alpha}$-এর মান নির্ণয় করো।","steps":["মূল-সহগ সম্পর্ক থেকে পাই: $\\alpha + \\beta = 4$ এবং $\\alpha\\beta = 2$।","ভগ্নাংশ যোগ করি: $\\frac{\\alpha^2}{\\beta} + \\frac{\\beta^2}{\\alpha} = \\frac{\\alpha^3 + \\beta^3}{\\alpha\\beta}$।","$\\alpha^3 + \\beta^3 = (\\alpha+\\beta)^3 - 3\\alpha\\beta(\\alpha+\\beta) = 64 - 3(2)(4) = 40$।","$\\alpha\\beta = 2$ দিয়ে ভাগ করি: $\\frac{40}{2} = 20$।"],"finalAnswer":"$20$","markingTip":"$\\alpha+\\beta, \\alpha\\beta$ লেখায় ০.৫ নম্বর, $\\alpha^3+\\beta^3$-এর সূত্রে ১ নম্বর এবং চূড়ান্ত মানে ০.৫ নম্বর।"},{"id":"alg_poly_w3","cardId":"alg_poly_c4","marks":2,"q":"$2x^2 - 5x + 1 = 0$-এর মূলদ্বয় $\\alpha, \\beta$ হলে $\\alpha + 2$ ও $\\beta + 2$ মূলবিশিষ্ট দ্বিঘাত সমীকরণ গঠন করো।","steps":["ধরি নতুন সমীকরণের চলক $y = x + 2 \\implies x = y - 2$।","মূল সমীকরণে $x = y - 2$ বসাই: $2(y-2)^2 - 5(y-2) + 1 = 0$।","বিস্তৃত করি: $2(y^2 - 4y + 4) - 5y + 10 + 1 = 2y^2 - 13y + 19 = 0$।","$y$-এর স্থানে $x$ বসিয়ে পাই: $2x^2 - 13x + 19 = 0$।"],"finalAnswer":"$2x^2 - 13x + 19 = 0$","markingTip":"সঠিক বিপরীত প্রতিস্থাপন $x = y - 2$-এর জন্য ১ নম্বর এবং নির্ভুল সরলীকরণের জন্য ১ নম্বর।"}],"subtitle":"২য় পত্র অধ্যায় ৪"},{"id":"alg_perm_comb","moduleId":"mod_alg","title":"বিন্যাস ও সমাবেশ","paperRef":"১ম পত্র অধ্যায় ৫","tier":2,"estMinutes":16,"cards":[{"id":"alg_perm_comb_c1","badge":"মৌলিক নীতি","title":"গণনার মৌলিক নীতি ও বিন্যাস","intuition":"গণনার দুটি মূল নিয়ম: ধাপগুলো ধারাবাহিকভাবে ঘটলে (এবং) গুণ করতে হয়, আর পরস্পর বর্জনশীল বিকল্প হলে (অথবা) যোগ করতে হয়। বিন্যাসে ক্রম গুরুত্বপূর্ণ—দুটি উপাদানের স্থান বদলালে নতুন বিন্যাস তৈরি হয়।","formulas":[{"label":"বিন্যাস সূত্র","latex":"{}^nP_r = \\frac{n!}{(n-r)!} = n(n-1)\\cdots(n-r+1)","whenToUse":"$n$-টি ভিন্ন বস্তু থেকে $r$-টি নিয়ে ক্রম অনুসারে সাজাতে।"},{"label":"শূন্য ও পূর্ণ গৌণিক","latex":"0! = 1,\\qquad {}^nP_n = n!,\\qquad {}^nP_0 = 1","whenToUse":"বিশেষ ও প্রান্তিক মান নির্ণয়ে।"},{"label":"গুণন বনাম যোগ বিধি","latex":"m \\times n \\quad (\\land),\\qquad m + n \\quad (\\lor)","whenToUse":"অঙ্ক দিয়ে সংখ্যা গঠন, পথ গণনা ও বহুধাপ নির্বাচনে।"}],"symbols":[{"sym":"$n!$","meaning":"$n$-এর গৌণিক: $n \\times (n-1) \\times \\dots \\times 1$"},{"sym":"${}^nP_r$","meaning":"$n$-টি ভিন্ন বস্তু থেকে $r$-টি নিয়ে বিন্যাস সংখ্যা"}],"example":{"problem":"$\\{0, 1, 2, 3, 4\\}$ অঙ্কগুলো পুনরাবৃত্তি না করে কয়টি ৩-অঙ্কের সংখ্যা গঠন করা যায়?","steps":["শতকের ঘরে $0$ বসতে পারবে না: $4$টি উপায় ($1, 2, 3, 4$)।","দশকের ঘরে $0$-সহ বাকি $3$টি অঙ্ক বসতে পারবে: $4$টি উপায়।","এককের ঘরে বাকি $3$টি অঙ্ক: মোট $= 4 \\times 4 \\times 3 = 48$।"],"answer":"$48$"},"tip":"সবচেয়ে বেশি শর্তযুক্ত ঘরটি (যেমন প্রথম ঘরে $0$ নয়, বা শেষ ঘরে জোড় অঙ্ক) সবসময় আগে পূরণ করো।","check":{"q":"${}^nP_2 = 30$ হলে $n$-এর মান কত?","a":"$n(n-1) = 30 = 6 \\times 5 \\implies n = 6$।"},"my ্জিত বা ধ্রুবক পদ"}],"example":{"problem":"$\\left(x^2 + \\frac{1}{x}\\right)^6$-এর বিস্তৃতিতে $x$-বর্জিত পদটি কত?","steps":["এখানে $n = 6, p = 2, q = 1$; শর্টকাট হতে $r = \\frac{6 \\times 2}{2 + 1} = 4$।","পদটি হলো $T_5 = \\binom{6}{4} (x^2)^2 \\left(\\frac{1}{x}\\right)^4 = \\binom{6}{4} = 15$।"],"answer":"$15$"},"tip":"$r = \\frac{np}{p+q}$ যদি ভগ্নাংশ আসে, তবে বিস্তৃতিতে কোনো $x$-বর্জিত পদ নেই (সহগ $0$)।","check":{"q":"$(x + 2)^{10}$-এর বিস্তৃতিতে মধ্যপদটি কততম পদ?","a":"$n = 10$ জোড় হওয়ায় মধ্যপদ $= T_{10/2 + 1} = T_6$ (৬ষ্ঠ পদ)।"},"mythBuster":{"statement":"$(x + y)^8$-এর মধ্যপদ হলো ৪র্থ পদ।","isTrue":false,"why":"মোট $9$টি পদের ঠিক মাঝের পদটি হলো $\\frac{8}{2} + 1 = 5$-ম পদ ($T_5$)।"}},{"id":"alg_binom_c3","badge":"কোর শর্টকাট","title":"সহগের সমষ্টি ও প্রতিসাম্য","intuition":"যেকোনো বহুপদী বিস্তৃতির সকল সাংখ্যিক সহগের সমষ্টি বের করতে প্রতিটি চলকের মান $1$ বসালেই চলে। আর $(1 + x)^n$-এ $x = 1$ ও $x = -1$ বসালে সব দ্বিপদী সহগের সমষ্টি ও জোড়-বিজোড় সূচকের সমষ্টি মুহূর্তেই পাওয়া যায়।","formulas":[{"label":"দ্বিপদী সহগের সমষ্টি","latex":"\\sum_{r=0}^n \\binom{n}{r} = 2^n,\\qquad \\sum_{r=0}^n (-1)^r \\binom{n}{r} = 0","whenToUse":"সব দ্বিপদী সহগের যোগফল বা পর্যায়ক্রমিক চিহ্নের সমষ্টিতে।"},{"label":"জোড় ও বিজোড় সূচকের সমষ্টি","latex":"C_0 + C_2 + C_4 + \\dots = C_1 + C_3 + C_5 + \\dots = 2^{n-1}","whenToUse":"কেবল জোড় বা কেবল বিজোড় সূচকের দ্বিপদী সহগ যোগ করতে।"},{"label":"সকল সাংখ্যিক সহগের সমষ্টি","latex":"(ax + by)^n \\Big|_{x=1, y=1} = (a + b)^n","whenToUse":"$a, b \\neq 1$ হলে সব সহগের যোগফল নির্ণয়ে।"}],"symbols":[{"sym":"$C_r$","meaning":"দ্বিপদী সহগ $\\binom{n}{r}$-এর সংক্ষিপ্ত রূপ"},{"sym":"$2^{n-1}$","meaning":"জোড় ও বিজোড় সূচকের সহগসমষ্টির সমান অর্ধেক মান"}],"example":{"problem":"$(3x - 2y)^5$-এর বিস্তৃতিতে সকল সাংখ্যিক সহগের সমষ্টি কত?","steps":["সকল সহগের সমষ্টি পেতে $x = 1$ এবং $y = 1$ বসাই।","হিসাব করে পাই: $(3 - 2)^5 = 1^5 = 1$।"],"answer":"$1$"},"tip":"শুরু ও শেষ থেকে সমদূরবর্তী দ্বিপদী সহগ সর্বদা সমান: $\\binom{n}{r} = \\binom{n}{n-r}$।","check":{"q":" rt{2^2 + (-3)^2 + 6^2} = \\sqrt{4 + 9 + 36} = \\sqrt{49} = 7$।","একক ভেক্টর গঠন কর: $\\hat{a} = \\frac{1}{7}(2\\hat{i} - 3\\hat{j} + 6\\hat{k})$।","$14$ দিয়ে গুণ কর: $14\\hat{a} = 2(2\\hat{i} - 3\\hat{j} + 6\\hat{k}) = 4\\hat{i} - 6\\hat{j} + 12\\hat{k}$।"],"answer":"$4\\hat{i} - 6\\hat{j} + 12\\hat{k}$"},"tip":"ক্যালকুলেটর ছাড়া ২ সেকেন্ডে মান বের করতে ত্রিমাত্রিক পিথাগোরীয় চতুষ্টয় মনে রাখো: $(1,2,2)\\to 3$, $(2,3,6)\\to 7$, $(3,4,12)\\to 13$, এবং $(2,6,9)\\to 11$।","check":{"q":"$\\vec{v} = 3\\hat{i} - 4\\hat{j} + 12\\hat{k}$ ভেক্টরটির মান কত?","a":"$13$, কারণ $\\sqrt{3^2 + (-4)^2 + 12^2} = \\sqrt{9 + 16 + 144} = \\sqrt{169} = 13$।"},"mythBuster":{"statement":"$A$ থেকে $B$ বিন্দুগামী সরণ ভেক্টর $\\vec{AB} = \\vec{OA} - \\vec{OB}$।","isTrue":false,"why":"সরণ ভেক্টর সবসময় শেষ বিন্দু বিয়োগ আদি বিন্দু, অর্থাৎ $\\vec{AB} = \\vec{OB} - \\vec{OA}$; উল্টো করলে দিক পাল্টে $\\vec{BA}$ হয়ে যায়।"}},{"id":"geo_vectors_c2","badge":"ঢাবি সি-ইউনিট হট টপিক","title":"ডট গুণন, মধ্যবর্তী কোণ ও অভিক্ষেপ","intuition":"ডট বা স্কেলার গুণন দুটি ভেক্টর একই দিকে কতটা ক্রিয়াশীল তা পরিমাপ করে এবং ফলাফল হিসেবে একটি স্কেলার সংখ্যা দেয়। দুটি ভেক্টর পরস্পর লম্ব ($90^\\circ$) হলে তাদের ডট গুণফল শূন্য হয়—এটি ঢাবি ভর্তি পরীক্ষায় অজানা মান বের করার সবচেয়ে জনপ্রিয় শর্ত।","formulas":[{"label":"ডট বা স্কেলার গুণন","latex":"\\vec{a} \\cdot \\vec{b} = |\\vec{a}||\\vec{b}|\\cos\\theta = a_x b_x + a_y b_y + a_z b_z","whenToUse":"দুটি ভেক্টরের স্কেলার গুণফল, মধ্যবর্তী কোণ বা কৃতকাজ নির্ণয়ে।"},{"label":"লম্ব হওয়ার শর্ত","latex":"\\vec{a} \\perp \\vec{b} \\iff \\vec{a} \\cdot \\vec{b} = 0","whenToUse":"দুটি অশূন্য ভেক্টর পরস্পর লম্ব হলে অজানা ধ্রুবক $m$-এর মান বের করতে।"},{"label":"লম্ব অভিক্ষেপ (স্কেলার)","latex":"\\text{Proj}_{\\vec{b}}(\\vec{a}) = \\frac{\\vec{a} \\cdot \\vec{b}}{|\\vec{b}|}","whenToUse":"$\\vec{b}$ ভেক্টরের ওপর $\\vec{a}$-এর লম্ব অভিক্ষেপ চাইলে (যেটির ওপর অভিক্ষেপ, তার মান হরে বসবে)।"},{"label":"ভেক্টর উপাংশ","latex":"\\text{VecProj}_{\\vec{b}}(\\vec{a}) = \\left(\\frac{\\vec{a} \\cdot \\vec{b}}{|\\vec{b}|^2}\\right)\\vec{b}","whenToUse":"$\\vec{b}$ ভেক্টর বরাবর $\\vec{a}$-এর উপাংশ ভেক্টর নির্ণয়ে।"}],"symbols":[{"sym":"$\\vec{a}\\cdot\\vec{b}$","meaning":"$\\vec{a}$ ও $\\vec{b}$-এর ডট (স্কেলার) গুণফল"},{"sym":"$\\theta$","meaning":"দুটি ভেক্টরের মধ্যবর্তী কোণ ($0^\\circ \\le \\theta \\le 180^\\circ$)"},{"sym":"$W = \\vec{F}\\cdot\\vec{d}$","meaning":"ধ্রুব বল $\\vec{F}$ দ্বারা সরণ $\\vec{d}$-এ কৃতকাজ"}],"example":{"problem":"$\\vec{a} = 2\\hat{i} + m\\hat{j} + \\hat{k}$ এবং $\\vec{b} = 4\\hat{i} - 2\\hat{j} - 2\\hat{k}$ পরস্পর লম্ব হলে $m$-এর মান নির্ণয় কর।","steps":["লম্ব হওয়ার শর্ত অনুযায়ী $\\vec{a} \\cdot \\vec{b} = 0$ বসাও।","অনুরূপ উপাংশ গুণ করে যোগ কর: $(2)(4) + (m)(-2) + (1)(-2) = 0$।","সরল কর: $8 - 2m - 2 = 0 \\implies 2m = 6 \\implies m = 3$।"],"answer":"$m = 3$"},"tip":"‘$\\vec{b}$-এর ওপর $\\vec{a}$-এর অভিক্ষেপ’ চাইলে ‘ওপর’ শব্দের আগের ভেক্টরটি ($\\vec{b}$) সবসময় হরে বসে: লম্ব অভিক্ষেপে $|\\vec{b}|$ এবং উপাংশে $|\\vec{b}|^2$ দিয়ে ভাগ করে $\\vec{b}$ গুণ করতে হয়।","check":{"q":"$\\vec{b} = 2\\hat{i} - \\hat{j} + 2\\hat{k}$ ভেক্টরের ওপর $\\vec{a} = 2\\hat{i} + 3\\hat{j} + \\hat{k}$-এর লম্ব অভিক্ষেপ কত?","a":"$1$, কারণ $\\vec{a}\\cdot\\vec{b} = 4 - 3 + 2 = 3$ এবং $|\\vec{b}| = \\sqrt{4+1+4} = 3$, সুতরাং $\\frac{3}{3} = 1$।"},"mythBuster":{"statement":"$\\vec{b}$-এর ওপর $\\vec{a}$-এর লম্ব অভিক্ষেপ এবং $\\vec{a}$-এর ওপর $\\vec{b}$-এর লম্ব অভিক্ষেপ সবসময় সমান।","isTrue":false,"why":"উভয়ের লব $\\vec{a}\\cdot\\vec{b}$ এক হলেও হর যথাক্রমে $|\\vec{b}|$ ও $|\\vec{a}|$; কেবল $|\\vec{a}| = |\\vec{b}|$ অথবা $\\vec{a}\\cdot\\vec{b} = 0$ হলেই এরা সমান হয়।"}},{"id":"geo_vectors_c3","badge":"ক্ষেত্রফল ও সমান্তরালতা","title":"ক্রস গুণন, সমান্তরালতা ও ক্ষেত্রফল","intuition":"ক্রস বা ভেক্টর গুণন এমন একটি নতুন ভেক্টর তৈরি করে যা প্রদত্ত উভয় ভেক্টরের ওপর লম্ব এবং যার মান ভেক্টর দুটি দ্বারা গঠিত সামান্তরিকের ক্ষেত্রফলের সমান। দুটি ভেক্টর সমান্তরাল হলে তারা কোনো ক্ষেত্রফল তৈরি করে না, তাই তাদের ক্রস গুণফল শূন্য ভেক্টর হয়।","formulas":[{"label":"ক্রস বা ভেক্টর গুণন","latex":"\\vec{a} \\times \\vec{b} = \\begin{vmatrix} \\hat{i} & \\hat{j} & \\hat{k} \\\\ a_x & a_y & a_z \\\\ b_x & b_y & b_z \\end{vmatrix}, \\quad |\\vec{a} \\times \\vec{b}| = |\\vec{a}||\\vec{b}|\\sin\\theta","whenToUse":"উভয় ভেক্টরের ওপর লম্ব ভেক্টর বা জ্যামিতিক ক্ষেত্রফল নির্ণয়ে।"},{"label":"সমান্তরাল হওয়ার শর্ত","latex":"\\vec{a} \\parallel \\vec{b} \\iff \\vec{a} \\times \\vec{b} = \\vec{0} \\iff \\frac{a_x}{b_x} = \\frac{a_y}{b_y} = \\frac{a_z}{b_z}","whenToUse":"সমান্তরাল ভেক্টরে অজানা মান বের করতে ৫ সেকেন্ডে অনুপাত শর্ত ব্যবহার কর।"},{"label":"সামান্তরিক ও ত্রিভুজের ক্ষেত্রফল","latex":"A_{\\parallel\\text{ (sides)}} = |\\vec{a} \\times \\vec{b}|, \\quad A_{\\triangle} = \\frac{1}{2}|\\vec{a} \\times \\vec{b}|, \\quad A_{\\parallel\\text{ (diagonals)}} = \\frac{1}{2}|\\vec{d_1} \\times \\vec{d_2}|","whenToUse":"প্রশ্নে সন্নিহিত বাহু নাকি কর্ণ দেওয়া আছে তা আগে ভালোভাবে দেখে নাও।"}],"symbols":[{"sym":"$\\vec{a}\\times\\vec{b}$","meaning":"$\\vec{a}$ ও $\\vec{b}$-এর ক্রস গুণফল, যা উভয়ের ওপর লম্ব"},{"sym":"$\\hat{n}$","meaning":"$\\vec{a}$ ও $\\vec{b}$-এর সমতলের ওপর লম্ব একক ভেক্টর"},{"sym":"$\\vec{d_1}, \\vec{d_2}$","meaning":"সামান্তরিকের দুটি কর্ণ ভেক্টর"}],"example":{"problem":"যদি কোনো ত্রিভুজের দুটি সন্নিহিত বাহু $\\vec{a} = 2\\hat{i} + \\hat{j} - \\hat{k}$ এবং $\\vec{b} = \\hat{i} - \\hat{j} + 2\\hat{k}$ হয়, তবে ত্রিভুজটির ক্ষেত্রফল নির্ণয় কর।","steps":["ক্রস গুণফল বের কর: $\\vec{a} \\times \\vec{b} = (2 - 1)\\hat{i} - (4 + 1)\\hat{j} + (-2 - 1)\\hat{k} = \\hat{i} - 5\\hat{j} - 3\\hat{k}$।","মান নির্ণয় কর: $|\\vec{a} \\times \\vec{b}| = \\sqrt{1^2 + (-5)^2 + (-3)^2} = \\sqrt{1 + 25 + 9} = \\sqrt{35}$।","ত্রিভুজের ক্ষেত্রফলের জন্য অর্ধেক কর: $\\text{Area} = \\frac{\\sqrt{35}}{2}$ বর্গ একক।"],"answer":"$\\frac{\\sqrt{35}}{2}$ বর্গ একক"},"tip":"দুটি ভেক্টর সমান্তরাল কি না যাচাই করতে কখনো $3\\times 3$ নির্ণায়ক বিস্তার করে সময় নষ্ট কোরো না—সরাসরি $\\frac{a_x}{b_x} = \\frac{a_y}{b_y} = \\frac{a_z}{b_z}$ অনুপাত সমান করে দা onceptual","conceptGroup":"coplanarity_and_unit_vectors","q":"স্কেলার ত্রিগুণন $[\\vec{a}\\;\\vec{b}\\;\\vec{c}]$-এর ক্ষেত্রে নিচের কোন অভেদটি সবসময় সত্য?","opts":["$[\\vec{a}\\;\\vec{b}\\;\\vec{c}] = [\\vec{b}\\;\\vec{a}\\;\\vec{c}]$","$[\\vec{a}\\;\\vec{b}\\;\\vec{c}] = [\\vec{b}\\;\\vec{c}\\;\\vec{a}]$","$[\\vec{a}\\;\\vec{b}\\;\\vec{c}] = -[\\vec{c}\\;\\vec{a}\\;\\vec{b}]$","$[\\vec{a}\\;\\vec{b}\\;\\vec{c}] = |\\vec{a}||\\vec{b}||\\vec{c}|$"],"ans":1,"tags":["board-standard","formula-trap"],"exp":"চক্রক্রমিক বিন্যাসে নির্ণায়কের চিহ্ন অপরিবর্তিত থাকে, তাই $[\\vec{a}\\;\\vec{b}\\;\\vec{c}] = [\\vec{b}\\;\\vec{c}\\;\\vec{a}] = [\\vec{c}\\;\\vec{a}\\;\\vec{b}]$। কিন্তু দুটি ভেক্টর অদলবদল করলে চিহ্ন ঋণাত্মক হয়।","variants":[]},{"id":"geo_vectors_q24","cardId":"geo_vectors_c4","qType":"conceptual","conceptGroup":"coplanarity_and_unit_vectors","q":"$[\\vec{a}\\;\\vec{b}\\;\\vec{c}]$ স্কেলার ত্রিগুণনের তিনটি ভেক্টরের মধ্যে যেকোনো দুটি সমান্তরাল হলে এর মান কত?","opts":["$1$","$-1$","$0$","$|\\vec{a}||\\vec{b}|$"],"ans":2,"tags":["no-calc-shortcut","board-standard"],"exp":"দুটি ভেক্টর সমান্তরাল হলে $3\\times 3$ নির্ণায়কের দুটি সারি সমানুপাতিক হয়ে যায়, ফলে নির্ণায়কের মান সরাসরি $0$ হয় (জ্যামিতিকভাবে ভেক্টর তিনটি সমতলীয়)।","variants":[]},{"id":"geo_vectors_q25","cardId":"geo_vectors_c1","qType":"conceptual","conceptGroup":"coplanarity_and_unit_vectors","q":"একটি ভেক্টর ধনাত্মক $x, y, z$ অক্ষের সাথে $\\alpha, \\beta, \\gamma$ কোণ উৎপন্ন করলে $\\sin^2\\alpha + \\sin^2\\beta + \\sin^2\\gamma$-এর মান কত?","opts":["$1$","$3$","$0$","$2$"],"ans":3,"tags":["pyq-pattern","formula-trap"],"exp":"যেহেতু $\\cos^2\\alpha + \\cos^2\\beta + \\cos^2\\gamma = 1$, তাই $\\sin^2\\theta = 1 - \\cos^2\\theta$ বসিয়ে পাই $3 - (\\cos^2\\alpha + \\cos^2\\beta + \\cos^2\\gamma) = 3 - 1 = 2$। কোসাইন অভেদের সাথে গুলিয়ে ফেললে ভুল উত্তর $1$ আসে।","variants":[]}],"writtenDrills":[{"id":"geo_vectors_w1","cardId":"geo_vectors_c2","marks":2,"q":"$\\vec{b} = 2\\hat{i} - \\hat{j} + 2\\hat{k}$ ভেক্টরের ওপর $\\vec{a} = 3\\hat{i} - 2\\hat{j} + 4\\hat{k}$-এর লম্ব অভিক্ষেপ এবং ভেক্টর উপাংশ নির্ণয় কর।","steps":["ডট গুণফল ও মান বের কর: $\\vec{a}\\cdot\\vec{b} = (3)(2) + (-2)(-1) + (4)(2) = 6 + 2 + 8 = 16$ এবং $|\\vec{b}| = \\sqrt{2^2 + (-1)^2 + 2^2} = 3$।","লম্ব অভিক্ষেপ $= \\frac{\\vec{a}\\cdot\\vec{b}}{|\\vec{b}|} = \\frac{16}{3}$।","ভেক্টর উপাংশ $= \\left(\\frac{\\vec{a}\\cdot\\vec{b}}{|\\vec{b}|^2}\\right)\\vec{b} = \\frac{16}{9}(2\\hat{i} - \\hat{j} + 2\\hat{k})$।"],"finalAnswer":"লম্ব অভিক্ষেপ $= \\frac{16}{3}$; ভেক্টর উপাংশ $= \\frac{16}{9}(2\\hat{i} - \\hat{j} + 2\\hat{k})$","markingTip":"$\\vec{a}\\cdot\\vec{b}$ ও $|\\vec{b}|$ দেখিয়ে সঠিক লম্ব অভিক্ষেপ নির্ণয়ে ১ নম্বর এবং $|\\vec{b}|^2$ দিয়ে ভাগ করে ভেক্টর উপাংশ বের করায় ১ নম্বর।"},{"id":"geo_vectors_w2","cardId":"geo_vectors_c3","marks":2,"q":"$\\vec{a} = \\hat{i} + \\hat{j} - \\hat{k}$ এবং $\\vec{b} = 2\\hat{i} - \\hat{j} + \\hat{k}$ উভয় ভেক্টরের ওপর লম্ব একটি একক ভেক্টর নির্ণয় কর।","steps":["ক্রস গুণফল বের কর: $\\vec{a}\\times\\vec{b} = \\begin{vmatrix}\\hat{i} & \\hat{j} & \\hat{k} \\\\ 1 & 1 & -1 \\\\ 2 & -1 & 1\\end{vmatrix} = (1-1)\\hat{i} - (1+2)\\hat{j} + (-1-2)\\hat{k} = -3\\hat{j} - 3\\hat{k}$।","মান নির্ণয় কর: $|\\vec{a}\\times\\vec{b}| = \\sqrt{(-3)^2 + (-3)^2} = 3\\sqrt{2}$।","উভয় দিকসহ একক ভেক্টর: $\\pm\\frac{-3\\hat{j} - 3\\hat{k}}{3\\sqrt{2}} = \\pm\\frac{1}{\\sqrt{2}}(\\hat{j} + \\hat{k})$।"],"finalAnswer":"$\\pm\\frac{1}{\\sqrt{2}}(\\hat{j} + \\hat{k})$","markingTip":"সঠিক ক্রস গুণফল নির্ণয়ে ১ নম্বর এবং $|\\vec{a}\\times\\vec{b}|$ দিয়ে ভাগ করে $\\pm$ চিহ্নসহ একক ভেক্টর লেখায় ১ নম্বর।"},{"id":"geo_vectors_w3","cardId":"geo_vectors_c4","marks":2,"q":"দেখাও যে, $\\vec{a} = \\hat{i} - 2\\hat{j} + 3\\hat{k}$, $\\vec{b} = -2\\hat{i} + 3\\hat{j} - 4\\hat{k}$ এবং $\\vec{c} = \\hat{i} - 3\\hat{j} + 5\\hat{k}$ ভেক্টর তিনটি সমতলীয়।","steps":["স্কেলার ত্রিগুণন নির্ণায়ক গঠন কর: $[\\vec{a}\\;\\vec{b}\\;\\vec{c}] = \\begin{vmatrix} 1 & -2 & 3 \\\\ -2 & 3 & -4 \\\\ 1 & -3 & 5 \\end{vmatrix}$।","প্রথম সারি বরাবর বিস্তার কর: $1(15 - 12) - (-2)(-10 + 4) + 3(6 - 3) = 3 - 12 + 9 = 0$।","যেহেতু $[\\vec{a}\\;\\vec{b}\\;\\vec{c}] = 0$, তাই ভেক্টর তিনটি সমতলীয়।"],"finalAnswer":"$[\\vec{a}\\;\\vec{b}\\;\\vec{c}] = 0$, সুতরাং ভেক্টর তিনটি সমতলীয় (প্রমাণিত)।","markingTip":"সমতলীয়তার শর্ত ও নির্ণায়ক গঠনে ১ নম্বর এবং সঠিক বিস্তারের মাধ্যমে $0$ প্রমাণ করে সিদ্ধান্ত লেখায় ১ নম্বর।"}]},{"id":"geo_lines","moduleId":"mod_geo","title":"সরলরেখা","subtitle":"পোলার স্থানাঙ্ক, বিভক্তিকরণ, ঢাল, সরলরেখার রূপ, দূরত্ব ও সমদ্বিখণ্ডক","paperRef":"1st Paper Ch. 3","tier":1,"estMinutes":20,"cards":[{"id":"geo_lines_c1","badge":"টিয়ার ১ মূল অধ্যায়","title":"পোলার স্থানাঙ্ক, বিভক্তিকরণ সূত্র ও ত্রিভুজের ক্ষেত্রফল","intuition":"সমতলের যেকোনো বিন্দুকে কার্তেসীয় $(x, y)$ অথবা মূলবিন্দু থেকে দূরত্ব ও কোণ $(r, \\theta)$ পোলার স্থানাঙ্কে প্রকাশ করা যায়। বিভক্তিকরণ সূত্র ও ক্ষেত্রফলের নির্ণায়ক ব্যবহার করে কয়েক সেকেন্ডেই ভরকেন্দ্র ও বিন্দুর সমরেখতা নির্ণয় করা যায়।","formulas":[{"label":"কার্তেসীয়–পোলার রূপান্তর","latex":"x = r\\cos\\theta,\\; y = r\\sin\\theta,\\; r = \\sqrt{x^2 + y^2},\\; \\tan\\theta = \\frac{y}{x}","whenToUse":"$(x, y)$ কোন চতুর্ভাগে আছে তা দেখে সবসময় $\\theta$ ঠিক করে নাও।"},{"label":"অন্তর্বিভক্ত ও বহির্বিভক্ত সূত্র","latex":"P = \\left(\\frac{m_1 x_2 \\pm m_2 x_1}{m_1 \\pm m_2},\\; \\frac{m_1 y_2 \\pm m_2 y_1}{m_1 \\pm m_2}\\right)","whenToUse":"$m_1:m_2$ অনুপাতে অন্তর্বিভক্ত হলে $+$ এবং বহির্বিভক্ত হলে $-$ চিহ্ন বসাও।"},{"label":"ভরকেন্দ্র ও ত্রিভুজের ক্ষেত্রফল","latex":"G = \\left(\\frac{x_1+x_2+x_3}{3},\\; \\frac{y_1+y_2+y_3}{3}\\right),\\quad \\Delta = \\frac{1}{2}\\left|x_1(y_2-y_3) + x_2(y_3-y_1) + x_3(y_1-y_2)\\right|","whenToUse":"তিনটি বিন্দু সমরেখ প্রমাণে $\\Delta = 0$ অথবা সমান ঢালের শর্ত ব্যবহার কর।"}],"symbols":[{"sym":"$(r, \\theta)$","meaning":"পোলার স্থানাঙ্ক: ব্যাসার্ধ ভেক্টর $r \\ge 0$ এবং ধনাত্মক $x$-অক্ষের সাথে কোণ $\\theta$"},{"sym":"$m_1 : m_2$","meaning":"প্রথম বিন্দু থেকে দ্বিতীয় বিন্দু পর্যন্ত বিভক্তিকরণ অনুপাত"},{"sym":"$G$","meaning":"ত্রিভুজের ভরকেন্দ্র (মধ্যমাত্রয়ের ছেদবিন্দু)"}],"example":{"problem":"$(-1, \\sqrt{3})$ কার্তেসীয় বিন্দুটির পোলার স্থানাঙ্ক $(r, \\theta)$ নির্ণয় কর যেখানে $0^\\circ \\le \\theta < 360^\\circ$।","steps":["ব্যাসার্ধ নির্ণয় কর: $r = \\sqrt{(-1)^2 + (\\sqrt{3})^2} = \\sqrt{1 + 3} = 2$।","সূক্ষ্মকোণ বের কর: $\\tan\\alpha = \\left|\\frac{\\sqrt{3}}{-1}\\right| = \\sqrt{3} \\implies \\alpha = 60^\\circ$।","যেহেতু $x < 0, y > 0$ (দ্বিতীয় চতুর্ভাগ), তাই $\\theta = 180^\\circ - 60^\\circ = 120^\\circ$।"],"answer":"$(2, 120^\\circ)$"},"tip":"হাতে কলমে ১০ সেকেন্ডে ত্রিভুজের ক্ষেত্রফল বের করতে একটি শীর্ষবিন্দুকে বাকি দুটি থেকে বিয়োগ করে $(0,0)$-এ নিয়ে যাও: নতুন বিন্দু $(a, b)$ ও $(c, d)$ হলে $\\Delta = \\frac{1}{2}|ad - bc|$।","check":{"q":"$(2, 5)$, $(4, -1)$ এবং $(6, 2)$ শীর্ষবিশিষ্ট ত্রিভুজের ভরকেন্দ্র কত?","a":"$(4, 2)$, কারণ $\\left(\\frac{2+4+6}{3}, \\frac{5-1+2}{3}\\right) = (4, 2)$।"},"mythBuster":{"statement":"যেকোনো কার্তেসীয় বিন্দু $(x, y)$-এর পোলার কোণ সরাসরি $\\theta = \\tan^{-1}\\left(\\frac{y}{x}\\right)$।","isTrue":false,"why":"$\\tan^{-1}(y/x)$ কেবল প্রথম ও চতুর্থ চতুর্ভাগের কোণ দেয়; দ্বিতীয় ও তৃতীয় চতুর্ভাগে সঠিক কোণ পেতে $180^\\circ$ যোগ করতে হয়।"}},{"id":"geo_lines_c2","badge":"সরলরেখার রূপ","title":"ঢাল ও সরলরেখার সমীকরণের সকল রূপ","intuition":"যেকোনো সরলরেখা দুটি তথ্যে নির্দিষ্ট হয়—ঢাল ও একটি বিন্দু, দুটি বিন্দু, দুটি ছেদক, অথবা মূলবিন্দু থেকে লম্ব দূরত্ব ও কোণ। সঠিক রূপ বেছে নিলে অতিরিক্ত হিসাব ছাড়াই ছেদক, নতি কোণ ও ক্ষেত্রফল মুহূর্তেই বের হয়।","formulas":[{"label":"সরলরেখার ঢাল","latex":"m = \\tan\\theta = \\frac{y_2 - y_1}{x_2 - x_1} = -\\frac{a}{b} \\quad (ax + by + c = 0)","whenToUse":"দুটি বিন্দু বা সাধারণ সমীকরণ থেকে দ্রুত ঢাল নির্ণয়ে।"},{"label":"বিন্দু-ঢাল ও ঢাল-ছেদক আকার","latex":"y - y_1 = m(x - x_1), \\qquad y = mx + c","whenToUse":"একটি বিন্দু ও ঢাল অথবা ঢাল ও $y$-ছেদক $c$ দেওয়া থাকলে।"},{"label":"ছেদক আকার ও অক্ষদ্বয়ের সাথে ক্ষেত্রফল","latex":"\\frac{x}{a} + \\frac{y}{b} = 1, \\qquad \\Delta = \\frac{1}{2}|ab|","whenToUse":"$x$-ছেদক $a$, $y$-ছেদক $b$ এবং অক্ষদ্বয়ের সাথে গঠিত ত্রিভুজের ক্ষেত্রফল বের করতে।"},{"label":"লম্ব আকার","latex":"x\\cos\\alpha + y\\sin\\alpha = p \\quad (p > 0)","whenToUse":"মূলবিন্দু থেকে লম্ব দূরত্ব $p$ এবং লম্বের নতি কোণ $\\alpha$ দেওয়া থাকলে।"}],"symbols":[{"sym":"$m$","meaning":"সরলরেখার ঢাল বা নতি"},{"sym":"$a, b$","meaning":"ছেদক আকারে $x$-অক্ষ ও $y$-অক্ষের খণ্ডিতাংশ"},{"sym":"$p$","meaning":"মূলবিন্দু $(0,0)$ থেকে সরলরেখার লম্ব দূরত্ব ($p > 0$)"}],"example":{"problem":"$3x + 4y = 24$ সরলরেখাটি অক্ষদ্বয়ের সাথে যে ত্রিভুজ গঠন করে তার ক্ষেত্রফল নির্ণয় কর।","steps":["উভয় পক্ষকে $24$ দিয়ে ভাগ করে ছেদক আকারে নাও: $\\frac{x}{8} + \\frac{y}{6} = 1$।","ছেদক দুটি পড়ো: $a = 8$ এবং $b = 6$।","ক্ষেত্রফল নির্ণয় কর: $\\Delta = \\frac{1}{2}|8 \\times 6| = 24$ বর্গ একক।"],"answer":"$24$ বর্গ একক"},"tip":"$ax + by + c = 0$ রেখাটি অক্ষদ্বয়ের সাথে যে ত্রিভুজ গঠন করে তার ক্ষেত্রফলের সরাসরি ঢাবি শর্টকাট হলো $\\Delta = \\frac{c^2}{2|ab|}$—সাজানোরও দরকার নেই।","check":{"q":"$\\sqrt{3}x - y + 5 = 0$ রেখাটি ধনাত্মক $x$-অক্ষের সাথে কত কোণ উৎপন্ন করে?","a":"$60^\\circ$, কারণ $m = -\\frac{\\sqrt{3}}{-1} = \\sqrt{3} = \\tan 60^\\circ$।"},"mythBuster":{"statement":"$ax + by + c = 0$ সরলরেখার ঢাল হলো $\\frac{a}{b}$।","isTrue":false,"why":"$y$-এর মান বের করলে পাই $y = -\\frac{a}{b}x - \\frac{c}{b}$, তাই সাধারণ আকারের ঢাল সবসময় মাইনাস চিহ্নসহ $-\\frac{a}{b}$ হয়।"}},{"id":"geo_lines_c3","badge":"ঢাবি অতি গুরুত্বপূর্ণ","title":"সমান্তরাল, লম্ব, মধ্যবর্তী কোণ ও সমবিন্দুতা","intuition":"সমান্তরাল রেখাগুলোর $ax + by$ অংশ হুবহু একই থাকে, আর লম্ব রেখা পেতে $x$ ও $y$-এর সহগ অদলবদল করে মাঝের চিহ্ন বদলে দিতে হয় ($bx - ay$)। তিনটি রেখার সহগ নির্ণায়ক শূন্য হলে তারা একটি সাধারণ বিন্দুতে মিলিত হয় অর্থাৎ সমবিন্দু হয়।","formulas":[{"label":"সমান্তরাল ও লম্ব রেখার সরাসরি ছাঁচ","latex":"\\parallel: ax + by + k = 0 \\qquad \\perp: bx - ay + k = 0","whenToUse":"প্রদত্ত বিন্দু $(x_1, y_1)$ বসিয়ে ১০ সেকেন্ডে $k$ বের কর—ঢাল বের করার দরকার নেই।"},{"label":"সমান্তরাল ও লম্ব হওয়ার শর্ত","latex":"\\parallel: m_1 = m_2 \\;\\text{or}\\; \\frac{a_1}{a_2} = \\frac{b_1}{b_2}; \\qquad \\perp: m_1 m_2 = -1 \\;\\text{or}\\; a_1 a_2 + b_1 b_2 = 0","whenToUse":"দুটি রেখায় অজানা ধ্রুবক $k$-এর মান নির্ণয় করতে।"},{"label":"দুটি রেখার মধ্যবর্তী সূক্ষ্মকোণ","latex":"\\tan\\theta = \\left|\\frac{m_1 - m_2}{1 + m_1 m_2}\\right|","whenToUse":"$m_1$ ও $m_2$ ঢালবিশিষ্ট দুটি ছেদী রেখার মধ্যবর্তী সূক্ষ্মকোণ নির্ণয়ে।"},{"label":"সমবিন্দু হওয়ার শর্ত","latex":"\\begin{vmatrix} a_1 & b_1 & c_1 \\\\ a_2 & b_2 & c_2 \\\\ a_3 & b_3 & c_3 \\end{vmatrix} = 0","whenToUse":"তিনটি সরলরেখা একই বিন্দুগামী (সমবিন্দু) হলে।"}],"symbols":[{"sym":"$m_1, m_2$","meaning":"দুটি সরলরেখার ঢাল"},{"sym":"$k$","meaning":"প্রদত্ত বিন্দু বসিয়ে নির্ণীত ধ্রুবক পদ"}],"example":{"problem":"$(2, -3)$ বিন্দুগামী এবং $4x - 5y + 7 = 0$ রেখার ওপর লম্ব সরলরেখার সমীকরণ নির্ণয় কর।","steps":["সহগ অদলবদল করে মাঝের চিহ্ন পরিবর্তন কর: $5x + 4y + k = 0$।","$(2, -3)$ বিন্দু বসাও: $5(2) + 4(-3) + k = 0 \\implies 10 - 12 + k = 0 \\implies k = 2$।","নির্ণেয় সমীকরণ লেখো: $5x + 4y + 2 = 0$।"],"answer":"$5x + 4y + 2 = 0$"},"tip":"তিনটি রেখার সমবিন্দুতা যাচাইয়ের সময় যদি প্রথম দুটি রেখার সহগ সহজ হয়, তবে $3\\times 3$ নির্ণায়ক বিস্তার না করে ওই দুটির ছেদবিন্দু বের করে তৃতীয় রেখায় বসিয়ে দেওয়া অনেক দ্রুততর।","check":{"q":"$3x + ky - 5 = 0$ এবং $4x - 6y + 1 = 0$ পরস্পর লম্ব হলে $k$-এর মান কত?","a":"$k = 2$, কারণ $a_1a_2 + b_1b_2 = (3)(4) + (k)(-6) = 0 \\implies 6k = 12 \\implies k = 2$।"},"mythBuster":{"statement":"$3x - 2y + 5 = 0$ রেখার লম্ব রেখার সমীকরণ হলো $2x - 3y + k = 0$।","isTrue":false,"why":"সহগ অদলবদল করার পাশাপাশি মাঝের চিহ্নও বদলাতে হয়; সঠিক লম্ব রেখা হবে $2x + 3y + k = 0$, যাতে $a_1a_2 + b_1b_2 = 6 - 6 = 0$ হয়।"}},{"id":"geo_lines_c4","badge":"পরীক্ষার ফাঁদ সতর্কতা","title":"লম্ব দূরত্ব ও কোণের সমদ্বিখণ্ডক","intuition":"কোনো বিন্দু থেকে একটি রেখার ক্ষুদ্রতম দূরত্ব সবসময় লম্ব বরাবর হয়। আর দুটি সমান্তরাল রেখার দূরত্ব বের করতে ধ্রুবক দুটি বিয়োগ করার আগে অবশ্যই উভয় সমীকরণের $x$ ও $y$-এর সহগ সমান করে নিতে হবে।","formulas":[{"label":"বিন্দু থেকে রেখার লম্ব দূরত্ব","latex":"d = \\frac{|ax_1 + by_1 + c|}{\\sqrt{a^2 + b^2}}","whenToUse":"$(x_1, y_1)$ বিন্দু থেকে $ax + by + c = 0$ রেখার লম্ব দূরত্ব নির্ণয়ে।"},{"label":"সমান্তরাল রেখাদ্বয়ের মধ্যবর্তী দূরত্ব","latex":"d = \\frac{|c_1 - c_2|}{\\sqrt{a^2 + b^2}} \\quad (ax+by+c_1=0,\\; ax+by+c_2=0)","whenToUse":"$c_1 - c_2$ করার আগে অবশ্যই উভয় সমীকরণে $a$ ও $b$ হুবহু সমান করে নাও।"},{"label":"কোণের সমদ্বিখণ্ডক","latex":"\\frac{a_1x + b_1y + c_1}{\\sqrt{a_1^2 + b_1^2}} = \\pm \\frac{a_2x + b_2y + c_2}{\\sqrt{a_2^2 + b_2^2}}","whenToUse":"$c_1, c_2 > 0$ রেখে $a_1a_2 + b_1b_2 > 0$ হলে $+$ চিহ্নে স্থূলকোণের এবং $-$ চিহ্নে সূক্ষ্মকোণের সমদ্বিখণ্ডক পাওয়া যায়।"}],"symbols":[{"sym":"$d$","meaning":"অঋণাত্মক লম্ব দূরত্ব"},{"sym":"$c_1, c_2$","meaning":"$a, b$ সমান করার পর সমান্তরাল রেখাদ্বয়ের ধ্রুবক পদ"}],"example":{"problem":"$3x - 4y + 5 = 0$ এবং $6x - 8y - 15 = 0$ সমান্তরাল রেখাদ্বয়ের মধ্যবর্তী দূরত্ব নির্ণয় কর।","steps":["দ্বিতীয় সমীকরণকে $2$ দিয়ে ভাগ করে $x, y$-এর সহগ সমান কর: $3x - 4y - \\frac{15}{2} = 0$।","সমান্তরাল দূরত্বের সূত্র বসাও: $d = \\frac{|5 - (-\\frac{15}{2})|}{\\sqrt{3^2 + (-4)^2}} = \\frac{|\\frac{25}{2}|}{5}$।","সরল কর: $d = \\frac{25}{10} = \\frac{5}{2}$ একক।"],"answer":"$\\frac{5}{2}$ একক"},"tip":"ঢাবি এমসিকিউতে $3x + 4y + 7 = 0$ ও $6x + 8y + 4 = 0$ ধরনের রেখা দেখলেই সাথে সাথে দ্বিতীয়টিকে $2$ দিয়ে ভাগ কর—সহগ সমান না করে $|7 - 4|$ বিয়োগ করাই সবচেয়ে বড় ফাঁদ।","check":{"q":"$(3, -2)$ বিন্দু থেকে $3x + 4y - 6 = 0$ রেখার লম্ব দূরত্ব কত?","a":"$1$ একক, কারণ $\\frac{|3(3) + 4(-2) - 6|}{\\sqrt{3^2 + 4^2}} = \\frac{|9 - 8 - 6|}{5} = \\frac{5}{5} = 1$।"},"mythBuster":{"statement":"দুটি ছেদী সরলরেখার কোণের সমদ্বিখণ্ডক দুটির মধ্যবর্তী কোণ রেখা দুটির ঢালের ওপর নির্ভর করে।","isTrue":false,"why":"যেকোনো দুটি ছেদী সরলরেখার সূক্ষ্মকোণ ও স্থূলকোণের সমদ্বিখণ্ডক দুটি সবসময় পরস্পর লম্ব ($90^\\circ$) হয়।"}}],"mcqs":[{"id":"geo_lines_q1","cardId":"geo_lines_c1","qType":"numerical","conceptGroup":"cartesian_to_polar","q":"$(-1, \\sqrt{3})$ কার্তেসীয় বিন্দুটির পোলার স্থানাঙ্ক $(r, \\theta)$ কত?","opts":["$(2, 60^\\circ)$","$(2, 120^\\circ)$","$(2, 150^\\circ)$","$(4, 120^\\circ)$"],"ans":1,"tags":["pyq-pattern","formula-trap"],"exp":"$r = \\sqrt{(-1)^2 + (\\sqrt{3})^2} = 2$ এবং সূক্ষ্মকোণ $\\tan^{-1}(\\sqrt{3}) = 60^\\circ$। বিন্দুটি দ্বিতীয় চতুর্ভাগে থাকায় $\\theta = 180^\\circ - 60^\\circ = 120^\\circ$; চতুর্ভাগ না দেখলে ভুল ফাঁদ $(2, 60^\\circ)$ আসে।","variants":[{"q":"$(-\\sqrt{3}, -1)$ কার্তেসীয় বিন্দুটির পোলার স্থানাঙ্ক $(r, \\theta)$ কত?","opts":["$(2, 30^\\circ)$","$(2, 150^\\circ)$","$(2, 210^\\circ)$","$(2, 240^\\circ)$"],"ans":2,"exp":"$r = \\sqrt{3 + 1} = 2$ এবং সূক্ষ্মকোণ $30^\\circ$। উভয় স্থানাঙ্ক ঋণাত্মক (তৃতীয় চতুর্ভাগ) হওয়ায় $\\theta = 180^\\circ + 30^\\circ = 210^\\circ$।"},{"q":"$(2, -2)$ কার্তেসীয় বিন্দুটির পোলার স্থানাঙ্ক $(r, \\theta)$ কত?","opts":["$(2\\sqrt{2}, 315^\\circ)$","$(2\\sqrt{2}, 45^\\circ)$","$(2\\sqrt{2}, 135^\\circ)$","$(4, 315^\\circ)$"],"ans":0,"exp":"$r = \\sqrt{4 + 4} = 2\\sqrt{2}$ এবং সূক্ষ্মকোণ $45^\\circ$। চতুর্থ চতুর্ভাগে ($x > 0, y < 0$) কোণ $\\theta = 360^\\circ - 45^\\circ = 315^\\circ$।"}]},{"id":"geo_lines_q2","cardId":"geo_lines_c1","qType":"numerical","conceptGroup":"polar_to_cartesian","q":"$(4, 60^\\circ)$ পোলার বিন্দুটির কার্তেসীয় স্থানাঙ্ক কত?","opts":["$(2\\sqrt{3}, 2)$","$(2, 2\\sqrt{3})$","$(4, 2\\sqrt{3})$","$(2, 2)$"],"ans":1,"tags":["board-standard","no-calc-shortcut"],"exp":"$x = 4\\cos 60^\\circ = 4(\\frac{1}{2}) = 2$ এবং $y = 4\\sin 60^\\circ = 4(\\frac{\\sqrt{3}}{2}) = 2\\sqrt{3}$। সাইন ও কোসাইন উল্টো বসালে ভুল ফাঁদ $(2\\sqrt{3}, 2)$ আসে।","variants":[{"q":"$(6, 150^\\circ)$ পোলার বিন্দুটির কার্তেসীয় স্থানাঙ্ক কত?","opts":["$(3\\sqrt{3}, 3)$","$(-3, 3\\sqrt{3})$","$(-3\\sqrt{3}, 3)$","$(-3\\sqrt{3}, -3)$"],"ans":2,"exp":"$x = 6\\cos 150^\\circ = 6(-\\frac{\\sqrt{3}}{2}) = -3\\sqrt{3}$ এবং $y = 6\\sin 150^\\circ = 6(\\frac{1}{2}) = 3$। $\\sin$ ও $\\cos$ অদলবদল করলে $(-3, 3\\sqrt{3})$ আসে।"},{"q":"$(4\ ,{"id":"geo_lines_q22","cardId":"geo_lines_c2","qType":"conceptual","conceptGroup":"line_forms_and_slope_concepts","q":"নিচের কোন সরলরেখাটিকে ছেদক আকার $\\frac{x}{a} + \\frac{y}{b} = 1$-এ প্রকাশ করা যায় না?","opts":["যার $x$-ছেদক ঋণাত্মক ও $y$-ছেদক ধনাত্মক","মূলবিন্দু $(0, 0)$ দিয়ে গমনকারী সরলরেখা","যার ঢাল $-1$ এবং $y$-ছেদক $3$","যা $(2, 0)$ বিন্দু দিয়ে যায় এবং অক্ষের সাথে $45^\\circ$ কোণ করে"],"ans":1,"tags":["pyq-pattern","graph-visual"],"exp":"মূলবিন্দুগামী সরলরেখায় $a = 0$ ও $b = 0$ হওয়ায় $\\frac{x}{a}$ ও $\\frac{y}{b}$ অসংজ্ঞায়িত হয়ে যায় (কোনো অক্ষের সমান্তরাল রেখাতেও এটি লেখা যায় না)। ঋণাত্মক অশূন্য ছেদক সম্পূর্ণ বৈধ।","variants":[]},{"id":"geo_lines_q23","cardId":"geo_lines_c4","qType":"conceptual","conceptGroup":"angles_distances_bisectors_concepts","q":"দুটি সমান্তরাল রেখার মধ্যবর্তী দূরত্বের সূত্র $d = \\frac{|c_1 - c_2|}{\\sqrt{a^2 + b^2}}$ প্রয়োগের আগে কোনটি অবশ্যই নিশ্চিত করতে হবে?","opts":["$c_1$ ও $c_2$ উভয়ই ধনাত্মক হতে হবে","রেখা দুটি মূলবিন্দুগামী হতে হবে","উভয় সমীকরণে $x$ ও $y$-এর সহগ হুবহু সমান হতে হবে","রেখা দুটির ঢাল পরস্পর বিপরীত হতে হবে"],"ans":2,"tags":["pyq-pattern","formula-trap"],"exp":"একটি সমীকরণকে কোনো ধ্রুবক দিয়ে গুণ করলে রেখা না সরলেও $c_2$ বদলে যায়, তাই সূত্র বসানোর আগে অবশ্যই উভয় সমীকরণে $a$ ও $b$ সমান করে নিতে হয়। $c_1, c_2$ ধনাত্মক হওয়া বাধ্যতামূলক নয়।","variants":[]},{"id":"geo_lines_q24","cardId":"geo_lines_c4","qType":"conceptual","conceptGroup":"angles_distances_bisectors_concepts","q":"যেকোনো দুটি ছেদী সরলরেখার অন্তর্ভুক্ত কোণগুলোর সমদ্বিখণ্ডক দুটির মধ্যবর্তী কোণ কত?","opts":["$45^\\circ$","$60^\\circ$","রেখা দুটির ঢালের ওপর নির্ভরশীল","$90^\\circ$"],"ans":3,"tags":["pyq-pattern","graph-visual"],"exp":"ছেদী রেখা দুটির সম্পূরক কোণ $\\theta$ ও $180^\\circ - \\theta$ হলে তাদের সমদ্বিখণ্ডকগুলোর মধ্যবর্তী কোণ $\\frac{\\theta}{2} + (90^\\circ - \\frac{\\theta}{2}) = 90^\\circ$। তাই সমদ্বিখণ্ডক দুটি সবসময় পরস্পর লম্ব।","variants":[]},{"id":"geo_lines_q25","cardId":"geo_lines_c3","qType":"conceptual","conceptGroup":"angles_distances_bisectors_concepts","q":"$a_1x + b_1y + c_1 = 0$ এবং $a_2x + b_2y + c_2 = 0$ সরলরেখা দুটির ক্ষেত্রে $\\frac{a_1}{a_2} = \\frac{b_1}{b_2} \\ne \\frac{c_1}{c_2}$ হলে রেখা দুটি কেমন হবে?","opts":["সমান্তরাল ও পৃথক (কোনো ছেদবিন্দু নেই)","অভিন্ন বা সমাপতিত রেখা","পরস্পর লম্ব","মূলবিন্দুতে ছেদ করবে"],"ans":0,"tags":["board-standard","formula-trap"],"exp":"$a$ ও $b$-এর অনুপাত সমান হওয়ায় ঢাল সমান (সমান্তরাল), কিন্তু $c$-এর অনুপাত ভিন্ন হওয়ায় ছেদক ভিন্ন—অর্থাৎ রেখা দুটি সমান্তরাল ও পৃথক। $\\frac{c_1}{c_2}$-ও সমান হলে তারা সমাপতিত হতো।","variants":[]}],"writtenDrills":[{"id":"geo_lines_w1","cardId":"geo_lines_c2","marks":2,"q":"$(3, 4)$ বিন্দুগামী একটি সরলরেখার অক্ষদ্বয় হতে খণ্ডিত অংশের যোগফল $14$ হলে রেখাটির সমীকরণ নির্ণয় কর।","steps":["ধরি, ছেদক আকার $\\frac{x}{a} + \\frac{y}{14 - a} = 1$, যেহেতু $a + b = 14$।","$(3, 4)$ বিন্দু বসিয়ে পাই $\\frac{3}{a} + \\frac{4}{14 - a} = 1 \\implies 3(14 - a) + 4a = a(14 - a) \\implies a^2 - 13a + 42 = 0$।","উৎপাদকে বিশ্লেষণ কর: $(a - 6)(a - 7) = 0 \\implies a = 6$ ($b = 8$) অথবা $a = 7$ ($b = 7$), ফলে সমীকরণ দুটি $4x + 3y = 24$ অথবা $x + y = 7$।"],"finalAnswer":"$4x + 3y = 24$ অথবা $x + y = 7$","markingTip":"$\\frac{x}{a} + \\frac{y}{14-a} = 1$ ধরে দ্বিঘাত সমীকরণ $a^2 - 13a + 42 = 0$ গঠনে ১ নম্বর এবং উভয় বৈধ সমীকরণ নির্ণয়ে ১ নম্বর।"},{"id":"geo_lines_w2","cardId":"geo_lines_c3","marks":2,"q":"$k$-এর কোন মানের জন্য $x - y + 1 = 0$, $2x + y - 7 = 0$ এবং $kx - y + 2 = 0$ সরলরেখা তিনটি সমবিন্দু হবে?","steps":["প্রথম দুটি সমীকরণ যোগ করে সমাধান কর: $(x - y + 1) + (2x + y - 7) = 0 \\implies 3x = 6 \\implies x = 2$।","$x - y + 1 = 0$-এ $x = 2$ বসিয়ে পাই $y = 3$, অর্থাৎ ছেদবিন্দু $(2, 3)$।","তৃতীয় সমীকরণে $(2, 3)$ বসাও: $2k - 3 + 2 = 0 \\implies 2k = 1 \\implies k = \\frac{1}{2}$।"],"finalAnswer":"$k = \\frac{1}{2}$","markingTip":"প্রথম দুটি রেখার ছেদবিন্দু $(2, 3)$ নির্ণয়ে (বা $3\\times 3$ নির্ণায়ক $= 0$ বসানোয়) ১ নম্বর এবং $k = \\frac{1}{2}$ নির্ণয়ে ১ নম্বর।"},{"id":"geo_lines_w3","cardId":"geo_lines_c4","marks":2,"q":"$3x + 4y + 5 = 0$ এবং $12x - 5y + 7 = 0$ সরলরেখা দুটির অন্তর্ভুক্ত সূক্ষ্মকোণের সমদ্বিখণ্ডকের সমীকরণ নির্ণয় কর।","steps":["লক্ষ্য কর $c_1 = 5 > 0$, $c_2 = 7 > 0$ এবং $a_1a_2 + b_1b_2 = (3)(12) + (4)(-5) = 36 - 20 = 16 > 0$।","যেহেতু $a_1a_2 + b_1b_2 > 0$, তাই ঋণাত্মক ($-$) চিহ্ন নিলে সূক্ষ্মকোণের সমদ্বিখণ্ডক পাওয়া যাবে: $\\frac{3x + 4y + 5}{5} = -\\frac{12x - 5y + 7}{13}$।","আড়গুণন করে সরল কর: $39x + 52y + 65 = -60x + 25y - 35 \\implies 99x + 27y + 100 = 0$।"],"finalAnswer":"$99x + 27y + 100 = 0$","markingTip":"$c_1, c_2 > 0$ ও $a_1a_2 + b_1b_2 > 0$ যাচাই করে মাইনাস চিহ্ন নির্বাচনে ১ নম্বর এবং সঠিক বীজগাণিতিক সরলীকরণে ১ নম্বর।"}]},{"id":"geo_circles","moduleId":"mod_geo","title":"বৃত্ত","subtitle":"সাধারণ সমীকরণ, অক্ষের খণ্ডিতাংশ, স্পর্শক-অভিলম্ব ও দুই বৃত্তের সম্পর্ক","paperRef":"১ম পত্র অধ্যায় ৪","tier":2,"estMinutes":18,"cards":[{"id":"geo_circles_c1","badge":"মূল সমীকরণ","title":"বৃত্তের আদর্শ, সাধারণ ও ব্যাস রূপ","intuition":"কোনো নির্দিষ্ট বিন্দু (কেন্দ্র) থেকে সর্বদা সমান দূরত্বে (ব্যাসার্ধ $r$) অবস্থিত বিন্দুর সঞ্চারপথই হলো বৃত্ত। ঢাকা বিশ্ববিদ্যালয়ের গ-ইউনিট ভর্তি পরীক্ষায় ক্যালকুলেটর ছাড়াই সাধারণ সমীকরণ থেকে দ্রুত কেন্দ্র ও ব্যাসার্ধ বের করতে হয়—মনে রাখবে, $x^2$ ও $y^2$-এর সহগ $1$ না থাকলে প্রথমেই সেই সহগ দিয়ে পুরো সমীকরণকে ভাগ করে নিতে হবে।","formulas":[{"label":"কেন্দ্র-ব্যাসার্ধ রূপ","latex":"(x - h)^2 + (y - k)^2 = r^2","whenToUse":"যখন কেন্দ্র $(h,k)$ এবং ব্যাসার্ধ $r$ সরাসরি দেওয়া থাকে।"},{"label":"সাধারণ সমীকরণ","latex":"x^2 + y^2 + 2gx + 2fy + c = 0 \\implies C(-g,-f),\\; r = \\sqrt{g^2+f^2-c}","whenToUse":"বিস্তৃত দ্বিঘাত সমীকরণ থেকে কেন্দ্র ও ব্যাসার্ধ বের করতে; আগে $x^2, y^2$-এর সহগ $1$ করে নাও।"},{"label":"ব্যাসের প্রান্তবিন্দু রূপ","latex":"(x - x_1)(x - x_2) + (y - y_1)(y - y_2) = 0","whenToUse":"যখন একটি ব্যাসের দুই প্রান্তবিন্দু $(x_1, y_1)$ ও $(x_2, y_2)$ দেওয়া থাকে।"},{"label":"ক্ষেত্রফল ও পরিধি","latex":"A = \\pi r^2 = \\pi(g^2+f^2-c), \\quad P = 2\\pi r","whenToUse":"সাধারণ সমীকরণ থেকে সরাসরি ক্ষেত্রফল চাইলে বর্গমূল না করেই $r^2$ বসাও।"}],"symbols":[{"sym":"$(h, k)$ বা $(-g, -f)$","meaning":"বৃত্তের কেন্দ্রের স্থানাঙ্ক"},{"sym":"$r$","meaning":"বৃত্তের ব্যাসার্ধ; বাস্তব বৃত্তের জন্য $g^2+f^2-c > 0$ হতে হবে"},{"sym":"$2g, 2f$","meaning":"$x^2, y^2$-এর সহগ $1$ করার পর $x$ ও $y$-এর সহগ"}],"example":{"problem":"$2x^2 + 2y^2 - 12x + 16y - 22 = 0$ বৃত্তের কেন্দ্র, ব্যাসার্ধ এবং ক্ষেত্রফল নির্ণয় করো।","steps":["প্রথমে পুরো সমীকরণকে $2$ দিয়ে ভাগ করো: $x^2 + y^2 - 6x + 8y - 11 = 0$।","তুলনা করে পাই: $2g = -6 \\implies g = -3$, $2f = 8 \\implies f = 4$, এবং $c = -11$।","কেন্দ্র $= (-g, -f) = (3, -4)$।","$r^2 = g^2 + f^2 - c = (-3)^2 + 4^2 - (-11) = 9 + 16 + 11 = 36 \\implies r = 6$।","ক্ষেত্রফল $= \\pi r^2 = 36\\pi$ বর্গ একক।"],"answer":"কেন্দ্র $(3, -4)$, ব্যাসার্ধ $6$ এবং ক্ষেত্রফল $36\\pi$ বর্গ একক।"},"tip":"দ্রুত শর্টকাট: $x^2+y^2+Ax+By+c=0$ থেকে কেন্দ্র বের করতে শুধু $A$ ও $B$-কে অর্ধেক করে চিহ্ন উল্টে দাও: $(-A/2, -B/2)$।","check":{"q":"$x^2 + y^2 + 10x - 24y = 0$ বৃত্তের ব্যাসার্ধ কত?","a":"কেন্দ্র $(-5, 12)$ এবং $c=0$, তাই $r = \\sqrt{5^2 + 12^2} = 13$ ($5$-$12$-$13$ পিথাগোরীয় ত্রয়ী)।"},"mythBuster":{"statement":"$x^2 + y^2 + 2gx + 2fy + c = 0$ আকারের প্রতিটি সমীকরণই একটি বাস্তব বৃত্ত নির্দেশ করে।","isTrue":false,"why":"শুধুমাত্র $g^2 + f^2 - c > 0$ হলেই বাস্তব বৃত্ত হয়। $g^2 + f^2 - c = 0$ হলে তা বিন্দু বৃত্ত এবং $< 0$ হলে তা কাল্পনিক বৃত্ত।"}},{"id":"geo_circles_c2","badge":"অক্ষ ও খণ্ডিতাংশ","title":"অক্ষের খণ্ডিতাংশ ও অক্ষ স্পর্শের শর্ত","intuition":"কোনো বৃত্ত $x$-অক্ষ বা $y$-অক্ষকে যে দৈর্ঘ্যের জ্যা-তে ছেদ করে, তাই হলো অক্ষের খণ্ডিতাংশ। সেই খণ্ডিতাংশের দৈর্ঘ্য $0$ হয়ে গেলে বৃত্তটি অক্ষটিকে স্পর্শ করে—যা ভর্তি পরীক্ষার সবচেয়ে জনপ্রিয় ১০-সেকেন্ডের এমসিকিউ।","formulas":[{"label":"x-অক্ষের খণ্ডিতাংশ","latex":"L_x = 2\\sqrt{g^2 - c}","whenToUse":"$x$-অক্ষ থেকে বৃত্তটি যে অংশ কেটে নেয় তার দৈর্ঘ্য ($g^2 \\ge c$)।"},{"label":"y-অক্ষের খণ্ডিতাংশ","latex":"L_y = 2\\sqrt{f^2 - c}","whenToUse":"$y$-অক্ষ থেকে বৃত্তটি যে অংশ কেটে নেয় তার দৈর্ঘ্য ($f^2 \\ge c$)।"},{"label":"x-অক্ষ স্পর্শের শর্ত","latex":"g^2 = c \\iff r = |k|","whenToUse":"বৃত্তটি $x$-অক্ষকে স্পর্শ করলে কেন্দ্রের কোটি $|k|$-ই হয় ব্যাসার্ধ।"},{"label":"y-অক্ষ বা উভয় অক্ষ স্পর্শের শর্ত","latex":"f^2 = c \\; (r = |h|); \\quad g^2 = f^2 = c \\; (|h|=|k|=r)","whenToUse":"শুধু $y$-অক্ষ অথবা একইসাথে উভয় অক্ষকে স্পর্শ করার ক্ষেত্রে।"}],"symbols":[{"sym":"$L_x, L_y$","meaning":"যথাক্রমে $x$-অক্ষ ও $y$-অক্ষের খণ্ডিতাংশের দৈর্ঘ্য"},{"sym":"$g^2 = c$","meaning":"সমীকরণে $y=0$ বসিয়ে প্রাপ্ত দ্বিঘাত সমীকরণের নিশ্চায়ক শূন্য হওয়ার শর্ত"}],"example":{"problem":"$x^2 + y^2 - 10x + 4y + 9 = 0$ বৃত্তের $x$-অক্ষের খণ্ডিতাংশ নির্ণয় করো এবং $x^2 + y^2 - 10x + 4y + k = 0$ বৃত্তটি $x$-অক্ষকে স্পর্শ করলে $k$-এর মান কত?","steps":["এখানে $g = -5$, $f = 2$ এবং $c = 9$।","$x$-অক্ষের খণ্ডিতাংশ $= 2\\sqrt{g^2 - c} = 2\\sqrt{(-5)^2 - 9} = 2\\sqrt{16} = 8$ একক।","$x$-অক্ষকে স্পর্শ করলে $g^2 = k \\implies k = (-5)^2 = 25$।"],"answer":"$x$-অক্ষের খণ্ডিতাংশ $8$ একক এবং $k = 25$।"},"tip":"সতর্কতা: $x$-অক্ষকে স্পর্শ করলে ব্যাসার্ধ $r = |k|$ (কেন্দ্রের $y$-স্থানাঙ্ক), $|h|$ নয়! মনে মনে $x$-অক্ষের ওপর বসা একটি বৃত্ত কল্পনা করলেই আর গুলিয়ে যাবে না।","check":{"q":"$(4, -7)$ কেন্দ্রবিশিষ্ট একটি বৃত্ত $y$-অক্ষকে স্পর্শ করলে তার ব্যাসার্ধ কত?","a":"$r = |h| = |4| = 4$ একক (কেন্দ্র থেকে $y$-অক্ষের লম্ব দূরত্ব)।"},"mythBuster":{"statement":"কোনো বৃত্ত মূলবিন্দু $(0,0)$ দিয়ে গেলে তার $g = 0$ এবং $f = 0$ হয়।","isTrue":false,"why":"মূলবিন্দু দিয়ে গেলে কেবল ধ্রুবক পদ $c = 0$ হয়। আর $g = f = 0$ হওয়ার অর্থ হলো বৃত্তটির কেন্দ্র মূলবিন্দুতে।"}},{"id":"geo_circles_c3","badge":"স্পর্শক ও অভিলম্ব","title":"বিন্দুর অবস্থান, স্পর্শক ও অভিলম্ব","intuition":"যেকোনো বিন্দু $(x_1, y_1)$ বৃত্তের সমীকরণের বামপক্ষে ($S_1$) বসালে মান ধনাত্মক হলে বিন্দুটি বাইরে, শূন্য হলে পরিধির ওপর এবং ঋণাত্মক হলে ভেতরে অবস্থিত। বাইরের বিন্দু থেকে স্পর্শকের দৈর্ঘ্য সরাসরি $\\sqrt{S_1}$। আর কোনো সরলরেখা স্পর্শক হবে ঠিক তখনই, যখন কেন্দ্র থেকে রেখাটির লম্ব দূরত্ব ব্যাসার্ধ $r$-এর সমান হয়।","formulas":[{"label":"বিন্দুর অবস্থান ও স্পর্শকের দৈর্ঘ্য","latex":"S_1 = x_1^2 + y_1^2 + 2gx_1 + 2fy_1 + c; \\quad L = \\sqrt{S_1}","whenToUse":"$S_1>0$ হলে বাইরে, $=0$ হলে ওপরে, $<0$ হলে ভেতরে। $L=\\sqrt{S_1}$ বসানোর আগে $x^2, y^2$-এর সহগ $1$ করে নাও।"},{"label":"বৃত্তস্থ বিন্দুতে স্পর্শক ($T = 0$)","latex":"xx_1 + yy_1 + g(x+x_1) + f(y+y_1) + c = 0","whenToUse":"$(x_1, y_1)$ বৃত্তের পরিধির ওপর থাকলে $x^2 \\to xx_1$, $y^2 \\to yy_1$, $2x \\to x+x_1$, $2y \\to y+y_1$ বসাও।"},{"label":"বৃত্তস্থ বিন্দুতে অভিলম্ব","latex":"\\frac{y - y_1}{y_1 + f} = \\frac{x - x_1}{x_1 + g}","whenToUse":"বৃত্তের প্রতিটি অভিলম্বই স্পর্শবিন্দু $(x_1, y_1)$ এবং কেন্দ্র $(-g,-f)$-গামী সরলরেখা।"},{"label":"রেখা স্পর্শক হওয়ার শর্ত","latex":"\\frac{|a(-g) + b(-f) + d|}{\\sqrt{a^2+b^2}} = r; \\quad c = \\pm r\\sqrt{1+m^2}","whenToUse":"$ax+by+d=0$ অথবা $x^2+y^2=r^2$ বৃত্তে $y=mx+c$ স্পর্শক হওয়ার শর্ত যাচাই করতে।"}],"symbols":[{"sym":"$S_1$","meaning":"একক সহগবিশিষ্ট বৃত্তের বামপক্ষে $(x_1, y_1)$ বসিয়ে প্রাপ্ত মান"},{"sym":"$T = 0$","meaning":"বৃত্তস্থ বিন্দু $(x_1, y_1)$-এ স্পর্শকের সমীকরণ"}],"example":{"problem":"$(5, 4)$ বিন্দু থেকে $x^2 + y^2 - 4x - 2y - 4 = 0$ বৃত্তে অঙ্কিত স্পর্শকের দৈর্ঘ্য নির্ণয় করো।","steps":["লক্ষ্য করো $x^2$ ও $y^2$-এর সহগ ইতিমধ্যেই $1$।","$S_1 = 5^2 + 4^2 - 4(5) - 2(4) - 4 = 25 + 16 - 20 - 8 - 4 = 9$।","স্পর্শকের দৈর্ঘ্য $L = \\sqrt{S_1} = \\sqrt{9} = 3$ একক।"],"answer":"$3$ একক।"},"tip":"পরীক্ষার বড় ফাঁদ: $L = \\sqrt{S_1}$ ব্যবহারের আগে অবশ্যই $x^2$ ও $y^2$-এর সহগ $1$ করে নেবে, নইলে ভুল উত্তর আসবে!","check":{"q":"$k$-এর কোন ধনাত্মক মানের জন্য $3x + 4y = k$ রেখাটি $x^2 + y^2 = 16$ বৃত্তকে স্পর্শ করে?","a":"কেন্দ্র $(0,0)$ থেকে লম্ব দূরত্ব $|k|/\\sqrt{3^2+4^2} = |k|/5 = 4 \\implies k = 20$।"},"mythBuster":{"statement":"$(x_1, y_1)$ বিন্দুটি বৃত্তের বাইরে থাকলেও $T = 0$ সমীকরণটি একটি স্পর্শক নির্দেশ করে।","isTrue":false,"why":"বিন্দুটি বৃত্তের বাইরে থাকলে $T = 0$ কোনো স্পর্শক নয়, বরং ঐ বিন্দু থেকে অঙ্কিত দুটি স্পর্শকের স্পর্শবিন্দুদ্বয়ের সংযোগকারী স্পর্শ-জ্যা নির্দেশ করে।"}},{"id":"geo_circles_c4","badge":"দুই বৃত্তের সম্পর্ক","title":"সাধারণ জ্যা, সমকেন্দ্রিক ও লম্বচ্ছেদী বৃত্ত","intuition":"দুটি বৃত্তের $x^2$ ও $y^2$-এর সহগ $1$ করে একটি থেকে আরেকটি বিয়োগ করলেই দ্বিঘাত পদগুলো কাটা যায় এবং সরাসরি সাধারণ জ্যা বা মূল অক্ষ পাওয়া যায়। আর দুটি বৃত্ত পরস্পরকে সমকোণে (লম্বভাবে) ছেদ করলে ছেদবিন্দুতে তাদের ব্যাসার্ধদ্বয় ও কেন্দ্রদ্বয়ের সংযোগকারী রেখা একটি সমকোণী ত্রিভুজ গঠন করে।","formulas":[{"label":"সাধারণ জ্যা বা মূল অক্ষ","latex":"S_1 - S_2 = 0 \\implies 2(g_1-g_2)x + 2(f_1-f_2)y + (c_1-c_2) = 0","whenToUse":"বিয়োগ করার আগে উভয় বৃত্তের $x^2, y^2$-এর সহগ $1$ করে নিতে হবে।"},{"label":"সমকেন্দ্রিক বৃত্ত","latex":"x^2 + y^2 + 2gx + 2fy + k = 0","whenToUse":"কেন্দ্র একই থাকে, কেবল ধ্রুবক পদ $k$ পরিবর্তিত হয়; প্রদত্ত বিন্দু বসিয়ে $k$ বের করো।"},{"label":"লম্বচ্ছেদের শর্ত","latex":"2g_1g_2 + 2f_1f_2 = c_1 + c_2 \\iff d^2 = r_1^2 + r_2^2","whenToUse":"দুটি বৃত্ত পরস্পরকে $90^\\circ$ কোণে (লম্বভাবে) ছেদ করার শর্ত।"},{"label":"বহিঃস্পর্শ ও অন্তঃস্পর্শের শর্ত","latex":"d = r_1 + r_2 \\; (\\text{ext}); \\quad d = |r_1 - r_2| \\; (\\text{int})","whenToUse":"কেন্দ্রদ্বয়ের দূরত্ব $d$ ব্যবহার করে বহিঃস্পর্শ ($r_1+r_2$) ও অন্তঃস্পর্শ ($|r_1-r_2|$) যাচাই করতে।"}],"symbols":[{"sym":"$d$","meaning":"দুটি কেন্দ্র $C_1(-g_1,-f_1)$ ও $C_2(-g_2,-f_2)$-এর মধ্যবর্তী দূরত্ব"},{"sym":"$S_1 - S_2 = 0$","meaning":"মূল অক্ষ; বৃত্তদ্বয় পরস্পরকে ছেদ করলে এটিই সাধারণ জ্যা"}],"example":{"problem":"$x^2 + y^2 + 4x - 6y + k = 0$ এবং $x^2 + y^2 - 2x + 4y - 8 = 0$ বৃত্তদ্বয় পরস্পরকে লম্বভাবে ছেদ করলে $k$-এর মান নির্ণয় করো।","steps":["১ম বৃত্ত থেকে: $g_1 = 2, f_1 = -3, c_1 = k$।","২য় বৃত্ত থেকে: $g_2 = -1, f_2 = 2, c_2 = -8$।","লম্বচ্ছেদের শর্ত $2g_1g_2 + 2f_1f_2 = c_1 + c_2$ বসিয়ে পাই: $2(2)(-1) + 2(-3)(2) = k + (-8)$।","$-4 - 12 = k - 8 \\implies -16 = k - 8 \\implies k = -8$।"],"answer":"$k = -8$।"},"tip":"লম্বচ্ছেদের শর্টকাট: $x$-এর সহগদ্বয়ের গুণফলের অর্ধেক + $y$-এর সহগদ্বয়ের গুণফলের অর্ধেক = ধ্রুবক পদদ্বয়ের যোগফল ($c_1 + c_2$)!","check":{"q":"$x^2+y^2-6x+4y-3=0$ বৃত্তের সাথে সমকেন্দ্রিক এবং $(
