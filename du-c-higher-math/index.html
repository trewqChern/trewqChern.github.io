 লব্ধি $R$-এর মান কীভাবে পরিবর্তিত হয়?","opts":["$|P - Q|$ থেকে $P + Q$ পর্যন্ত বাড়ে","সর্বদা অপরিবর্তিত থাকে","$P + Q$ থেকে $|P - Q|$ পর্যন্ত ক্রমাগত কমে","$90^\\circ$ পর্যন্ত বেড়ে তারপর কমে"],"ans":2,"tags":["board-standard","graph-visual"],"exp":"$[0^\\circ, 180^\\circ]$ ব্যবধিতে $\\cos\\alpha$-এর মান $1$ থেকে $-1$ পর্যন্ত ক্রমাগত কমে, তাই $R = \\sqrt{P^2 + Q^2 + 2PQ\\cos\\alpha}$ ক্রমাগত $P + Q$ থেকে $|P - Q|$ পর্যন্ত হ্রাস পায়।","variants":[]},{"id":"app_statics_q20","cardId":"app_statics_c2","qType":"conceptual","conceptGroup":"lami_and_equilibrium","q":"লামির উপপাদ্য প্রয়োগের জন্য কোন শর্তটি আবশ্যক?","opts":["দৃঢ় বস্তুতে ক্রিয়ারত যেকোনো তিনটি বল","সাম্যাবস্থায় থাকা তিনটি সমান্তরাল বল","সাম্যাবস্থায় থাকা চারটি সমবিন্দু বল","সাম্যাবস্থায় থাকা তিনটি সমতলীয়, সমবিন্দু ও অসমরেখ বল"],"ans":3,"tags":["board-standard","formula-trap"],"exp":"লামির উপপাদ্য কেবল সাম্যাবস্থায় থাকা তিনটি সমতলীয়, সমবিন্দু ও অসমরেখ বলের জন্য প্রযোজ্য। সমান্তরাল বলের ক্ষেত্রে হরে $\\sin 0^\\circ = 0$ চলে আসে।","variants":[]},{"id":"app_statics_q21","cardId":"app_statics_c2","qType":"conceptual","conceptGroup":"lami_and_equilibrium","q":"কোনো বিন্দুতে ক্রিয়ারত তিনটি বলকে যদি একটি ত্রিভুজের তিনটি বাহু দ্বারা একই ক্রমে মান ও দিকে প্রকাশ করা যায়, তবে তাদের লব্ধি কত?","opts":["শূন্য (সাম্যাবস্থা)","ত্রিভুজের পরিসীমার সমান","বৃহত্তম বাহুর দ্বিগুণ","ত্রিভুজের ক্ষেত্রফলের সমান"],"ans":0,"tags":["board-standard","graph-visual"],"exp":"বলের ত্রিভুজ সূত্র অনুসারে একই ক্রমে বদ্ধ ত্রিভুজ গঠনকারী তিনটি বলের ভেক্টর যোগফল শূন্য, অর্থাৎ বল তিনটি সাম্যাবস্থায় থাকে।","variants":[]},{"id":"app_statics_q22","cardId":"app_statics_c2","qType":"conceptual","conceptGroup":"lami_and_equilibrium","q":"সমতলীয় বলের অধীনে একটি দৃঢ় বস্তুর সাম্যাবস্থার প্রয়োজনীয় ও পর্যাপ্ত শর্ত কোনটি?","opts":["কেবল $\\sum F_x = 0$ এবং $\\sum F_y = 0$","$\\sum F_x = 0$, $\\sum F_y = 0$ এবং যেকোনো বিন্দুর সাপেক্ষে $\\sum M = 0$","কেবল ভরকেন্দ্রের সাপেক্ষে $\\sum M = 0$","সব বলের মান সমান হতে হবে"],"ans":1,"tags":["board-standard","formula-trap"],"exp":"দৃঢ় বস্তুর সাম্যাবস্থার জন্য রৈখিক সাম্য ($\\sum F_x = 0, \\sum F_y = 0$) এবং ঘূর্ণন সাম্য ($\\sum M = 0$)—উভয়ই প্রয়োজন। কেবল মোট বল শূন্য হলেও যুগলের প্রভাবে বস্তু ঘুরতে পারে।","variants":[]},{"id":"app_statics_q23","cardId":"app_statics_c3","qType":"conceptual","conceptGroup":"parallel_forces_and_couples","q":"$A$ ও $B$ বিন্দুতে ক্রিয়ারত দুটি অসমান বিসদৃশ সমান্তরাল বলের ($P > Q$) লব্ধির ক্রিয়াবিন্দু কোথায় অবস্থিত?","opts":["$AB$-এর মধ্যবিন্দুতে","$AB$-এর ভেতরে $P$-এর কাছাকাছি","$AB$-এর বাইরে বৃহত্তর বল $P$-এর পাশে","$AB$-এর বাইরে ক্ষুদ্রতর বল $Q$-এর পাশে"],"ans":2,"tags":["pyq-pattern","formula-trap"],"exp":"$P > Q$ বিসদৃশ সমান্তরাল বলের লব্ধি $R = P - Q$ সর্বদা বর্ধিত $BA$ রেখার ওপর অর্থাৎ $AB$-এর বাইরে বৃহত্তর বল $P$-এর পাশে থাকে। $AB$-এর ভেতরে থাকে কেবল সদৃশ বলের ক্ষেত্রে।","variants":[]},{"id":"app_statics_q24","cardId":"app_statics_c4","qType":"conceptual","conceptGroup":"parallel_forces_and_couples","q":"$12\\text{ N}\\cdot\\text{m}$ ভ্রামকের একটি যুগলকে নিচের কোনটি দ্বারা সাম্যাবস্থায় আনা সম্ভব?","opts":["$12\\text{ N}$ মানের একটি একক বল","$6\\text{ N}$ মানের দুটি সদৃশ সমান্তরাল বল","মধ্যবিন্দুতে ক্রিয়ারত একটি একক বল","একই বা সমান্তরাল তলে বিপরীতমুখী $12\\text{ N}\\cdot\\text{m}$ ভ্রামকের আরেকটি যুগল"],"ans":3,"tags":["board-standard","formula-trap"],"exp":"যুগলের নিট বল শূন্য কিন্তু ঘূর্ণন ভ্রামক অশূন্য, তাই কোনো একক বল কখনো যুগলকে সাম্যাবস্থায় আনতে পারে না। কেবল সমমানের ও বিপরীতমুখী আরেকটি যুগলই একে প্রশমিত করতে পারে।","variants":[]},{"id":"app_statics_q25","cardId":"app_statics_c4","qType":"conceptual","conceptGroup":"parallel_forces_and_couples","q":"একই তলে আবর্তন বিন্দু পরিবর্তন করলে একটি যুগলের ভ্রামকের বীজগাণিতিক সমষ্টির কী পরিবর্তন হয়?","opts":["অপরিবর্তিত থাকে এবং সর্বদা $F \\cdot d$-এর সমান হয়","যুগল থেকে দূরত্বের সাথে রৈখিকভাবে বাড়ে","মধ্যবিন্দুতে শূন্য হয়ে যায়","বিপরীত পাশে গেলে চিহ্ন পাল্টে যায়"],"ans":0,"tags":["board-standard","no-calc-shortcut"],"exp":"যুগলের তলের যেকোনো বিন্দুর সাপেক্ষে এর ভ্রামক ধ্রুব এবং $F \\cdot d$-এর সমান। বিন্দু সরালে একটি বলের $+Fx$ ও অপর বলের $-Fx$ পরস্পরকে নাকচ করে দেয়।","variants":[]}],"writtenDrills":[{"id":"app_statics_w1","cardId":"app_statics_c1","marks":2,"q":"$P$ ও $Q$ মানের দুটি বল $\\alpha$ কোণে ক্রিয়ারত। এদের লব্ধি $R$ যদি $P$-এর ওপর লম্ব হয় এবং $R = \\frac{Q}{2}$ হয়, তবে $\\alpha$ এবং $P : Q$ নির্ণয় করো।","steps":["যেহেতু $R \\perp P$, তাই দিকের সূত্র থেকে $P + Q\\cos\\alpha = 0 \\implies \\cos\\alpha = -\\frac{P}{Q}$।","$P, R$ ও $Q$ (অতিভুজ) দ্বারা গঠিত সমকোণী ত্রিভুজে $R^2 + P^2 = Q^2$।","$R = \\frac{Q}{2}$ বসিয়ে পাই, $\\frac{Q^2}{4} + P^2 = Q^2 \\implies P^2 = \\frac{3}{4}Q^2 \\implies \\frac{P}{Q} = \\frac{\\sqrt{3}}{2}$।","অতএব $\\cos\\alpha = -\\frac{\\sqrt{3}}{2} \\implies \\alpha = 150^\\circ$ এবং $P : Q = \\sqrt{3} : 2$।"],"finalAnswer":"$\\alpha = 150^\\circ$ এবং $P : Q = \\sqrt{3} : 2$","markingTip":"প্রথম ১ নম্বরের জন্য $P + Q\\cos\\alpha = 0$ স্পষ্টভাবে লিখবে এবং পরের ১ নম্বরের জন্য ঋণাত্মক কোসাইনের মান দেখিয়ে $\\alpha = 150^\\circ$ প্রমাণ করবে।"},{"id":"app_statics_w2","cardId":"app_statics_c2","marks":2,"q":"$20\\text{ N}$ ওজনের একটি বস্তু দুটি সুতার সাহায্যে আনুভূমিক ছাদের সাথে যথাক্রমে $30^\\circ$ ও $60^\\circ$ কোণে ঝুলন্ত অবস্থায় সাম্যাবস্থায় আছে। সুতা দুটির টান $T_1$ ($30^\\circ$ কোণে) ও $T_2$ ($60^\\circ$ কোণে) নির্ণয় করো।","steps":["বিপরীত কোণগুলো নির্ণয় করি: $T_1$ ও $T_2$-এর মধ্যবর্তী কোণ $90^\\circ$ ($20\\text{ N}$-এর বিপরীত); $T_2$ ও ওজনের মধ্যবর্তী কোণ $90^\\circ + 60^\\circ = 150^\\circ$ ($T_1$-এর বিপরীত); $T_1$ ও ওজনের মধ্যবর্তী কোণ $90^\\circ + 30^\\circ = 120^\\circ$ ($T_2$-এর বিপরীত)।","লামির উপপাদ্য থেকে $\\frac{T_1}{\\sin 150^\\circ} = \\frac{T_2}{\\sin 120^\\circ} = \\frac{20}{\\sin 90^\\circ} = 20$।","সমাধান করে পাই, $T_1 = 20 \\times \\frac{1}{2} = 10\\text{ N}$ এবং $T_2 = 20 \\times \\frac{\\sqrt{3}}{2} = 10\\sqrt{3}\\text{ N}$।"],"finalAnswer":"$T_1 = 10\\text{ N},\\ T_2 = 10\\sqrt{3}\\text{ N}$","markingTip":"$150^\\circ, 120^\\circ, 90^\\circ$ চিহ্নিত একটি ছোট রাফ চিত্র এঁকে নেবে, যেন $T_1$ ও $T_2$ অদলবদল না হয়।"},{"id":"app_statics_w3","cardId":"app_statics_c4","marks":2,"q":"$8\\text{ m}$ দীর্ঘ এবং $60\\text{ N}$ ওজনের একটি সুষম দণ্ড $AB$ এর দুই প্রান্ত $A$ ও $B$-তে দুটি খুঁটির ওপর আনুভূমিকভাবে আছে। $A$ থেকে $2\\text{ m}$ দূরে $40\\text{ N}$ ওজন রাখলে খুঁটি দুটির প্রতিক্রিয়া $R_A$ ও $R_B$ নির্ণয় করো।","steps":["$A$ বিন্দুর সাপেক্ষে ভ্রামক নিই (দণ্ডের ওজন $A$ থেকে $4\\text{ m}$ দূরে ক্রিয়া করে): $8 R_B = 60(4) + 40(2) = 240 + 80 = 320$।","$8$ দিয়ে ভাগ করে পাই, $R_B = 40\\text{ N}$।","উল্লম্ব সাম্যাবস্থা থেকে $R_A + R_B = 60 + 40 = 100\\text{ N} \\implies R_A = 100 - 40 = 60\\text{ N}$।"],"finalAnswer":"$R_A = 60\\text{ N},\\ R_B = 40\\text{ N}$","markingTip":"চূড়ান্ত উত্তর লেখার আগে অবশ্যই যাচাই করে নেবে $R_A + R_B$ মোট নিম্নমুখী ওজন ($100\\text{ N}$)-এর সমান হয়েছে কিনা।"}]},{"id":"app_dynamics","moduleId":"mod_applied","title":"সমতলে বস্তুকণার গতি","subtitle":"গতির সমীকরণ, অভিকর্ষের অধীনে গতি, প্রাসের গতি ও আপেক্ষিক বেগ","paperRef":"২য় পত্র, অধ্যায় ৯","tier":1,"estMinutes":18,"cards":[{"id":"app_dynamics_c1","badge":"সরলরৈখিক গতি","title":"সমত্বরণে গতির সমীকরণ ও n-তম সেকেন্ডে দূরত্ব","intuition":"সমত্বরণে বেগ সমান হারে পরিবর্তিত হয় বলে গড় বেগ হয় ঠিক $\\frac{u + v}{2}$। পাঁচটি চলকের ($u, v, a, t, s$) মধ্যে কোনটি অনুপস্থিত—তা দেখেই সঠিক গতির সমীকরণ বেছে নেওয়া যায়।","formulas":[{"label":"বেগ-সময় সমীকরণ","latex":"v = u + at","whenToUse":"যখন সরণ $s$ দেওয়া নেই বা নির্ণয়ের প্রয়োজন নেই।"},{"label":"সরণ-সময় সমীকরণ","latex":"s = ut + \\frac{1}{2}at^2 = \\left(\\frac{u+v}{2}\\right)t","whenToUse":"শেষ বেগ $v$ (অথবা ত্বরণ $a$) অনুপস্থিত থাকলে।"},{"label":"বেগ-সরণ সমীকরণ","latex":"v^2 = u^2 + 2as","whenToUse":"সময় $t$ অনুপস্থিত থাকলে (থামার দূরত্ব নির্ণয়ে দারুণ কার্যকর)।"},{"label":"n-তম সেকেন্ডে অতিক্রান্ত দূরত্ব","latex":"s_n = u + \\frac{1}{2}a(2n - 1)","whenToUse":"কেবল $n$-তম সেকেন্ডে ($t = n-1$ থেকে $t = n$ পর্যন্ত) অতিক্রান্ত দূরত্ব নির্ণয়ে।"}],"symbols":[{"sym":"$u, v$","meaning":"আদি বেগ ও শেষ বেগ ($\\text{m/s}$)"},{"sym":"$a$","meaning":"সমত্বরণ ($\\text{m/s}^2$; মন্দনের ক্ষেত্রে ঋণাত্মক)"},{"sym":"$s, s_n$","meaning":"মোট সরণ এবং $n$-তম সেকেন্ডে সরণ ($\\text{m}$)"},{"sym":"$t$","meaning":"অতিবাহিত সময় ($\\text{s}$)"}],"example":{"problem":"স্থিরাবস্থা থেকে $4\\text{ m/s}^2$ সমত্বরণে চলমান একটি কণা $5$-তম সেকেন্ডে কত দূরত্ব অতিক্রম করবে?","steps":["এখানে $u = 0$, $a = 4\\text{ m/s}^2$ এবং $n = 5$।","$s_n = u + \\frac{1}{2}a(2n - 1)$ সূত্রে বসাই: $s_5 = 0 + \\frac{1}{2}(4)(2 \\cdot 5 - 1)$।","সরল করে পাই, $s_5 = 2 \\times 9 = 18\\text{ m}$।"],"answer":"$18\\text{ m}$"},"tip":"থামার দূরত্ব $s = \\frac{u^2}{2a}$ হওয়ায় বেগ দ্বিগুণ করলে থামার দূরত্ব চারগুণ হয়! আর স্থিরাবস্থা থেকে পরপর সেকেন্ডগুলোতে অতিক্রান্ত দূরত্বের অনুপাত সর্বদা $1 : 3 : 5 : 7$।","check":{"q":"$20\\text{ m/s}$ বেগে চলমান গাড়ি $4\\text{ m/s}^2$ সমমন্দনে ব্রেক করলে থামার আগে কত দূরত্ব যাবে?","a":"$s = \\frac{u^2}{2a} = \\frac{400}{8} = 50\\text{ m}$।"},"mythBuster":{"statement":"৫ম সেকেন্ডে অতিক্রান্ত দূরত্ব আর ৫ সেকেন্ডে মোট অতিক্রান্ত দূরত্ব একই।","isTrue":false,"why":"৫ম সেকেন্ড মানে কেবল $t = 4\\text{ s}$ থেকে $t = 5\\text{ s}$ পর্যন্ত ১ সেকেন্ডের দূরত্ব ($S(5) - S(4)$), শুরু থেকে মোট ৫ সেকেন্ডের দূরত্ব নয়।"}},{"id":"app_dynamics_c2","badge":"উল্লম্ব গতি","title":"অভিকর্ষের অধীনে উল্লম্ব গতি","intuition":"অভিকর্ষজ ত্বরণ $g$ ($9.8$ বা $10\\text{ m/s}^2$) হলো একটি ধ্রুব নিম্নমুখী ত্বরণ। ওপরে ওঠা ও নিচে নামা পরস্পরের প্রতিসম: ওঠার সময় ও নামার সময় সমান এবং একই উচ্চতায় ওঠা-নামার দ্রুতি সমান।","formulas":[{"label":"সর্বাধিক উচ্চতা","latex":"H = \\frac{u^2}{2g}","whenToUse":"$u$ বেগে খাড়া উপরের দিকে নিক্ষিপ্ত বস্তুর সর্বোচ্চ উচ্চতা নির্ণয়ে (শীর্ষে $v = 0$)।"},{"label":"উত্থানকাল ও বিচরণকাল","latex":"t_{\\text{up}} = \\frac{u}{g}, \\quad T = \\frac{2u}{g}","whenToUse":"শীর্ষে পৌঁছানোর সময় এবং নিক্ষেপণ বিন্দুতে ফিরে আসার মোট সময় নির্ণয়ে।"},{"label":"মুক্তভাবে পতনশীল বস্তু","latex":"h = \\frac{1}{2}gt^2, \\quad v = \\sqrt{2gh}","whenToUse":"$h$ উচ্চতা থেকে স্থিরাবস্থায় ($u = 0$) ছেড়ে দেওয়া বস্তুর জন্য।"}],"symbols":[{"sym":"$g$","meaning":"অভিকর্ষজ ত্বরণ (প্রশ্নানুযায়ী $9.8$ বা $10\\text{ m/s}^2$)"},{"sym":"$H$","meaning":"সর্বাধিক উচ্চতা"},{"sym":"$T$","meaning":"মোট বিচরণকাল"}],"example":{"problem":"একটি বলকে $29.4\\text{ m/s}$ বেগে খাড়া উপরের দিকে নিক্ষেপ করা হলো। $g = 9.8\\text{ m/s}^2$ ধরে বলটি হাতে ফিরে আসতে মোট কত সময় নেবে?","steps":["লক্ষ করো $29.4 = 3 \\times 9.8$, তাই উত্থানকাল $t_{\\text{up}} = \\frac{u}{g} = \\frac{29.4}{9.8} = 3\\text{ s}$।","প্রতিসাম্য অনুযায়ী মোট বিচরণকাল $T = 2 t_{\\text{up}} = 2 \\times 3 = 6\\text{ s}$।"],"answer":"$6\\text{ s}$"},"tip":"এইচএসসি ও ঢাবি প্রশ্নে $9.8$-এর গুণিতক দেখেই চিনে নেবে: $4.9 = 0.5g$, $19.6 = 2g$, $29.4 = 3g$, $39.2 = 4g$, $49 = 5g$ এবং $44.1 = 4.5g$।","check":{"q":"$80\\text{ m}$ উঁচু মিনার থেকে স্থিরাবস্থায় একটি পাথর ছেড়ে দিলে ($g = 10\\text{ m/s}^2$) মাটিতে পড়তে কত সময় লাগবে?","a":"$t = \\sqrt{\\frac{2h}{g}} = \\sqrt{\\frac{160}{10}} = \\sqrt{16} = 4\\text{ s}$।"},"mythBuster":{"statement":"খাড়া উপরের দিকে নিক্ষিপ্ত বস্তুর সর্বোচ্চ বিন্দুতে বেগ ও ত্বরণ উভয়ই শূন্য হয়।","isTrue":false,"why":"সর্বোচ্চ বিন্দুতে বেগ ক্ষণিকের জন্য $0$ হলেও অভিকর্ষ কখনো বন্ধ হয় না—ত্বরণ সর্বদা নিচের দিকে $g$ থাকে।"}},{"id":"app_dynamics_c3","badge":"প্রাসের গতি","title":"প্রাসের গতি: বিচরণকাল, উচ্চতা, পাল্লা ও সঞ্চারপথ","intuition":"প্রাসের গতি আসলে দুটি স্বাধীন গতির সমষ্টি: আনুভূমিক দিকে $u\\cos\\alpha$ সমবেগে চলা (ত্বরণ শূন্য) এবং উল্লম্ব দিকে $u\\sin\\alpha$ আদিবেগে অভিকর্ষের অধীনে ওঠানামা। এই বিভাজনই দ্বিমাত্রিক গতিকে সহজ করে দেয়।","formulas":[{"label":"বিচরণকাল","latex":"T = \\frac{2u\\sin\\alpha}{g}","whenToUse":"সমতল ভূমিতে প্রাসের মোট শূন্যে থাকার সময় নির্ণয়ে।"},{"label":"সর্বাধিক উচ্চতা","latex":"H = \\frac{u^2\\sin^2\\alpha}{2g}","whenToUse":"নিক্ষেপণ তল থেকে প্রাসের সর্বোচ্চ উল্লম্ব উচ্চতা নির্ণয়ে।"},{"label":"আনুভূমিক পাল্লা","latex":"R = \\frac{u^2\\sin 2\\alpha}{g}","whenToUse":"সমতল ভূমিতে প্রাসের মোট আনুভূমিক দূরত্ব নির্ণয়ে।"},{"label":"সঞ্চারপথের সমীকরণ","latex":"y = x\\tan\\alpha - \\frac{gx^2}{2u^2\\cos^2\\alpha} = x\\tan\\alpha\\left(1 - \\frac{x}{R}\\right)","whenToUse":"আনুভূমিক দূরত্ব $x$-এর সাথে উচ্চতা $y$-এর সম্পর্ক নির্ণয়ে (আকৃতি পরাবৃত্ত)।"}],"symbols":[{"sym":"$u$","meaning":"নিক্ষেপণ বেগ ($\\text{m/s}$)"},{"sym":"$\\alpha$","meaning":"আনুভূমিকের সাথে নিক্ষেপণ কোণ"},{"sym":"$R$","meaning":"আনুভূমিক পাল্লা"},{"sym":"$H$","meaning":"সর্বাধিক উচ্চতা"}],"example":{"problem":"একটি বলকে আনুভূমিকের সাথে $60^\\circ$ কোণে $u = 20\\text{ m/s}$ বেগে নিক্ষেপ করা হলো। $g = 10\\text{ m/s}^2$ হলে সর্বাধিক উচ্চতা $H$ কত?","steps":["$H = \\frac{u^2\\sin^2\\alpha}{2g}$ সূত্রে $u = 20$, $\\sin 60^\\circ = \\frac{\\sqrt{3}}{2}$ এবং $g = 10$ বসাই।","বর্গ করে পাই $\\sin^2 60^\\circ = \\frac{3}{4}$।","$H = \\frac{400 \\times (3/4)}{20} = \\frac{300}{20} = 15\\text{ m}$।"],"answer":"$15\\text{ m}$"},"tip":"ঢাবির গোল্ডেন শর্টকাট $R = 4H\\cot\\alpha$ (অর্থাৎ $\\tan\\alpha = \\frac{4H}{R}$) মনে রাখলে $u$ বা $g$ ছাড়াই ৫ সেকেন্ডে নিক্ষেপণ কোণ বের করা যায়!","check":{"q":"একটি প্রাসের সঞ্চারপথ $y = x - \\frac{x^2}{20}$ হলে এর আনুভূমিক পাল্লা $R$ কত?","a":"$y = 0$ বসিয়ে পাই $x\\left(1 - \\frac{x}{20}\\right) = 0 \\implies R = 20\\text{ m}$।"},"mythBuster":{"statement":"প্রাসের গতিপথের সর্বোচ্চ বিন্দুতে এর বেগ শূন্য হয়।","isTrue":false,"why":"সর্বোচ্চ বিন্দুতে কেবল উল্লম্ব বেগ $v_y = 0$ হয়; আনুভূমিক বেগ $u\\cos\\alpha$ তখনও বজায় থাকে।"}},{"id":"app_dynamics_c4","badge":"সর্বোচ্চ পাল্লা ও আপেক্ষিক বেগ","title":"সর্বোচ্চ পাল্লা, পূরক কোণ ও আপেক্ষিক বেগ","intuition":"আনুভূমিক পাল্লা $\\sin 2\\alpha$-এর ওপর নির্ভর করে বলে $\\alpha = 45^\\circ$ কোণে পাল্লা সর্বোচ্চ হয় এবং $\\alpha$ ও $90^\\circ - \\alpha$ পূরক কোণে পাল্লা সমান হয়। আর আপেক্ষিক বেগ মানে হলো চলমান বস্তুর বেগ থেকে পর্যবেক্ষকের বেগ ভেক্টর বিয়োগ করা।","formulas":[{"label":"সর্বোচ্চ আনুভূমিক পাল্লা","latex":"R_{\\max} = \\frac{u^2}{g} \\quad (\\alpha = 45^\\circ), \\quad H_{45^\\circ} = \\frac{R_{\\max}}{4}","whenToUse":"সমতল ভূমিতে সর্বাধিক আনুভূমিক পাল্লা ও সেই অবস্থায় উচ্চতা নির্ণয়ে।"},{"label":"পূরক nge_and_relative_motion","q":"নির্দিষ্ট নিক্ষেপণ বেগ $u$-এর জন্য সমতল ভূমিতে কোন জোড়া কোণে নিক্ষেপ করলে আনুভূমিক পাল্লা সমান হবে?","opts":["$30^\\circ$ এবং $45^\\circ$","$20^\\circ$ এবং $60^\\circ$","$30^\\circ$ এবং $60^\\circ$","$45^\\circ$ এবং $90^\\circ$"],"ans":2,"tags":["pyq-pattern","no-calc-shortcut"],"exp":"$\\sin(2(90^\\circ - \\alpha)) = \\sin(180^\\circ - 2\\alpha) = \\sin 2\\alpha$ হওয়ায় যেকোনো পূরক কোণ জোড়া (যাদের যোগফল $90^\\circ$, যেমন $30^\\circ$ ও $60^\\circ$) সমান পাল্লা দেয়।","variants":[]},{"id":"app_dynamics_q24","cardId":"app_dynamics_c4","qType":"conceptual","conceptGroup":"range_and_relative_motion","q":"আনুভূমিকের সাথে কত কোণে নিক্ষেপ করলে একটি প্রাস সমতল ভূমিতে সর্বাধিক আনুভূমিক পাল্লা অতিক্রম করবে?","opts":["$30^\\circ$","$60^\\circ$","$90^\\circ$","$45^\\circ$"],"ans":3,"tags":["board-standard","no-calc-shortcut"],"exp":"$R = \\frac{u^2\\sin 2\\alpha}{g}$ সর্বোচ্চ হয় যখন $\\sin 2\\alpha = 1 \\implies 2\\alpha = 90^\\circ \\implies \\alpha = 45^\\circ$। আর $90^\\circ$ কোণে আনুভূমিক পাল্লা শূন্য হয়।","variants":[]},{"id":"app_dynamics_q25","cardId":"app_dynamics_c4","qType":"conceptual","conceptGroup":"range_and_relative_motion","q":"একই বেগ $u$-তে পূরক কোণ $\\alpha$ ও $90^\\circ - \\alpha$-তে নিক্ষিপ্ত দুটি প্রাসের বিচরণকাল $T_1, T_2$ এবং অভিন্ন পাল্লা $R$ হলে $T_1 T_2$-এর মান কত?","opts":["$\\frac{2R}{g}$","$\\frac{R}{g}$","$\\frac{4R}{g}$","$\\frac{R}{2g}$"],"ans":0,"tags":["pyq-pattern","written-convert"],"exp":"$T_1 T_2 = \\left(\\frac{2u\\sin\\alpha}{g}\\right)\\left(\\frac{2u\\cos\\alpha}{g}\\right) = \\frac{2}{g}\\left(\\frac{u^2\\sin 2\\alpha}{g}\\right) = \\frac{2R}{g}$। লবের $2$ বাদ দিলে ভুল ফাঁদ $R/g$ আসে।","variants":[]}],"writtenDrills":[{"id":"app_dynamics_w1","cardId":"app_dynamics_c1","marks":2,"q":"সমত্বরণে চলমান একটি কণা $3$-য় সেকেন্ডে $15\\text{ m}$ এবং $5$-তম সেকেন্ডে $23\\text{ m}$ দূরত্ব অতিক্রম করে। কণাটির আদিবেগ $u$ ও ত্বরণ $a$ নির্ণয় করো।","steps":["$s_n = u + \\frac{1}{2}a(2n - 1)$ সূত্রে $n = 3$ বসিয়ে পাই: $u + \\frac{5}{2}a = 15$।","$n = 5$ বসিয়ে পাই: $u + \\frac{9}{2}a = 23$।","দ্বিতীয় সমীকরণ থেকে প্রথম সমীকরণ বিয়োগ করে পাই: $2a = 8 \\implies a = 4\\text{ m/s}^2$।","মান বসিয়ে পাই: $u + \\frac{5}{2}(4) = 15 \\implies u + 10 = 15 \\implies u = 5\\text{ m/s}$।"],"finalAnswer":"$u = 5\\text{ m/s},\\ a = 4\\text{ m/s}^2$","markingTip":"$s_3$ ও $s_5$-এর দুটি সমীকরণ স্পষ্টভাবে লিখে বিয়োগ করলে ভগ্নাংশ ছাড়াই সরাসরি $2a = 8$ পাওয়া যায়।"},{"id":"app_dynamics_w2","cardId":"app_dynamics_c3","marks":2,"q":"একটি বলকে আনুভূমিকের সাথে $30^\\circ$ কোণে $u = 40\\text{ m/s}$ বেগে নিক্ষেপ করা হলো। $g = 10\\text{ m/s}^2$ ধরে এর বিচরণকাল $T$, সর্বাধিক উচ্চতা $H$ এবং আনুভূমিক পাল্লা $R$ নির্ণয় করো।","steps":["বিচরণকাল: $T = \\frac{2u\\sin 30^\\circ}{g} = \\frac{2(40)(1/2)}{10} = 4\\text{ s}$।","সর্বাধিক উচ্চতা: $H = \\frac{u^2\\sin^2 30^\\circ}{2g} = \\frac{1600(1/4)}{20} = 20\\text{ m}$।","আনুভূমিক পাল্লা: $R = \\frac{u^2\\sin 60^\\circ}{g} = \\frac{1600(\\sqrt{3}/2)}{10} = 80\\sqrt{3}\\text{ m}$।"],"finalAnswer":"$T = 4\\text{ s},\\ H = 20\\text{ m},\\ R = 80\\sqrt{3}\\text{ m}$","markingTip":"ক্যালকুলেটর ছাড়া পরীক্ষায় $R$-এর মান দশমিকে আসন্ন না করে নির্ভুল বর্গমূল রূপে ($80\\sqrt{3}\\text{ m}$) রাখবে।"},{"id":"app_dynamics_w3","cardId":"app_dynamics_c4","marks":2,"q":"প্রমাণ করো যে, $u$ বেগে পূরক কোণ $\\alpha$ ও $90^\\circ - \\alpha$-তে নিক্ষিপ্ত প্রাসের বিচরণকাল $T_1, T_2$ এবং আনুভূমিক পাল্লা $R$ হলে $T_1 T_2 = \\frac{2R}{g}$।","steps":["লিখি $T_1 = \\frac{2u\\sin\\alpha}{g}$ এবং $T_2 = \\frac{2u\\sin(90^\\circ - \\alpha)}{g} = \\frac{2u\\cos\\alpha}{g}$।","গুণ করে পাই: $T_1 T_2 = \\frac{4u^2\\sin\\alpha\\cos\\alpha}{g^2} = \\frac{2}{g} \\cdot \\frac{u^2(2\\sin\\alpha\\cos\\alpha)}{g}$।","যেহেতু $2\\sin\\alpha\\cos\\alpha = \\sin 2\\alpha$ এবং $R = \\frac{u^2\\sin 2\\alpha}{g}$, তাই $T_1 T_2 = \\frac{2R}{g}$।"],"finalAnswer":"$T_1 T_2 = \\frac{2R}{g}$ (প্রমাণিত)","markingTip":"পূর্ণ নম্বর পেতে দ্বিগুণ কোণের অভেদ $2\\sin\\alpha\\cos\\alpha = \\sin 2\\alpha$ স্পষ্টভাবে উল্লেখ করবে।"}]},{"id":"app_dispersion_prob","moduleId":"mod_applied","title":"বিস্তার পরিমাপ ও সম্ভাবনা","subtitle":"পরিসর, ভেদাঙ্ক, বিভেদাঙ্ক, যোগ-গুণন সূত্র ও শর্তাধীন সম্ভাবনা","paperRef":"2nd Paper Ch. 10","tier":2,"estMinutes":18,"cards":[{"id":"app_dispersion_prob_c1","badge":"বিস্তার পরিমাপ","title":"পরিসর, গড় ব্যবধান, ভেদাঙ্ক ও পরিমিত ব্যবধান","intuition":"কেন্দ্রীয় প্রবণতা উপাত্তের কেন্দ্র নির্দেশ করে, আর বিস্তার পরিমাপ বোঝায় মানগুলো সেই কেন্দ্র থেকে কতটা ছড়িয়ে আছে। গড় থেকে ব্যবধানের বর্গের গড়ই হলো ভেদাঙ্ক ($\\sigma^2$), আর এর ধনাত্মক বর্গমূল হলো পরিমিত ব্যবধান ($\\sigma$), যার একক মূল উপাত্তের এককের সমান।","formulas":[{"label":"পরিসর","latex":"R = x_{\\max} - x_{\\min}","whenToUse":"শুধু সর্বোচ্চ ও সর্বনিম্ন মান ব্যবহার করে দ্রুত বিস্তার বের করতে।"},{"label":"গড় ব্যবধান (গড় হতে)","latex":"MD(\\bar{x}) = \\frac{\\sum |x_i - \\bar{x}|}{n}","whenToUse":"গাণিতিক গড় থেকে উপাত্তগুলোর পরম দূরত্বের গড় নির্ণয়ে।"},{"label":"ভেদাঙ্ক ও পরিমিত ব্যবধান (সংক্ষিপ্ত সূত্র)","latex":"\\sigma^2 = \\frac{\\sum x_i^2}{n} - \\bar{x}^2, \\quad \\sigma = \\sqrt{\\sigma^2}","whenToUse":"ক্যালকুলেটর ছাড়া অবিন্যস্ত উপাত্তের ভেদাঙ্ক ও পরিমিত ব্যবধান দ্রুত বের করতে।"},{"label":"প্রথম n স্বাভাবিক সংখ্যা ও দুই সংখ্যার শর্টকাট","latex":"\\sigma^2_{1..n} = \\frac{n^2 - 1}{12}, \\quad \\sigma_{\\{a,b\\}} = \\frac{|a - b|}{2}","whenToUse":"ক্রমিক স্বাভাবিক সংখ্যা $1, 2, \\dots, n$ অথবা যেকোনো দুটি সংখ্যা $a, b$-এর ক্ষেত্রে মুহূর্তেই উত্তর পেতে।"}],"symbols":[{"sym":"$\\bar{x}$","meaning":"গাণিতিক গড়"},{"sym":"$\\sigma^2$","meaning":"ভেদাঙ্ক"},{"sym":"$\\sigma$","meaning":"পরিমিত ব্যবধান"},{"sym":"$n$","meaning":"মোট উপাত্তের সংখ্যা"}],"example":{"problem":"$\\{2, 4, 6, 8, 10\\}$ উপাত্তটির ভেদাঙ্ক ও পরিমিত ব্যবধান নির্ণয় কর।","steps":["গাণিতিক গড়: $\\bar{x} = \\frac{2+4+6+8+10}{5} = 6$।","গড় হতে ব্যবধান $(x_i - \\bar{x})$: $-4, -2, 0, 2, 4$।","ব্যবধানের বর্গের সমষ্টি: $(-4)^2 + (-2)^2 + 0^2 + 2^2 + 4^2 = 16 + 4 + 0 + 4 + 16 = 40$।","ভেদাঙ্ক: $\\sigma^2 = \\frac{40}{5} = 8$, এবং পরিমিত ব্যবধান: $\\sigma = \\sqrt{8} = 2\\sqrt{2}$।"],"answer":"$\\sigma^2 = 8$, $\\sigma = 2\\sqrt{2}$"},"tip":"সাধারণ অন্তর $d$ বিশিষ্ট $n$-পদের যেকোনো সমান্তর ধারার ভেদাঙ্ক $\\sigma^2 = d^2 \\cdot \\frac{n^2 - 1}{12}$। উপরের উদাহরণে $d=2, n=5 \\implies \\sigma^2 = 4 \\cdot \\frac{24}{12} = 8$ মাত্র ৩ সেকেন্ডে!","check":{"q":"$10$ ও $18$ সংখ্যা দুটির পরিমিত ব্যবধান কত?","a":"$\\sigma = \\frac{|18 - 10|}{2} = 4$।"},"mythBuster":{"statement":"উপাত্তের বেশিরভাগ মান ঋণাত্মক হলে পরিমিত ব্যবধানও ঋণাত্মক হতে পারে।","isTrue":false,"why":"ব্যবধানকে বর্গ করে গড় করা হয় বলে $\\sigma^2 \\ge 0$ এবং ধনাত্মক বর্গমূল $\\sigma \\ge 0$ সর্বদাই অঋণাত্মক থাকে।"}},{"id":"app_dispersion_prob_c2","badge":"রূপান্তর ও বিভেদাঙ্ক","title":"মূলবিন্দু ও মাপনী পরিবর্তন এবং বিভেদাঙ্ক","intuition":"প্রতিটি উপাত্তের সাথে কোনো ধ্রুবক যোগ বা বিয়োগ করলে (মূলবিন্দু পরিবর্তন) মানগুলোর পারস্পরিক দূরত্ব বদলায় না, তাই বিস্তার অপরিবর্তিত থাকে। কিন্তু কোনো ধ্রুবক দিয়ে গুণ করলে (মাপনী পরিবর্তন) পরিমিত ব্যবধান সেই ধ্রুবকের পরম মানের গুণিতক হয়। ভিন্ন গড় বা ভিন্ন এককের দুটি উপাত্তের সামঞ্জস্যতা তুলনা করতে বিভেদাঙ্ক ($CV$) ব্যবহার করা হয়।","formulas":[{"label":"রৈখিক রূপান্তর y = ax + b","latex":"\\bar{y} = a\\bar{x} + b, \\quad \\sigma_y = |a|\\sigma_x, \\quad \\sigma_y^2 = a^2\\sigma_x^2","whenToUse":"প্রতিটি মানকে $a$ দিয়ে গুণ (মাপনী পরিবর্তন) ও $b$ যোগ (মূলবিন্দু পরিবর্তন) করা হলে।"},{"label":"বিভেদাঙ্ক","latex":"CV = \\frac{\\sigma}{\\bar{x}} \\times 100\\%","whenToUse":"দুটি নিবেশনের সামঞ্জস্যতা তুলনা করতে; যার $CV$ কম, সে বেশি সামঞ্জস্যপূর্ণ।"}],"symbols":[{"sym":"$a$","meaning":"মাপনী গুণক"},{"sym":"$b$","meaning":"মূলবিন্দু স্থানান্তর ধ্রুবক"},{"sym":"$CV$","meaning":"বিভেদাঙ্ক (এককমুক্ত শতকরা মান)"}],"example":{"problem":"একটি উপাত্তের গড় $\\bar{x} = 20$ এবং পরিমিত ব্যবধান $\\sigma_x = 5$। $y = -3x + 100$ রূপান্তরের পর নতুন গড়, পরিমিত ব্যবধান ও বিভেদাঙ্ক নির্ণয় কর।","steps":["নতুন গড়: $\\bar{y} = -3(20) + 100 = 40$।","নতুন পরিমিত ব্যবধান: $\\sigma_y = |-3| \\cdot 5 = 15$ (মূলবিন্দু $+100$-এর কোনো প্রভাব নেই এবং $\\sigma_y$ সর্বদা ধনাত্মক)।","নতুন বিভেদাঙ্ক: $CV = \\frac{15}{40} \\times 100\\% = 37.5\\%$।"],"answer":"$\\bar{y} = 40$, $\\sigma_y = 15$, $CV = 37.5\\%$"},"tip":"$\\sigma_y$-এর সামনে কখনো মাইনাস চিহ্ন বসাবে না: $y = 50 - 2x$ হলে $\\sigma_y = |-2|\\sigma_x = 2\\sigma_x$, কখনোই $-2\\sigma_x$ নয়।","check":{"q":"কোনো নিবেশনের ভেদাঙ্ক $16$ হলে প্রতিটি উপাত্তের সাথে $10$ যোগ করলে নতুন ভেদাঙ্ক কত হবে?","a":"$16$ — ভেদাঙ্ক মূলবিন্দু পরিবর্তনের ওপর নির্ভরশীল নয়।"},"mythBuster":{"statement":"যে উপাত্তের পরিমিত ব্যবধান কম, সেটি সবসময় বেশি সামঞ্জস্যপূর্ণ।","isTrue":false,"why":"সামঞ্জস্যতা তুলনা করতে আপেক্ষিক বিস্তার অর্থাৎ বিভেদাঙ্ক ($CV = \\frac{\\sigma}{\\bar{x}} \\times 100\\%$) দেখতে হয়, শুধু $\\sigma$ নয়—বিশেষ করে গড় ভিন্ন হলে।"}},{"id":"app_dispersion_prob_c3","badge":"সম্ভাবনার ভিত্তি","title":"নমুনাক্ষেত্র, চিরায়ত সম্ভাবনা ও যোগসূত্র","intuition":"কোনো দৈব পরীক্ষণের সকল সম্ভাব্য ফলাফলের সেটই নমুনাক্ষেত্র ($S$)। সমসম্ভাব্য ফলাফলের ক্ষেত্রে অনুকূল ফলাফলকে মোট ফলাফল দিয়ে ভাগ করলেই সম্ভাবনা পাওয়া যায়। '$A$ অথবা $B$' ঘটার সম্ভাবনা বের করার সময় সাধারণ অংশ $P(A \\cap B)$ বিয়োগ করতে হয়, যদি না ঘটনা দুটি পরস্পর বর্জনশীল হয়।","formulas":[{"label":"চিরায়ত সম্ভাবনা ও পূরক ঘটনা","latex":"P(A) = \\frac{n(A)}{n(S)}, \\quad 0 \\le P(A) \\le 1, \\quad P(A') = 1 - P(A)","whenToUse":"নিরপেক্ষ মুদ্রা, ছক্কা ও ৫২ তাসের প্যাকেটের সমসম্ভাব্য পরীক্ষণে।"},{"label":"সম্ভাবনার সাধারণ যোগসূত্র","latex":"P(A \\cup B) = P(A) + P(B) - P(A \\cap B)","whenToUse":"$A$ বা $B$-এর অন্তত একটি ঘটার সম্ভাবনা নির্ণয়ে।"},{"label":"পরস্পর বর্জনশীল ঘটনা","latex":"A \\cap B = \\emptyset \\implies P(A \\cap B) = 0, \\quad P(A \\cup B) = P(A) + P(B)","whenToUse":"যখন $A$ ও $B$ একই সাথে ঘটা অসম্ভব।"}],"symbols":[{"sym":"$S$","meaning":"নমুনাক্ষেত্র"},{"sym":"$A'$","meaning":"পূরক ঘটনা ($A$ না ঘটা)"},{"sym":"$A \\cup B$","meaning":"সংযোগ ঘটনা ($A$ অথবা $B$ বা উভয়ই)"},{"sym":"$A \\cap B$","meaning":"ছেদ ঘটনা ($A$ এবং $B$ উভয়ই)"}],"example":{"problem":"এক প্যাকেট ৫২টি তাস থেকে দৈবভাবে একটি তাস টানা হলো। তাসটি রাজা অথবা হরতন হওয়ার সম্ভাবনা কত?","steps":["$P(K) = \\frac{4}{52}$ এবং $P(H) = \\frac{13}{52}$।","উভয় শর্ত পূরণকারী তাস (হরতনের রাজা): $P(K \\cap H) = \\frac{1}{52}$।","যোগসূত্রানুসারে: $P(K \\cup H) = \\frac{4}{52} + \\frac{13}{52} - \\frac{1}{52} = \\frac{16}{52} = \\frac{4}{13}$।"],"answer":"$\\frac{4}{13}$"},"tip":"দুটি ছক্কা নিক্ষেপে ($n(S) = 36$) যোগফল $2$ থেকে $12$-এর অনুকূল উপায়গুলো ত্রিভুজ ছন্দে মনে রাখো: $1, 2, 3, 4, 5, 6, 5, 4, 3, 2, 1$ (যোগফল $7$-এ সর্বোচ্চ $6$টি উপায়)।","check":{"q":"দুটি নিরপেক্ষ ছক্কা একত্রে নিক্ষেপ করলে প্রাপ্ত সংখ্যার যোগফল $9$ হওয়ার সম্ভাবনা কত?","a":"অনুকূল জোড়া $(3,6),(4,5),(5,4),(6,3)$ — মোট ৪টি, তাই $\\frac{4}{36} = \\frac{1}{9}$।"},"mythBuster":{"statement":"$P(A) = 0.6$ এবং $P(B) = 0.5$ হলেও $A$ ও $B$ পরস্পর বর্জনশীল হতে পারে।","isTrue":false,"why":"বর্জনশীল হলে $P(A \\cup B) = 0.6 + 0.5 = 1.1 > 1$ হতো, যা সম্ভাবনার নিয়মবিরুদ্ধ।"}},{"id":"app_dispersion_prob_c4","badge":"স্বাধীন ও শর্তাধীন সম্ভাবনা","title":"স্বাধীন ঘটনা, গুণনসূত্র ও শর্তাধীন সম্ভাবনা","intuition":"শর্তাধীন সম্ভাবনা $P(A|B)$ হলো $B$ ঘটেছে জানার পর নতুন ছোট নমুনাক্ষেত্র $B$-এর সাপেক্ষে $A$ ঘটার সম্ভাবনা। $B$ ঘটা বা না ঘটা যদি $A$-এর সম্ভাবনায় কোনো প্রভাব না ফেলে, তবে ঘটনা দুটি স্বাধীন—তখন উভয়ের একত্রে ঘটার সম্ভাবনা শুধু $P(A)P(B)$।","formulas":[{"label":"শর্তাধীন সম্ভাবনা","latex":"P(A|B) = \\frac{P(A \\cap B)}{P(B)} \\quad (P(B) > 0)","whenToUse":"$B$ ঘটনাটি ইতিমধ্যে ঘটেছে শর্তে $A$ ঘটার সম্ভাবনা বের করতে।"},{"label":"স্বাধীন ঘটনার শর্ত","latex":"P(A \\cap B) = P(A) \\cdot P(B) \\iff P(A|B) = P(A)","whenToUse":"আলাদা মুদ্রা/ছক্কা নিক্ষেপ, প্রতিস্থাপনসহ বল তোলা বা দুজনের স্বাধীনভাবে অঙ্ক সমাধানের ক্ষেত্রে।"},{"label":"অন্তত একটি ঘটার শর্টকাট","latex":"P(A \\cup B) = 1 - P(A')P(B')","whenToUse":"স্বাধীন ঘটনার ক্ষেত্রে 'অন্তত একজন সমাধান/লক্ষ্যভেদ করবে' টাইপের প্রশ্নে সবচেয়ে দ্রুত উপায়।"}],"symbols":[{"sym":"$P(A|B)$","meaning":"$B$ ঘটেছে শর্তে $A$-এর শর্তাধীন সম্ভাবনা"},{"sym":"$P(A \\cap B)$","meaning":"$A$ ও $B$-এর যৌথ সম্ভাবনা"}],"example":{"problem":"একটি থলেতে $4$টি লাল ও $6$টি নীল বল আছে। প্রতিস্থাপন না করে পরপর দুটি বল তোলা হলে উভয় বলই লাল হওয়ার সম্ভাবনা কত?","steps":["প্রথম বল লাল হওয়ার সম্ভাবনা: $P(R_1) = \\frac{4}{10} = \\frac{2}{5}$।","প্রথমটি লাল হলে বাকি থাকে $9$টি বলের মধ্যে $3$টি লাল: $P(R_2 | R_1) = \\frac{3}{9} = \\frac{1}{3}$।","গুণনসূত্রানুসারে: $P(R_1 \\cap R_2) = \\frac{2}{5} \\times \\frac{1}{3} = \\frac{2}{15}$।"],"answer":"$\\frac{2}{15}$"},"tip":"প্রশ্নে 'প্রতিস্থাপনসহ' (স্বাধীন) নাকি 'প্রতিস্থাপন না করে' (অধীন, প্রতি ধাপে হর ১ কমে) লেখা আছে তা আগে চিহ্নিত করো।","check":{"q":"$A$ ও $B$ স্বাধীন ঘটনা এবং $P(A) = \\frac{1}{2}$, $P(B) = \\frac{1}{3}$ হলে $P(A \\cup B)$ কত?","a":"$\\frac{1}{2} + \\frac{1}{3} - \\frac{1}{6} = \\frac{2}{3}$।"},"mythBuster":{"statement":"দুটি অশূন্য পরস্পর বর্জনশীল ঘটনা সর্বদা স্বাধীনও হয়।","isTrue":false,"why":"অশূন্য বর্জনশীল ঘটনায় $P(A \\cap B) = 0$, কিন্তু $P(A)P(B) > 0$; তাই $P(A \\cap B) \\neq P(A)P(B)$ অর্থাৎ তারা অবশ্যই অধীন ঘটনা!"}}],"mcqs":[{"id":"app_dispersion_prob_q1","cardId":"app_dispersion_prob_c1","qType":"numerical","conceptGroup":"range_calc","q":"$\\{12, 5, 19, 8, 23, 14\\}$ উপাত্তটির পরিসর কত?","opts":["$18$","$11$","$28$","$15$"],"ans":0,"tags":["board-standard","no-calc-shortcut"],"exp":"সর্বোচ্চ মান $23$ এবং সর্বনিম্ন মান $5$, সুতরাং পরিসর $R = 23 - 5 = 18$। $11$ নিলে ভুলবশত শেষ ও প্রথম মানের পার্থক্য ধরা হয়।","variants":[{"q":"$\\{7, 21, 4, 16, 29, 11\\}$ উপাত্তটির পরিসর কত?","opts":["$22$","$25$","$18$","$33$"],"ans":1,"exp":"সর্বোচ্চ মান $29$ ও সর্বনিম্ন মান $4$, তাই $R = 29 - 4 = 25$। $33$ হলো মান দুটির যোগফল, বিয়োগফল নয়।"},{"q":"$\\{-4, 9, 0, -7, 13, 5\\}$ উপাত্তটির পরিসর কত?","opts":["$9$","$17$","$20$","$6$"],"ans":2,"exp":"সর্বোচ্চ মান $13$ এবং সর্বনিম্ন মান $-7$, সুতরাং $R = 13 - (-7) = 20$। $6$ নিলে ঋণাত্মক চিহ্ন বাদ দিয়ে $13 - 7$ করার ভুল হয়।"}]},{"id":"app_dispersion_prob_q2","cardId":"app_dispersion_prob_c1","qType":"numerical","conceptGroup":"mean_deviation","q":"$\\{3, 5, 7, ,"formula-trap"],"exp":"$\\sigma$ এবং $\\bar{x}$ উভয়ই $c$ গুণ হওয়ায় $CV_{\\text{new}} = \\frac{c\\sigma}{c\\bar{x}} \\times 100\\% = CV_{\\text{old}}$। অর্থাৎ ধনাত্মক মাপনী পরিবর্তনে $CV$ অপরিবর্তিত থাকে।","variants":[]},{"id":"app_dispersion_prob_q23","cardId":"app_dispersion_prob_c3","qType":"conceptual","conceptGroup":"event_relations_prob","q":"$A$ ও $B$ পরস্পর বর্জনশীল ঘটনা হলে নিচের কোন সম্পর্কটি অবশ্যই সত্য?","opts":["$P(A \\cap B) = P(A)P(B)$","$P(A \\cup B) = 1$","$P(A \\cap B) = 0$","$P(A|B) = P(A)$"],"ans":2,"tags":["board-standard","formula-trap"],"exp":"পরস্পর বর্জনশীল ঘটনা একসাথে ঘটতে পারে না বলে $A \\cap B = \\emptyset$ এবং $P(A \\cap B) = 0$। প্রথম অপশনটি স্বাধীন ঘটনার শর্ত।","variants":[]},{"id":"app_dispersion_prob_q24","cardId":"app_dispersion_prob_c4","qType":"conceptual","conceptGroup":"event_relations_prob","q":"$P(A) > 0$ এবং $P(B) > 0$ বিশিষ্ট দুটি ঘটনা $A$ ও $B$ যদি পরস্পর বর্জনশীল হয়, তবে তারা হবে:","opts":["সর্বদা স্বাধীন","শুধু $P(A)=P(B)$ হলে স্বাধীন","পূরক ঘটনা","সর্বদা অধীন"],"ans":3,"tags":["pyq-pattern","formula-trap"],"exp":"বর্জনশীল হলে $P(A \\cap B) = 0$, কিন্তু $P(A)P(B) > 0$; সুতরাং $P(A \\cap B) \\neq P(A)P(B)$ হওয়ায় ঘটনা দুটি সর্বদা অধীন।","variants":[]},{"id":"app_dispersion_prob_q25","cardId":"app_dispersion_prob_c4","qType":"conceptual","conceptGroup":"event_relations_prob","q":"$A$ ও $B$ স্বাধীন ঘটনা হলে নিচের কোনটি নিশ্চিতভাবে সত্য?","opts":["$P(A|B) = P(A)$","$P(A \\cap B) = 0$","$P(A \\cup B) = P(A) + P(B)$","$P(A) + P(B) = 1$"],"ans":0,"tags":["board-standard","formula-trap"],"exp":"স্বাধীনতার অর্থ $B$ ঘটলেও $A$-এর সম্ভাবনা বদলায় না, তাই $P(A|B) = \\frac{P(A)P(B)}{P(B)} = P(A)$। $P(A \\cap B) = 0$ হলো বর্জনশীলতার শর্ত।","variants":[]}],"writtenDrills":[{"id":"app_dispersion_prob_w1","cardId":"app_dispersion_prob_c1","marks":2,"q":"$\\{4, 6, 8, 10, 12\\}$ উপাত্তটির ভেদাঙ্ক, পরিমিত ব্যবধান এবং বিভেদাঙ্ক নির্ণয় কর।","steps":["গাণিতিক গড়: $\\bar{x} = \\frac{4 + 6 + 8 + 10 + 12}{5} = \\frac{40}{5} = 8$।","গড় হতে ব্যবধানের বর্গের সমষ্টি: $(-4)^2 + (-2)^2 + 0^2 + 2^2 + 4^2 = 16 + 4 + 0 + 4 + 16 = 40$।","ভেদাঙ্ক: $\\sigma^2 = \\frac{40}{5} = 8$ এবং পরিমিত ব্যবধান: $\\sigma = \\sqrt{8} = 2\\sqrt{2}$।","বিভেদাঙ্ক: $CV = \\frac{\\sigma}{\\bar{x}} \\times 100\\% = \\frac{2\\sqrt{2}}{8} \\times 100\\% = 25\\sqrt{2}\\%$।"],"finalAnswer":"$\\sigma^2 = 8$, $\\sigma = 2\\sqrt{2}$, $CV = 25\\sqrt{2}\\%$","markingTip":"গড় $\\bar{x}$ স্পষ্ট করে লিখলে ০.৫ নম্বর, $\\sigma^2$ ও $\\sigma$ সঠিকভাবে বের করলে ১ নম্বর এবং $CV$ মূলদ-অমূলদ আকারে $25\\sqrt{2}\\%$ রাখলে বাকি ০.৫ নম্বর নিশ্চিত।"},{"id":"app_dispersion_prob_w2","cardId":"app_dispersion_prob_c4","marks":2,"q":"একটি পাত্রে $5$টি সাদা ও $4$টি কালো বল আছে। প্রতিস্থাপন না করে পরপর দুটি বল তোলা হলে বল দুটি ভিন্ন রঙের হওয়ার সম্ভাবনা নির্ণয় কর।","steps":["মোট বল $= 5 + 4 = 9$টি। ভিন্ন রঙের বল দুটি বর্জনশীল উপায়ে উঠতে পারে: (প্রথম সাদা ও দ্বিতীয় কালো) অথবা (প্রথম কালো ও দ্বিতীয় সাদা)।","$P(W_1 \\cap B_2) = \\frac{5}{9} \\times \\frac{4}{8} = \\frac{20}{72} = \\frac{5}{18}$।","$P(B_1 \\cap W_2) = \\frac{4}{9} \\times \\frac{5}{8} = \\frac{20}{72} = \\frac{5}{18}$।","নির্ণেয় সম্ভাবনা $= \\frac{5}{18} + \\frac{5}{18} = \\frac{10}{18} = \\frac{5}{9}$।"],"finalAnswer":"$\\frac{5}{9}$","markingTip":"দুটি ক্রমই ($WB$ ও $BW$) যোগ করতে ভুলো না অথবা সরাসরি সমাবেশে $\\frac{\\binom{5}{1}\\binom{4}{1}}{\\binom{9}{2}} = \\frac{20}{36} = \\frac{5}{9}$ দেখাও; একটি ক্রম বাদ দিলে অর্ধেক নম্বর কাটা যায়।"},{"id":"app_dispersion_prob_w3","cardId":"app_dispersion_prob_c4","marks":2,"q":"যদি $P(A) = \\frac{1}{2}$, $P(B) = \\frac{1}{3}$ এবং $P(A \\cup B) = \\frac{2}{3}$ হয়, তবে $P(A|B)$ নির্ণয় কর এবং $A$ ও $B$ স্বাধীন কি না যাচাই কর।","steps":["যোগসূত্রানুসারে: $P(A \\cap B) = P(A) + P(B) - P(A \\cup B) = \\frac{1}{2} + \\frac{1}{3} - \\frac{2}{3} = \\frac{1}{6}$।","শর্তাধীন সম্ভাবনা: $P(A|B) = \\frac{P(A \\cap B)}{P(B)} = \\frac{1/6}{1/3} = \\frac{1}{2}$।","স্বাধীনতা যাচাই: $P(A) \\cdot P(B) = \\frac{1}{2} \\cdot \\frac{1}{3} = \\frac{1}{6} = P(A \\cap B)$।","যেহেতু $P(A \\cap B) = P(A)P(B)$, তাই $A$ ও $B$ পরস্পর স্বাধীন ঘটনা।"],"finalAnswer":"$P(A|B) = \\frac{1}{2}$; হ্যাঁ, $A$ ও $B$ স্বাধীন ঘটনা।","markingTip":"'হ্যাঁ' লেখার আগে অবশ্যই $P(A \\cap B) = P(A)P(B)$ শর্তটি দেখিয়ে উপসংহার টানবে, এতে পূর্ণ ২ নম্বর নিশ্চিত হবে।"}]},{"id":"app_lp","moduleId":"mod_applied","title":"যোগাশ্রয়ী প্রোগ্রাম","subtitle":"সিদ্ধান্ত চলক, অনুকূল এলাকা ও কৌণিক বিন্দু উপপাদ্য","paperRef":"2nd Paper Ch. 2","tier":3,"estMinutes":12,"cards":[{"id":"app_lp_c1","badge":"মডেল গঠন","title":"সিদ্ধান্ত চলক, উদ্দেশ্য ফাংশন ও রৈখিক শর্ত","intuition":"যোগাশ্রয়ী প্রোগ্রাম সীমিত সম্পদের মধ্যে সর্বোচ্চ মুনাফা বা সর্বনিম্ন ব্যয় নির্ণয়ের একটি গাণিতিক কৌশল। এখানে উদ্দেশ্য ফাংশন ও প্রতিটি শর্ত অবশ্যই একঘাত রৈখিক হতে হবে—কোনো $x^2$ বা $xy$ পদ থাকতে পারবে না।","formulas":[{"label":"উদ্দেশ্য ফাংশন","latex":"Z = c_1 x + c_2 y","whenToUse":"মোট মুনাফা সর্বোচ্চ (গরিষ্ঠকরণ) বা মোট ব্যয় সর্বনিম্ন (লঘিষ্ঠকরণ) প্রকাশ করতে।"},{"label":"রৈখিক শর্ত ও অঋণাত্মক শর্ত","latex":"a_1 x + b_1 y \\le d_1, \\quad a_2 x + b_2 y \\le d_2, \\quad x \\ge 0, \\; y \\ge 0","whenToUse":"'সর্বোচ্চ/মজুদ' থাকলে $\\le$, 'অন্তত/ন্যূনতম' থাকলে $\\ge$, এবং বাস্তব উৎপাদনের জন্য $x, y \\ge 0$ বসাতে।"}],"symbols":[{"sym":"$x, y$","meaning":"সিদ্ধান্ত চলক"},{"sym":"$Z$","meaning":"উদ্দেশ্য ফাংশন"},{"sym":"$x \\ge 0, y \\ge 0$","meaning":"অঋণাত্মক শর্ত (প্রথম চতুর্ভাগ)"}],"example":{"problem":"একটি কারখানা $x$টি টেবিল (মুনাফা ৫০০ টাকা, সময় ৪ ঘণ্টা) ও $y$টি চেয়ার (মুনাফা ৩০০ টাকা, সময় ২ ঘণ্টা) তৈরি করে। সর্বোচ্চ ৪০ ঘণ্টা শ্রম পাওয়া গেলে যোগাশ্রয়ী প্রোগ্রামটি গঠন কর।","steps":["সিদ্ধান্ত চলক: ধরি, টেবিলের সংখ্যা $= x$ এবং চেয়ারের সংখ্যা $= y$ ($x \\ge 0, y \\ge 0$)।","উদ্দেশ্য ফাংশন: গরিষ্ঠকরণ $Z = 500x + 300y$।","শ্রমের শর্ত: $4x + 2y \\le 40$ (সরল করলে $2x + y \\le 20$)।"],"answer":"গরিষ্ঠকরণ $Z = 500x + 300y$; শর্ত: $2x + y \\le 20,\\; x \\ge 0,\\; y \\ge 0$"},"tip":"প্রশ্নের শব্দ চটজলদি চিহ্নে বদলে নাও: 'সর্বোচ্চ / অনধিক / মজুদ' $\\rightarrow \\le$; 'সর্বনিম্ন / অন্তত / কমপক্ষে' $\\rightarrow \\ge$।","check":{"q":"$Z = 3x^2 + 2y$ কি যোগাশ্রয়ী প্রোগ্রামের বৈধ উদ্দেশ্য ফাংশন?","a":"না — $x^2$ দ্বিঘাত পদ; যোগাশ্রয়ী প্রোগ্রামে সব পদ একঘাত হতে হবে।"},"mythBuster":{"statement":"ব্যবসায়িক যোগাশ্রয়ী প্রোগ্রামে অঋণাত্মক শর্ত $x \\ge 0, y \\ge 0$ না লিখলেও চলে।","isTrue":false,"why":"$x \\ge 0, y \\ge 0$ বাদ দিলে উৎপাদনের পরিমাণ ঋণাত্মক হতে পারে এবং অনুকূল এলাকা প্রথম চতুর্ভাগে সীমাবদ্ধ থাকে না।"}},{"id":"app_lp_c2","badge":"অনুকূল এলাকা","title":"অর্ধতল ছায়াঙ্কন, সীমাবদ্ধ ও অসীমাবদ্ধ অনুকূল এলাকা","intuition":"প্রতিটি রৈখিক অসমতা সমতলকে দুটি অর্ধতলে ভাগ করে। সবগুলো শর্ত একসাথে পূরণকারী সাধারণ অংশই হলো অনুকূল এলাকা, যা সর্বদা একটি উত্তল বহুভুজ—অর্থাৎ এলাকার যেকোনো দুটি বিন্দুর সংযোজক রেখাংশ সম্পূর্ণভাবে ওই এলাকার ভেতরেই থাকে।","formulas":[{"label":"ছেদক আকারে দ্রুত রেখা আঁকা","latex":"ax + by = c \\implies \\frac{x}{c/a} + \\frac{y}{c/b} = 1","whenToUse":"সীমান্ত সরলরেখার $x$-ছেদক $(c/a, 0)$ ও $y$-ছেদক $(0, c/b)$ ৫ সেকেন্ডে বের করতে।"},{"label":"মূলবিন্দু পরীক্ষা","latex":"(0,0): \\; a(0) + b(0) \\le c","whenToUse":"রেখাটি $(0,0)$ দিয়ে না গেলে $(0,0)$ বসিয়ে সত্য হলে মূলবিন্দুর দিকে ছায়া দাও; $(0,0)$ দিয়ে গেলে $(1,0)$ বা $(0,1)$ দিয়ে যাচাই করো।"}],"symbols":[{"sym":"$(c/a, 0)$","meaning":"$ax + by = c$ রেখার $x$-অক্ষের ছেদবিন্দু"},{"sym":"$(0, c/b)$","meaning":"$ax + by = c$ রেখার $y$-অক্ষের ছেদবিন্দু"}],"example":{"problem":"$2x + 3y \\le 12,\\; x \\ge 0,\\; y \\ge 0$ দ্বারা সীমাবদ্ধ অনুকূল এলাকার শীর্ষবিন্দু ও ক্ষেত্রফল নির্ণয় কর।","steps":["$2x + 3y = 12$ রেখার $x$-ছেদক $(6, 0)$ এবং $y$-ছেদক $(0, 4)$।","মূলবিন্দু পরীক্ষা: $2(0) + 3(0) = 0 \\le 12$ (সত্য), তাই প্রথম চতুর্ভাগে মূলবিন্দুর দিকের ত্রিভুজটিই অনুকূল এলাকা।","শীর্ষবিন্দুগুলো $(0,0), (6,0), (0,4)$ এবং সমকোণী ত্রিভুজটির ক্ষেত্রফল $= \\frac{1}{2} \\times 6 \\times 4 = 12$ বর্গ একক।"],"answer":"শীর্ষবিন্দু: $(0,0), (6,0), (0,4)$; ক্ষেত্রফল $= 12$ বর্গ একক"},"tip":"ধনাত্মক সহগসহ সব শর্ত $\\le$ (এবং $x, y \\ge 0$) হলে এলাকাটি সীমাবদ্ধ হয় এবং গরিষ্ঠ ও লঘিষ্ঠ উভয় মানই থাকে। সব শর্ত $\\ge$ ardId":"app_lp_c1","qType":"numerical","conceptGroup":"slack_calculation","q":"$(3, 2)$ অনুকূল বিন্দুতে $2x + 3y \\le 20$ শর্তে কত একক অব্যবহৃত সম্পদ (ঘাটতি চলক) অবশিষ্ট থাকে?","opts":["$12$","$8$","$6$","$14$"],"ans":1,"tags":["board-standard","no-calc-shortcut"],"exp":"$(3,2)$ বিন্দুতে ব্যবহৃত সম্পদ $= 2(3) + 3(2) = 12$। অবশিষ্ট সম্পদ $= 20 - 12 = 8$। $12$ হলো ব্যবহৃত অংশ, অবশিষ্ট অংশ নয়।","variants":[{"q":"$(4, 1)$ অনুকূল বিন্দুতে $3x + 5y \\le 25$ শর্তে কত একক অব্যবহৃত সম্পদ অবশিষ্ট থাকে?","opts":["$17$","$10$","$8$","$5$"],"ans":2,"exp":"ব্যবহৃত $= 3(4) + 5(1) = 17$, তাই অবশিষ্ট $= 25 - 17 = 8$। $17$ হলো ব্যবহৃত পরিমাণ।"},{"q":"$(2, 5)$ অনুকূল বিন্দুতে $4x + 2y \\le 18$ শর্তে কত একক অব্যবহৃত সম্পদ অবশিষ্ট থাকে?","opts":["$0$","$2$","$4$","$18$"],"ans":0,"exp":"ব্যবহৃত $= 4(2) + 2(5) = 18$, তাই অবশিষ্ট $= 18 - 18 = 0$ (এখানে শর্তটি পূর্ণভাবে ব্যবহৃত)।"}]},{"id":"app_lp_q15","cardId":"app_lp_c3","qType":"numerical","conceptGroup":"reverse_objective_coeff","q":"$Z = ax + 4y$ উদ্দেশ্য ফাংশনটির মান $(3, 2)$ বিন্দুতে $26$ হলে $a$-এর মান কত?","opts":["$5$","$4$","$6$","$8$"],"ans":2,"tags":["board-standard","no-calc-shortcut"],"exp":"$(3,2)$ বসিয়ে পাই: $3a + 4(2) = 26 \\implies 3a = 18 \\implies a = 6$। $8$ হলো $4(2)$-এর মান, $a$-এর মান নয়।","variants":[{"q":"$Z = 5x + by$ উদ্দেশ্য ফাংশনটির মান $(3, 4)$ বিন্দুতে $31$ হলে $b$-এর মান কত?","opts":["$4$","$3$","$5$","$6$"],"ans":0,"exp":"$(3,4)$ বসালে $15 + 4b = 31 \\implies 4b = 16 \\implies b = 4$। $5$ বিয়োগের ভুলে আসে।"},{"q":"$Z = ax + 3y$ উদ্দেশ্য ফাংশনটির মান $(2, 4)$ এবং $(5, 2)$ উভয় বিন্দুতে সমান হলে $a$-এর মান কত?","opts":["$3$","$2$","$4$","$1$"],"ans":1,"exp":"শর্তমতে $2a + 12 = 5a + 6 \\implies 3a = 6 \\implies a = 2$। $3$ নিলে $6$-কে $3$ দিয়ে সঠিকভাবে ভাগ করা হয়নি।"}]},{"id":"app_lp_q16","cardId":"app_lp_c3","qType":"numerical","conceptGroup":"min_two_constraints","q":"$x + y \\ge 4,\\; x + 2y \\ge 6,\\; x \\ge 0,\\; y \\ge 0$ শর্তাধীনে $Z = 2x + 3y$-এর সর্বনিম্ন মান কত?","opts":["$8$","$12$","$9$","$1  = 20$, $Z(0,4) = 16$।"],"finalAnswer":"$(x, y) = (4, 2)$ বিন্দুতে $Z_{\\max} = 20$","markingTip":"ছেদবিন্দু নির্ণয় দেখাও (০.৫ নম্বর), ৪টি অনুকূল কৌণিক বিন্দু তালিকাভুক্ত করো (০.৫ নম্বর) এবং প্রতিটি বিন্দুতে $Z$-এর মান দেখিয়ে সর্বোচ্চ মান লিখলে পূর্ণ ২ নম্বর পাবে।"},{"id":"app_lp_w2","cardId":"app_lp_c3","marks":2,"q":"$x + y \\ge 4$, $2x + y \\ge 6$, $x \\ge 0$, $y \\ge 0$ শর্তাধীনে $Z = 5x + 3y$-এর সর্বনিম্ন মান নির্ণয় কর।","steps":["সীমান্ত রেখার ছেদবিন্দু: $x + y = 4$ যায় $(4,0), (0,4)$ দিয়ে; $2x + y = 6$ যায় $(3,0), (0,6)$ দিয়ে।","রেখা দুটির ছেদবিন্দু: $(2x + y) - (x + y) = 6 - 4 \\implies x = 2$, এবং $y = 2$, অর্থাৎ $(2,2)$।","অসীমাবদ্ধ অনুকূল এলাকার কৌণিক বিন্দু: $A(0,6), B(2,2), C(4,0)$।","$Z = 5x + 3y$-এর মান: $Z(0,6) = 18$, $Z(2,2) = 10 + 6 = 16$, $Z(4,0) = 20$। সহগ ধনাত্মক হওয়ায় সর্বনিম্ন মান $16$।"],"finalAnswer":"$(x, y) = (2, 2)$ বিন্দুতে $Z_{\\min} = 16$","markingTip":"$\\ge$ শর্তের ক্ষেত্রে বাইরের ছেদবিন্দু $(0,6)$ ও $(4,0)$ নিতে হবে—ভেতরের $(0,4)$ বা $(3,0)$ নিলে অবৈধ বিন্দু হওয়ায় নম্বর কাটা যাবে।"},{"id":"app_lp_w3","cardId":"app_lp_c1","marks":2,"q":"একটি বেকারি দৈনিক $x$টি কেক ও $y$টি পাই তৈরি করে। প্রতিটি কেকে ২ কেজি ময়দা ও ১ ঘণ্টা সময় লাগে (মুনাফা ৩০০ টাকা); প্রতিটি পাইয়ে ১ কেজি ময়দা ও ২ ঘণ্টা সময় লাগে (মুনাফা ২০০ টাকা)। দৈনিক সর্বোচ্চ ১০ কেজি ময়দা ও ৮ ঘণ্টা সময় পাওয়া গেলে মুনাফা সর্বোচ্চ করার যোগাশ্রয়ী প্রোগ্রামটি গঠন কর।","steps":["সিদ্ধান্ত চলক: ধরি, দৈনিক কেকের সংখ্যা $= x$ এবং পাইয়ের সংখ্যা $= y$।","উদ্দেশ্য ফাংশন: গরিষ্ঠকরণ $Z = 300x + 200y$।","ময়দার শর্ত: $2x + y \\le 10$; সময়ের শর্ত: $x + 2y \\le 8$।","অঋণাত্মক শর্ত: $x \\ge 0,\\; y \\ge 0$।"],"finalAnswer":"গরিষ্ঠকরণ $Z = 300x + 200y$; শর্ত: $2x + y \\le 10$, $x + 2y \\le 8$, $x \\ge 0$, $y \\ge 0$","markingTip":"শেষে অঋণাত্মক শর্ত $x \\ge 0, y \\ge 0$ লিখতে কখনোই ভুলো না—এটি বাদ দিলে পরীক্ষকরা ০.৫ নম্বর কেটে নেন।"}]},{"id":"app_written","moduleId":"mod_applied","title":"১০ নম্বরের লিখিত মাস্টার স্প্রিন্ট","subtitle":"ত্রিকোণমিতি, স্থানাঙ্ক, ক্যালকুলাস, ভেক্টর-ম্যাট্রিক্স ও কণিকের ২-নম্বর প্রমাণ","paperRef":"Cross-Chapter Exam Sprint","tier":1,"estMinutes":20,"cards":[{"id":"app_written_c1","badge":"ত্রিকোণমিতি ও স্থানাঙ্ক","title":"ত্রিকোণমিতিক প্রমাণ ও স্থানাঙ্ক জ্যামিতির ২-নম্বর ব্লুপ্রিন্ট","intuition":"ঢাবি গ ইউনিটের ২ নম্বরের লিখিত প্রশ্নে অপ্রয়োজনীয় বড় হিসাব নয়, ৪ লাইনের পরিচ্ছন্ন প্রমাণই পূর্ণ নম্বর এনে দেয়। ত্রিকোণমিতিতে $\\tan(A+B)$ বা $\\sin C \\pm \\sin D$ ধরো, আর স্থানাঙ্ক জ্যামিতিতে $m_1 m_2 = -1$ দিয়ে সমকোণী ত্রিভুজ এবং সমান ঢাল বা $\\Delta = 0$ দিয়ে সমরেখতা প্রমাণ করো।","formulas":[{"label":"ট্যানজেন্ট যোগফল ও দ্বিকোণ সূত্র","latex":"\\tan(A+B) = \\frac{\\tan A + \\tan B}{1 - \\tan A \\tan B}, \\quad \\sin 2\\theta = 2\\sin\\theta\\cos\\theta","whenToUse":"$\\tan 70^\\circ = \\tan 20^\\circ + 2\\tan 50^\\circ$ বা $\\sin 3\\theta, \\cos 3\\theta$-এর প্রমাণ দ্রুত শেষ করতে।"},{"label":"লম্ব ও সমরেখতার শর্ত","latex":"m_1 m_2 = -1, \\quad m_{AB} = m_{BC} \\iff \\Delta = 0","whenToUse":"তিনটি বিন্দু সমকোণী ত্রিভুজ গঠন করে কি না অথবা সমরেখ কি না ৩ লাইনে প্রমাণ করতে।"},{"label":"বিন্দু হতে সরলরেখার লম্ব দূরত্ব","latex":"d = \\frac{|ax_1 + by_1 + c|}{\\sqrt{a^2 + b^2}}","whenToUse":"$(x_1, y_1)$ বিন্দু হতে $ax + by + c = 0$ রেখার লম্ব দূরত্ব বা স্পর্শক প্রমাণ করতে।"}],"symbols":[{"sym":"$m$","meaning":"সরলরেখার ঢাল $= \\frac{y_2 - y_1}{x_2 - x_1}$"},{"sym":"$\\Delta$","meaning":"ত্রিভুজের ক্ষেত্রফল"}],"example":{"problem":"প্রমাণ কর যে, $A(1, 1)$, $B(4, 5)$ এবং $C(0, 8)$ বিন্দু তিনটি $B$ বিন্দুতে একটি সমকোণী ত্রিভুজ গঠন করে।","steps":["$AB$ রেখার ঢাল: $m_{AB} = \\frac{5 - 1}{4 - 1} = \\frac{4}{3}$।","$BC$ রেখার ঢাল: $m_{BC} = \\frac{8 - 5}{0 - 4} = -\\frac{3}{4}$।","ঢালদ্বয়ের গুণফল: $m_{AB} \\cdot m_{BC} = \\frac{4}{3} \\times \\left(-\\frac{3}{4}\\right) = -1$।","সুতরাং $AB \\perp BC$, অর্থাৎ $\\triangle ABC$-এর $\\angle B = 90^\\circ$ (প্রমাণিত)।"],"answer":"প্রমাণিত ($m_{AB} \\cdot m_{BC} = -1 \\implies \\angle B = 90^\\circ$)"},"tip":"সমকোণী ত্রিভুজ প্রমাণে পিথাগোরাসের বদলে ঢালের গুণফল $m_1 m_2 = -1$ ব্যব }]},{"id":"app_written_q17","cardId":"app_written_c1","qType":"conceptual","conceptGroup":"proof_strategy_trig_coord","q":"সমতলের তিনটি ভিন্ন বিন্দু $A, B, C$ সমরেখ হওয়ার প্রয়োজনীয় ও পর্যাপ্ত শর্ত কোনটি?","opts":["$\\triangle ABC$-এর ক্ষেত্রফল $0$","$m_{AB} \\cdot m_{BC} = -1$","$AB = BC$","$m_{AB} + m_{BC} = 0$"],"ans":0,"tags":["board-standard","written-convert"],"exp":"তিনটি বিন্দু একই সরলরেখায় থাকলে তাদের দ্বারা গঠিত ত্রিভুজের ক্ষেত্রফল শূন্য ($\\Delta = 0$) হয়। $m_{AB} \\cdot m_{BC} = -1$ লম্ব হওয়ার শর্ত।","variants":[]},{"id":"app_written_q18","cardId":"app_written_c1","qType":"conceptual","conceptGroup":"proof_strategy_trig_coord","q":"২ নম্বরের লিখিত পরীক্ষায় $\\tan 70^\\circ = \\tan 20^\\circ + 2\\tan 50^\\circ$ প্রমাণের সবচেয়ে পরিচ্ছন্ন প্রথম ধাপ কোনটি?","opts":["প্রতিটি ট্যানজেন্টের দশমিক মান বসানো","$\\tan 70^\\circ = \\tan(50^\\circ + 20^\\circ)$ লিখে যোগফল সূত্র প্রয়োগ করা","অভেদটি সত্য ধরে উভয় পক্ষের অন্তরীকরণ করা","সবগুলোকে $\\csc$ ও $\\sec$-এ রূপান্তর করা"],"ans":1,"tags":["written-convert","no-calc-shortcut"],"exp":"$70^\\circ = 50^\\circ + 20^\\circ$ ধরে ট্যানজেন্ট যোগফল সূত্র বসালে এবং $\\tan 70^\\circ\\tan 20^\\circ = 1$ ব্যবহার করলে ৩ লাইনেই প্রমাণ শেষ হয়।","variants":[]},{"id":"app_written_q19","cardId":"app_written_c1","qType":"conceptual","conceptGroup":"proof_strategy_trig_coord","q":"অউল্লম্ব দুটি সরলরেখার ঢাল $m_1$ ও $m_2$ হলে তারা পরস্পর লম্ব হওয়ার শর্ত কোনটি?","opts":["$m_1 = m_2$","$m_1 + m_2 = 0$","$m_1 m_2 = -1$","$m_1 m_2 = 1$"],"ans":2,"tags":["board-standard","formula-trap"],"exp":"পরস্পর লম্ব দুটি অউল্লম্ব রেখার ঢালের গুণফল $-1$, অর্থাৎ $m_1 m_2 = -1$। $m_1 = m_2$ হলো সমান্তরাল হওয়ার শর্ত।","variants":[]},{"id":"app_written_q20","cardId":"app_written_c2","qType":"conceptual","conceptGroup":"calculus_vector_matrix_rules","q":"লিখিত পরীক্ষায় $\\int_a^b f(g(x))g'(x)\\,dx$ যোগজে $u = g(x)$ প্রতিস্থাপন করলে সীমার ক্ষেত্রে কী করতে হবে?","opts":["শেষ পর্যন্ত সীমা বাদ দিয়ে রাখা","$u$-যোগজে পুরোনো $a$ ও $b$ রেখে দেওয়া","উভ Type":"conceptual","conceptGroup":"conic_exam_traps","q":"$\\frac{x^2}{16} + \\frac{y^2}{25} = 1$ উপবৃত্তটির বৃহৎ অক্ষ কোন অক্ষ বরাবর অবস্থিত?","opts":["$x$-অক্ষ","$y = x$ রেখা","কোনো অক্ষ নয়","$y$-অক্ষ"],"ans":3,"tags":["graph-visual","formula-trap"],"exp":"$y^2$-এর নিচের হর ($25 > 16$) বড় হওয়ায় বৃহৎ অক্ষ $y$-অক্ষ বরাবর অবস্থিত। সবসময় $x$-অক্ষ ভাবা পরীক্ষার সাধারণ ফাঁদ।","variants":[]},{"id":"app_written_q25","cardId":"app_written_c4","qType":"conceptual","conceptGroup":"conic_exam_traps","q":"যেকোনো পরাবৃত্ত, উপবৃত্ত ও অধিবৃত্তের ক্ষেত্রে নিচের কোন রাশিটি সর্বদাই ধনাত্মক?","opts":["উপকেন্দ্রিক লম্বের দৈর্ঘ্য","উপকেন্দ্রের ভুজ","শীর্ষবিন্দুর কোটি","$y^2 = 4ax$ সমীকরণের ধ্রুবক $a$"],"ans":0,"tags":["formula-trap","written-convert"],"exp":"উপকেন্দ্রিক লম্ব একটি জ্যামিতিক জ্যা-এর দৈর্ঘ্য ($|4a|$ বা $\\frac{2b^2}{a}$) হওয়ায় তা সর্বদাই ধনাত্মক, কিন্তু $a$ বা স্থানাঙ্ক ঋণাত্মক হতে পারে।","variants":[]}],"writtenDrills":[{"id":"app_written_w1","cardId":"app_written_c1","marks":2,"q":"[ত্রিকোণমিতি] প্রমাণ কর যে, $\\tan 70^\\circ = \\tan 20^\\circ + 2\\tan 50^\\circ$।","steps":["আমরা জানি, $70^\\circ = 50^\\circ + 20^\\circ$। উভয় পক্ষে $\\tan$ নিয়ে: $\\tan 70^\\circ = \\tan(50^\\circ + 20^\\circ) = \\frac{\\tan 50^\\circ + \\tan 20^\\circ}{1 - \\tan 50^\\circ\\tan 20^\\circ}$।","আরগুণন করে: $\\tan 70^\\circ - \\tan 70^\\circ\\tan 50^\\circ\\tan 20^\\circ = \\tan 50^\\circ + \\tan 20^\\circ$।","যেহেতু $70^\\circ + 20^\\circ = 90^\\circ$, তাই $\\tan 70^\\circ = \\cot 20^\\circ = \\frac{1}{\\tan 20^\\circ}$, অর্থাৎ $\\tan 70^\\circ\\tan 20^\\circ = 1$।","মান বসিয়ে পাই: $\\tan 70^\\circ - \\tan 50^\\circ = \\tan 50^\\circ + \\tan 20^\\circ \\implies \\tan 70^\\circ = \\tan 20^\\circ + 2\\tan 50^\\circ$ (প্রমাণিত)।"],"finalAnswer":"$\\tan 70^\\circ = \\tan 20^\\circ + 2\\tan 50^\\circ$ (প্রমাণিত)","markingTip":"তৃতীয় ধাপে বন্ধনীর ভেতরে $\\tan 70^\\circ\\tan 20^\\circ = \\cot 20^\\circ\\tan 20^\\circ = 1$ স্পষ্টভাবে উল্লেখ করলে পূর্ণ ২ নম্বর নিশ্চিত।"},{"id":"app_written_w2","cardId":"app_written_c1","marks":2,"q":"[স্থানাঙ্ক জ্যামিতি] দেখাও যে, $A(1, 2)$, $B(4, 6)$ এবং $C(-4, 12)$ বিন্দু তিনটি $B$ বিন্দুতে সমকোণী ত্রিভুজ গঠন করে এবং ত্রিভুজটির ক্ষেত্রফল নির্ণয় কর।","steps":["$AB$ রেখার ঢাল: $m_{AB} = \\frac{6 - 2}{4 - 1} = \\frac{4}{3}$।","$BC$ রেখার ঢাল: $m_{BC} = \\frac{12 - 6}{-4 - 4} = \\frac{6}{-8} = -\\frac{3}{4}$।","ঢালদ্বয়ের গুণফল: $m_{AB}\\cdot m_{BC} = \\frac{4}{3}\\left(-\\frac{3}{4}\\right) = -1 \\implies AB \\perp BC$, অর্থাৎ $\\angle B = 90^\\circ$।","বাহুর দৈর্ঘ্য: $AB = \\sqrt{3^2 + 4^2} = 5$ এবং $BC = \\sqrt{(-8)^2 + 6^2} = 10$; সুতরাং ক্ষেত্রফল $= \\frac{1}{2}(5)(10) = 25$ বর্গ একক।"],"finalAnswer":"$B$ বিন্দুতে সমকোণী; ক্ষেত্রফল $= 25$ বর্গ একক","markingTip":"$m_1 m_2 = -1$ দিয়ে ৩ লাইনে লম্ব প্রমাণ করো (১ নম্বর) এবং $\\frac{1}{2}\\cdot AB \\cdot BC$ দিয়ে ক্ষেত্রফল বের করলে নির্ণায়ক ছাড়া দ্রুত পূর্ণ ২ নম্বর পাবে।"},{"id":"app_written_w3","cardId":"app_written_c2","marks":2,"q":"[ক্যালকুলাস] নির্দিষ্ট যোগজটির মান নির্ণয় কর: $\\int_0^{\\pi/2} \\frac{\\sin x}{\\sin x + \\cos x}\\,dx$।","steps":["ধরি, $I = \\int_0^{\\pi/2} \\frac{\\sin x}{\\sin x + \\cos x}\\,dx \\quad \\dots (1)$।","নির্দিষ্ট যোগজের ধর্ম $\\int_0^a f(x)\\,dx = \\int_0^a f(a - x)\\,dx$ প্রয়োগ করে: $I = \\int_0^{\\pi/2} \\frac{\\sin(\\frac{\\pi}{2} - x)}{\\sin(\\frac{\\pi}{2} - x) + \\cos(\\frac{\\pi}{2} - x)}\\,dx = \\int_0^{\\pi/2} \\frac{\\cos x}{\\cos x + \\sin x}\\,dx \\quad \\dots (2)$।","$(1)$ ও $(2)$ যোগ করে পাই: $2I = \\int_0^{\\pi/2} \\frac{\\sin x + \\cos x}{\\sin x + \\cos x}\\,dx = \\int_0^{\\pi/2} 1\\,dx = [x]_0^{\\pi/2} = \\frac{\\pi}{2}$।","উভয় পক্ষকে $2$ দিয়ে ভাগ করে: $I = \\frac{\\pi}{4}$।"],"finalAnswer":"$\\frac{\\pi}{4}$","markingTip":"সমীকরণ $(1)$ ও $(2)$ চিহ্নিত করে এবং ধর্মটি উল্লেখ করে $2I$ দেখাতে হবে; লিখিত পরীক্ষায় সরাসরি '$\\frac{\\pi}{4}$' লিখলে ০ নম্বর দেওয়া হয়।"},{"id":"app_written_w4","cardId":"app_written_c3","marks":2,"q":"[ভেক্টর ও ম্যাট্রিক্স] $A = \\begin{pmatrix} 3 & 2 \\\\ 5 & 4 \\end{pmatrix}$ ম্যাট্রিক্সের বিপরীত ম্যাট্রিক্স $A^{-1}$ নির্ণয় কর এবং এর সাহায্যে $A\\begin{pmatrix} x \\\\ y \\end{pmatrix} = \\begin{pmatrix} 1 \\\\ 3 \\end{pmatrix}$ সমাধান কর।","steps":["নির্ণায়ক: $|A| = (3)(4) - (2)(5) = 12 - 10 = 2 \\neq 0$, সুতরাং $A^{-1}$ বিদ্যমান।","বিপরীত ম্যাট্রিক্স: $A^{-1} = \\frac{1}{2}\\begin{pmatrix} 4 & -2 \\\\ -5 & 3 \\end{pmatrix}$।","সমাধান $X = A^{-1}B$: $\\begin{pmatrix} x \\\\ y \\end{pmatrix} = \\frac{1}{2}\\begin{pmatrix} 4 & -2 \\\\ -5 & 3 \\end{pmatrix}\\begin{pmatrix} 1 \\\\ 3 \\end{pmatrix} = \\frac{1}{2}\\begin{pmatrix} 4 - 6 \\\\ -5 + 9 \\end{pmatrix} = \\frac{1}{2}\\begin{pmatrix} -2 \\\\ 4 \\end{pmatrix} = \\begin{pmatrix} -1 \\\\ 2 \\end{pmatrix}$।","যাচাই: $3(-1) + 2(2) = 1$ (সঠিক)।"],"finalAnswer":"$A^{-1} = \\frac{1}{2}\\begin{pmatrix} 4 & -2 \\\\ -5 & 3 \\end{pmatrix}$; $x = -1,\\; y = 2$","markingTip":"$\\text{adj}(A)\\cdot B$ গুণ করার সময় $\\frac{1}{2}$ বাইরে রাখো—এতে ভগ্নাংশের ভুল এড়ানো যায় এবং শেষে নিঃশেষে ভাগ হয়।"},{"id":"app_written_w5","cardId":"app_written_c4","marks":2,"q":"[কণিক] $y^2 - 4y - 8x + 20 = 0$ পরাবৃত্তটিকে প্রমিত আকারে প্রকাশ কর এবং এর শীর্ষবিন্দু, উপকেন্দ্র ও উপকেন্দ্রিক লম্বের দৈর্ঘ্য নির্ণয় কর।","steps":["$y$-যুক্ত পদগুলো পূর্ণবর্গ করে: $y^2 - 4y + 4 = 8x - 20 + 4 \\implies (y - 2)^2 = 8x - 16 = 8(x - 2)$।","$(y - k)^2 = 4a(x - h)$-এর সাথে তুলনা করে: $h = 2,\\; k = 2$ এবং $4a = 8 \\implies a = 2$।","শীর্ষবিন্দু: $(h, k) = (2, 2)$; উপকেন্দ্র: $(h + a, k) = (2 + 2, 2) = (4, 2)$।","উপকেন্দ্রিক লম্বের দৈর্ঘ্য: $LR = |4a| = 8$।"],"finalAnswer":"প্রমিত আকার: $(y - 2)^2 = 8(x - 2)$; শীর্ষবিন্দু: $(2, 2)$; উপকেন্দ্র: $(4, 2)$; $LR = 8$","markingTip":"প্রমিত আকার ও $a = 2$ স্পষ্টভাবে দেখাও (১ নম্বর), তারপর শীর্ষবিন্দু, উপকেন্দ্র ও $LR$ আলাদা লাইনে লিখলে বাকি ১ নম্বর নিশ্চিত।"}]}]}],"lessonConfusions":{"alg_matrices":["|kA| কেন k|A| না হয়ে k^n |A| হয়, আর একটি সারিকে k দিয়ে গুণ করার সাথে এর পার্থক্য কী?","বিপ্রতিসম ম্যাট্রিক্সের নির্ণায়ক কখন শূন্য হয় আর কখন অশূন্য হয়, এবং ব্যতিক্রমী ম্যাট্রিক্স দ্রুত চে  $1+\\cos 2A=2\\cos^2 A$, $\\sin 3A=3\\sin A-4\\sin^3 A$, $\\cos 3A=4\\cos^3 A-3\\cos A$","shortcut":"$\\frac{1-\\cos 2\\theta}{\\sin 2\\theta}=\\tan\\theta$; $\\frac{1-\\cos 2\\theta}{1+\\cos 2\\theta}=\\tan^2\\theta$।"},{"topic":"ত্রিভুজের সূত্রাবলি","formula":"$\\frac{a}{\\sin A}=\\frac{b}{\\sin B}=\\frac{c}{\\sin C}=2R$; $\\cos C=\\frac{a^2+b^2-c^2}{2ab}$; $\\Delta=\\frac{1}{2}ab\\sin C$","shortcut":"বাহু $(3,5,7)$ হলে $C=120^\\circ$; $a^2+b^2<c^2$ হলে $C$ স্থূলকোণ।"},{"topic":"মুখ্যমান শাখা","formula":"$\\sin^{-1},\\tan^{-1}\\in[-\\frac{\\pi}{2},\\frac{\\pi}{2}]$ ($\\tan^{-1}$-এ খোলা); $\\cos^{-1},\\cot^{-1}\\in[0,\\pi]$ ($\\cot^{-1}$-এ খোলা)","shortcut":"ঋণাত্মক ইনপুটে: $\\cos^{-1}(-x)=\\pi-\\cos^{-1}x$; $\\sin^{-1}(-x)=-\\sin^{-1}x$।"},{"topic":"বিপরীত বৃত্তীয় অভেদ","formula":"$\\sin^{-1}x+\\cos^{-1}x=\\frac{\\pi}{2}$; $\\tan^{-1}x+\\tan^{-1}y=\\tan^{-1}\\frac{x+y}{1-xy}$ ($xy<1$), আর $x,y>0,xy>1$ হলে $+\\pi$","shortcut":"জনপ্রিয় জোড়া: $\\tan^{-1}\\frac{1}{2}+\\tan^{-1}\\frac{1}{3}=\\frac{\\pi}{4}$; $\\tan^{-1}2+\\tan^{-1}3=\\frac{3\\pi}{4}$।"},{"topic":"সাধারণ সমাধান","formula":"$\\sin\\theta=\\sin\\alpha \\Rightarrow n\\pi+(-1)^n\\alpha$; $\\cos\\theta=\\cos\\alpha \\Rightarrow 2n\\pi\\pm\\alpha$; $\\tan\\theta=\\tan\\alpha \\Rightarrow n\\pi+\\alpha$","shortcut":"সকল বর্গ আকারে ($\\sin^2/\\cos^2/\\tan^2$) একক উত্তর $\\theta = n\\pi \\pm \\alpha$।"},{"topic":"রৈখিক সমীকরণ $a\\cos\\theta+b\\sin\\theta=c$","formula":"$R=\\sqrt{a^2+b^2}$ দিয়ে ভাগ; বাস্তব সমাধানের শর্ত $|c| \\le \\sqrt{a^2+b^2}$","shortcut":"সর্বোচ্চ $+\\sqrt{a^2+b^2}$, সর্বনিম্ন $-\\sqrt{a^2+b^2}$; কখনো $\\sin\\theta$ বা $\\cos\\theta$ দিয়ে ভাগ কোরো না।"}]},{"moduleId":"mod_calc","title":"ক্যালকুলাস সূত্র-ভাণ্ডার","rows":[{"topic":"আদর্শ সীমা ($x\\to 0$)","formula":"$\\frac{\\sin ax}{bx}\\to\\frac{a}{b},\\; \\frac{1-\\cos ax}{x^2}\\to\\frac{a^2}{2},\\; \\frac{e^{ax}-1}{x}\\to a,\\; \\frac{\\ln(1+ax)}{x}\\to a$","note":"কোণ রেডিয়ানে হতে হবে; $0/0$ আকারে প্রযোজ্য।"},{"topic":"অয়লারের $1^\ // Flat indexes
let LESSON_MAP = {};
let MCQ_MAP = {};
let CARD_MAP = {};
let MODULE_MAP = {};

function rebuildIndex() {
  LESSON_MAP = {};
  MCQ_MAP = {};
  CARD_MAP = {};
  MODULE_MAP = {};
  for (const mod of CURRICULUM.modules) {
    MODULE_MAP[mod.id] = mod;
    for (const l of mod.lessons) {
      LESSON_MAP[l.id] = l;
      for (const c of (l.cards || [])) CARD_MAP[c.id] = { ...c, lessonId: l.id };
      for (const q of (l.mcqs || [])) MCQ_MAP[q.id] = { ...q, lessonId: l.id, moduleId: mod.id };
    }
  }
  for (const cl of (state.customLessons || [])) {
    LESSON_MAP[cl.id] = cl;
    for (const c of (cl.cards || [])) CARD_MAP[c.id] = { ...c, lessonId: cl.id };
    for (const q of (cl.mcqs || [])) MCQ_MAP[q.id] = { ...q, lessonId: cl.id, moduleId: cl.moduleId || "mod_alg" };
  }
}

function loadLocalState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return { ...DEFAULT_STATE };
    return { ...DEFAULT_STATE, ...JSON.parse(raw) };
  } catch (e) {
    return { ...DEFAULT_STATE };
  }
}

function loadSyncProfile() {
  try { return localStorage.getItem(PROFILE_KEY) || ""; } catch (e) { return ""; }
}

function saveState(pushCloud = true) {
  state.updatedAt = Date.now();
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
  updateHeader();
  if (pushCloud && syncProfile) {
    clearTimeout(syncDebounce);
    syncStatus = "syncing";
    updateSyncPill();
    syncDebounce = setTimeout(pushToCloud, 1000);
  }
}

function normalizePhone(input) {
  const bn = "০১২৩৪৫৬৭৮৯";
  let s = String(input || "").replace(/[০-৯]/g, ch => String(bn.indexOf(ch)));
  s = s.replace(/\D/g, "");
  if (s.startsWith("01") && s.length === 11) s = "88" + s;
  else if (s.startsWith("1") && s.length === 10) s = "880" + s;
  return s.length >= 10 ? "phone_" + s : "";
}

async function pullFromCloud() {
  if (!syncProfile) return;
  syncStatus = "syncing";
  updateSyncPill();
  try {
    const r = await fetch(`${WORKER_URL}/sync/${encodeURIComponent(syncProfile)}`);
    const d = await r.json();
    if (d.ok && d.found && d.state && (d.updatedAt || 0) > (state.updatedAt || 0)) {
      state = { ...DEFAULT_STATE, ...d.state, updatedAt: d.updatedAt };
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
      rebuildIndex();
      applyTheme();
      renderAll();
      showToast("ক্লাউড থেকে সর্বশেষ প্রগ্রেস লোড হয়েছে");
    } else if (d.ok && (!d.found || (state.updatedAt || 0) > (d.updatedAt || 0))) {
      await pushToCloud();
    }
    syncStatus = "synced";
  } catch (e) {
    syncStatus = "offline";
  }
  updateSyncPill();
}

async function pushToCloud() {
  if (!syncProfile) return;
  try {
    const r = await fetch(`${WORKER_URL}/sync/${encodeURIComponent(syncProfile)}`, {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ state, updatedAt: state.updatedAt })
    });
    const d = await r.json();
    syncStatus = d.ok ? "synced" : "offline";
  } catch (e) {
    syncStatus = "offline";
  }
  updateSyncPill();
}

function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.remove("hidden");
  clearTimeout(window._toastT);
  window._toastT = setTimeout(() => t.classList.add("hidden"), 2800);
}

function escHtml(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

function renderMath(el) {
  if (!el || typeof renderMathInElement !== "function") return;
  try {
    renderMathInElement(el, {
      delimiters: [
        { left: "$$", right: "$$", display: true },
        { left: "$", right: "$", display: false },
        { left: "\\(", right: "\\)", display: false },
        { left: "\\[", right: "\\]", display: true }
      ],
      throwOnError: false,
      strict: false
    });
  } catch (e) {}
}

function renderLatexDisplay(latex) {
  if (typeof katex !== "undefined") {
    try {
      return katex.renderToString(latex, { displayMode: true, throwOnError: false, strict: false });
    } catch (e) {}
  }
  return `$$${escHtml(latex)}$$`;
}

function applyTheme() {

function updateSyncPill() {
  const btn = document.getElementById("btnSyncPill");
  if (!syncProfile) {
    btn.textContent = "নম্বর যোগ করুন";
  } else if (syncStatus === "syncing") {

function isLessonUnlocked(modIdx, lessonIdx, lesson) {
  if (!state.strictMode || state.unlockAll) return true;
  if (lessonIdx === 0) return true;
  const prev = CURRICULUM.modules[modIdx].lessons[lessonIdx - 1];
  return Boolean(state.completedLessons[prev.id]?.passed);
}

}

/* ==================== STRICT MODE LESSON & BOSS PLAYER ==================== */
let session = null;
let slideGateTimer = null;
let cooldownTimer = null;
let bossQuestionTimer = null;

function clearPlayerTimers() {
  clearInterval(slideGateTimer);
  clearInterval(cooldownTimer);
  clearInterval(bossQuestionTimer);
}

function shuffleArr(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function makeShuffledOptionOrder(mcq) {
  const idx = [0, 1, 2, 3];
  const order = shuffleArr(idx);
  return {
    opts: order.map(i => mcq.opts[i]),
    ans: order.indexOf(mcq.ans)
  };
}

function startLessonSession(lessonId, mode = "full") {
  const lesson = LESSON_MAP[lessonId];
  if (!lesson) return;
  if (state.strictMode && state.hearts <= 0) {
    showToast("হার্ট শেষ! ভুল ব্যাংক / SRS ড্রিল থেকে হার্ট অর্জন করো।");
    activeTab = "review";
    renderAll();
    return;
  }

  const queue = [];
  if (mode === "full") {
    for (const c of (lesson.cards || [])) {
      queue.push({ type: "card", card: c, isRedirect: false });
    }
  }
  for (const q of (lesson.mcqs || [])) {
    queue.push({
      type: "mcq",
      baseId: q.id,
      mcq: q,
      display: makeShuffledOptionOrder(q),
      streakMiss: 0,
      isRetry: false,
      retryBadge: ""
    });
  }

  session = {
    kind: "lesson",
    lessonId,
    title: lesson.title,
    mode,
    queue,
    idx: 0,
    firstAttemptCorrect: 0,
    firstAttemptTotal: (lesson.mcqs || []).length,
    seenBaseIds: new Set(),
    missedBaseIds: new Set(),
    answered: false,
    selectedOpt: null,
    slideGateLeft: 0,
    understoodChecked: false,
    cooldownLeft: 0
  };
  openPlayer();
}

function startBossQuiz(moduleId) {
  if (state.strictMode && state.hearts <= 0) {
    showToast("হার্ট শেষ! আগে SRS রিভিশন ড্রিল থেকে হার্ট অর্জন করো।");
    activeTab = "review";
    renderAll();
    return;
  }
  const mod = MODULE_MAP[moduleId];
  if (!mod) return;
  const pool = [];
  for (const l of mod.lessons) {
    for (const q of l.mcqs) pool.push(q);
  }
  const picked = shuffleArr(pool).slice(0, 12);
  const queue = picked.map(q => ({
    type: "mcq",
    baseId: q.id,
    mcq: q,
    display: makeShuffledOptionOrder(q),
    streakMiss: 0,
    isRetry: false,
    retryBadge: ""
  }));

  session = {
    kind: "boss",
    moduleId,
    title: `⚔️ বস কুইজ — ${mod.title}`,
    queue,
    idx: 0,
    firstAttemptCorrect: 0,
    firstAttemptTotal: picked.length,
    seenBaseIds: new Set(),
    missedBaseIds: new Set(),
    answered: false,
    selectedOpt: null,
    bossTimeLeft: 45,
    cooldownLeft: 0
  };
  openPlayer();
}

function startCustomMcqSession(title, mcqIds, kind = "review") {
  const qs = mcqIds.map(id => MCQ_MAP[id]).filter(Boolean);
  if (!qs.length) {
    showToast("অনুশীলনের জন্য কোনো প্রশ্ন পাওয়া যায়নি");
    return;
  }
  const queue = shuffleArr(qs).map(q => ({
    type: "mcq",
    baseId: q.id,
    mcq: q,
    display: makeShuffledOptionOrder(q),
    streakMiss: 0,
    isRetry: false,
    retryBadge: ""
  }));
  session = {
    kind, // review | srs | bookmarks
    title,
    queue,
    idx: 0,
    firstAttemptCorrect: 0,
    firstAttemptTotal: qs.length,
    seenBaseIds: new Set(),
    missedBaseIds: new Set(),
    answered: false,
    selectedOpt: null,
    cooldownLeft: 0
  };
  openPlayer();
}

function openPlayer() {
  const ov = document.getElementById("playerOverlay");
  ov.classList.remove("hidden");
  ov.classList.add("flex");
  renderPlayerStep();
}

function closePlayer() {
  clearPlayerTimers();
  session = null;
  const ov = document.getElementById("playerOverlay");
  ov.classList.add("hidden");
  ov.classList.remove("flex");
  renderAll();
}

function renderPlayerStep() {
  clearPlayerTimers();
  if (!session) return;
  if (session.idx >= session.queue.length) {
    renderSessionSummary();
    return;
  }

  const step = session.queue[session.idx];
  document.getElementById("playerTitle").textContent = session.title;
  document.getElementById("playerStepCount").textContent = `${session.idx + 1} / ${session.queue.length}`;
  document.getElementById("playerProgressBar").style.width = `${Math.round((session.idx / session.queue.length) * 100)}%`;
  document.getElementById("playerHearts").textContent = state.hearts;

  const bossBadge = document.getElementById("bossTimerBadge");
  if (session.kind === "boss" && step.type === "mcq") {
    bossBadge.classList.remove("hidden");
    session.bossTimeLeft = 45;
    bossBadge.textContent = "45s";
    bossQuestionTimer = setInterval(() => {
      session.bossTimeLeft--;
      bossBadge.textContent = `${Math.max(0, session.bossTimeLeft)}s`;
      if (session.bossTimeLeft <= 0) {
        clearInterval(bossQuestionTimer);
        if (!session.answered) submitMcqAnswer(-1, true);
      }
    }, 1000);
  } else {
    bossBadge.classList.add("hidden");
  }

  if (step.type === "card") renderCardStep(step);
  else if (step.type === "myth") renderMythStep(step);
  else renderMcqStep(step);
}

function submitMcqAnswer(chosenIdx, timedOut) {
  clearInterval(bossQuestionTimer);
  const step = session.queue[session.idx];
  session.answered = true;
  session.selectedOpt = chosenIdx;

  const correctIdx = step.display.ans;
  const isCorrect = !timedOut && chosenIdx === correctIdx;

  // First attempt tracking for mastery pass threshold
  if (!step.isRetry && !session.seenBaseIds.has(step.baseId)) {
    session.seenBaseIds.add(step.baseId);
    if (isCorrect) session.firstAttemptCorrect++;
    else session.missedBaseIds.add(step.baseId);
  }

  // Highlight options
  document.querySelectorAll(".opt-btn").forEach((b, i) => {
    b.disabled = true;
    if (i === correctIdx) {
      b.classList.add("bg-emerald-500/20", "border-emerald-500", "text-emerald-200");
    } else if (i === chosenIdx && !isCorrect) {
      b.classList.add("bg-rose-500/20", "border-rose-500", "text-rose-200");
    } else {
      b.classList.add("opacity-50");
    }
  });

  const fb = document.getElementById("mcqFeedback");
  fb.classList.remove("hidden");
  let strictNote = "";

  if (isCorrect) {
    state.xp += 10;
    if (session.kind === "review" || session.kind === "srs") {
      // Remove from mistakes if mastered in review
      const mi = state.mistakes.indexOf(step.baseId);
      if (mi >= 0) state.mistakes.splice(mi, 1);
      // Earn back hearts: +1 heart per 2 correct answers
      if (state.hearts < state.maxHearts) {
        state.srsCorrectStreak = (state.srsCorrectStreak || 0) + 1;
        if (state.srsCorrectStreak >= 2) {
          state.srsCorrectStreak = 0;
          state.hearts = Math.min(state.maxHearts, state.hearts + 1);
          strictNote = "❤️ দারুণ! ২টি সঠিক উত্তরে +১ হার্ট ফিরে পেয়েছ!";
        } else {
          strictNote = "❤️ আরও ১টি সঠিক উত্তর দিলে +১ হার্ট পাবে!";
        }
      }
    }
    fb.className = "p-4 rounded-xl text-sm space-y-1.5 bg-emerald-500/15 border border-emerald-500/40 text-emerald-100";
    fb.innerHTML = `<div class="font-bold text-emerald-400">✅ সঠিক উত্তর! (+10 XP)</div><div>${escHtml(step.mcq.exp)}</div>${strictNote ? `<div class="text-xs font-bold text-amber-300 pt-1">${strictNote}</div>` : ''}`;
  } else {
    if (!state.mistakes.includes(step.baseId)) state.mistakes.push(step.baseId);
    if (state.strictMode && session.kind !== "srs") {
      state.hearts = Math.max(0, state.hearts - 1);
    }

    // === STRICT LEARNING MODE ADAPTIVE REMEDIATION ===
    if (state.strictMode && (session.kind === "lesson" || session.kind === "boss")) {
      const nextMissCount = (step.streakMiss || 0) + 1;
      const baseMcq = MCQ_MAP[step.baseId] || step.mcq;
      const linkedCard = CARD_MAP[baseMcq.cardId];

      if (baseMcq.qType === "numerical") {
        const variants = baseMcq.variants || [];
        if (nextMissCount === 1 && variants[0]) {
          // 1st miss -> immediate fresh-value Variant 1
          const v1 = { ...baseMcq, q: variants[0].q, opts: variants[0].opts, ans: variants[0].ans, exp: variants[0].exp };
          session.queue.splice(session.idx + 1, 0, {
            type: "mcq",
            baseId: step.baseId,
            mcq: v1,
            display: makeShuffledOptionOrder(v1),
            streakMiss: 1,
            isRetry: true,
            retryBadge: "🔄 নতুন মান দিয়ে যাচাই (১ম রিট্রাই)"
          });
          strictNote = "🔄 স্ট্রিক্ট মোড: পরের ধাপেই একই সূত্রের নতুন মান দিয়ে আবার যাচাই হবে!";
        } else if (nextMissCount >= 2 && linkedCard) {
          // 2nd consecutive miss -> redirect to Learn Slide, then immediately test Variant 2
          const v2Src = variants[1] || variants[0] || baseMcq;
          const v2 = { ...baseMcq, q: v2Src.q, opts: v2Src.opts, ans: v2Src.ans, exp: v2Src.exp };
          session.queue.splice(session.idx + 1, 0,
            { type: "card", card: linkedCard, isRedirect: true },
            {
              type: "mcq",
              baseId: step.baseId,
              mcq: v2,
              display: makeShuffledOptionOrder(v2),
              streakMiss: 2,
              isRetry: true,
              retryBadge: "🎯 স্লাইড রিভিশনের পর নতুন মান যাচাই"
            }
          );
          strictNote = "🔁 টানা ২য় ভুল: আগে সংশ্লিষ্ট থিওরি কার্ডটি রিভিশন করো, তারপর নতুন মান দিয়ে যাচাই হবে!";
        }
      } else {
        // Conceptual MCQ -> Delayed Different-Angle Remediation
        const lessonObj = LESSON_MAP[baseMcq.lessonId];
        const siblings = (lessonObj?.mcqs || []).filter(m =>
          m.id !== step.mcq.id && m.qType === "conceptual" && m.conceptGroup === baseMcq.conceptGroup
        );
        if (nextMissCount === 1) {
          const sib = siblings[0] || baseMcq;
          const insertPos = Math.min(session.queue.length, session.idx + 3); // 2 steps later
          session.queue.splice(insertPos, 0, {
            type: "mcq",
            baseId: step.baseId,
            mcq: sib,
            display: makeShuffledOptionOrder(sib),
            streakMiss: 1,
            isRetry: true,
            retryBadge: "🧠 ভিন্ন কোণে কনসেপ্ট যাচাই (বিলম্বিত)"
          });
          strictNote = "🧠 স্ট্রিক্ট মোড: এই কনসেপ্টটি ২ ধাপ পর ভিন্ন কোণ থেকে আবার যাচাই করা হবে!";
        } else if (nextMissCount >= 2 && linkedCard) {
          const followStep = linkedCard.mythBuster
            ? { type: "myth", myth: linkedCard.mythBuster }
            : {
                type: "mcq",
                baseId: step.baseId,
                mcq: siblings[1] || siblings[0] || baseMcq,
                display: makeShuffledOptionOrder(siblings[1] || siblings[0] || baseMcq),
                streakMiss: 2,
                isRetry: true,
                retryBadge: "🎯 স্লাইড রিভিশনের পর কনসেপ্ট যাচাই"
              };
          session.queue.splice(session.idx + 1, 0,
            { type: "card", card: linkedCard, isRedirect: true },
            followStep
          );
          strictNote = "🔁 টানা ২য় ভুল: সংশ্লিষ্ট থিওরি কার্ডে মূল ধারণা ও ফাঁদ হাইলাইট করে দেখানো হচ্ছে!";
        }
      }
    }

    fb.className = "p-4 rounded-xl text-sm space-y-1.5 bg-rose-500/15 border border-rose-500/40 text-rose-100";
    fb.innerHTML = `<div class="font-bold text-rose-400">${timedOut ? '⏰ সময় শেষ!' : '❌ ভুল উত্তর!'}</div><div>${escHtml(step.mcq.exp)}</div>${strictNote ? `<div class="text-xs font-bold text-amber-300 pt-1">${strictNote}</div>` : ''}`;
  }

  saveState();
  document.getElementById("playerHearts").textContent = state.hearts;
  renderMath(fb);

  const btn = document.getElementById("btnMcqNext");
  const needCooldown = state.strictMode && !isCorrect;
  if (needCooldown) {
    session.cooldownLeft = 3;
    btn.disabled = true;
    btn.textContent = `ব্যাখ্যা পড়ো (${session.cooldownLeft} সে.)`;
    btn.className = "ml-auto px-5 py-2.5 rounded-xl font-bold text-sm bg-slate-700 text-slate-400 cursor-not-allowed";
    cooldownTimer = setInterval(() => {
      session.cooldownLeft--;
      if (session.cooldownLeft <= 0) {
        clearInterval(cooldownTimer);
        enableNextMcqBtn();
      } else {
        btn.textContent = `ব্যাখ্যা পড়ো (${session.cooldownLeft} সে.)`;
      }
    }, 1000);
  } else {
    enableNextMcqBtn();
  }

  function enableNextMcqBtn() {
    btn.disabled = false;
    btn.textContent = (state.strictMode && state.hearts <= 0 && session.kind !== "srs") ? "হার্ট শেষ — রিভিশনে যাও →" : "পরবর্তী →";
    btn.className = "ml-auto px-5 py-2.5 rounded-xl font-bold text-sm bg-emerald-600 hover:bg-emerald-500 text-white";
    btn.onclick = () => {
      if (state.strictMode && state.hearts <= 0 && session.kind !== "srs") {
        closePlayer();
        activeTab = "review";
        renderAll();
        showToast("হার্ট শূন্য! SRS রিভিশন ড্রিল থেকে হার্ট অর্জন করো।");
        return;
      }
      session.idx++;
      renderPlayerStep();
    };
  }
}

function renderSessionSummary() {
  clearPlayerTimers();
  document.getElementById("playerProgressBar").style.width = "100%";
  const acc = session.firstAttemptTotal ? Math.round((session.firstAttemptCorrect / session.firstAttemptTotal) * 100) : 100;
  const threshold = session.kind === "boss" ? 80 : 75;
  const passed = acc >= threshold;

  if (session.kind === "lesson") {
    const prev = state.completedLessons[session.lessonId] || { bestAcc: 0, passed: false, attempts: 0 };
    state.completedLessons[session.lessonId] = {
      bestAcc: Math.max(prev.bestAcc, acc),
      passed: prev.passed || passed,
      attempts: prev.attempts + 1
    };
    if (passed) state.xp += 50;
  } else if (session.kind === "boss") {
    const prev = state.bossPassed[session.moduleId] || { bestAcc: 0, passed: false };
    state.bossPassed[session.moduleId] = {
      bestAcc: Math.max(prev.bestAcc, acc),
      passed: prev.passed || passed
    };
    if (passed) state.xp += 100;
  }
  saveState();

  if (passed && typeof confetti === "function") {
    try { confetti({ particleCount: 70, spread: 65, origin: { y: 0.6 } }); } catch (e) {}
  }

  const confusions = (session.lessonId && CURRICULUM.lessonConfusions[session.lessonId])

    || [];
  const missedCount = session.missedBaseIds.size;

  body.innerHTML = `

            <div class="text-xl font-extrabold ${passed ? 'text-emerald-400' : 'text-amber-400'}">${acc}%</div>
          </div>
          <div class="glass-2 rounded-xl p-3">
            <div class="text-xs text-slate-400">পাস মার্ক</div>
            <div class="text-xl font-extrabold text-sky-400">≥${threshold}%</div>
          </div>
          <div class="glass-2 rounded-xl p-3">
            <div class="text-xs text-slate-400">ভুল প্রশ্ন</div>
            <div class="text-xl font-extrabold text-rose-400">${missedCount}</div>
          </div>
        </div>
        ${!passed && state.strictMode ? `<p class="text-xs text-amber-300 pt-1">স্ট্রিক্ট মোডে পরের অধ্যায় আনলক করতে প্রথম চেষ্টায় অন্তত ${threshold}% পেতে হবে।</p>` : ''}
      </div>

      ${(confusions.length || missedCount > 0) ? `
        <div class="glass rounded-2xl p-5 space-y-3 border-indigo-500/30">
          <div class="text-sm font-bold text-indigo-300 flex items-center gap-2">✨ সম্ভাব্য কনফিউশন ও AI রেমিডিয়েশন</div>
          ${missedCount > 0 ? `
            <button id="btnAiRemediateMissed" class="w-full py-2.5 px-3 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold text-left flex items-center justify-between">
              <span>🎯 এই সেশনে ভুল হওয়া ${missedCount}টি প্রশ্ন থেকে AI রেমিডিয়েশন লেসন বানাও</span>
              <span>→</span>
            </button>
          ` : ''}
          <div class="space-y-2">
            ${confusions.map(cf => `
              <button data-conf="${escHtml(cf)}" class="conf-gen-btn w-full py-2.5 px-3 rounded-xl glass-2 hover:border-indigo-400 text-xs text-left flex items-center justify-between gap-2">

  document.getElementById("playerFooter").innerHTML = `
    <div class="max-w-xl mx-auto flex items-center gap-2">
      <button id="btnSummaryClose" class="flex-1 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-sm">শেখার পথে ফিরে যাও</button>
    </div>
  `;

  if (remBtn) remBtn.addEventListener("click", () => {

function startMockExam() {
  const count = Number(document.getElementById("mockCount").value);
  const mins = Number(document.getElementById("mockMinutes").value);
  const neg = Number(document.getElementById("mockNeg").value);
  const mods = Array.from(document.querySelectorAll(".mock-mod-chk:checked")).map(c => c.value);
  if (!mods.length) { showToast("অন্তত ১টি মডিউল নির্বাচন করো"); return; }

  const pool = [];
  for (const mid of mods) {
    for (const l of (MODULE_MAP[mid]?.lessons || [])) {
      for (const q of l.mcqs) pool.push(q);
    }
  }
  const picked = shuffleArr(pool).slice(0, count).map(q => ({ mcq: q, display: makeShuffledOptionOrder(q) }));
  mockState = { questions: picked, answers: {}, curIdx: 0, neg, hasTimer: mins > 0, timeLeft: mins * 60, submitted: false };

  clearInterval(mockTimerInt);
  if (mins > 0) {
    mockTimerInt = setInterval(() => {
      if (!mockState || mockState.submitted) { clearInterval(mockTimerInt); return; }
      mockState.timeLeft--;
      const clk = document.getElementById("mockClock");
      if (clk) clk.textContent = `${String(Math.floor(mockState.timeLeft/60)).padStart(2,'0')}:${String(mockState.timeLeft%60).padStart(2,'0')}`;
      if (mockState.timeLeft <= 0) finishMockExam();
    }, 1000);
  }
  renderMockTab();
}

function finishMockExam() {
  clearInterval(mockTimerInt);
  if (!mockState) return;
  mockState.submitted = true;
  mockState.questions.forEach((item, i) => {
    const picked = mockState.answers[i];
    if (picked != null && picked !== item.display.ans) {
      if (!state.mistakes.includes(item.mcq.id)) state.mistakes.push(item.mcq.id);
    }
  });
  saveState();
  renderMockTab();
}

  let correct = 0, wrong = 0, skipped = 0;

    const picked = mockState.answers[i];
    if (picked == null) skipped++;
    else if (picked === item.display.ans) correct++;
    else wrong++;
  });
  const score = (correct - wrong * mockState.neg).toFixed(2);
  main.innerHTML = `

              ${picked != null && !ok ? `<div class="text-xs text-rose-400">তোমার উত্তর: ${escHtml(item.display.opts[picked])}</div>` : ''}

/* ==================== AI TUTOR & CONFUSION LESSON GENERATOR ==================== */
async function generateAiConfusionLesson(confusionText, moduleHint, sampleMistakes) {
  if (aiBusy) return;
  aiBusy = true;
  activeTab = "chat";
  state.chatHistory.push({ role: "user", content: `🎯 কনফিউশন লেসন বানাও: ${confusionText}` });
  renderAll();
  showToast("AI কনফিউশন লেসন তৈরি হচ্ছে (৩০–৬০ সে. লাগতে পারে)...");
  try {
    const r = await fetch(`${WORKER_URL}/ai/generate-lesson`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ confusion: confusionText, moduleHint, sampleMistakes })
    });
    const d = await r.json();
    if (!d.ok || !d.lesson) throw new Error(d.error || "লেসন তৈরি ব্যর্থ হয়েছে");
    const cl = normalizeCustomLesson(d.lesson, moduleHint);
    state.customLessons.unshift(cl);
    rebuildIndex();
    state.chatHistory.push({
      role: "assistant",
      content: `তোমার জন্য **${cl.title}** লেসনটি তৈরি হয়ে গেছে (${cl.cards.length}টি কার্ড ও ${cl.mcqs.length}টি MCQ)। নিচে ক্লিক করে এখনই শুরু করো!`,
      lessonId: cl.id,
      suggestedPrompts: cl.nextSuggestions || []
    });
    saveState();
  } catch (e) {
    state.chatHistory.push({ role: "assistant", content: `দুঃখিত, এই মুহূর্তে AI লেসন তৈরি করা যায়নি (${e.message})। একটু পর আবার চেষ্টা করো।` });
    saveState();
  }
  aiBusy = false;
  renderAll();
}

function normalizeCustomLesson(raw, fallbackMod) {
  const id = "ai_" + Date.now();
  const cards = (raw.cards || []).map((c, i) => ({
    ...c,
    id: `${id}_c${i+1}`,
    formulas: (c.formulas || []).map(f => ({ ...f, latex: String(f.latex || "").replace(/^\$\$?|\$\$?$/g, "").trim() }))
  }));
  const firstCardId = cards[0]?.id || `${id}_c1`;
  const mcqs = (raw.mcqs || []).map((q, i) => ({
    ...q,
    id: `${id}_q${i+1}`,
    cardId: cards.some(c => c.id === q.cardId) ? q.cardId : firstCardId,
    qType: q.qType === "conceptual" ? "conceptual" : "numerical",
    conceptGroup: q.conceptGroup || `ai_group_${i}`,
    variants: Array.isArray(q.variants) ? q.variants : []
  }));
  return {
    id,
    moduleId: raw.moduleId || fallbackMod || "mod_alg",
    paperRef: "AI কনফিউশন লেসন",
    tier: 1,
    estMinutes: 10,
    title: raw.title || "AI রেমিডিয়েশন লেসন",
    subtitle: raw.subtitle || "",
    cards,
    mcqs,
    writtenDrills: [],
    nextSuggestions: raw.nextSuggestions || []
  };
}

async function sendChatMessage(text) {
  if (aiBusy) return;
  aiBusy = true;
  state.chatHistory.push({ role: "user", content: text });
  saveState();
  renderChatTab();
  try {
    const r = await fetch(`${WORKER_URL}/ai/chat`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        messages: state.chatHistory.slice(-8).map(m => ({ role: m.role, content: m.content })),
        forceLesson: aiForceLesson,
        context: {
          xp: state.xp,
          completedCount: Object.values(state.completedLessons).filter(x => x.passed).length,
          recentMistakes: state.mistakes.slice(-5).map(id => MCQ_MAP[id]?.q).filter(Boolean)
        }
      })
    });
    const d = await r.json();
    if (!d.ok) throw new Error(d.error || "AI উত্তর দিতে পারেনি");
    let lessonId = null;
    if (d.lesson && Array.isArray(d.lesson.mcqs) && d.lesson.mcqs.length) {
      const cl = normalizeCustomLesson(d.lesson, d.lesson.moduleId || "mod_alg");
      state.customLessons.unshift(cl);
      rebuildIndex();
      lessonId = cl.id;
    }
    state.chatHistory.push({ role: "assistant", content: d.reply || "সম্পন্ন!", lessonId, suggestedPrompts: d.suggestedPrompts || [] });
    saveState();
  } catch (e) {
    state.chatHistory.push({ role: "assistant", content: `ত্রুটি: ${e.message}` });
    saveState();
  }
  aiBusy = false;
  renderChatTab();
}

  saveState();
  renderAll();
  showToast(state.strictMode ? "🔒 স্ট্রিক্ট লার্নিং মোড চালু হয়েছে" : "🔓 ফ্রি প্র্যাকটিস মোড চালু হয়েছে");
});

document.getElementById("btnHeartsPill").addEventListener("click", () => {
  activeTab = "review";
  renderAll();
});

document.getElementById("btnTheme").addEventListener("click", () => {
  state.darkMode = !state.darkMode;
  applyTheme();
  saveState();
});

document.getElementById("btnClosePlayer").addEventListener("click", closePlayer);

function openSyncModal() {
  const m = document.getElementById("syncModal");
  m.classList.remove("hidden");
  m.classList.add("flex");
}
function closeSyncModal() {
  const m = document.getElementById("syncModal");
  m.classList.add("hidden");
  m.classList.remove("flex");
}
document.getElementById("btnSyncPill").addEventListener("click", openSyncModal);
document.getElementById("btnCloseSyncModal").addEventListener("click", closeSyncModal);
document.getElementById("btnSkipSyncPhone").addEventListener("click", () => {
  try { localStorage.setItem("du_c_math_sync_skipped", "1"); } catch (e) {}
  closeSyncModal();
});
document.getElementById("btnSaveSyncPhone").addEventListener("click", () => {
  const raw = document.getElementById("syncPhoneInput").value;
  const norm = normalizePhone(raw);
  const msg = document.getElementById("syncModalMsg");
  if (!norm) {
    msg.textContent = "সঠিক ১১ ডিজিটের মোবাইল নম্বর দাও (যেমন: 017XXXXXXXX)";
    msg.className = "text-xs text-rose-400 mb-3";
    return;
  }
  syncProfile = norm;
  try { localStorage.setItem(PROFILE_KEY, syncProfile); } catch (e) {}
  closeSyncModal();
  pullFromCloud();
  showToast("ফোন নম্বর সিঙ্ক যুক্ত হয়েছে!");
});

// Keyboard shortcuts in Player (respecting Strict Mode locks!)
document.addEventListener("keydown", e => {
  if (!session) return;
  const step = session.queue[session.idx];
  if (!step) return;
  if (step.type === "mcq" && !session.answered && ["1","2","3","4"].includes(e.key)) {
    submitMcqAnswer(Number(e.key) - 1, false);
  } else if (e.key === "Enter") {
    const nextBtn = document.getElementById("btnMcqNext") || document.getElementById("btnNextStep") || document.getElementById("btnMythNext");
    if (nextBtn && !nextBtn.disabled) nextBtn.click();
  }
});

window.addEventListener("online", () => { if (syncProfile) pullFromCloud(); });

window.addEventListener("DOMContentLoaded", () => {
  rebuildIndex();
  applyTheme();
  renderAll();
  if (syncProfile) {
    pullFromCloud();
  } else {
    let skipped = false;
    try { skipped = localStorage.getItem("du_c_math_sync_skipped") === "1"; } catch (e) {}
    if (!skipped) setTimeout(openSyncModal, 600);
  }
});
</script>
</body>
</html>
