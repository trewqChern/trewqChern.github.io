eptual","conceptGroup":"circle_pair_relations","q":"$r_1, r_2$ ব্যাসার্ধ ও $d$ কেন্দ্র-দূরত্ববিশিষ্ট দুটি বৃত্ত পরস্পরকে লম্বভাবে ছেদ করলে কোন জ্যামিতিক সম্পর্কটি সত্য?","opts":["$d = r_1 + r_2$","$d = |r_1 - r_2|$","$d^2 = r_1^2 + r_2^2$","$r_1 = r_2$"],"ans":2,"tags":["graph-visual","pyq-pattern"],"exp":"লম্বচ্ছেদের ক্ষেত্রে ছেদবিন্দুতে ব্যাসার্ধদ্বয় $90^\\circ$ কোণ তৈরি করে, ফলে কেন্দ্রদ্বয়ের সংযোগকারী রেখা $d$ হয় অতিভুজ এবং $d^2 = r_1^2 + r_2^2$।","variants":[]},{"id":"geo_circles_q24","cardId":"geo_circles_c4","qType":"conceptual","conceptGroup":"circle_pair_relations","q":"অসমকেন্দ্রিক দুটি বৃত্তের মূল অক্ষ $S_1 - S_2 = 0$ তাদের কেন্দ্রদ্বয়ের সংযোগকারী সরলরেখার সাথে কীভাবে অবস্থান করে?","opts":["কেন্দ্রদ্বয়ের সংযোগরেখার সমান্তরাল","কেন্দ্রদ্বয়ের সংযোগরেখার সাথে $45^\\circ$ কোণে আনত","সর্বদা কেন্দ্রদ্বয়ের মধ্যবিন্দুগামী","কেন্দ্রদ্বয়ের সংযোগরেখার ওপর লম্ব"],"ans":3,"tags":["board-standard","graph-visual"],"exp":"মূল অক্ষ $2(g_1-g_2)x + 2(f_1-f_2)y + (c_1-c_2) = 0$-এর অভিলম্ব ভেক্টর কেন্দ্রদ্বয়ের সংযোগরেখার সমান্তরাল, তাই এটি সর্বদা কেন্দ্র-সংযোগরেখার ওপর লম্ব।","variants":[]},{"id":"geo_circles_q25","cardId":"geo_circles_c4","qType":"conceptual","conceptGroup":"circle_pair_relations","q":"দুটি বৃত্ত পরস্পরকে বহিঃস্পর্শ করলে তাদের মোট কয়টি সাধারণ স্পর্শক আঁকা সম্ভব?","opts":["$3$","$2$","$4$","$1$"],"ans":0,"tags":["pyq-pattern","graph-visual"],"exp":"বহিঃস্পর্শী দুটি বৃত্তের $2$টি সরল সাধারণ স্পর্শক এবং স্পর্শবিন্দুতে $1$টি তির্যক সাধারণ স্পর্শক—মোট $3$টি সাধারণ স্পর্শক থাকে।","variants":[]}],"writtenDrills":[{"id":"geo_circles_w1","cardId":"geo_circles_c2","marks":2,"q":"যে বৃত্তটি $x$-অক্ষকে $(3, 0)$ বিন্দুতে স্পর্শ করে এবং $(1, 2)$ বিন্দু দিয়ে যায়, তার সমীকরণ নির্ণয় করো।","steps":["বৃত্তটি $x$-অক্ষকে $(3,0)$ বিন্দুতে স্পর্শ করায় এর কেন্দ্র $(3, r)$ এবং ব্যাসার্ধ $r$ (এখানে $(1,2)$ বিন্দুর কোটি ধনাত্মক হওয়ায় $r > 0$)।","বৃত্তের সমীকরণ: $(x - 3)^2 + (y - r)^2 = r^2$।","$(1, 2)$ বিন্দু বসিয়ে পাই: $(1 - 3)^2 + (2 - r)^2 = r^2 \\implies 4 + 4 - 4r + r^2 = r^2 \\implies 4r = 8 \\implies r = 2$।","সুতরাং সমীকরণ: $(x - 3)^2 + (y - 2)^2 = 4 \\implies x^2 + y^2 - 6x - 4y + 9 = 0$।"],"finalAnswer":"$x^2 + y^2 - 6x - 4y + 9 = 0$","markingTip":"কেন্দ্র $(3, r)$ চিহ্নিত করতে ১ নম্বর এবং $r=2$ বের করে বিস্তৃত সমীকরণ লেখার জন্য ১ নম্বর।"},{"id":"geo_circles_w2","cardId":"geo_circles_c3","marks":2,"q":"$x^2 + y^2 - 4x + 6y - 12 = 0$ বৃত্তের $(5, 1)$ বিন্দুতে স্পর্শক ও অভিলম্বের সমীকরণ নির্ণয় করো।","steps":["যাচাই: $5^2 + 1^2 - 4(5) + 6(1) - 12 = 0$, তাই $(5,1)$ বৃত্তের পরিধির ওপর অবস্থিত।","স্পর্শক ($T=0$): $5x + y - 2(x+5) + 3(y+1) - 12 = 0 \\implies 3x + 4y - 19 = 0$।","বৃত্তের কেন্দ্র $(2, -3)$। অভিলম্বটি $(2,-3)$ ও $(5,1)$-গামী হওয়ায় ঢাল $m = \\frac{1-(-3)}{5-2} = \\frac{4}{3}$।","অভিলম্বের সমীকরণ: $y - 1 = \\frac{4}{3}(x - 5) \\implies 4x - 3y - 17 = 0$।"],"finalAnswer":"স্পর্শক: $3x + 4y - 19 = 0$; অভিলম্ব: $4x - 3y - 17 = 0$","markingTip":"$T=0$ ব্যবহার করে স্পর্শকের জন্য ১ নম্বর এবং কেন্দ্রগামী রেখা হিসেবে অভিলম্ব নির্ণয়ের জন্য ১ নম্বর।"},{"id":"geo_circles_w3","cardId":"geo_circles_c4","marks":2,"q":"দেখাও যে $x^2 + y^2 - 6x + 4y + 4 = 0$ এবং $x^2 + y^2 + 2x - 4y - 18 = 0$ বৃত্তদ্বয় পরস্পরকে লম্বভাবে ছেদ করে, এবং তাদের সাধারণ জ্যা-এর সমীকরণ নির্ণয় করো।","steps":["সহগ তুলনা করে পাই: $g_1 = -3, f_1 = 2, c_1 = 4$ এবং $g_2 = 1, f_2 = -2, c_2 = -18$।","বামপক্ষ $= 2g_1g_2 + 2f_1f_2 = 2(-3)(1) + 2(2)(-2) = -6 - 8 = -14$; ডানপক্ষ $= c_1 + c_2 = 4 - 18 = -14$। সমান হওয়ায় বৃত্তদ্বয় লম্বচ্ছেদী।","সাধারণ জ্যা ($S_1 - S_2 = 0$): $(-6-2)x + (4+4)y + (4+18) = 0 \\implies -8x + 8y + 22 = 0 \\implies 4x - 4y - 11 = 0$।"],"finalAnswer":"লম্বচ্ছেদী ($-14 = -14$); সাধারণ জ্যা: $4x - 4y - 11 = 0$","markingTip":"লম্বচ্ছেদের শর্তের উভয় পক্ষ $-14$ দেখানোর জন্য ১ নম্বর এবং সরলীকৃত সাধারণ জ্যা-এর জন্য ১ নম্বর।"}]},{"id":"geo_parabola","moduleId":"mod_geo","title":"কনিক ১: সাধারণ কনিক শনাক্তকরণ ও পরাবৃত্ত","subtitle":"উৎকেন্দ্রিকতা ও নিশ্চায়ক দ্বারা কনিক নির্ণয়, আদর্শ ও স্থানান্তরিত পরাবৃত্ত এবং স্পর্শকের শর্ত","paperRef":"২য় পত্র অধ্যায় ৬(ক)","tier":1,"estMinutes":18,"cards":[{"id":"geo_parabola_c1","badge":"কনিক শনাক্তকরণ","title":"সাধারণ দ্বিঘাত সমীকরণ থেকে কনিক শনাক্তকরণ","intuition":"কোনো চলমান বিন্দু $P$ থেকে স্থির বিন্দু (উপকেন্দ্র $S$) এবং স্থির সরলরেখার (নিয়ামক রেখা $M$) লম্ব দূরত্বের অনুপাত ধ্রুবক $e$ (উৎকেন্দ্রিকতা) হলে সেই সঞ্চারপথকে কনিক বলে: $SP = e \\cdot PM$। ঢাকা বিশ্ববিদ্যালয়ের এমসিকিউতে ছবি না এঁকেই কেবল $h^2 - ab$-এর চিহ্ন দেখে ৫ সেকেন্ডে কনিক চেনা যায়।","formulas":[{"label":"উৎকেন্দ্রিকতা দ্বারা শ্রেণিবিভাগ","latex":"e = \\frac{SP}{PM}: \\; e=0,\\; 0<e<1,\\; e=1,\\; e>1","whenToUse":"$e=0$ বৃত্ত, $0<e<1$ উপবৃত্ত, $e=1$ পরাবৃত্ত এবং $e>1$ অধিবৃত্ত নির্দেশ করে।"},{"label":"সাধারণ দ্বিঘাত সমীকরণ ও নিশ্চায়ক","latex":"ax^2 + 2hxy + by^2 + 2gx + 2fy + c = 0; \\quad \\Delta = abc + 2fgh - af^2 - bg^2 - ch^2","whenToUse":"$\\Delta = 0$ হলে সমীকরণটি একজোড়া সরলরেখা (অপজাত কনিক) নির্দেশ করে।"},{"label":"অপজাত নয় এমন কনিকের শর্ত ($\\Delta \\neq 0$)","latex":"h^2 - ab < 0 \\; (\\text{E}); \\quad h^2 - ab = 0 \\; (\\text{P}); \\quad h^2 - ab > 0 \\; (\\text{H})","whenToUse":"$<0$ উপবৃত্ত, $=0$ পরাবৃত্ত এবং $>0$ অধিবৃত্ত। মনে রাখবে, $h$ হলো $xy$-এর সহগের অর্ধেক।"},{"label":"বিশেষ ক্ষেত্র: বৃত্ত ও আয়তাকার অধিবৃত্ত","latex":"a = b \\neq 0,\\; h = 0; \\quad h^2 - ab > 0,\\; a + b = 0","whenToUse":"প্রথমটি বৃত্ত এবং দ্বিতীয়টি আয়তাকার অধিবৃত্ত শনাক্ত করতে।"}],"symbols":[{"sym":"$e$","meaning":"উৎকেন্দ্রিকতা, সর্বদা অঋণাত্মক ($e \\ge 0$)"},{"sym":"$h$","meaning":"$ax^2+2hxy+by^2+\\dots=0$ সমীকরণে $xy$-এর সহগের অর্ধেক"},{"sym":"$\\Delta$","meaning":"কনিকের $3\\times 3$ প্রতিসম নির্ণায়কের মান"}],"example":{"problem":"$4x^2 - 12xy + 9y^2 + 6x - 8y + 1 = 0$ ($\\Delta \\neq 0$) সমীকরণটি কোন ধরনের কনিক নির্দেশ করে?","steps":["সহগ তুলনা করে পাই: $a = 4$, $2h = -12 \\implies h = -6$, এবং $b = 9$।","$h^2 - ab = (-6)^2 - (4)(9) = 36 - 36 = 0$।","যেহেতু $h^2 - ab = 0$ এবং $\\Delta \\neq 0$, তাই এটি একটি পরাবৃত্ত।"],"answer":"পরাবৃত্ত।"},"tip":"সর্বদা $xy$-এর সহগকে অর্ধেক করে $h$ নেবে! লক্ষ করো $4x^2-12xy+9y^2 = (2x-3y)^2$ একটি পূর্ণবর্গ—দ্বিঘাত অংশ পূর্ণবর্গ হলেই $h^2-ab=0$ (পরাবৃত্ত) হয়।","check":{"q":"$3x^2 + 4xy - 3y^2 + 5x - 2 = 0$ ($\\Delta \\neq 0$) কোন ধরনের কনিক?","a":"$a=3, b=-3, h=2 \\implies h^2-ab = 4 - (-9) = 13 > 0$ এবং $a+b = 0$, তাই এটি একটি আয়তাকার অধিবৃত্ত।"},"mythBuster":{"statement":"$h^2 - ab = 0$ হলেই সমীকরণটি সর্বদা একটি পরাবৃত্ত নির্দেশ করে।","isTrue":false,"why":"শুধুমাত্র $\\Delta \\neq 0$ হলেই পরাবৃত্ত হয়। যদি একইসাথে $\\Delta = 0$ হয়, তবে এটি একজোড়া সমান্তরাল (বা অভিন্ন) সরলরেখা নির্দেশ করে।"}},{"id":"geo_parabola_c2","badge":"আদর্শ পরাবৃত্ত","title":"আদর্শ পরাবৃত্ত ($y^2 = 4ax$ ও $x^2 = 4ay$)","intuition":"পরাবৃত্তের সমীকরণে একটি চলক বর্গ (দ্বিঘাত) এবং অন্যটি একঘাত থাকে। একঘাত চলকটিই বলে দেয় পরাবৃত্তটি কোন অক্ষ বরাবর খোলা! এখানে $a$ হলো শীর্ষবিন্দু থেকে উপকেন্দ্রের দিকনির্দেশিত দূরত্ব, আর উপকেন্দ্রিক লম্বের দৈর্ঘ্য সর্বদা $|4a|$।","formulas":[{"label":"অনুভূমিক পরাবৃত্ত ($x$-অক্ষ বরাবর)","latex":"y^2 = 4ax \\implies V(0,0),\\; S(a,0),\\; x = -a","whenToUse":"অক্ষরেখা $y=0$; $a>0$ হলে ডানদিকে এবং $a<0$ হলে বামদিকে খোলা।"},{"label":"উল্লম্ব পরাবৃত্ত ($y$-অক্ষ বরাবর)","latex":"x^2 = 4ay \\implies V(0,0),\\; S(0,a),\\; y = -a","whenToUse":"অক্ষরেখা $x=0$; $a>0$ হলে ওপরে এবং $a<0$ হলে নিচে খোলা।"},{"label":"উপকেন্দ্রিক লম্ব","latex":"\\text{LR} = |4a|; \\quad (a, \\pm 2a)","whenToUse":"উপকেন্দ্রগামী ও অক্ষের ওপর লম্ব জ্যা; দৈর্ঘ্য সর্বদা ধনাত্মক $|4a|$।"}],"symbols":[{"sym":"$a$","meaning":"শীর্ষবিন্দু থেকে উপকেন্দ্রের দিকনির্দেশিত দূরত্ব (ধনাত্মক বা ঋণাত্মক হতে পারে)"},{"sym":"$|4a|$","meaning":"উপকেন্দ্রিক লম্বের দৈর্ঘ্য"}],"example":{"problem":"$3x^2 = -24y$ পরাবৃত্তের উপকেন্দ্র, নিয়ামক রেখা এবং উপকেন্দ্রিক লম্বের দৈর্ঘ্য নির্ণয় করো।","steps":["বর্গপদের সহগ $1$ করো: $x^2 = -8y$।","$x^2 = 4ay$-এর সাথে তুলনা করে পাই $4a = -8 \\implies a = -2$।","উপকেন্দ্র $= (0, a) = (0, -2)$ এবং নিয়ামক রেখা $y = -a \\implies y = 2$।","উপকেন্দ্রিক লম্বের দৈর্ঘ্য $= |4a| = |-8| = 8$ একক।"],"answer":"উপকেন্দ্র $(0, -2)$, নিয়ামক রেখা $y = 2$, উপকেন্দ্রিক লম্ব $= 8$ একক।"},"tip":"কখনোই $x^2$ বা $y^2$-এর সামনে সহগ রেখে $4a$ ধরবে না! যেমন $3x^2 = 16y$ হলে আগে $3$ দিয়ে ভাগ করে $x^2 = \\frac{16}{3}y$ করো, তারপর $|4a| = \\frac{16}{3}$ নাও।","check":{"q":"$y^2 = -12x$ পরাবৃত্তের উপকেন্দ্রিক লম্বের দৈর্ঘ্য কত?","a":"$|4a| = |-12| = 12$ একক (দৈর্ঘ্য কখনো ঋণাত্মক হয় না)।"},"mythBuster":{"statement":"$y^2 = -12x$ পরাবৃত্তের উপকেন্দ্রিক লম্বের দৈর্ঘ্য $-12$।","isTrue":false,"why":"দৈর্ঘ্য সর্বদা অঋণাত্মক: $|4a| = 12$। ঋণাত্মক চিহ্নটি কেবল বোঝায় যে পরাবৃত্তটি ঋণাত্মক $x$-অক্ষের দিকে খোলা।"}},{"id":"geo_parabola_c3","badge":"স্থানান্তরিত পরাবৃত্ত","title":"স্থানান্তরিত পরাবৃত্ত ও পূর্ণবর্গ গঠন","intuition":"ভর্তি পরীক্ষার বেশিরভাগ পরাবৃত্তের প্রশ্ন $y^2 - 4y - 8x + 12 = 0$-এর মতো বিস্তৃত আকারে থাকে। দ্বিঘাত চলকটিকে পূর্ণবর্গ করে শীর্ষবিন্দু $(\\alpha, \\beta)$ বের করো—তারপর আদর্শ পরাবৃত্তের প্রতিটি স্থানাঙ্কের সাথে $x$-এ $+\\alpha$ এবং $y$-এ $+\\beta$ যোগ করলেই সব উপাদান মিলে যাবে।","formulas":[{"label":"স্থানান্তরিত অনুভূমিক পরাবৃত্ত","latex":"(y - \\beta)^2 = 4a(x - \\alpha) \\implies V(\\alpha,\\beta),\\; S(\\alpha+a,\\beta),\\; x = \\alpha - a","whenToUse":"অক্ষরেখা $y = \\beta$ এবং উপকেন্দ্রিক লম্বের দৈর্ঘ্য অপরিবর্তিত $|4a|$।"},{"label":"স্থানান্তরিত উল্লম্ব পরাবৃত্ত","latex":"(x - \\alpha)^2 = 4a(y - \\beta) \\implies V(\\alpha,\\beta),\\; S(\\alpha,\\beta+a),\\; y = \\beta - a","whenToUse":"অক্ষরেখা $x = \\alpha$ এবং উপকেন্দ্রিক লম্বের দৈর্ঘ্য $|4a|$।"},{"label":"শীর্ষবিন্দু ও লম্বের দ্রুত শর্টকাট","latex":"y = Ax^2 + Bx + C \\implies \\alpha = -\\frac{B}{2A},\\; \\beta = y(\\alpha),\\; \\text{LR} = \\frac{1}{|A|}","whenToUse":"$y = Ax^2+Bx+C$ আকারের উল্লম্ব পরাবৃত্তে ২০ সেকেন্ড সময় বাঁচাতে!"}],"symbols":[{"sym":"$(\\alpha, \\beta)$","meaning":"স্থানান্তরিত পরাবৃত্তের শীর্ষবিন্দুর স্থানাঙ্ক"},{"sym":"$y = \\beta$ বা $x = \\alpha$","meaning":"পরাবৃত্তের অক্ষরেখার সমীকরণ"}],"example":{"problem":"$y^2 - 4y - 8x + 12 = 0$ পরাবৃত্তের শীর্ষবিন্দু, উপকেন্দ্র এবং নিয়ামক রেখা নির্ণয় করো।","steps":["$y$-এর পদ বামপক্ষে রেখে বাকি সব ডানপক্ষে নাও: $y^2 - 4y = 8x - 12$।","উভয় পক্ষে $(-4/2)^2 = 4$ যোগ করে পূর্ণবর্গ করো: $(y - 2)^2 = 8x - 8 = 8(x - 1)$।","এখানে $\\alpha = 1, \\beta = 2$ এবং $4a = 8 \\implies a = 2$।","শীর্ষবিন্দু $(1, 2)$; উপকেন্দ্র $(1+2, 2) = (3, 2)$; নিয়ামক রেখা $x = 1 - 2 = -1$।"],"answer":"শীর্ষবিন্দু $(1, 2)$, উপকেন্দ্র $(3, 2)$, নিয়ামক রেখা $x = -1$।"},"tip":"যাচাইয়ের উপায়: শীর্ষবিন্দু $(\\alpha, \\beta)$ সর্বদা উপকেন্দ্র এবং অক্ষের ওপর নিয়ামক রেখার পাদবিন্দুর ঠিক মধ্যবিন্দু হয়!","check":{"q":"$y = 2x^2 - 8x + 5$ পরাবৃত্তের উপকেন্দ্রিক লম্বের দৈর্ঘ্য ৫ সেকেন্ডে কত?","a":"এখানে $A = 2$, তাই $|4a| = 1/|A| = 1/2$ একক।"},"mythBuster":{"statement":"$(y - 3)^2 = 12(x + 2)$ পরাবৃত্তের শীর্ষবিন্দু $(3, -2)$।","isTrue":false,"why":"$x$-এর সাথে $\\alpha$ এবং $y$-এর সাথে $\\beta$ মেলাতে হবে: $x+2=0 \\implies \\alpha=-2$ এবং $y-3=0 \\implies \\beta=3$, তাই শীর্ষবিন্দু $(-2, 3)$।"}},{"id":"geo_parabola_c4","badge":"উপকেন্দ্রিক দূরত্ব ও স্পর্শক","title":"উপকেন্দ্রিক দূরত্ব, পরামিতিক রূপ ও স্পর্শক","intuition":"পরাবৃত্তের প্রতিটি বিন্দুতে $SP = PM$ হওয়ায় উপকেন্দ্রিক দূরত্ব বের করতে কখনোই দূরত্ব সূত্র লাগে না—শুধু নিয়ামক রেখা থেকে লম্ব দূরত্ব নিলেই হয়! আর স্পর্শক হওয়ার শর্ত $c = a/m$ হলো উচ্চতর গণিত ২য় পত্রের অধ্যায় ৬(ক)-এর সবচেয়ে বেশি আসা সূত্র।","formulas":[{"label":"উপকেন্দ্রিক দূরত্ব","latex":"y^2 = 4ax \\implies SP = |x_1 + a|; \\quad x^2 = 4ay \\implies SP = |y_1 + a|","whenToUse":"পরাবৃত্তস্থ কোনো বিন্দু $(x_1, y_1)$ থেকে উপকেন্দ্রের দূরত্ব নির্ণয়ে।"},{"label":"পরামিতিক স্থানাঙ্ক","latex":"(x, y) = (at^2, 2at)","whenToUse":"$y^2 = 4ax$ পরাবৃত্তের ওপর যেকোনো বিন্দুকে এক চলক $t$-এ প্রকাশ করতে।"},{"label":"স্পর্শক হওয়ার শর্ত ($y = mx + c$)","latex":"c = \\frac{a}{m} \\; (m \\neq 0), \\quad P\\left(\\frac{a}{m^2}, \\frac{2a}{m}\\right)","whenToUse":"$y = mx + c$ রেখাটি $y^2 = 4ax$-এর স্পর্শক হওয়ার শর্ত ও স্পর্শবিন্দু নির্ণয়ে।"},{"label":"পরাবৃত্তস্থ $(x_1, y_1)$ বিন্দুতে স্পর্শক","latex":"yy_1 = 2a(x + x_1)","whenToUse":"$y^2 = 4ax$ পরাবৃত্তের ওপরস্থ বিন্দুতে সরাসরি স্পর্শকের সমীকরণ বের করতে।"}],"symbols":[{"sym":"$SP$","meaning":"পরাবৃত্তস্থ $P(x_1, y_1)$ বিন্দুর উপকেন্দ্রিক দূরত্ব"},{"sym":"$m$","meaning":"$y = mx + c$ স্পর্শকের ঢাল"}],"example":{"problem":"$k$-এর কোন মানের জন্য $y = 2x + k$ রেখাটি $y^2 = 16x$ পরাবৃত্তকে স্পর্শ করবে? স্পর্শবিন্দুও নির্ণয় করো।","steps":["$y^2 = 16x$-এর সাথে $y^2 = 4ax$ তুলনা করে পাই $4a = 16 \\implies a = 4$।","এখানে ঢাল $m = 2$, তাই স্পর্শক হওয়ার শর্তে $k = \\frac{a}{m} = \\frac{4}{2} = 2$।","স্পর্শবিন্দু $= \\left(\\frac{a}{m^2}, \\frac{2a}{m}\\right) = \\left(\\frac{4}{4}, \\frac{8}{2}\\right) = (1, 4)$।"],"answer":"$k = 2$ এবং স্পর্শবিন্দু $(1, 4)$।"},"tip":"২-সেকেন্ডের যাচাই: স্পর্শবিন্দু $(1,4)$ অবশ্যই $y^2=16x$ ($16=16$) এবং $y=2x+2$ ($4=4$) উভয় সমীকরণকেই সিদ্ধ করবে!","check":{"q":"$y^2 = 12x$ পরাবৃত্তের ওপর $(3, 6)$ বিন্দুর উপকেন্দ্রিক দূরত্ব কত?","a":"এখানে $a = 3$ এবং $x_1 = 3$, তাই $SP = x_1 + a = 3 + 3 = 6$ একক।"},"mythBuster":{"statement":"স্পর্শক হওয়ার শর্ত $c = a/m$ সূত্রটি $x^2 = 4ay$ পরাবৃত্তের ক্ষেত্রেও প্রযোজ্য।","isTrue":false,"why":"$x^2 = 4ay$-এ $y=mx+c$ বসালে $x^2 - 4amx - 4ac = 0$ হয়, যার নিশ্চায়ক শূন্য করলে $c = -am^2$ পাওয়া যায়, $a/m$ নয়।"}}],"mcqs":[{"id":"geo_parabola_q1","cardId":"geo_parabola_c1","qType":"numerical","conceptGroup":"conic_discriminant_k","q":"$k$-এর কোন ধনাত্মক মানের জন্য $x^2 + 2kxy + 9y^2 - 4x + 6y + 1 = 0$ ($\\Delta \\neq 0$) একটি পরাবৃত্ত নির্দেশ করবে?","opts":["$3$","$9$","$6$","$\\frac{3}{2}$"],"ans":0,"tags":["pyq-pattern","no-calc-shortcut"],"exp":"এখানে $a=1, b=9, h=k$। পরাবৃত্তের শর্ত $h^2 - ab = 0 \\implies k^2 = 9 \\implies k = 3$ (ধনাত্মক)। $2k$-কে অর্ধেক না করলে ভুল উত্তর $6$ বা $3/2$ আসে।","variants":[{"q":"$k$-এর কোন ধনাত্মক মানের জন্য $4x^2 + kxy + 9y^2 + 2x - 5 = 0$ ($\\Delta \\neq 0$) একটি পরাবৃত্ত নির্দেশ করবে?","opts":["$6$","$12$","$36$","$3$"],"ans":1,"exp":"এখানে $a=4, b=9, h=k/2$। $h^2 = ab$ থেকে $(k/2)^2 = 36 \\implies k/2 = 6 \\implies k = 12$। $k=2h$ ভুলে গেলে $6$ আসে।"},{"q":"$k$-এর কোন মানের জন্য $kx^2 + 8xy + 4y^2 - 3x + 1 = 0$ ($\\Delta \\neq 0$) একটি পরাবৃত্ত হবে?","opts":["$16$","$2$","$4$","$8$"],"ans":2,"exp":"এখানে $a=k, b=4, h=8/2=4$। $h^2 = ab \\implies 16 = 4k \\implies k = 4$। $h=8$ ধরলে ভুল উত্তর $16$ আসে।"}]},{"id":"geo_parabola_q2","cardId":"geo_parabola_c1","qType":"numerical","conceptGroup":"parabola_sp_pm","q":"যে পরাবৃত্তের উপকেন্দ্র $(2, 0)$ এবং নিয়ামক রেখা $x + 2 = 0$, তার সমীকরণ কোনটি?","opts":["$y^2 = 4x$","$y^2 = 8x$","$x^2 = 8y$","$y^2 = -8x$"],"ans":1,"tags":["board-standard","no-calc-shortcut"],"exp":"$(2,0)$ ও $(-2,0)$-এর মধ্যবিন্দু শীর্ষবিন্দু $(0,0)$ এবং $a = 2$, তাই $y^2 = 4(2)x = 8x$। $4ax$-এর বদলে $2ax$ বসালে ভুল উত্তর $y^2=4x$ আসে।","variants":[{"q":"যে পরাবৃত্তের উপকেন্দ্র $(0, -3)$ এবং নিয়ামক রেখা $y = 3$, তার সমীকরণ কোনটি?","opts":["$x^2 = -12y$","$x^2 = 12y$","$y^2 = -12x$","$x^2 = -6y$"],"ans":0,"exp":"শীর্ষবিন্দু $(0,0)$ এবং $y$-অক্ষ বরাবর $a = -3$, তাই $x^2 = 4(-3)y = -12y$। ঋণাত্মক চিহ্ন বাদ দিলে $x^2=12y$ আসে।"},{"q":"কোনো পরাবৃত্তের উপকেন্দ্র $(4, 0)$ এবং নিয়ামক রেখা $x = 0$ হলে এর শীর্ষবিন্দু কোনটি?","opts":["$(0, 0)$","$(4, 0)$","$(-2, 0)$","$(2, 0)$"],"ans":3,"exp":"শীর্ষবিন্দু হলো উপকেন্দ্র $(4,0)$ এবং নিয়ামকের পাদবিন্দু $(0,0)$-এর মধ্যবিন্দু, অর্থাৎ $(2, 0)$।"}]},{"id":"geo_parabola_q3","cardId":"geo_parabola_c2","qType":"numerical","conceptGroup":"parabola_std_focus","q":"$y^2 = -12x$ পরাবৃত্তের উপকেন্দ্রের স্থানাঙ্ক কত?","opts":["$(3, 0)$","$(0, -3)$","$(-3, 0)$","$(-12, 0)$"],"ans":2,"tags":["board-standard","graph-visual"],"exp":"$y^2 = 4ax$-এর সাথে তুলনা করে $4a = -12 \\implies a = -3$, তাই উপকেন্দ্র $(a, 0) = (-3, 0)$। $y$-স্থানাঙ্কে বসালে ভুল উত্তর $(0, -3)$ আসে।","variants":[{"q":"$x^2 = 16y$ পরাবৃত্তের নিয়ামক রেখার সমীকরণ কোনটি?","opts":["$y = 4$","$y = -4$","$x = -4$","$y = -16$"],"ans":1,"exp":"এখানে $4a = 16 \\implies a = 4$। $x^2=4ay$-এর নিয়ামক রেখা $y = -a = -4$; উপকেন্দ্রের সাথে গুলিয়ে ফেললে $y=4$ আসে।"},{"q":"$2x^2 = 12y$ পরাবৃত্তের উপকেন্দ্রের স্থানাঙ্ক কত?","opts":["$(0, \\frac{3}{2})$","$(\\frac{3}{2}, 0)$","$(0, 3)$","$(0, 6)$"],"ans":0,"exp":"$2$ দিয়ে ভাগ করে পাই $x^2 = 6y \\implies 4a = 6 \\implies a = \\frac{3}{2}$। অতএব উপকেন্দ্র $(0, \\frac{3}{2})$; ভাগ না করলে $(0,3)$ আসে।"}]},{"id":"geo_parabola_q4","cardId":"geo_parabola_c2","qType":"numerical","conceptGroup":"parabola_std_lr","q":"$3y^2 = -20x$ পরাবৃত্তের উপকেন্দ্রিক লম্বের দৈর্ঘ্য কত?","opts":["$20$","$-\\frac{20}{3}$","$\\frac{5}{3}$","$\\frac{20}{3}$"],"ans":3,"tags":["pyq-pattern","formula-trap"],"exp":"আগে $3$ দিয়ে ভাগ করো: $y^2 = -\\frac{20}{3}x$। উপকেন্দ্রিক লম্বের দৈর্ঘ্য $= |4a| = \\frac{20}{3}$ (সর্বদা ধনাত্মক)। ঋণাত্মক চিহ্ন রাখলে বা ভাগ না করলে ভুল হয়।","variants":[{"q":"$4x^2 = 28y$ পরাবৃত্তের উপকেন্দ্রিক লম্বের দৈর্ঘ্য কত?","opts":["$7$","$28$","$\\frac{7}{4}$","$14$"],"ans":0,"exp":"$4$ দিয়ে ভাগ করে পাই $x^2 = 7y$, তাই $|4a| = 7$। $4a$-এর বদলে $a = 7/4$ নিলে ভুল হয়।"},{"q":"$5y^2 = 15x$ পরাবৃত্তের উপকেন্দ্রিক লম্বের দৈর্ঘ্য কত?","opts":["$15$","$\\frac{3}{4}$","$3$","$6$"],"ans":2,"exp":"$5$ দিয়ে ভাগ করলে $y^2 = 3x$, ফলে উপকেন্দ্রিক লম্বের দৈর্ঘ্য $= |4a| = 3$।"}]},{"id":"geo_parabola_q5","cardId":"geo_parabola_c2","qType":"numerical","conceptGroup":"parabola_pass_point","q":"মূলবিন্দুতে শীর্ষবিন্দু ও $x$-অক্ষ বরাবর অক্ষরেখাবিশিষ্ট একটি পরাবৃত্ত $(2, 4)$ বিন্দুগামী হলে তার সমীকরণ কোনটি?","opts":["$y^2 = 8x$","$y^2 = 4x$","$x^2 = y$","$y^2 = 16x$"],"ans":0,"tags":["board-standard","no-calc-shortcut"],"exp":"$y^2 = 4ax$-এ $(2,4)$ বসালে $16 = 4a(2) \\implies 4a = 8$, তাই $y^2 = 8x$। $4a$-এর বদলে $a=8$ বসালে ভুল হয়।","variants":[{"q":"মূলবিন্দুতে শীর্ষবিন্দু ও $y$-অক্ষ বরাবর অক্ষরেখাবিশিষ্ট একটি পরাবৃত্ত $(6, 3)$ বিন্দুগামী হলে তার সমীকরণ কী?","opts":["$x^2 = 6y$","$x^2 = 12y$","$y^2 = 12x$","$x^2 = 3y$"],"ans":1,"exp":"$x^2 = 4ay$-এ $(6,3)$ বসালে $36 = 4a(3) \\implies 4a = 12$, অর্থাৎ $x^2 = 12y$। অক্ষ পাল্টে নিলে $y^2=12x$ আসে।"},{"q":"মূলবিন্দুতে শীর্ষবিন্দু ও $x$-অক্ষ বরাবর অক্ষরেখাবিশিষ্ট একটি পরাবৃত্ত $(-3, 6)$ বিন্দুগামী হলে এর উপকেন্দ্র কোনটি?", থিত?","opts":["নিয়ামক রেখার ওপর লম্ব","নিয়ামক রেখার সাথে অভিন্ন","নিয়ামক রেখাকে উপকেন্দ্রে ছেদ করে","নিয়ামক রেখার সমান্তরাল"],"ans":3,"tags":["graph-visual","board-standard"],"exp":"নিয়ামক রেখা এবং শীর্ষবিন্দুতে স্পর্শক—উভয়ই পরাবৃত্তের অক্ষরেখার ওপর লম্ব হওয়ায় তারা পরস্পর সমান্তরাল।","variants":[]},{"id":"geo_parabola_q25","cardId":"geo_parabola_c4","qType":"conceptual","conceptGroup":"parabola_tangency","q":"$y^2 = 4ax$ ($a>0$) পরাবৃত্তের ওপর $P(x_1, y_1)$ বিন্দুর উপকেন্দ্রিক দূরত্ব কেন সরাসরি $x_1 + a$ হয়?","opts":["সংজ্ঞানুসারে $SP = PM$, এবং $P$ থেকে নিয়ামক $x = -a$-এর লম্ব দূরত্ব $x_1 + a$","কারণ মূলবিন্দু থেকে $P$-এর দূরত্ব $x_1 + a$","কারণ উপকেন্দ্রিক লম্বের দৈর্ঘ্য $x_1 + a$","কারণ দূরত্ব সূত্রে $y_1$ সর্বদা শূন্য হয়"],"ans":0,"tags":["board-standard","no-calc-shortcut"],"exp":"পরাবৃত্তে $e = 1$ হওয়ায় $SP = PM$। আর $(x_1,y_1)$ থেকে $x = -a$ রেখার দূরত্ব $x_1 - (-a) = x_1 + a$।","variants":[]}],"writtenDrills":[{"id":"geo_parabola_w1","cardId":"geo_parabola_c3","marks":2,"q":"$y^2 - 4y - 8x + 20 = 0$ পরাবৃত্তটিকে আদর্শ আকারে প্রকাশ করে এর শীর্ষবিন্দু, উপকেন্দ্র, নিয়ামক রেখা ও উপকেন্দ্রিক লম্বের দৈর্ঘ্য নির্ণয় করো।","steps":["সাজিয়ে পাই: $y^2 - 4y = 8x - 20$।","উভয় পক্ষে $4$ যোগ করে পূর্ণবর্গ করো: $(y - 2)^2 = 8x - 16 = 8(x - 2)$।","এখানে $\\alpha = 2, \\beta = 2$ এবং $4a = 8 \\implies a = 2$।","শীর্ষবিন্দু $(2, 2)$; উপকেন্দ্র $(2+2, 2) = (4, 2)$; নিয়ামক রেখা $x = 2 - 2 = 0$; উপকেন্দ্রিক লম্ব $= |4a| = 8$।"],"finalAnswer":"শীর্ষবিন্দু $(2,2)$, উপকেন্দ্র $(4,2)$, নিয়ামক রেখা $x=0$, উপকেন্দ্রিক লম্ব $= 8$","markingTip":"পূর্ণবর্গ করে $(y-2)^2=8(x-2)$ গঠনে ১ নম্বর এবং চারটি উপাদান সঠিকভাবে লেখার জন্য ১ নম্বর।"},{"id":"geo_parabola_w2","cardId":"geo_parabola_c4","marks":2,"q":"$k$-এর কোন মানের জন্য $y = 3x + k$ রেখাটি $y^2 = 24x$ পরাবৃত্তের স্পর্শক হবে? স্পর্শবিন্দুও নির্ণয় করো।","steps":["$y^2 = 24x$ থেকে $4a = 24 \\implies a = 6$।","রেখাটির ঢাল $m = 3$। স্পর্শক হওয়ার শর্ত $c = a/m$ থেকে $k = 6/3 = 2$।","স্পর্শবিন্দু $= \\left(\\frac{a}{m^2}, \\frac{2a}{m}\\right) = \\left(\\frac{6}{9}, \\frac{12}{3}\\right) = \\left(\\frac{2}{3}, 4\\right)$।"],"finalAnswer":"$k = 2$; স্পর্শবিন্দু $\\left(\\frac{2}{3}, 4\\right)$","markingTip":"$k=a/m=2$ নির্ণয়ে ১ নম্বর এবং সরলীকৃত স্পর্শবিন্দু $(\\frac{2}{3}, 4)$-এর জন্য ১ নম্বর।"},{"id":"geo_parabola_w3","cardId":"geo_parabola_c1","marks":2,"q":"যে পরাবৃত্তের উপকেন্দ্র $(1, -2)$ এবং নিয়ামক রেখা $x + y - 1 = 0$, তার সমীকরণ নির্ণয় করো।","steps":["সংজ্ঞানুসারে $SP = PM$, অর্থাৎ $(x-1)^2 + (y+2)^2 = \\frac{(x+y-1)^2}{1^2+1^2}$।","উভয় পক্ষে $2$ গুণ করো: $2(x^2 - 2x + 1 + y^2 + 4y + 4) = x^2 + y^2 + 1 + 2xy - 2x - 2y$।","বিস্তৃত করে পাই: $2x^2 + 2y^2 - 4x + 8y + 10 = x^2 + y^2 + 2xy - 2x - 2y + 1$।","পক্ষান্তর করে পাই: $x^2 - 2xy + y^2 - 2x + 10y + 9 = 0$।"],"finalAnswer":"$x^2 - 2xy + y^2 - 2x + 10y + 9 = 0$","markingTip":"$SP^2 = PM^2$ গঠনে ১ নম্বর এবং সঠিক বিস্তৃতির জন্য ১ নম্বর (যাচাই: $h^2 - ab = 1 - 1 = 0$)।"}]},{"id":"geo_ellipse_hyp","moduleId":"mod_geo","title":"কনিক ২: উপবৃত্ত ও অধিবৃত্ত","subtitle":"আদর্শ ও স্থানান্তরিত রূপ, উৎকেন্দ্রিকতা, উপকেন্দ্র, অসীমতট, আয়তাকার অধিবৃত্ত ও স্পর্শক-অভিলম্ব","paperRef":"২য় পত্র অধ্যায় ৬(খ)","tier":1,"estMinutes":18,"cards":[{"id":"geo_ellipse_hyp_c1","badge":"উপবৃত্ত","title":"উপবৃত্ত: আদর্শ ও স্থানান্তরিত রূপ","intuition":"উপবৃত্তের সমীকরণে $x^2$ ও $y^2$ উভয় পদই ধনাত্মক। যার নিচে বড় হর থাকে, সেই অক্ষটিই হয় বৃহৎ অক্ষ! উপবৃত্তের উৎকেন্দ্রিকতা সর্বদা $0$ ও $1$-এর মাঝে থাকে এবং এর ওপরস্থ যেকোনো বিন্দু থেকে দুই উপকেন্দ্রের দূরত্বের সমষ্টি বৃহৎ অক্ষের সমান।","formulas":[{"label":"অনুভূমিক উপবৃত্ত ($a > b$)","latex":"\\frac{(x-\\alpha)^2}{a^2} + \\frac{(y-\\beta)^2}{b^2} = 1; \\quad e = \\sqrt{1 - \\frac{b^2}{a^2}}","whenToUse":"বৃহৎ অক্ষ $2a$, ক্ষুদ্র অক্ষ $2b$, উপকেন্দ্র $(\\alpha \\pm ae, \\beta)$, নিয়ামক $x = \\alpha \\pm \\frac{a}{e}$, উপকেন্দ্রিক লম্ব $\\frac{2b^2}{a}$।"},{"label":"উল্লম্ব উপবৃত্ত ($b > a$)","latex":"\\frac{(x-\\alpha)^2}{a^2} + \\frac{(y-\\beta)^2}{b^2} = 1; \\quad e = \\sqrt{1 - \\frac{a^2}{b^2}}","whenToUse":"বৃহৎ অক্ষ $2b$, ক্ষুদ্র অক্ষ $2a$, উপকেন্দ্র $(\\alpha, \\beta \\pm be)$, নিয়ামক $y = \\beta \\pm \\frac{b}{e}$, উপকেন্দ্রিক লম্ব $\\frac{2a^2}{b}$।"},{"label":"উপকেন্দ্রিক দূরত্বের সমষ্টি","latex":"SP + S'P = 2a \\; (a>b); \\quad SP + S'P = 2b \\; (b>a)","whenToUse":"উপবৃত্তস্থ যেকোনো বিন্দু থেকে দুই উপকেন্দ্রের দূরত্বের যোগফল চাইলে ৩ সেকেন্ডের শর্টকাট।"}],"symbols":[{"sym":"$2a, 2b$","meaning":"$x$ ও $y$ অক্ষ বরাবর অক্ষের দৈর্ঘ্য (বড়টি বৃহৎ অক্ষ, ছোটটি ক্ষুদ্র অক্ষ)"},{"sym":"$2ae$ বা $2be$","meaning":"দুটি উপকেন্দ্রের মধ্যবর্তী দূরত্ব"}],"example":{"problem":"$9x^2 + 25y^2 = 225$ উপবৃত্তের উৎকেন্দ্রিকতা, উপকেন্দ্র এবং উপকেন্দ্রিক লম্বের দৈর্ঘ্য নির্ণয় করো।","steps":["$225$ দিয়ে ভাগ করো: $\\frac{x^2}{25} + \\frac{y^2}{9} = 1$, ফলে $a^2 = 25 \\implies a = 5$ এবং $b^2 = 9 \\implies b = 3$ ($a > b$)।","উৎকেন্দ্রিকতা $e = \\sqrt{1 - \\frac{9}{25}} = \\sqrt{\\frac{16}{25}} = \\frac{4}{5}$।","উপকেন্দ্র $= (\\pm ae, 0) = (\\pm 5 \\cdot \\frac{4}{5}, 0) = (\\pm 4, 0)$।","উপকেন্দ্রিক লম্ব $= \\frac{2b^2}{a} = \\frac{2(9)}{5} = \\frac{18}{5}$ একক।"],"answer":"$e = \\frac{4}{5}$, উপকেন্দ্র $(\\pm 4, 0)$ এবং উপকেন্দ্রিক লম্ব $= \\frac{18}{5}$ একক।"},"tip":"সর্বজনীন উপবৃত্ত শর্টকাট: $e = \\sqrt{1 - \\frac{m}{M}}$ এবং উপকেন্দ্রিক লম্ব $= \\frac{2m}{\\sqrt{M}}$ (যেখানে $m$ = ছোট হর, $M$ = বড় হর)—অনুভূমিক ও উল্লম্ব উভয়ের জন্যই কাজ করে!","check":{"q":"$25x^2 + 16y^2 = 400$ উপবৃত্তের উৎকেন্দ্রিকতা কত?","a":"$\\frac{x^2}{16} + \\frac{y^2}{25} = 1 \\implies e = \\sqrt{1 - 16/25} = \\frac{3}{5}$।"},"mythBuster":{"statement":"$\\frac{x^2}{9} + \\frac{y^2}{25} = 1$ উপবৃত্তের উপকেন্দ্রদ্বয় $x$-অক্ষের ওপর অবস্থিত।","isTrue":false,"why":"যেহেতু $25 > 9$, তাই বৃহৎ অক্ষ $y$-অক্ষ বরাবর ($b=5 > a=3$), ফলে উপকেন্দ্রদ্বয় $y$-অক্ষের ওপর $(0, \\pm 4)$ বিন্দুতে অবস্থিত।"}},{"id":"geo_ellipse_hyp_c2","badge":"অধিবৃত্ত","title":"অধিবৃত্ত: আদর্শ ও স্থানান্তরিত রূপ","intuition":"অধিবৃত্তের সমীকরণে $x^2$ ও $y^2$ পদের মাঝে বিয়োগ চিহ্ন থাকে। উপবৃত্তের উল্টো—এখানে বড় হর নয়, বরং ধনাত্মক পদটিই নির্ধারণ করে আড় অক্ষ কোনটি! আর উৎকেন্দ্রিকতার বর্গমূলের ভেতরে বিয়োগের বদলে যোগ বসে, তাই সর্বদা $e > 1$।","formulas":[{"label":"অনুভূমিক অধিবৃত্ত ($x^2$ ধনাত্মক)","latex":"\\frac{(x-\\alpha)^2}{a^2} - \\frac{(y-\\beta)^2}{b^2} = 1; \\quad e = \\sqrt{1 + \\frac{b^2}{a^2}}","whenToUse":"আড় অক্ষ $2a$, অনুবন্ধী অক্ষ $2b$, উপকেন্দ্র $(\\alpha \\pm ae, \\beta)$, নিয়ামক $x = \\alpha \\pm \\frac{a}{e}$, উপকেন্দ্রিক লম্ব $\\frac{2b^2}{a}$।"},{"label":"উল্লম্ব অধিবৃত্ত ($y^2$ ধনাত্মক)","latex":"\\frac{(y-\\beta)^2}{b^2} - \\frac{(x-\\alpha)^2}{a^2} = 1; \\quad e = \\sqrt{1 + \\frac{a^2}{b^2}}","whenToUse":"আড় অক্ষ $2b$, অনুবন্ধী অক্ষ $2a$, উপকেন্দ্র $(\\alpha, \\beta \\pm be)$, নিয়ামক $y = \\beta \\pm \\frac{b}{e}$, উপকেন্দ্রিক লম্ব $\\frac{2a^2}{b}$।"},{"label":"উপকেন্দ্রিক দূরত্বের অন্তর","latex":"|SP - S'P| = 2a \\; (x^2 > 0); \\quad |SP - S'P| = 2b \\; (y^2 > 0)","whenToUse":"অধিবৃত্তস্থ যেকোনো বিন্দু থেকে উপকেন্দ্রদ্বয়ের দূরত্বের পার্থক্য আড় অক্ষের সমান।"}],"symbols":[{"sym":"$2a$ (বা $2b$)","meaning":"আড় অক্ষ—ধনাত্মক বর্গপদের অক্ষ বরাবর"},{"sym":"$e > 1$","meaning":"যেকোনো অধিবৃত্তের উৎকেন্দ্রিকতা; বর্গমূলের ভেতরে $+$ চিহ্ন বসে"}],"example":{"problem":"$\\frac{x^2}{16} - \\frac{y^2}{9} = 1$ অধিবৃত্তের উৎকেন্দ্রিকতা, উপকেন্দ্র এবং উপকেন্দ্রিক লম্বের দৈর্ঘ্য নির্ণয় করো।","steps":["$x^2$ ধনাত্মক হওয়ায় $a^2 = 16 \\implies a = 4$ এবং $b^2 = 9 \\implies b = 3$।","উৎকেন্দ্রিকতা $e = \\sqrt{1 + \\frac{9}{16}} = \\sqrt{\\frac{25}{16}} = \\frac{5}{4}$।","উপকেন্দ্র $= (\\pm ae, 0) = (\\pm 4 \\cdot \\frac{5}{4}, 0) = (\\pm 5, 0)$।","উপকেন্দ্রিক লম্ব $= \\frac{2b^2}{a} = \\frac{2(9)}{4} = \\frac{9}{2}$ একক।"],"answer":"$e = \\frac{5}{4}$, উপকেন্দ্র $(\\pm 5, 0)$ এবং উপকেন্দ্রিক লম্ব $= \\frac{9}{2}$ একক।"},"tip":"সর্বজনীন অধিবৃত্ত শর্টকাট: $e = \\sqrt{1 + \\frac{N}{P}}$ (যেখানে $N$ = ঋণাত্মক পদের হর, $P$ = ধনাত্মক পদের হর)। ভর্তি পরীক্ষায় $3$-$4$-$5$ ত্রয়ী সবচেয়ে বেশি আসে!","check":{"q":"$\\frac{y^2}{9} - \\frac{x^2}{16} = 1$ অধিবৃত্তের উৎকেন্দ্রিকতা কত?","a":"$y^2$ ধনাত্মক ($b^2=9$) ও $x^2$ ঋণাত্মক ($a^2=16$), তাই $e = \\sqrt{1 + 16/9} = \\frac{5}{3}$।"},"mythBuster":{"statement":"$\\frac{x^2}{9} - \\frac{y^2}{16} = 1$ অধিবৃত্তের আড় অক্ষ $y$-অক্ষ বরাবর, কারণ $16 > 9$।","isTrue":false,"why":"অধিবৃত্তে হরের বড়-ছোট নয়, বরং ধনাত্মক পদ আড় অক্ষ নির্ধারণ করে। এখানে $x^2$ ধনাত্মক হওয়ায় আড় অক্ষ $x$-অক্ষ বরাবর ($2a = 6$)।"}},{"id":"geo_ellipse_hyp_c3","badge":"অসীমতট ও আয়তাকার অধিবৃত্ত","title":"অসীমতট ও আয়তাকার অধিবৃত্ত","intuition":"অসীমতট হলো কেন্দ্রগামী সেই দুটি সরলরেখা, অধিবৃত্তটি অসীমে যাদের খুব কাছাকাছি যায় কিন্তু কখনো স্পর্শ করে না। অসীমতট বের করার সহজ উপায়: সমীকরণের ডানপক্ষের $1$-কে $0$ বসিয়ে দাও! আর অসীমতট দুটি পরস্পর লম্ব হলে তাকে আয়তাকার অধিবৃত্ত বলে, যার উৎকেন্দ্রিকতা সর্বদা $e = \\sqrt{2}$।","formulas":[{"label":"অসীমতট রেখাদ্বয়","latex":"\\frac{x^2}{a^2} - \\frac{y^2}{b^2} = 0 \\implies y = \\pm \\frac{b}{a}x","whenToUse":"স্থানান্তরিত অধিবৃত্তে $y - \\beta = \\pm \\frac{b}{a}(x - \\alpha)$ বসাও।"},{"label":"আয়তাকার অধিবৃত্ত","latex":"x^2 - y^2 = a^2 \\; (a=b) \\implies e = \\sqrt{2},\\; y = \\pm x,\\; \\text{LR} = 2a","whenToUse":"আবর্তিত রূপ $xy = c^2$-এর ক্ষেত্রেও অক্ষদ্বয় অসীমতট এবং $e = \\sqrt{2}$।"},{"label":"অনুবন্ধী অধিবৃত্তের সম্পর্ক","latex":"\\frac{1}{e_1^2} + \\frac{1}{e_2^2} = 1","whenToUse":"অধিবৃত্ত ($e_1$) এবং এর অনুবন্ধী অধিবৃত্ত ($e_2$)-এর উৎকেন্দ্রিকতার সম্পর্ক।"}],"symbols":[{"sym":"$e = \\sqrt{2}$","meaning":"যেকোনো আয়তাকার অধিবৃত্তের ধ্রুব উৎকেন্দ্রিকতা"},{"sym":"$e_1, e_2$","meaning":"একটি অধিবৃত্ত ও এর অনুবন্ধী অধিবৃত্তের উৎকেন্দ্রিকতা"}],"example":{"problem":"$9x^2 - 16y^2 = 144$ অধিবৃত্তের অসীমতট এবং $x^2 - y^2 = 25$-এর উৎকেন্দ্রিকতা নির্ণয় করো।","steps":["ডানপক্ষে $0$ বসাও: $9x^2 - 16y^2 = 0 \\implies 16y^2 = 9x^2 \\implies y = \\pm \\frac{3}{4}x$।","$x^2 - y^2 = 25$-এ $a^2 = b^2 = 25$, তাই এটি একটি আয়তাকার অধিবৃত্ত।","সুতরাং এর উৎকেন্দ্রিকতা $e = \\sqrt{1 + 25/25} = \\sqrt{2}$।"],"answer":"অসীমতট $y = \\pm \\frac{3}{4}x$ এবং উৎকেন্দ্রিকতা $e = \\sqrt{2}$।"},"tip":"ফাঁদ এড়াও: $9x^2 - 16y^2 = 144$-এ $a^2=16, b^2=9$, তাই $b/a = 3/4$, $4/3$ নয়। সরাসরি $9x^2 - 16y^2 = 0$ সমাধান করলে আর ভুল হবে না!","check":{"q":"একটি অধিবৃত্তের $e_1 = \\frac{5}{4}$ হলে এর অনুবন্ধী অধিবৃত্তের উৎকেন্দ্রিকতা $e_2$ কত?","a":"$\\frac{1}{e_2^2} = 1 - \\frac{16}{25} = \\frac{9}{25} \\implies e_2 = \\frac{5}{3}$।"},"mythBuster":{"statement":"$xy = 16$ অধিবৃত্তটির উৎকেন্দ্রিকতা $e = 2$।","isTrue":false,"why":"$xy = c^2$ হলো $45^\\circ$ কোণে ঘোরানো একটি আয়তাকার অধিবৃত্ত, তাই $c$-এর মান যাই হোক না কেন, এর উৎকেন্দ্রিকতা সর্বদা $e = \\sqrt{2}$।"}},{"id":"geo_ellipse_hyp_c4","badge":"স্পর্শক ও অভিলম্ব","title":"উপবৃত্ত ও অধিবৃত্তের স্পর্শক ও অভিলম্ব","intuition":"একটি চমৎকার প্রতিসাম্য মনে রাখো: উপবৃত্তের যেকোনো স্পর্শক বা অভিলম্বের সূত্রে $b^2$-এর স্থলে $-b^2$ বসালেই অধিবৃত্তের সূত্র পাওয়া যায়! তাই কেবল উপবৃত্তের সূত্রগুলো মুখস্থ করে অধিবৃত্তের জন্য চিহ্ন পাল্টে দাও।","formulas":[{"label":"$(x_1, y_1)$ বিন্দুতে স্পর্শক","latex":"\\frac{xx_1}{a^2} + \\frac{yy_1}{b^2} = 1; \\quad \\frac{xx_1}{a^2} - \\frac{yy_1}{b^2} = 1","whenToUse":"বামটি উপবৃত্ত ও ডানটি অধিবৃত্তের পরিধিস্থ $(x_1, y_1)$ বিন্দুতে স্পর্শক।"},{"label":"স্পর্শক হওয়ার শর্ত ($y = mx + c$)","latex":"c^2 = a^2m^2 + b^2; \\quad c^2 = a^2m^2 - b^2","whenToUse":"$+$ চিহ্ন উপবৃত্তের জন্য এবং $-$ চিহ্ন অধিবৃত্তের জন্য।"},{"label":"$(x_1, y_1)$ বিন্দুতে অভিলম্ব","latex":"\\frac{a^2 x}{x_1} - \\frac{b^2 y}{y_1} = a^2 - b^2; \\quad \\frac{a^2 x}{x_1} + \\frac{b^2 y}{y_1} = a^2 + b^2","whenToUse":"বামটি উপবৃত্ত এবং ডানটি অধিবৃত্তের $(x_1, y_1)$ বিন্দুতে অভিলম্ব ($x_1, y_1 \\neq 0$)।"}],"symbols":[{"sym":"$c = \\pm\\sqrt{a^2m^2 \\pm b^2}$","meaning":"$m$ ঢালবিশিষ্ট দুটি সমান্তরাল স্পর্শকের $y$-ছেদক ($+$ উপবৃত্ত, $-$ অধিবৃত্ত)"}],"example":{"problem":"$c$-এর কোন মানের জন্য $y = 2x + c$ রেখাটি $\\frac{x^2}{4} + \\frac{y^2}{9} = 1$ উপবৃত্তকে স্পর্শ করবে?","steps":["এখানে $a^2 = 4$, $b^2 = 9$ এবং ঢাল $m = 2$।","উপবৃত্তের স্পর্শকের শর্ত: $c^2 = a^2m^2 + b^2 = 4(2^2) + 9 = 16 + 9 = 25$।","বর্গমূল নিয়ে পাই: $c = \\pm 5$।"],"answer":"$c = \\pm 5$।"},"tip":"লক্ষ করো $c^2 = a^2m^2 + b^2$ সূত্রটি অনুভূমিক ($a>b$) ও উল্লম্ব ($b>a$) উভয় উপবৃত্তেই একই থাকে—শুধু $x^2$-এর নিচের হরকে $a^2$ এবং $y^2$-এর নিচের হরকে $b^2$ ধরবে!","check":{"q":"$c$-এর কোন বাস্তব মানের জন্য $y = 2x + c$ রেখাটি $\\frac{x^2}{4} - \\frac{y^2}{7} = 1$ অধিবৃত্তকে স্পর্শ করবে?","a":"$c^2 = a^2m^2 - b^2 = 4(4) - 7 = 9 \\implies c = \\pm 3$।"},"mythBuster":{"statement":"যেকোনো ঢাল $m$-এর জন্যই $y = mx + c$ রেখাটিকে $\\frac{x^2}{a^2} - \\frac{y^2}{b^2} = 1$ অধিবৃত্তের স্পর্শক বানানো যায়।","isTrue":false,"why":"বাস্তব স্পর্শকের জন্য $c^2 = a^2m^2 - b^2 \\ge 0$ হতে হয়, অর্থাৎ কেবল $|m| \\ge b/a$ (অসীমতটের চেয়ে বেশি খাড়া ঢাল) হলেই স্পর্শক সম্ভব।"}}],"mcqs":[{"id":"geo_ellipse_hyp_q1","cardId":"geo_ellipse_hyp_c1","qType":"numerical","conceptGroup":"ellipse_eccentricity_horiz","q":"$\\frac{x^2}{25} + \\frac{y^2}{16} = 1$ উপবৃত্তের উৎকেন্দ্রিকতা কত?","opts":["$\\frac{3}{5}$","$\\frac{4}{5}$","$\\frac{9}{25}$","$\\frac{\\sqrt{41}}{5}$"],"ans":0,"tags":["pyq-pattern","no-calc-shortcut"],"exp":"এখানে $a^2=25, b^2=16$, তাই $e = \\sqrt{1 - 16/25} = \\sqrt{9/25} = \\frac{3}{5}$। বর্গমূল ভুলে গেলে $\\frac{9}{25}$ এবং $+$ বসালে অধিবৃত্তের ভুল উত্তর $\\frac{\\sqrt{41}}{5}$ আসে।","variants":[{"q":"$9x^2 + 25y^2 = 225$ উপবৃত্তের উৎকেন্দ্রিকতা কত?","opts":["$\\frac{3}{5}$","$\\frac{4}{5}$","$\\frac{16}{25}$","$\\frac{5}{4}$"],"ans":1,"exp":"$225$ দিয়ে ভাগ করে পাই $\\frac{x^2}{25} + \\frac{y^2}{9} = 1$, তাই $e = \\sqrt{1 - 9/25} = \\frac{4}{5}$। সরাসরি $b/a$ নিলে ভুল উত্তর $\\frac{3}{5}$ আসে।"},{"q":"$\\frac{x^2}{169} + \\frac{y^2}{144} = 1$ উপবৃত্তের উৎকেন্দ্রিকতা কত?","opts":["$\\frac{12}{13}$","$\\frac{25}{169}$","$\\frac{5}{13}$","$\\frac{5}{12}$"],"ans":2,"exp":"$5$-$12$-$13$ ত্রয়ী থেকে $e = \\sqrt{1 - 144/169} = \\sqrt{25/169} = \\frac{5}{13}$। $12$ দিয়ে ভাগ করলে ভুল উত্তর $\\frac{5}{12}$ আসে।"}]},{"id":"geo_ellipse_hyp_q2","cardId":"geo_ellipse_hyp_c1","qType":"numerical","conceptGroup":"ellipse_eccentricity_vert","q": পরস্পরকে ছেদ করে।","variants":[]},{"id":"geo_ellipse_hyp_q23","cardId":"geo_ellipse_hyp_c4","qType":"conceptual","conceptGroup":"conic_tangency_compare","q":"$\\frac{x^2}{a^2}+\\frac{y^2}{b^2}=1$ উপবৃত্তের যেকোনো স্পর্শক বা অভিলম্বের সূত্র থেকে কীভাবে $\\frac{x^2}{a^2}-\\frac{y^2}{b^2}=1$ অধিবৃত্তের সূত্র পাওয়া যায়?","opts":["$a$-এর স্থলে $-a$ বসিয়ে","$a$ এবং $b$ পরস্পর বিনিময় করে","$b^2$-এর স্থলে $-b^2$ বসিয়ে","$m$-এর স্থলে $1/m$ বসিয়ে"],"ans":2,"tags":["no-calc-shortcut","board-standard"],"exp":"উপবৃত্তের সমীকরণে $b^2 \\to -b^2$ বসালে অধিবৃত্তের সমীকরণ আসে, তাই স্পর্শকের শর্ত $c^2=a^2m^2+b^2$ হয়ে যায় $c^2=a^2m^2-b^2$।","variants":[]},{"id":"geo_ellipse_hyp_q24","cardId":"geo_ellipse_hyp_c3","qType":"conceptual","conceptGroup":"conic_tangency_compare","q":"একটি অধিবৃত্ত এবং এর অনুবন্ধী অধিবৃত্তের উৎকেন্দ্রিকতা যথাক্রমে $e_1$ ও $e_2$ হলে কোন অভেদটি সর্বদা সত্য?","opts":["$e_1^2 + e_2^2 = 1$","$e_1 e_2 = 1$","$e_1^2 - e_2^2 = 1$","$\\frac{1}{e_1^2} + \\frac{1}{e_2^2} = 1$"],"ans":3,"tags":["pyq-pattern","formula-trap"],"exp":"$e_1^2 = \\frac{a^2+b^2}{a^2}$ এবং $e_2^2 = \\frac{a^2+b^2}{b^2}$ হওয়ায় তাদের বিপরীত বর্গের যোগফল $\\frac{a^2}{a^2+b^2} + \\frac{b^2}{a^2+b^2} = 1$।","variants":[]},{"id":"geo_ellipse_hyp_q25","cardId":"geo_ellipse_hyp_c4","qType":"conceptual","conceptGroup":"conic_tangency_compare","q":"$\\frac{x^2}{a^2} - \\frac{y^2}{b^2} = 1$ অধিবৃত্তে $y = mx + c$ বাস্তব স্পর্শক হওয়ার জন্য ঢাল $m$-কে কোন শর্ত মানতে হয়?","opts":["$|m| \\ge \\frac{b}{a}$","$|m| \\le \\frac{b}{a}$","শুধুমাত্র $m > 0$","যেকোনো বাস্তব $m$-এর জন্য সম্ভব"],"ans":0,"tags":["formula-trap","graph-visual"],"exp":"বাস্তব $c$-এর জন্য $c^2 = a^2m^2 - b^2 \\ge 0 \\implies |m| \\ge \\frac{b}{a}$ হতে হবে; এর চেয়ে কম ঢালের রেখা উভয় শাখাকে ছেদ করে।","variants":[]}],"writtenDrills":[{"id":"geo_ellipse_hyp_w1","cardId":"geo_ellipse_hyp_c1","marks":2,"q":"$9x^2 + 4y^2 - 36x + 24y + 36 = 0$ উপবৃত্তের কেন্দ্র, উৎকেন্দ্রিকতা, উপকেন্দ্র এবং উপকেন্দ্রিক লম্বের দৈর্ঘ্য নির্ণয় করো।","steps":["সাজিয়ে পূর্ণবর্গ করো: $9(x^2 - 4x + 4) + 4(y^2 + 6y + 9) = -36 + 36 + 36 = 36$।","$36$ দিয়ে ভাগ করো: $\\frac{(x - 2)^2}{4} + \\frac{(y + 3)^2}{9} = 1$, অর্থাৎ কেন্দ্র $(2, -3)$, $a = 2, b = 3$ ($b > a$)।","উৎকেন্দ্রিকতা $e = \\sqrt{1 - \\frac{4}{9}} = \\frac{\\sqrt{5}}{3}$।","উপকেন্দ্র $= (2, -3 \\pm be) = (2, -3 \\pm \\sqrt{5})$ এবং উপকেন্দ্রিক লম্ব $= \\frac{2a^2}{b} = \\frac{8}{3}$।"],"finalAnswer":"কেন্দ্র $(2,-3)$, $e = \\frac{\\sqrt{5}}{3}$, উপকেন্দ্র $(2, -3 \\pm \\sqrt{5})$, উপকেন্দ্রিক লম্ব $= \\frac{8}{3}$","markingTip":"আদর্শ স্থানান্তরিত আকারে রূপান্তরের জন্য ১ নম্বর এবং উল্লম্ব উপবৃত্তের চারটি উপাদানের জন্য ১ নম্বর।"},{"id":"geo_ellipse_hyp_w2","cardId":"geo_ellipse_hyp_c2","marks":2,"q":"$9x^2 - 16y^2 = 144$ অধিবৃত্তের উৎকেন্দ্রিকতা, উপকেন্দ্র, নিয়ামক রেখা এবং অসীমতট নির্ণয় করো।","steps":["$144$ দিয়ে ভাগ করে পাই $\\frac{x^2}{16} - \\frac{y^2}{9} = 1$, ফলে $a = 4, b = 3$ ($x^2$ ধনাত্মক)।","উৎকেন্দ্রিকতা $e = \\sqrt{1 + \\frac{9}{16}} = \\frac{5}{4}$।","উপকেন্দ্র $= (\\pm ae, 0) = (\\pm 5, 0)$ এবং নিয়ামক রেখা $x = \\pm \\frac{a}{e} = \\pm \\frac{16}{5}$।","অসীমতট: $9x^2 - 16y^2 = 0 \\implies y = \\pm \\frac{3}{4}x$।"],"finalAnswer":"$e = \\frac{5}{4}$, উপকেন্দ্র $(\\pm 5, 0)$, নিয়ামক $x = \\pm \\frac{16}{5}$, অসীমতট $y = \\pm \\frac{3}{4}x$","markingTip":"প্রতিটি উপাদানের জন্য ০.৫ করে মোট ২ নম্বর; অসীমতটে $b/a = 3/4$ ভালোভাবে যাচাই করো।"},{"id":"geo_ellipse_hyp_w3","cardId":"geo_ellipse_hyp_c4","marks":2,"q":"$\\frac{x^2}{25} + \\frac{y^2}{16} = 1$ উপবৃত্তের $\\left(3, \\frac{16}{5}\\right)$ বিন্দুতে স্পর্শক ও অভিলম্বের সমীকরণ নির্ণয় করো।","steps":["স্পর্শক: $\\frac{3x}{25} + \\frac{(16/5)y}{16} = 1 \\implies \\frac{3x}{25} + \\frac{y}{5} = 1 \\implies 3x + 5y = 25$।","স্পর্শকের ঢাল $-\\frac{3}{5}$, তাই অভিলম্বের ঢাল $\\frac{5}{3}$।","অভিলম্ব: $y - \\frac{16}{5} = \\frac{5}{3}(x - 3) \\implies 15y - 48 = 25x - 75 \\implies 25x - 15y - 27 = 0$।"],"finalAnswer":"স্পর্শক: $3x + 5y = 25$; অভিলম্ব: $25x - 15y - 27 = 0$","markingTip":"সরলীকৃত স্পর্শকের জন্য ১ নম্বর এবং অভিলম্ব নির্ণয়ের জন্য ১ নম্বর।"}]}]},{"id":"mod_trig","title":"মডিউল ৩: ফাংশন ও ত্রিকোণমিতি","subtitle":"ফাংশন ও লেখচিত্র, ত্রিকোণমিতিক অনুপাত, যৌগিক ও গুণিতক কোণ, বিপরীত ত্রিকোণমিতি","lessons":[{"id":"trig_func","moduleId":"mod_trig","title":"ফাংশন ও লেখচিত্র","paperRef":"1st Paper Ch. 8","tier":2,"estMinutes":16,"cards":[{"id":"trig_func_c1","badge":"মূল ধারণা ১","title":"ডোমেন ও রেঞ্জের মূলনীতি","intuition":"ডোমেন হলো $x$-এর সেই সব বৈধ মান যাদের জন্য ফাংশনটি বাস্তব ও সংজ্ঞায়িত থাকে—কখনই শূন্য দিয়ে ভাগ করা যাবে না, জোড় মূলের ভেতর ঋণাত্মক সংখ্যা রাখা যাবে না এবং লগারিদমের ভেতর মান অবশ্যই ধনাত্মক হতে হবে। আর এই বৈধ মানগুলো বসিয়ে $y$-এর যে সকল মান পাওয়া যায়, তাদের সেটই হলো রেঞ্জ।","formulas":[{"label":"ভগ্নাংশ ফাংশনের ডোমেন ও রেঞ্জ","latex":"f(x)=\\frac{ax+b}{cx+d} \\implies \\text{Dom}=\\mathbb{R}\\setminus\\left\\{-\\frac{d}{c}\\right\\},\\; \\text{Range}=\\mathbb{R}\\setminus\\left\\{\\frac{a}{c}\\right\\}","whenToUse":"যখন $f(x)$ দুটি একঘাত রাশির অনুপাত ($ad \\neq bc$) আকারে থাকে।"},{"label":"বর্গমূল ও অর্ধবৃত্ত ফাংশন","latex":"f(x)=\\sqrt{g(x)} \\implies g(x)\\ge 0;\\quad f(x)=\\sqrt{a^2-x^2} \\implies \\text{Dom}=[-a,a],\\; \\text{Range}=[0,a]","whenToUse":"যখন $x$ বর্গমূলের ভেতর থাকে; বর্গমূল হরে থাকলে প্রান্তবিন্দু বাদ দিয়ে খোলা ব্যবধি নিতে হয়।"},{"label":"লগারিদমিক, সূচকীয় ও পরমমান ফাংশন","latex":"\\ln(g(x)): g(x)>0;\\quad a^x\\;(a>0,a\\neq 1): \\text{Range}=(0,\\infty);\\quad |x-h|+k: \\text{Range}=[k,\\infty)","whenToUse":"ক্যালকুলেটর ছাড়াই দ্রুত $\\ln$, $e^x$ এবং V-আকৃতির পরমমান ফাংশনের ডোমেন-রেঞ্জ নির্ণয়ে।"}],"symbols":[{"sym":"$\\mathbb{R}\\setminus\\{k\\}$","meaning":"$k$ ব্যতীত সকল বাস্তব সংখ্যার সেট"},{"sym":"$[a,b] \\text{ vs } (a,b)$","meaning":"বদ্ধ ব্যবধি $[a,b]$ প্রান্তবিন্দু অন্তর্ভুক্ত করে; খোলা ব্যবধি $(a,b)$ প্রান্তবিন্দু বাদ দেয়"},{"sym":"$|x-h|$","meaning":"পরমমান (মডুলাস), যার মান সর্বদা $\\ge 0$"}],"example":{"problem":"$f(x) = \\frac{3x - 2}{x + 4}$ ফাংশনটির ডোমেন ও রেঞ্জ নির্ণয় করো।","steps":["হরের "sym":"$f: A \\to B$","meaning":"ডোমেন $A$ থেকে কোডোমেন $B$-তে সংজ্ঞায়িত ফাংশন"},{"sym":"$|A|$","meaning":"সসীম সেট $A$-এর উপাদান সংখ্যা"},{"sym":"$n!$","meaning":"ফ্যাক্টোরিয়াল: $n(n-1)\\cdots 2 \\cdot 1$"}],"example":{"problem":"$f: \\mathbb{R} \\to \\mathbb{R}$ যেখানে $f(x) = x^2 + 1$, ফাংশনটি এক-এক বা সার্বিক কি না যাচাই করো।","steps":["এক-এক যাচাই: $f(2) = 5$ এবং $f(-2) = 5$, কিন্তু $2 \\neq -2$। তাই $f$ এক-এক নয়।","রেঞ্জ নির্ণয়: যেহেতু $x^2 \\ge 0$, তাই $f(x) = x^2 + 1 \\ge 1$, অর্থাৎ রেঞ্জ $= [1, \\infty)$।","কোডোমেনের সাথে তুলনা: $[1, \\infty) \\neq \\mathbb{R}$ (যেমন $y = 0$-এর কোনো প্রাক-প্রতিবিম্ব নেই)। তাই $f$ সার্বিকও নয়।"],"answer":"ফাংশনটি এক-এক নয় এবং সার্বিকও নয়।"},"tip":"সর্বদা প্রদত্ত ডোমেন ও কোডোমেন খেয়াল করো! $f(x) = x^2$ ফাংশনটি $\\mathbb{R} \\to \\mathbb{R}$-এ বাইজেক্টিভ নয়, কিন্তু $[0, \\infty) \\to [0, \\infty)$-এ বাইজেক্টিভ।","check":{"q":"$|A| = 3$ এবং $|B| = 3$ হলে $A$ থেকে $B$-তে মোট কতটি বাইজেক্টিভ ফাংশন গঠন করা যায়?","a":"$3! = 6$টি বাইজেক্টিভ ফাংশন।"},"mythBuster":{"statement":"যে ফাংশনের লেখচিত্র উল্লম্ব রেখা পরীক্ষায় উত্তীর্ণ হয়, সেটি অবশ্যই এক-এক ফাংশন।","isTrue":false,"why":"উল্লম্ব রেখা পরীক্ষা কেবল নিশ্চিত করে যে লেখচিত্রটি একটি ফাংশন! এক-এক হওয়ার জন্য লেখচিত্রটিকে অনুভূমিক রেখা পরীক্ষাতেও উত্তীর্ণ হতে হয়।"}},{"id":"trig_func_c3","badge":"মূল ধারণা ৩","title":"বিপরীত ও সংযোজিত ফাংশন","intuition":"সংযোজিত ফাংশন $(f \\circ g)(x) = f(g(x))$ ভেতর থেকে বাইরের দিকে কাজ করে—আগে $g$ প্রয়োগ করো, তারপর প্রাপ্ত ফলাফল $f$-এ বসাও। আর বিপরীত ফাংশন $f^{-1}$ মূল ফাংশনের কাজ উল্টে দিয়ে ইনপুট ও আউটপুট পরস্পর বিনিময় করে।","formulas":[{"label":"ভগ্নাংশ ফাংশনের বিপরীত শর্টকাট","latex":"f(x)=\\frac{ax+b}{cx+d} \\implies f^{-1}(x)=\\frac{-dx+b}{cx-a}","whenToUse":"কর্ণের সহগ $a$ ও $d$-এর স্থান বিনিময় করে উভয়ের চিহ্ন উল্টে দাও—এমসিকিউতে ৪৫ সেকেন্ড বাঁচবে!"},{"label":"নির্দিষ্ট বিন্দুতে বিপরীত মান শর্টকাট","latex":"f^{-1}(k) = x \\iff f(x) = k","whenToUse":"$f^{-1}(7)$-এর মতো সংখ্যাগত মান চাইলে পুরো $f^{-1}(x)$ বের না করে সরাসরি $f(x)=k$ সমাধান করো।"},{"label":"সংযোজন ও বিপরীতের ধর্ম","latex":"(f\\circ g)(x)=f(g(x));\\quad (f\\circ g)^{-1}=g^{-1}\\circ f^{-1};\\quad \\text{Dom}(f^{-1})=\\text{Range}(f)","whenToUse":"সংযোজিত ফাংশনের বিপরীত নিতে হলে ক্রম উল্টে যায়—আগে বাইরের $f$ ও পরে ভেতরের $g$ বিপরীত হয়।"}],"symbols":[{"sym":"$f \\circ g$","meaning":"সংযোজিত ফাংশন: $f(g(x))$"},{"sym":"$f^{-1}(x)$","meaning":"বিপরীত ফাংশন—কখনই গুণাত্মক বিপরীত $\\frac{1}{f(x)}$ নয়"},{"sym":"$y = x$","meaning":"যে সরলরেখার সাপেক্ষে $f$ ও $f^{-1}$-এর লেখচিত্র পরস্পর প্রতিসম"}],"example":{"problem":"$f(x) = \\frac{2x + 5}{x - 3}$ হলে $f^{-1}(x)$ এবং $f^{-1}(4)$-এর মান নির্ণয় করো।","steps":["সহগ শনাক্ত করি: $a = 2, b = 5, c = 1, d = -3$।","$a$ ও $d$ বিনিময় করে চিহ্ন উল্টে পাই: $-d = 3$ এবং $-a = -2$, ফলে $f^{-1}(x) = \\frac{3x + 5}{x - 2}$।","$x = 4$ বসিয়ে পাই: $f^{-1}(4) = \\frac{3(4) + 5}{4 - 2} = \\frac{17}{2}$ (যাচাই: $f(17/2) = 4$)।"],"answer":"$f^{-1}(x) = \\frac{3x + 5}{x - 2}$ এবং $f^{-1}(4) = \\frac{17}{2}$।"},"tip":"যখন শুধু $f^{-1}(k)$-এর মান চায়, তখন $f^{-1}(x)$ বের করার দরকার নেই—সরাসরি $f(x) = k$ ধরে $x$ সমাধান করো!","check":{"q":"$f(x) = 3x - 4$ এবং $g(x) = x^2$ হলে $(f \\circ g)(2)$-এর মান কত?","a":"প্রথমে $g(2) = 4$, এরপর $f(4) = 3(4) - 4 = 8$।"},"mythBuster":{"statement":"$f^{-1}(x)$ বলতে সর্বদা $\\frac{1}{f(x)}$ বোঝায়।","isTrue":false,"why":"ফাংশনের নামের ওপর $-1$ চিহ্নটি বিপরীত ফাংশন নির্দেশ করে, ঋণাত্মক সূচক নয়। কেবল $[f(x)]^{-1}$ বলতে $\\frac{1}{f(x)}$ বোঝায়।"}},{"id":"trig_func_c4","badge":"মূল ধারণা ৪","title":"জোড়, বিজোড়, পর্যায়বৃত্ত ও আদর্শ লেখচিত্র","intuition":"প্রতিসাম্য চিনতে পারলে ঢাবি গ-ইউনিটে অনেক সময় বাঁচে: জোড় ফাংশন $y$-অক্ষের সাপেক্ষে প্রতিসম এবং বিজোড় ফাংশন মূলবিন্দুর সাপেক্ষে প্রতিসম। এ ছাড়া $x^2$, $|x|$, $e^x$, $\\ln x$ ও $\\frac{|x|}{x}$-এর আদর্শ লেখচিত্র মনে রাখলে ডোমেন-রেঞ্জ মুহূর্তেই বলা যায়।","formulas":[{"label":"জোড় ও বিজোড় ফাংশনের শর্ত","latex":"\\text{Even: } f(-x)=f(x);\\qquad \\text{Odd: } f(-x)=-f(x)","whenToUse":"$x$-এর বদলে $-x$ বসাও; কোনো শর্তই ঁদটি আসে।"},{"q":"$y = |4x - 8| + 1$ লেখচিত্রের শীর্ষবিন্দুর স্থানাঙ্ক কত?","opts":["$(8, 1)$","$(-2, 1)$","$(2, -1)$","$(2, 1)$"],"ans":3,"exp":"$4x - 8 = 0 \\implies x = 2$ এবং $x = 2$-এ $y = 1$, সুতরাং শীর্ষবিন্দু $(2, 1)$। $(8, 1)$ অপশনটি সহগ $4$ এড়িয়ে যাওয়ার ফাঁদ।"}]},{"id":"trig_func_q17","cardId":"trig_func_c2","qType":"conceptual","conceptGroup":"bijection_and_mapping_tests","q":"$y = f(x)$ ফাংশনটি এক-এক কি না তা লেখচিত্রের মাধ্যমে কোন পরীক্ষায় যাচাই করা হয়?","opts":["প্রতিটি অনুভূমিক রেখা লেখচিত্রকে সর্বোচ্চ একবার ছেদ করবে","প্রতিটি উল্লম্ব রেখা লেখচিত্রকে সর্বোচ্চ একবার ছেদ করবে","লেখচিত্রটি অবশ্যই মূলবিন্দু $(0, 0)$ দিয়ে যাবে","প্রতিটি অনুভূমিক রেখা লেখচিত্রকে অন্তত দুবার ছেদ করবে"],"ans":0,"tags":["graph-visual","board-standard"],"exp":"অনুভূমিক রেখা পরীক্ষা অনুযায়ী প্রতিটি অনুভূমিক রেখা $y = k$ লেখচিত্রকে সর্বোচ্চ একবার ছেদ করলে কোনো দুটি ভিন্ন $x$-এর জন্য একই $y$ হয় না, ফলে ফাংশনটি এক-এক হয়। উল্লম্ব রেখা পরীক্ষা শুধু ফাংশন কি না তা যাচাই করে।","variants":[]},{"id":"trig_func_q18","cardId":"trig_func_c2","qType":"conceptual","conceptGroup":"bijection_and_mapping_tests","q":"$f: \\mathbb{R} \\to \\mathbb{R}$ যেখানে $f(x) = x^2$, ফাংশনটি কেন বাইজেক্টিভ নয়?","opts":["এটি এক-এক কিন্তু সার্বিক নয়","এটি এক-এক নয় এবং সার্বিকও নয়","এটি সার্বিক কিন্তু এক-এক নয়","এটি ঋণাত্মক $x$-এর জন্য অসংজ্ঞায়িত"],"ans":1,"tags":["pyq-pattern","formula-trap"],"exp":"$f(-2) = f(2) = 4$ হওয়ায় এটি এক-এক নয়; আবার $x^2 \\ge 0$ কখনো ঋণাত্মক বাস্তব সংখ্যা তৈরি করতে না পারায় এটি সার্বিকও নয়। তাই এটি এক-এক বা সার্বিক কোনোটাই নয়।","variants":[]},{"id":"trig_func_q19","cardId":"trig_func_c2","qType":"conceptual","conceptGroup":"bijection_and_mapping_tests","q":"একটি ফাংশন $f: A \\to B$-এর বিপরীত ফাংশন $f^{-1}: B \\to A$ বিদ্যমান থাকার প্রয়োজনীয় ও পর্যাপ্ত শর্ত কোনটি?","opts":["$f$-কে অবশ্যই জোড় ফাংশন হতে হবে","$f$-কে কেবল সার্বিক হলেই চলবে","$f$-কে অবশ্যই এক-এক ও সার্বিক উভয়ই (বাইজেক্টিভ) হতে হবে","$f$-কে অবশ্যই বহুপদী ফাংশন হতে হবে"],"ans":2,"tags":["board-standard","pyq-pattern"],"exp":"$f^{-1}: B \\to A$ সংজ্ঞায়িত হতে হলে $B$-এর প্রতিটি উপাদানের জন্য $A$-তে একটি অনন্য প্রাক-প্রতিবিম্ব থাকতে হবে—অর্থাৎ $f$-কে সার্বিক ও এক-এক উভয়ই (বাইজেক্টিভ) হতে হবে। জোড় ফাংশন প্রতিসম ডোমেনে এক-এক হয় না।","variants":[]},{"id":"trig_func_q20","cardId":"trig_func_c4","qType":"conceptual","conceptGroup":"symmetry_and_parity_rules","q":"নিচের কোনটি একটি জোড় ফাংশন?","opts":["$f(x) = x^3 + x$","$f(x) = e^x$","$f(x) = \\sin x + \\cos x$","$f(x) = x^2 + |x|$"],"ans":3,"tags":["board-standard","no-calc-shortcut"],"exp":"$f(-x) = (-x)^2 + |-x| = x^2 + |x| = f(x)$ হওয়ায় $x^2 + |x|$ একটি জোড় ফাংশন। অপরদিকে $x^3 + x$ বিজোড় এবং $e^x$ ও $\\sin x + \\cos x$ কোনোটাই নয়।","variants":[]},{"id":"trig_func_q21","cardId":"trig_func_c4","qType":"conceptual","conceptGroup":"symmetry_and_parity_rules","q":"$f(x)$ একটি জোড় ফাংশন এবং $g(x)$ একটি বিজোড় ফাংশন হলে, এদের গুণফল $h(x) = f(x)\\cdot g(x)$ সর্বদা কেমন হবে?","opts":["একটি বিজোড় ফাংশন, যা মূলবিন্দুর সাপেক্ষে প্রতিসম","একটি জোড় ফাংশন, যা $y$-অক্ষের সাপেক্ষে প্রতিসম","জোড় বা বিজোড় কোনোটাই নয়","একটি ধ্রুবক ফাংশন"],"ans":0,"tags":["pyq-pattern","formula-trap"],"exp":"$h(-x) = f(-x)g(-x) = f(x)(-g(x)) = -h(x)$ হওয়ায় গুণফলটি সর্বদা বিজোড় এবং মূলবিন্দুর সাপেক্ষে প্রতিসম। চিহ্নের নিয়ম $(+)(-) = (-)$ দিয়ে সহজেই মনে রাখা যায়।","variants":[]},{"id":"trig_func_q22","cardId":"trig_func_c4","qType":"conceptual","conceptGroup":"symmetry_and_parity_rules","q":"নিচের কোন ফাংশনটি জোড় বা বিজোড় কোনোটাই নয়?","opts":["$f(x) = x^4 - 3x^2$","$f(x) = x^2 + x$","$f(x) = x^3 - 5x$","$f(x) = |x| \\cos x$"],"ans":1,"tags":["board-standard","formula-trap"],"exp":"$f(x) = x^2 + x$-এর ক্ষেত্রে $f(-x) = x^2 - x$, যা $f(x)$ বা $-f(x) = -x^2 - x$ কোনোটিরই সমান নয়। জোড় ও বিজোড় ঘাতের যোগফলে উভয় প্রতিসাম্যই নষ্ট হয়।","variants":[]},{"id":"trig_func_q23","cardId":"trig_func_c3","qType":"conceptual","conceptGroup":"graph_recognition_and_inverse_geometry","q":"জ্যামিতিকভাবে বিপরীত ফাংশন $y = f^{-1}(x)$-এর লেখচিত্র, মূল ফাংশন $y = f(x)$-এর লেখচিত্রের কোন রেখার সাপেক্ষে প্রতিবিম্ব?","opts":["$x$-অক্ষ ($y = 0$)","$y$-অক্ষ ($x = 0$)","$y = x$ সরলরেখা","$y = -x$ সরলরেখা"],"ans":2,"tags":["graph-visual","board-standard"],"exp":"বিপরীত ফাংশন প্রতিটি বিন্দু $(a, b)$-কে $(b, a)$-তে রূপান্তর করে, তাই লেখচিত্র দুটি $y = x$ সরলরেখার সাপেক্ষে দর্পণ-প্রতিবিম্ব হয়। $y$-অক্ষের প্রতিবিম্ব দেয় $f(-x)$।","variants":[]},{"id":"trig_func_q24","cardId":"trig_func_c4","qType":"conceptual","conceptGroup":"graph_recognition_and_inverse_geometry","q":"$x \\neq 3$-এর জন্য $f(x) = \\frac{|x - 3|}{x - 3}$ ফাংশনটির রেঞ্জ কত?","opts":["$[-1, 1]$","$\\mathbb{R} \\setminus \\{3\\}$","$\\{1\\}$","$\\{-1, 1\\}$"],"ans":3,"tags":["pyq-pattern","graph-visual","formula-trap"],"exp":"$x > 3$ হলে $f(x) = 1$ এবং $x < 3$ হলে $f(x) = -1$। অর্থাৎ আউটপুট কেবল দুটি বিচ্ছিন্ন মান $\\{-1, 1\\}$ গ্রহণ করে, সম্পূর্ণ ব্যবধি $[-1, 1]$ নয়।","variants":[]},{"id":"trig_func_q25","cardId":"trig_func_c4","qType":"conceptual","conceptGroup":"graph_recognition_and_inverse_geometry","q":"সূচকীয় ফাংশন $y = e^x$-এর লেখচিত্র সম্পর্কে নিচের কোন বক্তব্যটি সঠিক?","opts":["এটি $(0, 1)$ বিন্দুগামী, সর্বদা $x$-অক্ষের ওপরে থাকে এবং এক-এক","এটি $(1, 0)$ বিন্দুগামী এবং $y$-অক্ষ এর উল্লম্ব অসীমতট","এটি $y$-অক্ষের সাপেক্ষে প্রতিসম একটি জোড় ফাংশন","এর রেঞ্জ হলো $(-\\infty, \\infty)$"],"ans":0,"tags":["graph-visual","board-standard"],"exp":"$e^0 = 1$ এবং সকল বাস্তব $x$-এর জন্য $e^x > 0$ ও ক্রমবর্ধমান হওয়ায় লেখচিত্রটি $(0, 1)$ দিয়ে যায়, রেঞ্জ $(0, \\infty)$ এবং এটি এক-এক। দ্বিতীয় অপশনটি এর বিপরীত $y = \\ln x$-এর বৈশিষ্ট্য।","variants":[]}],"writtenDrills":[{"id":"trig_func_w1","cardId":"trig_func_c1","marks":2,"q":"$f(x) = \\frac{2x + 3}{x - 4}$ ফাংশনটির ডোমেন ও রেঞ্জ নির্ণয় করো।","steps":["ফাংশনটি সংজ্ঞায়িত হওয়ার জন্য হর অশূন্য হতে হবে: $x - 4 \\neq 0 \\implies x \\neq 4$। সুতরাং ডোমেন $= \\mathbb{R} \\setminus \\{4\\}$।","ধরি, $y = \\frac{2x + 3}{x - 4}$। বজ্রগুণন করে পাই: $y(x - 4) = 2x + 3 \\implies xy - 4y = 2x + 3$।","$x$-যুক্ত পদ একপাশে এনে পাই: $x(y - 2) = 4y + 3 \\implies x = \\frac{4y + 3}{y - 2}$।","$x$ বাস্তব হওয়ার জন্য $y - 2 \\neq 0 \\implies y \\neq 2$। সুতরাং রেঞ্জ $= \\mathbb{R} \\setminus \\{2\\}$।"],"finalAnswer":"ডোমেন $= \\mathbb{R} \\setminus \\{4\\}$, রেঞ্জ $= \\mathbb{R} \\setminus \\{2\\}$।","markingTip":"ঢাবি লিখিত পরীক্ষায় ডোমেনের শর্ত ($x - 4 \\neq 0$) দেখানোর জন্য ১ নম্বর এবং $x$-কে $y$-এর মাধ্যমে প্রকাশ করে রেঞ্জ লেখার জন্য ১ নম্বর বরাদ্দ থাকে।"},{"id":"trig_func_w2","cardId":"trig_func_c3","marks":2,"q":"$f(x) = \\frac{3x - 1}{2x + 5}$ হলে $f^{-1}(x)$ নির্ণয় করো এবং $f^{-1}(1)$-এর মান বের করো।","steps":["ধরি, $y = f(x) = \\frac{3x - 1}{2x + 5}$, যেখানে $x = f^{-1}(y)$।","বজ্রগুণন করে $x$ আলাদা করি: $2xy + 5y = 3x - 1 \\implies x(2y - 3) = -5y - 1$।","$x = \\frac{-5y - 1}{2y - 3} = \\frac{5y + 1}{3 - 2y}$। চলক পরিবর্তন করে পাই $f^{-1}(x) = \\frac{5x + 1}{3 - 2x}$।","$x = 1$ বসিয়ে পাই: $f^{-1}(1) = \\frac{5(1) + 1}{3 - 2(1)} = \\frac{6}{1} = 6$।"],"finalAnswer":"$f^{-1}(x) = \\frac{5x + 1}{3 - 2x}$ এবং $f^{-1}(1) = 6$।","markingTip":"উত্তর লেখার পর ৩ সেকেন্ডে যাচাই করো: মূল ফাংশনে $x = 6$ বসালে $f(6) = \\frac{17}{17} = 1$ হয় কি না!"},{"id":"trig_func_w3","cardId":"trig_func_c2","marks":2,"q":"প্রমাণ করো যে $f: \\mathbb{R} \\to \\mathbb{R}$ যেখানে $f(x) = 5x - 3$, ফাংশনটি এক-এক এবং সার্বিক উভয়ই।","steps":["এক-এক প্রমাণ: ধরি $x_1, x_2 \\in \\mathbb{R}$-এর জন্য $f(x_1) = f(x_2)$। তাহলে $5x_1 - 3 = 5x_2 - 3 \\implies 5x_1 = 5x_2 \\implies x_1 = x_2$। সুতরাং $f$ এক-এক।","সার্বিক প্রমাণ: কোডোমেন থেকে যেকোনো $y \\in \\mathbb{R}$ নিই। $y = 5x - 3 \\implies x = \\frac{y + 3}{5} \\in \\mathbb{R}$।","যাচাই: $f\\left(\\frac{y + 3}{5}\\right) = 5\\left(\\frac{y + 3}{5}\\right) - 3 = y$। যেহেতু প্রতিটি $y \\in \\mathbb{R}$-এর প্রাক-প্রতিবিম্ব $\\mathbb{R}$-এ বিদ্যমান, তাই $f$ সার্বিক।"],"finalAnswer":"$f(x) = 5x - 3$ ফাংশনটি এক-এক এবং সার্বিক (অর্থাৎ বাইজেক্টিভ)।","markingTip":"সার্বিক প্রমাণে শেষ লাইনে $f(x) = y$ যাচাই করে দেখানো জরুরি—পূর্ণ ২ নম্বর পেতে পরীক্ষকরা এই ধাপটি দেখেন।"}],"subtitle":"1st Paper Ch. 8"},{"id":"trig_ratios","moduleId":"mod_trig","title":"ত্রিকোণমিতিক অনুপাত, বৃত্তচাপ ও লেখচিত্র","paperRef":"1st Paper Ch. 6","tier":2,"estMinutes":16,"cards":[{"id":"trig_ratios_c1","badge":"মূল ধারণা ১","title":"রেডিয়ান, বৃত্তচাপ ও বৃত্তকলার ক্ষেত্রফল","intuition":"বৃত্তের ব্যাসার্ধের সমান দৈর্ঘ্যের চাপ কেন্দ্রে যে কোণ উৎপন্ন করে, তাকে ১ রেডিয়ান বলে। বৃত্তচাপ $s = r\\theta$ বা বৃত্তকলার ক্ষেত্রফল $A = \\frac{1}{2}r^2\\theta$ সূত্রে $\\theta$ অবশ্যই রেডিয়ানে বসাতে হয়—ডিগ্রি সরাসরি বসালে উত্তর পুরোপুরি ভুল হয়ে যাবে!","formulas":[{"label":"ডিগ্রি–রেডিয়ান রূপান্তর","latex":"\\theta_{\\text{rad}} = \\theta^\\circ \\times \\frac{\\pi}{180^\\circ};\\qquad 1\\text{ rad} = \\frac{180^\\circ}{\\pi} \\approx 57.3^\\circ","whenToUse":"বৃত্তচাপ বা বৃত্তকলার সূত্র প্রয়োগের আগে যেকোনো ডিগ্রি কোণকে রেডিয়ানে নিতে।"},{"label":"বৃত্তচাপের দৈর্ঘ্য ও বৃত্তকলার ক্ষেত্রফল","latex":"s = r\\theta;\\qquad A = \\frac{1}{2}r^2\\theta = \\frac{1}{2}rs \\quad (\\theta \\text{ in radians})","whenToUse":"ব্যাসার্ধ $r$, কেন্দ্রস্থ কোণ $\\theta$, বৃত্তচাপ $s$ বা বৃত্তকলার ক্ষেত্রফল $A$ নির্ণয়ে।"},{"label":"ঘড়ির কাঁটার মধ্যবর্তী কোণ শর্টকাট","latex":"\\theta = |30H - 5.5M|^\\circ","whenToUse":"ঘণ্টা ($H$) ও মিনিটের ($M$) কাঁটার কোণ মুহূর্তেই বের করতে; মান $> 180^\\circ$ হলে $360^\\circ - \\theta$ নাও।"}],"symbols":[{"sym":"$s$","meaning":"বৃত্তচাপের দৈর্ঘ্য"},{"sym":"$r$","meaning":"বৃত্তের ব্যাসার্ধ"},{"sym":"$\\theta$","meaning":"কেন্দ্রস্থ কোণ (অবশ্যই রেডিয়ান এককে)"}],"example":{"problem":"$r = 12\\text{ cm}$ ব্যাসার্ধের একটি বৃত্তের কেন্দ্রস্থ কোণ $60^\\circ$ হলে বৃত্তচাপের দৈর্ঘ্য $s$ এবং বৃত্তকলার ক্ষেত্রফল $A$ নির্ণয় করো।","steps":["$60^\\circ$-কে রেডিয়ানে রূপান্তর করি: $\\theta = 60^\\circ \\times \\frac{\\pi}{180^\\circ} = \\frac{\\pi}{3}\\text{ rad}$।","বৃত্তচাপের দৈর্ঘ্য: $s = r\\theta = 12 \\times \\frac{\\pi}{3} = 4\\pi\\text{ cm}$।","বৃত্তকলার ক্ষেত্রফল: $A = \\frac{1}{2}rs = \\frac{1}{2}(12)(4\\pi) = 24\\pi\\text{ cm}^2$।"],"answer":"$s = 4\\pi\\text{ cm}$ এবং $A = 24\\pi\\text{ cm}^2$।"},"tip":"যখন $r$ এবং $s$ উভয়ই দেওয়া থাকে, তখন সরাসরি $A = \\frac{1}{2}rs$ বসাও—এটি ত্রিভুজের $\\frac{1}{2} \\times$ ভূমি $\\times$ উচ্চতা-এর মতোই সহজ!","check":{"q":"$120^\\circ$-কে রেডিয়ানে প্রকাশ করো।","a":"$120^\\circ \\times \\frac{\\pi}{180^\\circ} = \\frac{2\\pi}{3}\\text{ rad}$।"},"mythBuster":{"statement":"$r = 10\\text{ cm}$ ব্যাসার্ধ ও $30^\\circ$ কোণের জন্য বৃত্তচাপের দৈর্ঘ্য $s = 10 \\times 30 = 300\\text{ cm}$।","isTrue":false,"why":"$s = r\\theta$ সূত্রটি কেবল রেডিয়ানের জন্য প্রযোজ্য! $30^\\circ = \\frac{\\pi}{6}$ বসালে সঠিক বৃত্তচাপ হবে $s = \\frac{5\\pi}{3}\\text{ cm}$।"}},{"id":"trig_ratios_c2","badge":"মূল ধারণা ২","title":"চতুর্ভাগ চিহ্ন (ASTC) ও সংযুক্ত কোণ","intuition":"চারটি চতুর্ভাগে কোন অনুপাত ধনাত্মক তা মনে রাখার সহজ নিয়ম হলো ASTC ('All Students Take Calculus')। সংযুক্ত কোণ $n\\cdot 90^\\circ \\pm \\theta$ ভাঙার সময় দুটি ধাপ মানো: (১) ওই চতুর্ভাগে মূল অনুপাতের চিহ্ন কী, এবং (২) $n$ বিজোড় হলে সহ-অনুপাতে পরিবর্তন, আর জোড় হলে অনুপাত অপরিবর্তিত থাকবে।","formulas":[{"label":"চতুর্ভাগে চিহ্ন বিধি (ASTC)","latex":"\\text{Q1: All }(+);\\quad \\text{Q2: }\\sin,\\csc(+);\\quad \\text{Q3: }\\tan,\\cot(+);\\quad \\text{Q4: }\\cos,\\sec(+)","whenToUse":"যেকোনো চতুর্ভাগে ত্রিকোণমিতিক অনুপাতের ধনাত্মক বা ঋণাত্মক চিহ্ন নির্ণয়ে।"},{"label":"ঋণাত্মক কোণের অভেদ","latex":"\\cos(-\\theta)=\\cos\\theta,\\; \\sec(-\\theta)=\\sec\\theta;\\quad \\sin(-\\theta)=-\\sin\\theta,\\; \\tan(-\\theta)=-\\tan\\theta","whenToUse":"ঋণাত্মক কোণ দ্রুত সরলীকরণে—শুধু $\\cos$ ও $\\sec$ ঋণাত্মক চিহ্ন শোষণ করে।"},{"label":"সংযুক্ত কোণ রূপান্তর বিধি","latex":"n\\text{ even} \\implies \\text{same ratio};\\qquad n\\text{ odd} \\implies \\sin\\leftrightarrow\\cos,\\; \\tan\\leftrightarrow\\cot,\\; \\sec\\leftrightarrow\\csc","whenToUse":"ক্যালকুলেটর ছাড়াই $150^\\circ, 225^\\circ, 240^\\circ$-এর মতো কোণের মান বের করতে।"}],"symbols":[{"sym":"$\\text{Q1–Q4}$","meaning":"ধনাত্মক $x$-অক্ষ থেকে ঘড়ির কাঁটার বিপরীতে চারটি চতুর্ভাগ"},{"sym":"$n\\cdot 90^\\circ \\pm \\theta$","meaning":"সূক্ষ্মকোণ $\\theta$-এর মাধ্যমে সংযুক্ত কোণের প্রকাশ"}],"example":{"problem":"ক্যালকুলেটর ছাড়া $\\cos(240^\\circ) + \\sin(150^\\circ)$-এর মান নির্ণয় করো।","steps":["$240^\\circ = 180^\\circ + 60^\\circ$ তৃতীয় চতুর্ভাগে, যেখানে $\\cos$ ঋণাত্মক এবং $180^\\circ = 2(90^\\circ)$ জোড় হওয়ায় $\\cos$ অপরিবর্তিত। তাই $\\cos(240^\\circ) = -\\cos(60^\\circ) = -\\frac{1}{2}$।","$150^\\circ = 180^\\circ - 30^\\circ$ দ্বিতীয় চতুর্ভাগে, যেখানে $\\sin$ ধনাত্মক। তাই $\\sin(150^\\circ) = +\\sin(30^\\circ) = \\frac{1}{2}$।","যোগ করে পাই: $-\\frac{1}{2} + \\frac{1}{2} = 0$।"],"answer":"$0$।"},"tip":"যতটা সম্ভব $180^\\circ$ বা $360^\\circ$ ($90^\\circ$-এর জোড় গুণিতক) ব্যবহার করে কোণ ভাঙো—এতে অনুপাত পাল্টাতে হয় না, ভুলের আশঙ্কা অর্ধেক কমে যায়!","check":{"q":"$\\tan(225^\\circ)$-এর সঠিক মান কত?","a":"$225^\\circ = 180^\\circ + 45^\\circ$ (৩য় চতুর্ভাগ, যেখানে $\\tan > 0$), তাই $\\tan(225^\\circ) = +\\tan(45^\\circ) = 1$।"},"mythBuster":{"statement":"দ্বিতীয় চতুর্ভাগে $\\sin$ ধনাত্মক হওয়ায় $\\cos(90^\\circ + \\theta) = +\\sin\\theta$ হয়।","isTrue":false,"why":"চিহ্ন সর্বদা মূল ফাংশন ($\\cos$) দেখে নির্ধারিত হয়, পরিবর্তিত ফাংশন ($\\sin$) দেখে নয়! ২য় চতুর্ভাগে $\\cos$ ঋণাত্মক হওয়ায় $\\cos(90^\\circ + \\theta) = -\\sin\\theta$।"}},{"id":"trig_ratios_c3","badge":"মূল ধারণা ৩","title":"পিথাগোরীয় ত্রয়ী ও মৌলিক অভেদাবলি","intuition":"চারটি পিথাগোরীয় ত্রয়ী—$(3,4,5)$, $(5,12,13)$, $(8,15,17)$ এবং $(7,24,25)$—মুখস্থ থাকলে বর্গমূল ছাড়াই ৩ সেকেন্ডে অজানা বাহু ও ত্রিকোণমিতিক অনুপাত বের করা যায়। সাথে $\\sec\\theta \\pm \\tan\\theta$-এর গুণাত্মক বিপরীত কৌশল জানা থাকলে ঢাবির অভেদভিত্তিক এমসিকিউ ১৫ সেকেন্ডেই সমাধান হয়।","formulas":[{"label":"তিনটি মৌলিক পিথাগোরীয় অভেদ","latex":"\\sin^2\\theta+\\cos^2\\theta=1;\\qquad 1+\\tan^2\\theta=\\sec^2\\theta;\\qquad 1+\\cot^2\\theta=\\csc^2\\theta","whenToUse":"বর্গযুক্ত ত্রিকোণমিতিক অনুপাতগুলোর মধ্যে রূপান্তর ও সরলীকরণে।"},{"label":"গুণাত্মক বিপরীত অনুবন্ধী শর্টকাট","latex":"\\sec\\theta+\\tan\\theta=k \\iff \\sec\\theta-\\tan\\theta=\\frac{1}{k} \\implies \\sec\\theta=\\frac{1}{2}\\left(k+\\frac{1}{k}\\right)","whenToUse":"ঢাবি ভর্তি পরীক্ষায় অত্যন্ত জনপ্রিয়! $\\csc\\theta \\pm \\cot\\theta$-এর ক্ষেত্রেও একই সূত্র খাটে।"},{"label":"প্রধান চারটি পিথাগোরীয় ত্রয়ী","latex":"(3,4,5),\\quad (5,12,13),\\quad (8,15,17),\\quad (7,24,25)","whenToUse":"একটি অনুপাত ও চতুর্ভাগ দেওয়া থাকলে বাকি অনুপাতগুলো দ্রুত বের করতে।"}],"symbols":[{"sym":"$P, B, H$","meaning":"লম্ব, ভূমি ও অতিভুজ"},{"sym":"$\\csc\\theta$","meaning":"কোসেক্যান্ট ($\\frac{1}{\\sin\\theta}$), এনসিটিবি বইয়ে $\\operatorname{cosec}\\theta$ লেখা হয়"}],"example":{"problem":"$\\sec\\theta + \\tan\\theta = 3$ হলে ক্যালকুলেটর ছাড়াই $\\sec\\theta$-এর মান নির্ণয় করো।","steps":["$\\sec^2\\theta - \\tan^2\\theta = 1$ থেকে সরাসরি পাই $\\sec\\theta - \\tan\\theta = \\frac{1}{3}$।","সমীকরণ দুটি যোগ করে পাই: $2\\sec\\theta = 3 + \\frac{1}{3} = \\frac{10}{3}$।","$2$ দিয়ে ভাগ করে পাই: $\\sec\\theta = \\frac{5}{3}$।"],"answer":"$\\sec\\theta = \\frac{5}{3}$।"},"tip":"$\\sec\\theta + \\tan\\theta = k$ দেওয়া থাকলে যোগ করে পাই $\\sec\\theta = \\frac{k^2+1}{2k}$ এবং বিয়োগ করে পাই $\\tan\\theta = \\frac{k^2-1}{2k}$!","check":{"q":"$\\cos\\theta = -\\frac{5}{13}$ এবং $\\theta$ ৩য় চতুর্ভাগে থাকলে $\\sin\\theta$-এর মান কত?","a":"$(5,12,13)$ ত্রয়ী থেকে $|\\sin\\theta| = \\frac{12}{13}$; ৩য় চতুর্ভাগে $\\sin < 0$ হওয়ায় $\\sin\\theta = -\\frac{12}{13}$।"},"mythBuster":{"statement":"যেকোনো সূক্ষ্মকোণের জন্য $\\tan^2\\theta - \\sec^2\\theta = 1$ সত্য।","isTrue":false,"why":"যেহেতু $1 + \\tan^2\\theta = \\sec^2\\theta$, তাই $\\sec^2\\theta - \\tan^2\\theta = 1$ এবং $\\tan^2\\theta - \\sec^2\\theta = -1$।"}},{"id":"trig_ratios_c4","badge":"মূল ধারণা ৪","title":"ত্রিকোণমিতিক লেখচিত্রের ডোমেন, রেঞ্জ, পর্যায়কাল ও বিস্তার","intuition":"$y = A\\sin(Bx) + C$ বা $A\\cos(Bx) + C$ তরঙ্গের তিনটি প্রধান অংশ রয়েছে: $|A|$ হলো বিস্তার (মধ্যরেখা থেকে সর্বোচ্চ উচ্চতা), $B$ পর্যায়কালকে সংকুচিত করে $\\frac{2\\pi}{|B|}$ করে, আর $C$ লেখচিত্রকে ওপরে বা নিচে সরায়। অপরদিকে $\\tan$ ও $\\cot$-এর মৌলিক পর্যায়কাল $\\pi$।","formulas":[{"label":"সাইন ও কোসাইন তরঙ্গের সূত্র","latex":"y=A\\sin(Bx)+C: \\quad \\text{Amp}=|A|,\\; T=\\frac{2\\pi}{|B|},\\; \\text{Range}=[C-|A|,\\,C+|A|]","whenToUse":"সমীকরণ দেখেই সর্বোচ্চ মান, সর্বনিম্ন মান, বিস্তার ও পর্যায়কাল নির্ণয়ে।"},{"label":"ট্যানজেন্ট ও কোট্যানজেন্টের পর্যায়কাল","latex":"y=A\\tan(Bx)+C: \\quad T=\\frac{\\pi}{|B|},\\quad \\text{Range}=(-\\infty,\\infty)","whenToUse":"$\\tan$ ও $\\cot$-এর মূল পর্যায়কাল $\\pi$ ($2\\pi$ নয়) এবং এদের নির্দিষ্ট সসীম বিস্তার নেই।"},{"label":"জোড় ঘাত ও পরমমানের পর্যায়কাল অর্ধেক হওয়া","latex":"\\text{Period of } \\sin^{2k}(x),\\, \\cos^{2k}(x),\\, |\\sin x|,\\, |\\cos x| \\text{ is } \\pi","whenToUse":"বর্গ বা পরমমান নিলে ঋণাত্মক অর্ধ-তরঙ্গ ওপরে উঠে আসে, ফলে পর্যায়কাল $2\\pi$ থেকে অর্ধেক হয়ে $\\pi$ হয়।"}],"symbols":[{"sym":"$T$","meaning":"মৌলিক পর্যায়কাল"},{"sym":"$|A|$","meaning":"বিস্তার (সর্বদা ধনাত্মক)"},{"sym":"$C \\pm |A|$","meaning":"$A\\sin(Bx)+C$-এর সর্বোচ্চ ও সর্বনিম্ন মান"}],"example":{"problem":"$f(x) = -4\\cos(3x) + 2$ ফাংশনটির বিস্তার, পর্যায়কাল ও রেঞ্জ নির্ণয় করো।","steps":["বিস্তার $= |A| = |-4| = 4$ (বিস্তার কখনো ঋণাত্মক হয় না)।","পর্যায়কাল $T = \\frac{2\\pi}{|B|} = \\frac{2\\pi}{3}$।","রেঞ্জ $= [C - |A|, C + |A|] = [2 - 4, 2 + 4] = [-2, 6]$।"],"answer":"বিস্তার $= 4$, পর্যায়কাল $= \\frac{2\\pi}{3}$, রেঞ্জ $= [-2, 6]$।"},"tip":"$x$-এর সাথে $B$ গুণ করলে পর্যায়কাল $|B|$ দিয়ে ভাগ হয়—$B$ যত বড় হবে, তরঙ্গ তত ঘন ও দ্রুত পুনরাবৃত্ত হবে!","check":{"q":"$f(x) = 3\\tan(4x)$ ফাংশনটির পর্যায়কাল কত?","a":"$T = \\frac{\\pi}{4}$ (মনে রাখো, $\\tan$-এর মূল পর্যায়কাল $\\pi$, $2\\pi$ নয়)।"},"mythBuster":{"statement":"$y = -5\\sin(2x)$ ফাংশনটির বিস্তার $-5$ এবং পর্যায়কাল $4\\pi$।","isTrue":false,"why":"বিস্তার সর্বদা অঋণাত্মক ($|-5| = 5$), আর $x$-এর সহগ $2$ হওয়ায় পর্যায়কাল ভাগ হয়ে $T = \\frac{2\\pi}{2} = \\pi$ হয়, $4\\pi$ নয়।"}}],"mcqs":[{"id":"trig_ratios_q1","cardId":"trig_ratios_c1","qType":"num tGroup":"trig_domain_range_bounds","q":"যেকোনো বাস্তব কোণ $\\theta$-এর জন্য $\\sec\\theta$-এর নিচের কোন মানটি অসম্ভব?","opts":["$-2$","$1$","$\\frac{5}{3}$","$\\frac{1}{2}$"],"ans":3,"tags":["pyq-pattern","formula-trap"],"exp":"$|\\cos\\theta| \\le 1$ হওয়ায় এর বিপরীত $|\\sec\\theta| \\ge 1$, অর্থাৎ রেঞ্জ $(-\\infty, -1] \\cup [1, \\infty)$। তাই $(-1, 1)$ ব্যবধির ভেতরের মান $\\frac{1}{2}$ কখনো সম্ভব নয়।","variants":[]},{"id":"trig_ratios_q21","cardId":"trig_ratios_c4","qType":"conceptual","conceptGroup":"trig_domain_range_bounds","q":"$x$-এর কোন মানগুলোর জন্য $y = \\tan x$ অসংজ্ঞায়িত (ডোমেন থেকে বাদ পড়ে)?","opts":["$\\frac{\\pi}{2}$-এর বিজোড় গুণিতক, অর্থাৎ $(2n+1)\\frac{\\pi}{2}$","$\\pi$-এর পূর্ণ গুণিতক, অর্থাৎ $n\\pi$","$\\pi$-এর জোড় গুণিতক, অর্থাৎ $2n\\pi$","সকল বাস্তব সংখ্যা $\\mathbb{R}$-এর জন্য সংজ্ঞায়িত"],"ans":0,"tags":["graph-visual","board-standard"],"exp":"$\\tan x = \\frac{\\sin x}{\\cos x}$ হওয়ায় যেখানে $\\cos x = 0$, অর্থাৎ $x = (2n+1)\\frac{\\pi}{2}$ ($n \\in \\mathbb{Z}$) বিন্দুতে $\\tan x$ অসংজ্ঞায়িত। $n\\pi$ বাদ পড়ে $\\cot x$ ও $\\csc x$-এর ডোমেন থেকে।","variants":[]},{"id":"trig_ratios_q22","cardId":"trig_ratios_c4","qType":"conceptual","conceptGroup":"trig_domain_range_bounds","q":"$y = \\sin x$ এবং $y = \\cos x$-এর লেখচিত্রের তুলনায় নিচের কোন বক্তব্যটি সঠিক?","opts":["$\\cos x$-এর পর্যায়কাল $\\sin x$-এর অর্ধেক","উভয়ের বিস্তার $1$ ও পর্যায়কাল $2\\pi$, এবং $\\cos x = \\sin\\left(x + \\frac{\\pi}{2}\\right)$","$\\sin x$-এর রেঞ্জ $[0, 1]$ কিন্তু $\\cos x$-এর রেঞ্জ $[-1, 1]$","উভয় লেখচিত্রই মূলবিন্দু $(0, 0)$ দিয়ে যায়"],"ans":1,"tags":["graph-visual","board-standard"],"exp":"উভয়ের বিস্তার $1$, রেঞ্জ $[-1, 1]$ এবং পর্যায়কাল $2\\pi$; $y = \\sin x$-কে বামে $\\frac{\\pi}{2}$ সরালে $y = \\cos x$ পাওয়া যায়। কেবল $\\sin x$ মূলবিন্দুগামী, কারণ $\\cos(0) = 1$।","variants":[]},{"id":"trig_ratios_q23","cardId":"trig_ratios_c1","qType":"conceptual","conceptGroup":"radian_and_identity_concepts","q":"$1$ রেডিয়ান কোণের সঠিক সংজ্ঞা কোনটি?","opts":["বৃত্তের ব্যাসের সমান চাপ কেন্দ্রে যে কোণ উৎপন্ন করে","এক সমকোণের ঠিক $\\frac{1}{100}$ অংশ","বৃত্তের ব্যাসার্ধ $r$-এর সমান দৈর্ঘ্যের চাপ কেন্দ্রে যে কোণ উৎপন্ন করে","এমন কোণ যার ডিগ্রি মান বৃত্তের ব্যাসার্ধের ওপর নির্ভর করে"],"ans":2,"tags":["board-standard","formula-trap"],"exp":"$\\theta = \\frac{s}{r}$ অনুযায়ী $s = r$ হলে $\\theta = 1\\text{ rad} \\approx 57.3^\\circ$ হয়, যা বৃত্তের আকারের ওপর নির্ভরশীল নয় (ধ্রুব কোণ)। ব্যাসের সমান চাপ ($2r$) কেন্দ্রে $2$ রেডিয়ান কোণ তৈরি করে।","variants":[]},{"id":"trig_ratios_q24","cardId":"trig_ratios_c3","qType":"conceptual","conceptGroup":"radian_and_identity_concepts","q":"নিচের কোনটি সকল সংজ্ঞায়িত কোণের জন্য সঠিক মৌলিক ত্রিকোণমিতিক অভেদ?","opts":["$\\tan^2\\theta - \\sec^2\\theta = 1$","$\\sin^2\\theta - \\cos^2\\theta = 1$","$\\cot^2\\theta - \\csc^2\\theta = 1$","$\\sec^2\\theta - \\tan^2\\theta = 1$"],"ans":3,"tags":["formula-trap","board-standard"],"exp":"$\\sin^2\\theta + \\cos^2\\theta = 1$-কে $\\cos^2\\theta$ দিয়ে ভাগ করলে $1 + \\tan^2\\theta = \\sec^2\\theta \\implies \\sec^2\\theta - \\tan^2\\theta = 1$ পাওয়া যায়। বিয়োগের ক্রম উল্টে দিলে $-1$ হয়, $+1$ নয়।","variants":[]},{"id":"trig_ratios_q25","cardId":"trig_ratios_c4","qType":"conceptual","conceptGroup":"radian_and_identity_concepts","q":"$y = \\sin x$ থেকে $y = \\sin^2 x$-এ রূপান্তর করলে পর্যায়কাল ও রেঞ্জের কী পরিবর্তন হয়?","opts":["পর্যায়কাল অর্ধেক হয়ে $2\\pi$ থেকে $\\pi$ হয় এবং রেঞ্জ $[-1, 1]$ থেকে $[0, 1]$ হয়","পর্যায়কাল $2\\pi$ এবং রেঞ্জ $[-1, 1]$ অপরিবর্তিত থাকে","পর্যায়কাল দ্বিগুণ হয়ে $4\\pi$ হয় এবং রেঞ্জ $[0, 1]$ হয়","পর্যায়কাল অর্ধেক হয়ে $\\pi$ হয় এবং রেঞ্জ $[-1, 0]$ হয়"],"ans":0,"tags":["pyq-pattern","graph-visual"],"exp":"$\\sin^2 x = \\frac{1 - \\cos(2x)}{2}$ হওয়ায় কম্পাঙ্ক দ্বিগুণ হয়ে পর্যায়কাল অর্ধেক ($\\pi$) হয়, আর বর্গ করায় সকল মান অঋণাত্মক হয়ে রেঞ্জ $[0, 1]$-এ সীমাবদ্ধ হয়।","variants":[]}],"writtenDrills":[{"id":"trig_ratios_w1","cardId":"trig_ratios_c1","marks":2,"q":"একটি বৃত্তকলার ব্যাসার্ধ $r = 10\\text{ cm}$ এবং বৃত্তচাপের দৈর্ঘ্য $s = 15\\text{ cm}$। কেন্দ্রস্থ কোণ $\\theta$ (রেডিয়ানে) এবং বৃত্তকলার ক্ষেত্রফল নির্ণয় করো।","steps":["বৃত্তচাপের সূত্র $s = r\\theta$ থেকে পাই: $\\theta = \\frac{s}{r} = \\frac{15}{10} = 1.5\\text{ rad}$ (বা $\\frac{3}{2}\\text{ rad}$)।","বৃত্তকলার ক্ষেত্রফল: $A = \\frac{1}{2}rs = \\frac{1}{2}(10)(15) = 75\\text{ cm}^2$।","(যাচাই: $A = \\frac{1}{2}r^2\\theta = \\frac{1}{2}(100)(1.5) = 75\\text{ cm}^2$।)"],"finalAnswer":"$\\theta = 1.5\\text{ rad}$ এবং ক্ষেত্রফল $= 75\\text{ cm}^2$।","markingTip":"উত্তরে অবশ্যই একক ('$\\text{rad}$' ও '$\\text{cm}^2$') লিখবে—একক বাদ পড়লে ঢাবির ২ নম্বরের লিখিত প্রশ্নে $0.5$ নম্বর কাটা যেতে পারে।"},{"id":"trig_ratios_w2","cardId":"trig_ratios_c3","marks":2,"q":"$\\tan\\theta = -\\frac{12}{5}$ এবং $\\sin\\theta > 0$ হলে $\\sin\\theta$ ও $\\cos\\theta$-এর সঠিক মান নির্ণয় করো।","steps":["চতুর্ভাগ নির্ণয়: $\\tan\\theta < 0$ এবং $\\sin\\theta > 0$ একসাথে কেবল দ্বিতীয় চতুর্ভাগে ঘটে।","$|\\tan\\theta| = \\frac{\\text{P}}{\\text{B}} = \\frac{12}{5}$ থেকে $(5, 12, 13)$ পিথাগোরীয় ত্রয়ী ব্যবহার করে অতিভুজ $H = \\sqrt{12^2 + 5^2} = 13$।","২য় চতুর্ভাগের চিহ্ন ($\\sin > 0$, $\\cos < 0$) বসিয়ে পাই: $\\sin\\theta = +\\frac{12}{13}$ এবং $\\cos\\theta = -\\frac{5}{13}$।"],"finalAnswer":"$\\sin\\theta = \\frac{12}{13}$ এবং $\\cos\\theta = -\\frac{5}{13}$।","markingTip":"চিহ্ন বসানোর আগে স্পষ্টভাবে 'দ্বিতীয় চতুর্ভাগ' লিখে দেখালে পদ্ধতির পূর্ণ নম্বর নিশ্চিত হয়।"},{"id":"trig_ratios_w3","cardId":"trig_ratios_c3","marks":2,"q":"$\\sec\\theta + \\tan\\theta = 5$ হলে ক্যালকুলেটর ছাড়াই $\\sec\\theta$ এবং $\\sin\\theta$-এর সঠিক মান নির্ণয় করো।","steps":["$\\sec^2\\theta - \\tan^2\\theta = 1 \\implies (\\sec\\theta + \\tan\\theta)(\\sec\\theta - \\tan\\theta) = 1$, সুতরাং $\\sec\\theta - \\tan\\theta = \\frac{1}{5}$।","সমীকরণ দুটি যোগ করে পাই: $2\\sec\\theta = 5 + \\frac{1}{5} = \\frac{26}{5} \\implies \\sec\\theta = \\frac{13}{5}$।","সমীকরণ দুটি বিয়োগ করে পাই: $2\\tan\\theta = 5 - \\frac{1}{5} = \\frac{24}{5} \\implies \\tan\\theta = \\frac{12}{5}$।","অতএব $\\sin\\theta = \\frac{\\tan\\theta}{\\sec\\theta} = \\frac{12/5}{13/5} = \\frac{12}{13}$।"],"finalAnswer":"$\\sec\\theta = \\frac{13}{5}$ এবং $\\sin\\theta = \\frac{12}{13}$।","markingTip":"$\\sqrt{1 - \\cos^2\\theta}$ করার চেয়ে সরাসরি $\\sin\\theta = \\frac{\\tan\\theta}{\\sec\\theta}$ ব্যবহার করা অনেক দ্রুত ও নির্ভুল।"}],"subtitle":"1st Paper Ch. 6"},{"id":"trig_angles","moduleId":"mod_trig","title":"সংযুক্ত, যৌগিক, গুণিতক কোণ ও ত্রিভুজের ধর্মাবলি","subtitle":"কোণ হ্রাসকরণ সূত্র, যৌগিক ও গুণিতক কোণ, যোগফল-গুণফল রূপান্তর এবং সাইন ও কোসাইন সূত্র","paperRef":"১ম পত্র, অধ্যায় ৭","tier":1,"estMinutes":18,"cards":[{"id":"trig_angles_c1","badge":"কোণ হ্রাসকরণ","title":"সংযুক্ত কোণ ও ASTC চতুর্ভাগ নিয়ম","intuition":"যেকোনো বড় বা ঋণাত্মক কোণকে $n\\cdot 90^\\circ \\pm \\theta$ আকারে লিখে প্রথম চতুর্ভাগে নামিয়ে আনা যায়। $n$ বিজোড় হলে অনুপাতটি তার সহ-অনুপাতে পরিবর্তিত হয়, $n$ জোড় হলে অনুপাত অপরিবর্তিত থাকে, আর চিহ্ন সবসময় মূল ফাংশনের ASTC চতুর্ভাগ থেকে আসে।","formulas":[{"label":"৯০°-এর জোড় গুণিতক","latex":"f(2k\\cdot 90^\\circ \\pm \\theta) = \\pm f(\\theta)","whenToUse":"$180^\\circ$ বা $360^\\circ$-এর কাছাকাছি কোণকে অনুপাত না বদলে সরল করতে।"},{"label":"৯০°-এর বিজোড় গুণিতক","latex":"f((2k+1)\\cdot 90^\\circ \\pm \\theta) = \\pm \\operatorname{cof}(\\theta)","whenToUse":"$90^\\circ$ বা $270^\\circ$-এর কাছাকাছি কোণে সহ-অনুপাত ($\\sin\\leftrightarrow\\cos$, $\\tan\\leftrightarrow\\cot$, $\\sec\\leftrightarrow\\csc$) ব্যবহারে।"},{"label":"ঋণাত্মক কোণের নিয়ম","latex":"\\cos(-\\theta)=\\cos\\theta,\\quad \\sin(-\\theta)=-\\sin\\theta,\\quad \\tan(-\\theta)=-\\tan\\theta","whenToUse":"কোনো কোণ ঋণাত্মক হলে চতুর্থ চতুর্ভাগের ধর্ম অনুযায়ী চিহ্ন বের করতে।"}],"symbols":[{"sym":"$n$","meaning":"সংযুক্ত কোণে $90^\\circ$ ($\\frac{\\pi}{2}$)-এর পূর্ণসংখ্যা গুণিতক"},{"sym":"$\\theta$","meaning":"চিহ্ন নির্ণয়ের জন্য ধনাত্মক সূক্ষ্মকোণ ($0^\\circ < \\theta < 90^\\circ$)"},{"sym":"$\\text{ASTC}$","meaning":"চতুর্ভাগভেদে ধনাত্মক অনুপাত: ১ম All, ২য় Sin/Csc, ৩য় Tan/Cot, ৪র্থ Cos/Sec"}],"example":{"problem":"ক্যালকুলেটর ছাড়াই $\\cos 240^\\circ$-এর সঠিক মান নির্ণয় কর।","steps":["$240^\\circ = 2\\cdot 90^\\circ + 60^\\circ = 180^\\circ + 60^\\circ$ আকারে লিখি।","এখানে $n = 2$ জোড় সংখ্যা হওয়ায় $\\cos$ অপরিবর্তিত থাকবে।","$240^\\circ$ কোণটি ৩য় চতুর্ভাগে অবস্থিত, যেখানে $\\cos$ ঋণাত্মক; তাই $\\cos 240^\\circ = -\\cos 60^\\circ = -\\frac{1}{2}$।"],"answer":"$-\\frac{1}{2}$"},"tip":"পরীক্ষার হলে $90^\\circ \\pm \\theta$ বা $270^\\circ \\pm \\theta$-এর বদলে সবসময় $180^\\circ \\pm \\theta$ বা $360^\\circ \\pm \\theta$ ব্যবহার করো—জোড় গুণিতক নিলে অনুপাত বদলানোর ভুল হয় না।","check":{"q":"$\\sin(270^\\circ + \\theta)$-এর সরলীকৃত রূপ ও চিহ্ন কী হবে?","a":"$-\\cos\\theta$ ($n=3$ বিজোড় হওয়ায় $\\sin\\to\\cos$, আর $270^\\circ + \\theta$ ৪র্থ চতুর্ভাগে হওয়ায় মূল $\\sin$ ঋণাত্মক)।"},"mythBuster":{"statement":"$\\cos(90^\\circ + \\theta)$-এর চিহ্ন বের করতে ২য় চতুর্ভাগে $\\sin$ ধনাত্মক কি না তা দেখতে হয়।","isTrue":false,"why":"চিহ্ন সবসময় মূল ফাংশনের ($\\cos$) চতুর্ভাগ দেখে ঠিক করতে হয়, রূপান্তরিত সহ-অনুপাতের ($\\sin$) নয়। ২য় চতুর্ভাগে $\\cos$ ঋণাত্মক, তাই $\\cos(90^\\circ + \\theta) = -\\sin\\theta$।"}},{"id":"trig_angles_c2","badge":"যৌগিক ও C-D সূত্র","title":"যৌগিক কোণ ও যোগফল-গুণফল রূপান্তর","intuition":"যৌগিক কোণের সূত্র দিয়ে $15^\\circ$ বা $75^\\circ$-এর মতো কোণকে $45^\\circ \\pm 30^\\circ$-এ ভেঙে মান বের করা যায়। আর যোগফল থেকে গুণফলে (C-D সূত্র) রূপান্তর করলে ভগ্নাংশের লব ও হরের সাধারণ উৎপাদক সহজেই কাটাকাটি হয়ে যায়।","formulas":[{"label":"সাইন ও কোসাইনের যৌগিক কোণ","latex":"\\sin(A\\pm B)=\\sin A\\cos B \\pm \\cos A\\sin B,\\quad \\cos(A\\pm B)=\\cos A\\cos B \\mp \\sin A\\sin B","whenToUse":"মিশ্র সাইন-কোসাইন গুণফলকে একটি কোণে সংকুচিত বা বিস্তৃত করতে।"},{"label":"ট্যানজেন্টের যৌগিক কোণ ও ৪৫° শর্টকাট","latex":"\\tan(A\\pm B)=\\frac{\\tan A\\pm\\tan B}{1\\mp\\tan A\\tan B},\\quad \\tan(45^\\circ\\pm\\theta)=\\frac{1\\pm\\tan\\theta}{1\\mp\\tan\\theta}","whenToUse":"$\\frac{\\cos\\theta \\pm \\sin\\theta}{\\cos\\theta \\mp \\sin\\theta}$ অথবা $A+B=45^\\circ$ জাতীয় সমস্যায়।"},{"label":"যোগফল-বিয়োগফল থেকে গুণফল (C-D সূত্র)","latex":"\\sin C+\\sin D=2\\sin\\frac{C+D}{2}\\cos\\frac{C-D}{2},\\quad \\cos C-\\cos D=2\\sin\\frac{C+D}{2}\\sin\\frac{D-C}{2}","whenToUse":"$\\frac{\\sin 75^\\circ + \\sin 15^\\circ}{\\cos 75^\\circ + \\cos 15^\\circ}$-এর মতো অনুপাত দ্রুত সরল করতে।"}],"symbols":[{"sym":"$A, B$","meaning":"যৌগিক কোণের দুটি উপাদান কোণ"},{"sym":"$C, D$","meaning":"যোগফল-গুণফল রূপান্তরে ব্যবহৃত দুটি কোণ"},{"sym":"$\\frac{D-C}{2}$","meaning":"$\\cos C - \\cos D$ সূত্রে বিপরীত ক্রমের অর্ধ-পার্থক্য"}],"example":{"problem":"$\\frac{\\sin 75^\\circ + \\sin 15^\\circ}{\\cos 75^\\circ + \\cos 15^\\circ}$-এর মান নির্ণয় কর।","steps":["লব: $\\sin 75^\\circ + \\sin 15^\\circ = 2\\sin 45^\\circ\\cos 30^\\circ$।","হর: $\\cos 75^\\circ + \\cos 15^\\circ = 2\\cos 45^\\circ\\cos 30^\\circ$।","উভয় পক্ষ থেকে $2\\cos 30^\\circ$ বাদ দিলে থাকে $\\frac{\\sin 45^\\circ}{\\cos 45^\\circ} = \\tan 45^\\circ = 1$।"],"answer":"$1$"},"tip":"সুপার শর্টকাট: $\\frac{\\sin C + \\sin D}{\\cos C + \\cos D} = \\tan\\left(\\frac{C+D}{2}\\right)$—দুটি কোণের গড় নিয়ে সরাসরি $\\tan$ বসালেই উত্তর!","check":{"q":"যদি $A + B = 45^\\circ$ হয়, তবে $(1 + \\tan A)(1 + \\tan B)$-এর মান কত?","a":"$2$, কারণ $\\tan A + \\tan B = 1 - \\tan A\\tan B \\implies 1 + \\tan A + \\tan B + \\tan A\\tan B = 2$।"},"mythBuster":{"statement":"$\\cos C - \\cos D = 2\\sin\\frac{C+D}{2}\\sin\\frac{C-D}{2}$।","isTrue":false,"why":"দ্বিতীয় উৎপাদকে কোণের ক্রম উল্টে $\\frac{D-C}{2}$ হয় (অথবা সামনে মাইনাস চিহ্ন দিয়ে $-2\\sin\\frac{C+D}{2}\\sin\\frac{C-D}{2}$ লিখতে হয়)।"}},{"id":"trig_angles_c3","badge":"গুণিতক ও উপগুণিতক","title":"গুণিতক, উপগুণিতক কোণ ও শর্তাধীন অভেদ","intuition":"গুণিতক ($2A, 3A$) ও উপগুণিতক ($\\frac{A}{2}$) কোণের সূত্রগুলো বর্গ বা ঘন রাশিকে ($\\cos^2\\theta, \\sin^3\\theta$) সরল রৈখিক কোণে নিয়ে আসে। আর যেকোনো ত্রিভুজে $A+B+C=\\pi$ শর্তে ট্যানজেন্টের যোগফল তাদের গুণফলের সমান হয়।","formulas":[{"label":"দ্বিগুণ কোণ ও ঘাত-হ্রাস সূত্র","latex":"\\sin 2A = 2\\sin A\\cos A = \\frac{2\\tan A}{1+\\tan^2 A},\\quad 1-\\cos 2A = 2\\sin^2 A,\\quad 1+\\cos 2A = 2\\cos^2 A","whenToUse":"$1\\pm\\cos 2A$-কে একক বর্গ রাশিতে আনতে বা $\\tan A$ থেকে $\\sin 2A$ বের করতে।"},{"label":"ত্রিগুণ কোণের সূত্র","latex":"\\sin 3A = 3\\sin A - 4\\sin^3 A,\\quad \\cos 3A = 4\\cos^3 A - 3\\cos A","whenToUse":"$3\\sin 20^\\circ - 4\\sin^3 20^\\circ = \\sin 60^\\circ$-এর মতো ঘন রাশি এক ধাপে সংকুচিত করতে।"},{"label":"ত্রিভুজের শর্তাধীন অভেদ","latex":"A+B+C=\\pi \\implies \\tan A + \\tan B + \\tan C = \\tan A\\tan B\\tan C","whenToUse":"যখন তিনটি কোণের সমষ্টি $180^\\circ$ বা $\\pi$ দেওয়া থাকে।"}],"symbols":[{"sym":"$2A, 3A$","meaning":"কোণ $A$-এর গুণিতক কোণ"},{"sym":"$\\frac{A}{2}$","meaning":"কোণ $A$-এর উপগুণিতক বা অর্ধকোণ"},{"sym":"$\\pi$","meaning":"শর্তাধীন অভেদে ত্রিভুজের তিন কোণের সমষ্টি ($180^\\circ$)"}],"example":{"problem":"ক্যালকুলেটর ছাড়া $4\\cos^3 10^\\circ - 3\\cos 10^\\circ$-এর মান বের কর।","steps":["$\\cos 3A = 4\\cos^3 A - 3\\cos A$ সূত্রটির সাথে মেলাই, যেখানে $A = 10^\\circ$।","মান বসালে পাই $\\cos(3\\cdot 10^\\circ) = \\cos 30^\\circ$।","আমরা জানি, $\\cos 30^\\circ = \\frac{\\sqrt{3}}{2}$।"],"answer":"$\\frac{\\sqrt{3}}{2}$"},"tip":"মনে রাখার কৌশল: $\\sin 3A$ হলো '৩৪' ($3\\sin - 4\\sin^3$) আর $\\cos 3A$ হলো '৪৩' ($4\\cos^3 - 3\\cos$)। এছাড়া $\\frac{1-\\cos 2\\theta}{\\sin 2\\theta} = \\tan\\theta$ খুব কাজে লাগে।","check":{"q":"উপগুণিতক কোণের সূত্র ব্যবহার করে $\\frac{1 - \\cos 60^\\circ}{1 + \\cos 60^\\circ}$-এর মান কত?","a":"$\\tan^2 30^\\circ = \\frac{1}{3}$ (যেহেতু $\\frac{1-\\cos 2\\theta}{1+\\cos 2\\theta} = \\tan^2\\theta$)।"},"mythBuster":{"statement":"যেকোনো কোণ $\\theta$-এর জন্য $\\sqrt{1 + \\sin 2\\theta}$ সবসময় $\\cos\\theta + \\sin\\theta$-এর সমান।","isTrue":false,"why":"$\\sqrt{(\\cos\\theta+\\sin\\theta)^2} = |\\cos\\theta + \\sin\\theta|$, যা $\\cos\\theta + \\sin\\theta < 0$ হলে $-(\\cos\\theta+\\sin\\theta)$ হয়।"}},{"id":"trig_angles_c4","badge":"ত্রি
