    @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap');

    :root {
      --font-sans: 'Hind Siliguri', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    body {
      font-family: var(--font-sans);
      -webkit-tap-highlight-color: transparent;
    }

    /* Smooth custom scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.4); border-radius: 9999px; }

    /* SoloLearn-style 3D button press */
    .btn-3d {
      transition: transform 0.08s ease, box-shadow 0.08s ease, background-color 0.15s ease;
    }
    .btn-3d:active:not(:disabled) {
      transform: translateY(2px);
    }

    /* Node connector line */
    .path-line {
      background: repeating-linear-gradient(
        to bottom,
        #cbd5e1 0px,
        #cbd5e1 6px,
        transparent 6px,
        transparent 12px
      );
    }
    .dark .path-line {
      background: repeating-linear-gradient(
        to bottom,
        #334155 0px,
        #334155 6px,
        transparent 6px,
        transparent 12px
      );
    }

    @keyframes slideUp {
      from { opacity: 0.7; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-slide-up {
      animation: slideUp 0.14s ease-out forwards;
    }

    @keyframes popIn {
      0% { transform: scale(0.92); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    .animate-pop {
      animation: popIn 0.2s ease-out forwards;
    }

    @media print {
      header, nav, .no-print { display: none !important; }
      body { background: #ffffff !important; color: #000000 !important; }
      .print-break { break-inside: avoid; }
    }
  </style>

// Build flat index of built-in lessons & MCQs
const BUILTIN_LESSONS = [];
const BUILTIN_MCQS = [];
MODULES.forEach((mod) => {
  mod.lessons.forEach((les) => {
    les.moduleId = mod.id;
    les.moduleTitle = mod.title;
    les.moduleColor = mod.color;
    les.globalIndex = BUILTIN_LESSONS.length;
    les.mcqs.forEach((m, qIdx) => {
      m.id = `${les.id}_q${qIdx + 1}`;
      m.lessonId = les.id;
      m.lessonTitle = les.title;
      m.moduleId = mod.id;
      m.moduleTitle = mod.title;
      BUILTIN_MCQS.push(m);
    });
    BUILTIN_LESSONS.push(les);
  });
});

let ALL_LESSONS = [...BUILTIN_LESSONS];
let ALL_MCQS = [...BUILTIN_MCQS];

function rebuildDynamicIndex() {
  ALL_LESSONS = [...BUILTIN_LESSONS];
  ALL_MCQS = [...BUILTIN_MCQS];
  const customs = Array.isArray(state?.customLessons) ? state.customLessons : [];
  customs.forEach((cl, idx) => {
    const les = {
      ...cl,
      isCustom: true,
      code: `AI-${toBnNum(idx + 1)}`,
      moduleTitle: 'AI কনফিউশন ল্যাব',
      moduleColor: 'amber',
      globalIndex: ALL_LESSONS.length
    };
    les.mcqs = (cl.mcqs || []).map((m, qIdx) => {
      const item = {
        ...m,
        id: m.id || `${cl.id}_q${qIdx + 1}`,
        lessonId: cl.id,
        lessonTitle: cl.title,
        moduleId: cl.moduleId || 'custom',
        moduleTitle: 'AI কনফিউশন ল্যাব'
      };
      ALL_MCQS.push(item);
      return item;
    });
    ALL_LESSONS.push(les);
  });
}

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return structuredClone(DEFAULT_STATE);
    const parsed = JSON.parse(raw);
    return {
      ...structuredClone(DEFAULT_STATE),
      ...parsed,
      qbProgress: parsed.qbProgress && typeof parsed.qbProgress === 'object' ? parsed.qbProgress : {},
      qbBookmarks: Array.isArray(parsed.qbBookmarks) ? parsed.qbBookmarks : [],
      qbFilter: { ...DEFAULT_STATE.qbFilter, ...(parsed.qbFilter || {}) },
      mockConfig: { ...DEFAULT_STATE.mockConfig, ...(parsed.mockConfig || {}) },
      mockSession: null // always start fresh on reload
    };
  } catch (e) {
    return structuredClone(DEFAULT_STATE);
  }
}

const OWNER_DEFAULT_PHONE_PROFILE = 'phone_8801339129852';
let syncStatus = 'idle'; // idle | syncing | synced | offline | error | unlinked
let lastSyncTime = 0;
let syncPushTimer = null;

function toEnDigits(str) {
  const bn = '০১২৩৪৫৬৭৮৯';
  return String(str || '').replace(/[০-৯]/g, (ch) => String(bn.indexOf(ch)));
}

function normalizePhoneToProfile(raw) {
  const ascii = toEnDigits(raw).trim();
  if (!ascii) return null;
  if (/^phone_[0-9]{8,15}$/.test(ascii)) return ascii;
  let digits = ascii.replace(/[^0-9]/g, '');
  if (digits.startsWith('00')) digits = digits.slice(2);
  // Normalize Bangladeshi local 11-digit mobile numbers (01XXXXXXXXX -> 8801XXXXXXXXX)
  if (digits.length === 11 && digits.startsWith('01')) {
    digits = '88' + digits;
  }
  if (digits.length < 8 || digits.length > 15) return null;
  return 'phone_' + digits;
}

function formatProfileDisplay(profile) {
  if (!profile) return 'লিংক করা নেই';
  if (profile.startsWith('phone_')) return '+' + profile.slice(6);
  return profile;
}

function migrateLegacyOwnerProfile() {
  try {
    const saved = (localStorage.getItem(SYNC_PROFILE_KEY) || '').trim();
    if (saved === 'trewqChern-main') {
      localStorage.setItem(SYNC_PROFILE_KEY, OWNER_DEFAULT_PHONE_PROFILE);
      return;
    }
    // If no profile saved yet, but browser already has cached local progress from before phone onboarding,
    // migrate it automatically to the owner's phone number so nothing is lost.
    if (!saved) {
      const rawState = localStorage.getItem(STORAGE_KEY);
      if (rawState) {
        const parsed = JSON.parse(rawState);
        const hasProgress = (parsed.xp > 0) ||
          (parsed.completedLessons && Object.keys(parsed.completedLessons).length > 0) ||
          (Array.isArray(parsed.customLessons) && parsed.customLessons.length > 0);
        if (hasProgress) {
          localStorage.setItem(SYNC_PROFILE_KEY, OWNER_DEFAULT_PHONE_PROFILE);
        }
      }
    }
  } catch (e) {}
}

migrateLegacyOwnerProfile();

function getSyncProfile() {
  try {
    const p = (localStorage.getItem(SYNC_PROFILE_KEY) || '').trim();
    if (!p) return '';
    return /^[a-zA-Z0-9_-]{2,64}$/.test(p) ? p : '';
  } catch (e) {
    return '';
  }
}

function setSyncPhone(rawPhone) {
  const normalized = normalizePhoneToProfile(rawPhone);
  if (!normalized) return null;
  try {
    localStorage.setItem(SYNC_PROFILE_KEY, normalized);
    localStorage.removeItem(SYNC_SKIP_KEY);
  } catch (e) {}
  return normalized;
}


function getSyncPayload() {
  return {
    xp: state.xp,
    streak: state.streak,
    hearts: state.hearts,
    unlimitedHearts: state.unlimitedHearts,
    unlockAll: state.unlockAll,
    darkMode: state.darkMode,
    completedLessons: state.completedLessons,
    mistakes: state.mistakes,
    bookmarks: state.bookmarks,
    customLessons: state.customLessons || [],
    aiChatHistory: (state.aiChatHistory || []).slice(-30),
    qbProgress: state.qbProgress || {},
    qbBookmarks: state.qbBookmarks || [],
    updatedAt: state.updatedAt || Date.now()
  };
}

function updateSyncBadge(status) {
  syncStatus = status;
  const btn = document.getElementById('btn-sync-status');
  const lbl = document.getElementById('stat-sync-label');
  if (!btn || !lbl) return;
  if (status === 'syncing') {
    lbl.textContent = 'সিঙ্ক...';
    btn.className = 'flex items-center gap-1 px-2 py-1 rounded-lg bg-blue-50 dark:bg-blue-950/50 border border-blue-200/70 dark:border-blue-800/60 text-blue-700 dark:text-blue-300 text-xs font-bold transition';
  } else if (status === 'synced') {
    lbl.textContent = 'সিঙ্কড';
    btn.className = 'flex items-center gap-1 px-2 py-1 rounded-lg bg-emerald-50 dark:bg-emerald-950/50 border border-emerald-200/70 dark:border-emerald-800/60 text-emerald-700 dark:text-emerald-300 text-xs font-bold hover:bg-emerald-100 dark:hover:bg-emerald-900/60 transition';
  } else if (status === 'offline' || status === 'error') {
    lbl.textContent = 'অফলাইন';
    btn.className = 'flex items-center gap-1 px-2 py-1 rounded-lg bg-amber-50 dark:bg-amber-950/50 border border-amber-200/70 dark:border-amber-800/60 text-amber-700 dark:text-amber-300 text-xs font-bold hover:bg-amber-100 dark:hover:bg-amber-900/60 transition';
  } else if (status === 'unlinked') {
    lbl.textContent = 'নম্বর দিন';
    btn.className = 'flex items-center gap-1 px-2 py-1 rounded-lg bg-amber-50 dark:bg-amber-950/50 border border-amber-300 dark:border-amber-700 text-amber-800 dark:text-amber-300 text-xs font-bold hover:bg-amber-100 dark:hover:bg-amber-900/60 transition';
  } else {
    lbl.textContent = 'ক্লাউড';
  }
}

function saveLocalOnly() {
  try {
    const toSave = { ...state, mockSession: null };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(toSave));
  } catch (e) {}
}

function saveState(skipCloudPush = false) {
  state.updatedAt = Date.now();
  saveLocalOnly();
  if (!skipCloudPush) {
    scheduleCloudPush();
  }
}

function scheduleCloudPush() {
  clearTimeout(syncPushTimer);
  syncPushTimer = setTimeout(() => {
    pushToCloud();
  }, 1100);
}

async function pushToCloud() {
  const profile = getSyncProfile();
  if (!profile) {
    updateSyncBadge('unlinked');
    return false;
  }
  if (typeof navigator !== 'undefined' && navigator.onLine === false) {
    updateSyncBadge('offline');
    return false;
  }
  updateSyncBadge('syncing');
  const payload = getSyncPayload();
  try {
    const res = await fetch(SYNC_API + encodeURIComponent(profile), {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ state: payload, updatedAt: payload.updatedAt })
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    if (data && data.ok) {
      lastSyncTime = Date.now();
      updateSyncBadge('synced');
      return true;
    }
    throw new Error('Sync failed');
  } catch (e) {
    updateSyncBadge('offline');
    return false;
  }
}

async function pullFromCloud(showNotification = false) {
  const profile = getSyncProfile();
  if (!profile) {
    updateSyncBadge('unlinked');
    return false;
  }
  if (typeof navigator !== 'undefined' && navigator.onLine === false) {
    updateSyncBadge('offline');
    return false;
  }
  updateSyncBadge('syncing');
  try {
    const res = await fetch(SYNC_API + encodeURIComponent(profile), { method: 'GET' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    if (data && data.ok) {
      const remoteTs = Number(data.updatedAt) || 0;
      const localTs = Number(state.updatedAt) || 0;
      if (data.exists && data.state && remoteTs > localTs) {
        const rs = data.state;
        state.xp = typeof rs.xp === 'number' ? rs.xp : state.xp;
        state.streak = typeof rs.streak === 'number' ? rs.streak : state.streak;
        state.hearts = typeof rs.hearts === 'number' ? rs.hearts : state.hearts;
        state.unlimitedHearts = typeof rs.unlimitedHearts === 'boolean' ? rs.unlimitedHearts : state.unlimitedHearts;
        state.unlockAll = typeof rs.unlockAll === 'boolean' ? rs.unlockAll : state.unlockAll;
        state.darkMode = typeof rs.darkMode === 'boolean' ? rs.darkMode : state.darkMode;
        state.completedLessons = rs.completedLessons && typeof rs.completedLessons === 'object' ? rs.completedLessons : state.completedLessons;
        state.mistakes = Array.isArray(rs.mistakes) ? rs.mistakes : state.mistakes;
        state.bookmarks = Array.isArray(rs.bookmarks) ? rs.bookmarks : state.bookmarks;
        state.customLessons = Array.isArray(rs.customLessons) ? rs.customLessons : (state.customLessons || []);
        state.aiChatHistory = Array.isArray(rs.aiChatHistory) ? rs.aiChatHistory : (state.aiChatHistory || []);
        state.qbProgress = rs.qbProgress && typeof rs.qbProgress === 'object' ? rs.qbProgress : (state.qbProgress || {});
        state.qbBookmarks = Array.isArray(rs.qbBookmarks) ? rs.qbBookmarks : (state.qbBookmarks || []);
        state.updatedAt = remoteTs;
        rebuildDynamicIndex();
        saveLocalOnly();
        renderApp();
        if (showNotification) showToast('ক্লাউড থেকে সর্বশেষ অগ্রগতি লোড হয়েছে!');
      } else if (localTs > remoteTs && (state.xp > 0 || Object.keys(state.completedLessons).length > 0)) {
        await pushToCloud();
        if (showNotification) showToast('লোকাল অগ্রগতি ক্লাউডে সিঙ্ক হয়েছে!');
        return true;
      } else if (showNotification) {
        showToast('অগ্রগতি ইতিমধ্যেই আপ-টু-ডেট আছে!');
      }
      lastSyncTime = Date.now();
      updateSyncBadge('synced');
      return true;
    }
    throw new Error('Bad response');
  } catch (e) {
    updateSyncBadge('offline');
    if (showNotification) showToast('অফলাইন মোড — অনলাইনে এলে অটো সিঙ্ক হবে');
    return false;
  }
}

function toBnNum(n) {
  const digits = ['০', '১', '২', '৩', '৪', '৫', '৬', '৭', '৮', '৯'];
  return String(n).replace(/\d/g, (d) => digits[Number(d)]);
}

const OPT_LABELS = ['ক', 'খ', 'গ', 'ঘ'];

function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.remove('hidden');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => el.classList.add('hidden'), 2400);
}

function getRank(xp) {
  if (xp >= 1500) return { title: 'ঢাবি খ-ইউনিট টপার', icon: '👑' };
  if (xp >= 900) return { title: 'ব্যাকরণ পণ্ডিত', icon: '🏆' };
  if (xp >= 450) return { title: 'খ-ইউনিট যোদ্ধা', icon: '⚔️' };
  if (xp >= 150) return { title: 'ব্যাকরণ শিক্ষার্থী', icon: '📘' };
  return { title: 'নবীন অভিযাত্রী', icon: '🌱' };
}

function applyTheme() {
  document.documentElement.classList.toggle('dark', !!state.darkMode);
}

function updateHeaderStats() {
  document.getElementById('stat-streak').textContent = toBnNum(state.streak);
  document.getElementById('stat-xp').textContent = toBnNum(state.xp);
  document.getElementById('stat-hearts').textContent = state.unlimitedHearts ? '∞' : toBnNum(state.hearts);

  const mCount = state.mistakes.length;
  ['nav-mistake-badge', 'mobile-mistake-badge'].forEach((id) => {
    const b = document.getElementById(id);
    if (!b) return;
    if (mCount > 0) {
      b.textContent = toBnNum(mCount);
      b.classList.remove('hidden');
    } else {
      b.classList.add('hidden');
    }
  });

  // Update active nav styles
  document.querySelectorAll('.nav-tab').forEach((btn) => {
    const active = btn.dataset.tab === state.tab;
    btn.className = `nav-tab px-2.5 py-1.5 rounded-lg text-xs lg:text-sm font-semibold transition-all flex items-center gap-1.5 whitespace-nowrap ${
      active
        ? 'bg-white dark:bg-slate-900 text-blue-600 dark:text-blue-400 shadow-sm'
        : 'text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white'
    }`;
  });
  document.querySelectorAll('.mobile-nav-tab').forEach((btn) => {
    const active = btn.dataset.tab === state.tab;
    btn.className = `mobile-nav-tab relative flex flex-col items-center gap-0.5 px-2 py-1 rounded-xl text-[11px] font-semibold transition ${
      active ? 'text-blue-600 dark:text-blue-400' : 'text-slate-500 dark:text-slate-400'
    }`;
  });
}

function renderApp() {
  applyTheme();
  updateHeaderStats();

  const main = document.getElementById('app-main');
  if (state.tab === 'learn') {
    main.innerHTML = renderLearnView();
  } else if (state.tab === 'qb') {
    main.innerHTML = renderQbView();
  } else if (state.tab === 'mock') {
    main.innerHTML = renderMockView();
  } else if (state.tab === 'review') {
    main.innerHTML = renderReviewView();
  } else if (state.tab === 'chat') {
    main.innerHTML = renderChatView();
  } else if (state.tab === 'notes') {
    main.innerHTML = renderNotesView();
  }

  attachMainListeners();
  if (window.lucide) {
    lucide.createIcons({ nodes: [document.getElementById('app-main')] });
  }
}

const QB_PAGE_SIZE = 20;
let qbSearchDebounce = null;

function getQbTopicMeta(topicId) {
  const map = {
    shomash: { label: 'সমাস', cls: 'bg-blue-100 text-blue-700 dark:bg-blue-900/50 dark:text-blue-300' },
    bakyo: { label: 'বাক্য প্রকরণ', cls: 'bg-teal-100 text-teal-700 dark:bg-teal-900/50 dark:text-teal-300' },
    bachyo: { label: 'বাচ্য', cls: 'bg-emerald-100 text-emerald-700 dark:bg-emerald-900/50 dark:text-emerald-300' },
    pod: { label: 'পদ প্রকরণ', cls: 'bg-violet-100 text-violet-700 dark:bg-violet-900/50 dark:text-violet-300' }
  };
  return map[topicId] || { label: topicId, cls: 'bg-slate-100 text-slate-700 dark:bg-slate-800 dark:text-slate-300' };
}

function getQbCatMeta(catId) {
  const map = {
    du: { label: 'ঢাবি বিগত', cls: 'bg-rose-100 text-rose-700 dark:bg-rose-900/40 dark:text-rose-300' },
    other: { label: 'অন্যান্য ভার্সিটি', cls: 'bg-amber-100 text-amber-800 dark:bg-amber-900/40 dark:text-amber-300' },
    probable: { label: 'সম্ভাব্য', cls: 'bg-slate-100 text-slate-600 dark:bg-slate-800 dark:text-slate-400' }
  };
  return map[catId] || { label: catId, cls: 'bg-slate-100 text-slate-600' };
}

function getFilteredQbQuestions() {
  const f = state.qbFilter || DEFAULT_STATE.qbFilter;
  const term = (f.search || '').trim().toLowerCase();
  const prog = state.qbProgress || {};
  const bms = new Set(state.qbBookmarks || []);

  return QB_QUESTIONS.filter((item) => {
    if (f.topic !== 'all' && item.topic !== f.topic) return false;
    if (f.cat !== 'all' && item.cat !== f.cat) return false;
    if (f.status === 'unsolved' && prog[item.id] !== undefined) return false;
    if (f.status === 'correct' && prog[item.id] !== 1) return false;
    if (f.status === 'wrong' && prog[item.id] !== 0) return false;
    if (f.status === 'bookmarked' && !bms.has(item.id)) return false;
    if (term) {
      const hay = (item.q + ' ' + item.opts.join(' ') + ' ' + item.tags + ' ' + item.exp).toLowerCase();
      if (!hay.includes(term)) return false;
    }
    return true;
  });
}

function renderQbCardHtml(item, displayIdx) {
  const prog = state.qbProgress || {};
  const status = prog[item.id]; // undefined | 1 | 0
  const isBm = (state.qbBookmarks || []).includes(item.id);
  const reveal = Boolean((state.qbFilter || {}).revealAll);
  const answered = status !== undefined;
  const showResult = answered || reveal;
  const tMeta = getQbTopicMeta(item.topic);
  const cMeta = getQbCatMeta(item.cat);

  let statusBadge = '';
  if (status === 1) {
    statusBadge = '<span class="text-[11px] font-bold px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-700 dark:bg-emerald-900/50 dark:text-emerald-300">✓ সঠিক</span>';
  } else if (status === 0) {
    statusBadge = '<span class="text-[11px] font-bold px-2 py-0.5 rounded-full bg-rose-100 text-rose-700 dark:bg-rose-900/50 dark:text-rose-300">✗ ভুল</span>';
  }

  const optsHtml = item.opts.map((opt, oi) => {
    let cls = 'border-slate-200 dark:border-slate-700 bg-slate-50/70 dark:bg-slate-800/60 hover:border-blue-400 dark:hover:border-blue-500 text-slate-800 dark:text-slate-100';
    let badgeCls = 'bg-white dark:bg-slate-700 text-slate-700 dark:text-slate-200 border border-slate-200 dark:border-slate-600';
    if (showResult) {
      if (item.ans === oi) {
        cls = 'border-emerald-500 bg-emerald-50 dark:bg-emerald-950/50 text-emerald-900 dark:text-emerald-200 font-semibold';
        badgeCls = 'bg-emerald-500 text-white border border-emerald-500';
      } else if (status === 0 && item._picked === oi) {
        cls = 'border-rose-400 bg-rose-50 dark:bg-rose-950/40 text-rose-800 dark:text-rose-200';
        badgeCls = 'bg-rose-500 text-white border border-rose-500';
      } else {
        cls = 'border-slate-200/70 dark:border-slate-800 bg-slate-50/40 dark:bg-slate-900/40 text-slate-500 dark:text-slate-400';
      }
    }
    return `
      <button type="button" data-qb-id="${item.id}" data-qb-opt="${oi}"
        class="qb-opt-btn w-full text-left px-3 py-2.5 rounded-xl border text-sm transition flex items-start gap-2.5 ${cls}">
        <span class="shrink-0 w-6 h-6 rounded-lg text-xs font-bold flex items-center justify-center ${badgeCls}">${OPT_LABELS[oi]}</span>
        <span class="leading-snug pt-0.5">${opt}</span>
      </button>
    `;
  }).join('');

  const specialBanner = item.ans === -1
    ? `<div class="mt-2.5 text-xs px-3 py-2 rounded-xl bg-amber-50 dark:bg-amber-950/40 border border-amber-200 dark:border-amber-800/60 text-amber-800 dark:text-amber-200 font-medium">
         ⚠️ বিশেষ প্রশ্ন (মূল প্রশ্নব্যাংকে একক উত্তর নেই — নিচের ব্যাখ্যা দেখুন)
       </div>`
    : '';

  const expBlock = (showResult && (item.exp || item.ans === -1))
    ? `<div class="mt-3 p-3 rounded-xl bg-blue-50/80 dark:bg-blue-950/40 border border-blue-200/70 dark:border-blue-800/60 text-xs sm:text-sm text-slate-700 dark:text-slate-200 leading-relaxed">
         <span class="font-bold text-blue-700 dark:text-blue-300">ব্যাখ্যা: </span>${item.exp || 'সঠিক উত্তর অপশনে চিহ্নিত আছে।'}
       </div>`
    : '';

  return `
    <div id="qb-card-${item.id}" class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 p-4 shadow-sm">
      <div class="flex flex-wrap items-center justify-between gap-2 mb-2.5">
        <div class="flex flex-wrap items-center gap-1.5">
          <span class="text-xs font-extrabold text-slate-400 dark:text-slate-500">#${toBnNum(displayIdx)}</span>
          <span class="text-[11px] font-bold px-2 py-0.5 rounded-full ${tMeta.cls}">${tMeta.label}</span>
          <span class="text-[11px] font-semibold px-2 py-0.5 rounded-full ${cMeta.cls}">${cMeta.label}</span>
          ${item.tags ? `<span class="text-[11px] font-mono font-semibold px-2 py-0.5 rounded-md bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300">${item.tags}</span>` : ''}
          ${statusBadge}
        </div>
        <div class="flex items-center gap-1.5">
          <button type="button" data-qb-ask="${item.id}" title="AI টিউটরকে জিজ্ঞাসা করুন"
            class="qb-ask-btn px-2 py-1 rounded-lg text-[11px] font-semibold bg-amber-50 dark:bg-amber-950/40 text-amber-700 dark:text-amber-300 border border-amber-200/70 dark:border-amber-800/50 hover:bg-amber-100 dark:hover:bg-amber-900/50 transition">
            ✨ AI ব্যাখ্যা
          </button>
          <button type="button" data-qb-bm="${item.id}" title="বুকমার্ক"
            class="qb-bm-btn px-2 py-1 rounded-lg text-xs font-bold border transition ${
              isBm
                ? 'bg-amber-100 dark:bg-amber-900/50 border-amber-300 dark:border-amber-700 text-amber-700 dark:text-amber-300'
                : 'bg-slate-50 dark:bg-slate-800 border-slate-200 dark:border-slate-700 text-slate-400 hover:text-amber-500'
            }">
            ${isBm ? '★' : '☆'}
          </button>
        </div>
      </div>
      <div class="text-sm sm:text-base font-bold text-slate-900 dark:text-white leading-relaxed mb-3">${item.q}</div>
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
        ${optsHtml}
      </div>
      ${specialBanner}
      ${expBlock}
    </div>
  `;
}

function renderQbListHtml() {

  const pagerHtml = total > QB_PAGE_SIZE ? `

function updateQbStatsDom() {
  const prog = state.qbProgress || {};
  const solvedIds = Object.keys(prog);
  const correctCount = solvedIds.filter((k) => prog[k] === 1).length;
  const acc = solvedIds.length > 0 ? Math.round((correctCount / solvedIds.length) * 100) : 0;
  const sEl = document.getElementById('qb-stat-solved');
  const aEl = document.getElementById('qb-stat-acc');
  const bEl = document.getElementById('qb-stat-bm');
  if (sEl) sEl.textContent = toBnNum(solvedIds.length);
  if (aEl) aEl.textContent = toBnNum(acc) + '%';
  if (bEl) bEl.textContent = toBnNum((state.qbBookmarks || []).length);
}

function refreshQbListOnly() {
  const box = document.getElementById('qb-list-container');
  if (!box) return;
  box.innerHTML = renderQbListHtml();
  attachQbListListeners();
}

function attachQbListListeners() {
  const box = document.getElementById('qb-list-container');
  if (!box) return;

  box.querySelectorAll('.qb-opt-btn').forEach((btn) => {
    btn.addEventListener('click', () => {
      const qid = btn.dataset.qbId;
      const optIdx = Number(btn.dataset.qbOpt);
      const item = QB_BY_ID[qid];
      if (!item) return;

      const prev = (state.qbProgress || {})[qid];
      item._picked = optIdx;
      const isCorrect = item.ans === -1 ? true : optIdx === item.ans;
      if (!state.qbProgress) state.qbProgress = {};
      state.qbProgress[qid] = isCorrect ? 1 : 0;

      if (prev === undefined && isCorrect) {
        state.xp += 5;
        updateHeaderStats();
      }
      saveState();
      updateQbStatsDom();

      // Re-render ONLY this single card in place (zero page flicker!)
      const card = document.getElementById('qb-card-' + qid);
      if (card) {
        const idxMatch = card.querySelector('span')?.textContent || '';
        const dispIdx = Number(toEnDigits(idxMatch)) || item.num;
        const wrap = document.createElement('div');
        wrap.innerHTML = renderQbCardHtml(item, dispIdx).trim();
        const newCard = wrap.firstElementChild;
        card.replaceWith(newCard);
        // Re-bind listeners for the replaced card only
        attachQbCardListeners(newCard);
      }
    });
  });

  box.querySelectorAll('.qb-bm-btn').forEach((btn) => {
    btn.addEventListener('click', () => toggleQbBookmark(btn.dataset.qbBm));
  });

  box.querySelectorAll('.qb-ask-btn').forEach((btn) => {
    btn.addEventListener('click', () => askAiAboutQbQuestion(btn.dataset.qbAsk));
  });

  box.querySelectorAll('.qb-page-btn').forEach((btn) => {
    btn.addEventListener('click', () => {
      const p = Number(btn.dataset.qbPage);
      if (!p || p < 1) return;
      state.qbFilter.page = p;
      refreshQbListOnly();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
  });

  box.querySelector('#btn-qb-reset-filters')?.addEventListener('click', () => {
    state.qbFilter = { ...DEFAULT_STATE.qbFilter };
    renderApp();
  });

  box.querySelector('#btn-qb-quiz-filtered')?.addEventListener('click', () => {
    const filtered = getFilteredQbQuestions().filter((q) => q.ans >= 0);
    if (filtered.length === 0) {
      showToast('কুইজের জন্য পর্যাপ্ত প্রশ্ন নেই');
      return;
    }
    const f = state.qbFilter || DEFAULT_STATE.qbFilter;
    const tLabel = (QB_TOPICS.find((t) => t.id === f.topic) || {}).label || 'সব টপিক';
    const cLabel = (QB_CATS.find((c) => c.id === f.cat) || {}).label || 'সব ধরন';
    const picked = [...filtered].sort(() => Math.random() - 0.5).slice(0, 25).map((q) => ({
      id: q.id,
      moduleId: q.topic === 'bachyo' ? 'bakyo' : q.topic,
      q: q.tags ? `${q.q} [${q.tags}]` : q.q,
      opts: q.opts,
      ans: q.ans,
      exp: q.exp || `সঠিক উত্তর: (${OPT_LABELS[q.ans]}) ${q.opts[q.ans]}`
    }));
    startCustomQuizPlayer(`প্রশ্নব্যাংক কুইজ: ${tLabel} (${cLabel})`, picked, 'qb');
  });
}

function attachQbCardListeners(cardEl) {
  if (!cardEl) return;
  cardEl.querySelectorAll('.qb-opt-btn').forEach((btn) => {
    btn.addEventListener('click', () => {
      const qid = btn.dataset.qbId;
      const optIdx = Number(btn.dataset.qbOpt);
      const item = QB_BY_ID[qid];
      if (!item) return;
      item._picked = optIdx;
      const isCorrect = item.ans === -1 ? true : optIdx === item.ans;
      if (!state.qbProgress) state.qbProgress = {};
      const prev = state.qbProgress[qid];
      state.qbProgress[qid] = isCorrect ? 1 : 0;
      if (prev === undefined && isCorrect) {
        state.xp += 5;
        updateHeaderStats();
      }
      saveState();
      updateQbStatsDom();
      const idxMatch = cardEl.querySelector('span')?.textContent || '';
      const dispIdx = Number(toEnDigits(idxMatch)) || item.num;
      const wrap = document.createElement('div');
      wrap.innerHTML = renderQbCardHtml(item, dispIdx).trim();
      const newCard = wrap.firstElementChild;
      cardEl.replaceWith(newCard);
      attachQbCardListeners(newCard);
    });
  });
  cardEl.querySelector('.qb-bm-btn')?.addEventListener('click', (e) => {
    toggleQbBookmark(e.currentTarget.dataset.qbBm);
  });
  cardEl.querySelector('.qb-ask-btn')?.addEventListener('click', (e) => {
    askAiAboutQbQuestion(e.currentTarget.dataset.qbAsk);
  });
}

function toggleQbBookmark(qid) {
  if (!state.qbBookmarks) state.qbBookmarks = [];
  const idx = state.qbBookmarks.indexOf(qid);
  if (idx >= 0) {
    state.qbBookmarks.splice(idx, 1);
    showToast('বুকমার্ক সরানো হয়েছে');
  } else {
    state.qbBookmarks.push(qid);
    showToast('প্রশ্নটি বুকমার্ক করা হয়েছে');
  }
  saveState();
  updateQbStatsDom();
  const card = document.getElementById('qb-card-' + qid);
  const item = QB_BY_ID[qid];
  if (card && item) {
    const idxMatch = card.querySelector('span')?.textContent || '';
    const dispIdx = Number(toEnDigits(idxMatch)) || item.num;
    const wrap = document.createElement('div');
    wrap.innerHTML = renderQbCardHtml(item, dispIdx).trim();
    const newCard = wrap.firstElementChild;
    card.replaceWith(newCard);
    attachQbCardListeners(newCard);
  }
}

function askAiAboutQbQuestion(qid) {
  const item = QB_BY_ID[qid];
  if (!item) return;
  const plainQ = item.q.replace(/<[^>]+>/g, '');
  const optsTxt = item.opts.map((o, i) => `(${OPT_LABELS[i]}) ${o.replace(/<[^>]+>/g, '')}`).join(' | ');
  const ansTxt = item.ans >= 0 ? `সঠিক উত্তর: (${OPT_LABELS[item.ans]}) ${item.opts[item.ans].replace(/<[^>]+>/g, '')}` : 'বিশেষ প্রশ্ন';
  const prompt = `এই প্রশ্নব্যাংক প্রশ্নটি সহজ শর্টকাটসহ ব্যাখ্যা করো:
প্রশ্ন: ${plainQ}
অপশন: ${optsTxt}
${ansTxt}`;
  state.tab = 'chat';
  renderApp();
  sendAiChatMessage(prompt, false);
}

function renderMockResults() {
  const s = state.mockSession;
  let correct = 0, wrong = 0, skipped = 0;
  s.questions.forEach((q) => {
    const a = s.answers[q.id];
    if (a === undefined) skipped++;
    else if (a === q.ans) correct++;
    else wrong++;
  });
  const penalty = s.negativeMarking ? wrong * 0.25 : 0;
  const netScore = Math.max(0, correct - penalty);
  const pct = Math.round((correct / s.questions.length) * 100);

  return `
    <div class="max-w-3xl mx-auto space-y-5">
      <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-6 text-center shadow-sm">
        <div class="text-4xl mb-2">${pct >= 80 ? '🏆' : pct >= 55 ? '🎯' : '📚'}</div>
        <h2 class="text-xl font-bold">মক টেস্ট ফলাফল</h2>
        <div class="text-3xl font-extrabold text-blue-600 dark:text-blue-400 mt-2">
          ${toBnNum(netScore.toFixed(2))} / ${toBnNum(s.questions.length)}
        </div>
        <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">
          ${s.negativeMarking ? `নেগেটিভ মার্কিং কাটা গেছে: -${toBnNum(penalty.toFixed(2))}` : 'নেগেটিভ মার্কিং বন্ধ ছিল'}
        </p>

        <div class="grid grid-cols-3 gap-3 mt-5">

function formatChatText(txt) {
  const esc = String(txt || '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
  return esc
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/`([^`]+)`/g, '<code class="px-1 py-0.5 rounded bg-slate-200/70 dark:bg-slate-800 text-xs font-mono">$1</code>')
    .replace(/\n/g, '<br>');
}

async function sendAiChatMessage(text, forceLessonOverride = null) {
  const clean = String(text || '').trim();
  if (!clean || aiChatBusy) return;
  const shouldForce = forceLessonOverride !== null ? forceLessonOverride : chatForceLesson;

  state.aiChatHistory = [...(state.aiChatHistory || []), { role: 'user', text: clean, ts: Date.now() }].slice(-30);
  aiChatBusy = true;
  saveLocalOnly();
  renderApp();
  const box = document.getElementById('chat-messages-box');
  if (box) box.scrollTop = box.scrollHeight;

  const recentMistakes = (state.mistakes || [])
    .map((id) => ALL_MCQS.find((q) => q.id === id)?.q)
    .filter(Boolean)
    .slice(0, 6);

  try {
    const resp = await fetch(AI_CHAT_API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        messages: state.aiChatHistory.slice(-10).map((m) => ({ role: m.role, text: m.text })),
        forceLesson: shouldForce,
        context: {
          xp: state.xp,
          completedCount: Object.keys(state.completedLessons || {}).length,
          recentMistakes
        }
      })
    });
    const data = await resp.json();
    if (!resp.ok || !data.ok) {
      throw new Error(data.error || 'AI চ্যাট থেকে উত্তর পাওয়া যায়নি');
    }

    let createdLessonId = null;
    if (data.lesson && Array.isArray(data.lesson.mcqs) && data.lesson.mcqs.length > 0) {
      createdLessonId = 'ai_' + Date.now().toString(36);
      const created = {
        id: createdLessonId,
        title: data.lesson.title,
        subtitle: data.lesson.subtitle,
        moduleId: data.lesson.moduleId || 'custom',
        cards: data.lesson.cards || [],
        mcqs: data.lesson.mcqs.map((m, i) => ({ ...m, id: `${createdLessonId}_q${i + 1}` })),
        nextSuggestions: data.lesson.nextSuggestions || [],
        createdAt: Date.now(),
        model: data.model || 'gemini-3.8-flash'
      };
      state.customLessons = [created, ...(state.customLessons || [])];
      rebuildDynamicIndex();
      showToast(`চ্যাট থেকে নতুন AI লেসন তৈরি হয়েছে (${toBnNum(created.mcqs.length)}টি MCQ)!`);
    }

    state.aiChatHistory = [
      ...state.aiChatHistory,
      {
        role: 'assistant',
        text: data.reply || 'সম্পন্ন হয়েছে!',
        lessonId: createdLessonId,
        suggestedPrompts: data.suggestedPrompts || [],
        ts: Date.now()
      }
    ].slice(-30);

    chatForceLesson = false;
    aiChatBusy = false;
    saveState();
    renderApp();
    const box2 = document.getElementById('chat-messages-box');
    if (box2) box2.scrollTop = box2.scrollHeight;
  } catch (err) {
    aiChatBusy = false;
    state.aiChatHistory = [
      ...state.aiChatHistory,
      { role: 'assistant', text: '⚠️ ' + (err.message || 'সংযোগ সমস্যা হয়েছে। আবার চেষ্টা করুন।'), ts: Date.now() }
    ].slice(-30);
    saveLocalOnly();
    renderApp();
  }
}

function startLessonPlayer(lessonId, mode = 'full') {
  const les = ALL_LESSONS.find((l) => l.id === lessonId);
  if (!les) return;

  if (!state.unlimitedHearts && state.hearts <= 0) {
    openHeartsModal();
    return;
  }

  const steps = [];
  if (mode === 'full') {
    // Interleave theory cards then full MCQ set (SoloLearn style)
    les.cards.forEach((c) => steps.push({ type: 'card', data: c, revealed: false }));
  }
  les.mcqs.forEach((m) => steps.push({ type: 'mcq', data: m }));

  player = {
    sourceType: 'lesson',
    lessonId: les.id,
    title: `লেসন ${les.code}: ${les.title}`,
    steps,
    idx: 0,
    selectedOpt: null,
    checked: false,
    correctCount: 0,
    mcqTotal: les.mcqs.length,
    xpEarned: 0,
    sessionMistakes: [],
    finished: false
  };

  openPlayerOverlay();
}

function startCustomQuizPlayer(title, mcqs, sourceType = 'custom') {
  if (!mcqs || mcqs.length === 0) return;
  if (!state.unlimitedHearts && state.hearts <= 0) {
    openHeartsModal();
    return;
  }

  const shuffled = [...mcqs].sort(() => Math.random() - 0.5);
  player = {
    sourceType,
    lessonId: null,
    title,
    steps: shuffled.map((m) => ({ type: 'mcq', data: m })),
    idx: 0,
    selectedOpt: null,
    checked: false,
    correctCount: 0,
    mcqTotal: shuffled.length,
    xpEarned: 0,
    sessionMistakes: [],
    finished: false
  };

  openPlayerOverlay();
}

function openPlayerOverlay() {
  document.getElementById('player-overlay').classList.remove('hidden');
  document.body.style.overflow = 'hidden';
  renderPlayerStep();
}

function closePlayerOverlay() {
  document.getElementById('player-overlay').classList.add('hidden');
  document.body.style.overflow = '';
  player = null;
  renderApp();
}

function checkCurrentMcq() {
  if (!player || player.checked || player.selectedOpt === null) return;
  const q = player.steps[player.idx].data;
  player.checked = true;

  if (player.selectedOpt === q.ans) {
    player.correctCount++;
    player.xpEarned += 10;
    state.xp += 10;
    // If practicing mistakes, remove from mistake bank once mastered!
    if (player.sourceType === 'mistakes') {
      state.mistakes = state.mistakes.filter((id) => id !== q.id);
    }
  } else {
    player.sessionMistakes.push(q);
    if (!state.mistakes.includes(q.id)) {
      state.mistakes.push(q.id);
    }
    if (!state.unlimitedHearts) {
      state.hearts = Math.max(0, state.hearts - 1);
    }
  }
  saveState();
  updateHeaderStats();
  renderPlayerStep();
}

function advancePlayerStep() {
  if (!player) return;

  if (!state.unlimitedHearts && state.hearts <= 0) {
    closePlayerOverlay();
    openHeartsModal();
    return;
  }

  if (player.idx < player.steps.length - 1) {
    player.idx++;
    player.selectedOpt = null;
    player.checked = false;
    renderPlayerStep();
  } else {
    // Finish lesson
    player.finished = true;
    const acc = player.mcqTotal > 0 ? Math.round((player.correctCount / player.mcqTotal) * 100) : 100;
    if (player.lessonId) {
      const prev = state.completedLessons[player.lessonId];
      state.completedLessons[player.lessonId] = {
        bestAcc: prev ? Math.max(prev.bestAcc, acc) : acc,
        attempts: prev ? prev.attempts + 1 : 1
      };
      // Bonus XP for lesson completion
      player.xpEarned += 20;
      state.xp += 20;
    }
    saveState();
    updateHeaderStats();
    renderPlayerStep();
    if (acc >= 70 && typeof confetti === 'function') {
      confetti({ particleCount: 70, spread: 65, origin: { y: 0.6 } });
    }
  }
}

// MOCK EXAM LOGIC
// ============================================================================
function startMockExam() {
  const cfg = state.mockConfig;
  const pool = ALL_MCQS.filter((q) => cfg.modules.includes(q.moduleId));
  if (pool.length === 0) return;

  const shuffled = [...pool].sort(() => Math.random() - 0.5);
  const selected = shuffled.slice(0, Math.min(cfg.count, shuffled.length));

  clearInterval(mockTimerInterval);
  state.mockSession = {
    questions: selected,
    idx: 0,
    answers: {},
    negativeMarking: cfg.negativeMarking,
    useTimer: cfg.useTimer,
    timeLeft: selected.length * 45,
    finished: false
  };

  if (cfg.useTimer) {
    mockTimerInterval = setInterval(() => {
      if (!state.mockSession || state.mockSession.finished) {
        clearInterval(mockTimerInterval);
        return;
      }
      state.mockSession.timeLeft--;
      const disp = document.getElementById('mock-timer-display');
      if (disp) {
        const m = Math.floor(state.mockSession.timeLeft / 60);
        const s = state.mockSession.timeLeft % 60;
        disp.textContent = `⏱ ${toBnNum(String(m).padStart(2, '0'))}:${toBnNum(String(s).padStart(2, '0'))}`;
      }
      if (state.mockSession.timeLeft <= 0) {
        finishMockExam();
      }
    }, 1000);
  }

  renderApp();
}

function finishMockExam() {
  clearInterval(mockTimerInterval);
  if (!state.mockSession) return;
  state.mockSession.finished = true;

  let correct = 0;
  state.mockSession.questions.forEach((q) => {
    const a = state.mockSession.answers[q.id];
    if (a === q.ans) {
      correct++;
    } else if (a !== undefined) {
      if (!state.mistakes.includes(q.id)) state.mistakes.push(q.id);
    }
  });
  state.xp += correct * 10;
  saveState();
  renderApp();

  if (correct / state.mockSession.questions.length >= 0.7 && typeof confetti === 'function') {
    confetti({ particleCount: 75, spread: 70, origin: { y: 0.6 } });
  }
}

async function runAiLessonGeneration(confusion, moduleHint, sampleMistakes) {
  if (aiGenBusy) return;
  aiGenBusy = true;

  const statusEl = document.getElementById('ai-gen-status');
  const submitBtn = document.getElementById('btn-submit-ai');
  const cancelBtn = document.getElementById('btn-cancel-ai');

  if (submitBtn) {
    submitBtn.disabled = true;
    submitBtn.textContent = 'তৈরি হচ্ছে...';
  }
  if (cancelBtn) cancelBtn.disabled = true;

  if (statusEl) {
    statusEl.className = 'p-3.5 rounded-xl bg-blue-50 dark:bg-blue-950/40 border border-blue-200 dark:border-blue-800/60 text-xs sm:text-sm text-blue-800 dark:text-blue-200 flex items-center gap-2.5';
    statusEl.innerHTML = `<span class="inline-block w-4 h-4 border-2 border-blue-600 border-t-transparent rounded-full animate-spin shrink-0"></span><span><strong>Gemini 3.8 Flash (High)</strong> আপনার কনফিউশন বিশ্লেষণ করে নোট কার্ড ও পর্যাপ্ত MCQ তৈরি করছে... (১৫–৩০ সেকেন্ড লাগতে পারে)</span>`;
  }

  try {
    const resp = await fetch(AI_LESSON_API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ confusion, moduleHint, sampleMistakes })
    });
    const data = await resp.json();
    if (!resp.ok || !data.ok || !data.lesson) {
      throw new Error(data.error || 'লেসন তৈরি করা যায়নি');
    }

    const newId = 'ai_' + Date.now().toString(36);
    const created = {
      id: newId,
      title: data.lesson.title,
      subtitle: data.lesson.subtitle,
      moduleId: data.lesson.moduleId || 'custom',
      cards: data.lesson.cards || [],
      mcqs: (data.lesson.mcqs || []).map((m, i) => ({ ...m, id: `${newId}_q${i + 1}` })),
      nextSuggestions: data.lesson.nextSuggestions || [],
      createdAt: Date.now(),
      model: data.model || 'gemini-3.8-flash'
    };

    state.customLessons = [created, ...(state.customLessons || [])];
    rebuildDynamicIndex();
    saveState();

    aiGenBusy = false;
    document.getElementById('modal-backdrop').classList.add('hidden');
    showToast(`নতুন AI লেসন তৈরি হয়েছে (${toBnNum(created.mcqs.length)}টি MCQ)!`);
    renderApp();
    startLessonPlayer(newId, 'full');
  } catch (err) {
    aiGenBusy = false;
    if (submitBtn) {
      submitBtn.disabled = false;
      submitBtn.textContent = '↻ পুনরায় চেষ্টা করুন';
    }
    if (cancelBtn) cancelBtn.disabled = false;
    if (statusEl) {
      statusEl.className = 'p-3.5 rounded-xl bg-rose-50 dark:bg-rose-950/40 border border-rose-200 dark:border-rose-800/60 text-xs sm:text-sm text-rose-700 dark:text-rose-300';
      statusEl.textContent = '⚠️ ' + (err.message || 'সার্ভারে সংযোগ করা যায়নি। আবার চেষ্টা করুন।');
    }
  }
}

function attachMainListeners() {
  // Question Bank View listeners
  if (state.tab === 'qb') {
    document.querySelectorAll('.qb-topic-btn').forEach((btn) => {
      btn.addEventListener('click', () => {
        state.qbFilter.topic = btn.dataset.qbTopic;

      });

        state.qbFilter.page = 1;
        renderApp();
      });
    });

      state.qbFilter.revealAll = !state.qbFilter.revealAll;

    });

      state.qbFilter.search = '';

      renderApp();
    });

      state.qbFilter.search = e.target.value;
      state.qbFilter.page = 1;
      clearTimeout(qbSearchDebounce);
      qbSearchDebounce = setTimeout(() => {
        refreshQbListOnly();
      }, 120);
    });
    attachQbListListeners();
  }

  // Learn View listeners
  document.querySelectorAll('.mod-filter-btn').forEach((btn) => {
    btn.addEventListener('click', () => {
      state.moduleFilter = btn.dataset.modFilter;
      renderApp();
    });
  });

  document.querySelectorAll('.btn-start-lesson').forEach((btn) => {
    btn.addEventListener('click', () => {
      startLessonPlayer(btn.dataset.startLesson, btn.dataset.mode);
    });
  });

  document.querySelectorAll('.btn-module-quiz').forEach((btn) => {
    btn.addEventListener('click', () => {
      const modId = btn.dataset.moduleQuiz;
      const mod = MODULES.find((m) => m.id === modId);
      const mcqs = ALL_MCQS.filter((q) => q.moduleId === modId);
      startCustomQuizPlayer(`${mod.title} — মডিউল কুইজ`, mcqs.slice(0, 20), 'module');
    });
  });

  document.getElementById('btn-toggle-unlock')?.addEventListener('click', () => {
    state.unlockAll = !state.unlockAll;
    saveState();
    showToast(state.unlockAll ? 'সব লেসন আনলক করা হয়েছে' : 'ধারাবাহিক লক চালু হয়েছে');
    renderApp();
  });

  document.getElementById('btn-quick-continue')?.addEventListener('click', () => {
    const next = ALL_LESSONS.find((l) => !state.completedLessons[l.id]) || ALL_LESSONS[0];
    startLessonPlayer(next.id, 'full');
  });

  document.getElementById('btn-open-ai-gen')?.addEventListener('click', () => {
    openAiLessonModal({ moduleHint: state.moduleFilter === 'all' ? 'auto' : state.moduleFilter });
  });

  document.querySelectorAll('.btn-open-ai-inline').forEach((btn) => {
    btn.addEventListener('click', () => openAiLessonModal({ moduleHint: 'auto' }));
  });

  document.querySelectorAll('.btn-del-custom').forEach((btn) => {
    btn.addEventListener('click', () => {
      const id = btn.dataset.delCustom;
      state.customLessons = (state.customLessons || []).filter((c) => c.id !== id);
      delete state.completedLessons[id];
      rebuildDynamicIndex();
      saveState();
      showToast('AI লেসনটি মুছে ফেলা হয়েছে');
      renderApp();
    });
  });

  document.getElementById('btn-ai-from-mistakes')?.addEventListener('click', () => {
    const missedQs = state.mistakes
      .map((id) => ALL_MCQS.find((q) => q.id === id))
      .filter(Boolean)
      .slice(0, 10)
      .map((q) => q.q);
    openAiLessonModal({
      prefill: 'আমার ভুল উত্তরগুলো বিশ্লেষণ করে মূল কনফিউশন সমাধান',
      moduleHint: 'auto',
      sampleMistakes: missedQs,
      autoStart: false
    });
  });

  // Mock View listeners
  document.querySelectorAll('.mock-mod-toggle').forEach((btn) => {
    btn.addEventListener('click', () => {
      const id = btn.dataset.mockMod;
      const idx = state.mockConfig.modules.indexOf(id);
      if (idx >= 0) state.mockConfig.modules.splice(idx, 1);
      else state.mockConfig.modules.push(id);
      saveState();
      renderApp();
    });
  });

  document.querySelectorAll('.mock-count-btn').forEach((btn) => {
    btn.addEventListener('click', () => {
      state.mockConfig.count = Number(btn.dataset.mockCount);
      saveState();
      renderApp();
    });
  });

  document.getElementById('chk-mock-neg')?.addEventListener('change', (e) => {
    state.mockConfig.negativeMarking = e.target.checked;
    saveState();
  });

  document.getElementById('chk-mock-timer')?.addEventListener('change', (e) => {
    state.mockConfig.useTimer = e.target.checked;
    saveState();
  });

  document.getElementById('btn-start-mock')?.addEventListener('click', startMockExam);

  document.querySelectorAll('.mock-opt-btn').forEach((btn) => {
    btn.addEventListener('click', () => {
      const s = state.mockSession;
      const q = s.questions[s.idx];
      s.answers[q.id] = Number(btn.dataset.mockOpt);
      renderApp();
    });
  });

  document.getElementById('btn-mock-clear')?.addEventListener('click', () => {
    const s = state.mockSession;
    delete s.answers[s.questions[s.idx].id];
    renderApp();
  });

  document.getElementById('btn-mock-prev')?.addEventListener('click', () => {
    if (state.mockSession.idx > 0) {
      state.mockSession.idx--;
      renderApp();
    }
  });

  document.getElementById('btn-mock-next')?.addEventListener('click', () => {
    const s = state.mockSession;
    if (s.idx < s.questions.length - 1) {
      s.idx++;
      renderApp();
    } else {
      finishMockExam();
    }
  });

  document.getElementById('btn-submit-mock')?.addEventListener('click', finishMockExam);

  document.querySelectorAll('.mock-jump-btn').forEach((btn) => {
    btn.addEventListener('click', () => {
      state.mockSession.idx = Number(btn.dataset.mockJump);
      renderApp();
    });
  });

  document.getElementById('btn-mock-new')?.addEventListener('click', () => {
    state.mockSession = null;
    renderApp();
  });

  document.getElementById('btn-mock-to-learn')?.addEventListener('click', () => {
    state.mockSession = null;
    state.tab = 'learn';
    renderApp();
  });

  // Review View listeners
  document.querySelectorAll('.rev-subtab').forEach((btn) => {
    btn.addEventListener('click', () => {
      state.reviewSubTab = btn.dataset.revTab;
      renderApp();
    });
  });

  document.querySelectorAll('.btn-remove-rev').forEach((btn) => {
    btn.addEventListener('click', () => {
      const id = btn.dataset.removeRev;
      if (state.reviewSubTab === 'mistakes') {
        state.mistakes = state.mistakes.filter((x) => x !== id);
      } else {
        state.bookmarks = state.bookmarks.filter((x) => x !== id);
      }
      saveState();
      renderApp();
    });
  });

  document.getElementById('btn-practice-review')?.addEventListener('click', () => {
    const ids = state.reviewSubTab === 'mistakes' ? state.mistakes : state.bookmarks;
    const list = ids.map((id) => ALL_MCQS.find((q) => q.id === id)).filter(Boolean);
    startCustomQuizPlayer(
      state.reviewSubTab === 'mistakes' ? 'ভুল উত্তর প্র্যাকটিস' : 'বুকমার্ক প্র্যাকটিস',
      list,
      state.reviewSubTab
    );
  });

  // Notes View listeners
  const searchInput = document.getElementById('input-notes-search');
  if (searchInput) {
    searchInput.addEventListener('input', (e) => {
      const pos = e.target.selectionStart;
      state.notesSearch = e.target.value;
      renderApp();
      const el = document.getElementById('input-notes-search');
      if (el) {
        el.focus();
        el.setSelectionRange(pos, pos);
      }
    });
  }

  document.getElementById('btn-print-notes')?.addEventListener('click', () => window.print());

  // AI Chat View listeners
  document.querySelectorAll('.btn-chat-starter').forEach((btn) => {
    btn.addEventListener('click', () => {
      sendAiChatMessage(btn.dataset.chatStarter);
    });
  });

  document.getElementById('chk-chat-force-lesson')?.addEventListener('change', (e) => {
    chatForceLesson = e.target.checked;
  });

  document.getElementById('btn-send-chat')?.addEventListener('click', () => {
    const val = document.getElementById('input-chat-msg')?.value || '';
    sendAiChatMessage(val);
  });

  document.getElementById('input-chat-msg')?.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendAiChatMessage(e.currentTarget.value);
    }
  });

  document.getElementById('btn-clear-chat')?.addEventListener('click', () => {
    state.aiChatHistory = [];
    saveState();
    renderApp();
  });
}

// Keyboard shortcuts inside Lesson Player
document.addEventListener('keydown', (e) => {
  if (!player || player.finished) return;
  const step = player.steps[player.idx];
  if (step.type === 'mcq' && !player.checked) {
    if (['1', '2', '3', '4'].includes(e.key)) {
      player.selectedOpt = Number(e.key) - 1;
      renderPlayerStep();
    } else if (e.key === 'Enter' && player.selectedOpt !== null) {
      checkCurrentMcq();
    }
  } else if (e.key === 'Enter') {
    advancePlayerStep();
  }
});

    }
    backdrop.classList.add('hidden');
    showToast(`নম্বর ${formatProfileDisplay(norm)} যুক্ত হয়েছে!`);
    await pullFromCloud(true);
  });

  document.getElementById('btn-skip-phone')?.addEventListener('click', () => {
    try { localStorage.setItem(SYNC_SKIP_KEY, '1'); } catch (e) {}
    backdrop.classList.add('hidden');
    updateSyncBadge('unlinked');
  });
}

// Boot App
if (window.lucide) lucide.createIcons();
renderApp();
if (getSyncProfile()) {
  pullFromCloud(false);
} else {
  updateSyncBadge('unlinked');
  let skipped = false;
  try { skipped = localStorage.getItem(SYNC_SKIP_KEY) === '1'; } catch (e) {}
  if (!skipped) {
    openPhoneOnboardingModal();
  }
}
</script>
</body>
</html>
