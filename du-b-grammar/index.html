  <style>
    @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap');

    :root {
      --font-sans: 'Hind Siliguri', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    body {
      font-family: var(--font-sans);
      -webkit-tap-highlight-color: transparent;
    }

    /* Smooth custom scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.4); border-radius: 9999px; }

    /* SoloLearn-style 3D button press */
    .btn-3d {
      transition: transform 0.08s ease, box-shadow 0.08s ease, background-color 0.15s ease;
    }
    .btn-3d:active:not(:disabled) {
      transform: translateY(2px);
    }

    /* Node connector line */
    .path-line {
      background: repeating-linear-gradient(
        to bottom,
        #cbd5e1 0px,
        #cbd5e1 6px,
        transparent 6px,
        transparent 12px
      );
    }
    .dark .path-line {
      background: repeating-linear-gradient(
        to bottom,
        #334155 0px,
        #334155 6px,
        transparent 6px,
        transparent 12px
      );
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-slide-up {
      animation: slideUp 0.24s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes popIn {
      0% { transform: scale(0.92); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    .animate-pop {
      animation: popIn 0.2s ease-out forwards;
    }

    @media print {
      header, nav, .no-print { display: none !important; }
      body { background: #ffffff !important; color: #000000 !important; }
      .print-break { break-inside: avoid; }
    }
  </style>

// APP STATE & PERSISTENCE (Sandbox-safe localStorage)
// ============================================================================
const STORAGE_KEY = 'du_b_bangla_sololearn_v1';

const DEFAULT_STATE = {
  tab: 'learn', // learn | mock | review | notes
  moduleFilter: 'all',
  xp: 0,
  streak: 1,
  hearts: 5,
  unlimitedHearts: true, // Helpful default for DU admission students, toggleable!
  unlockAll: true,       // Allow jumping to any lesson or sequential SoloLearn lock
  darkMode: false,
  updatedAt: 0,
  completedLessons: {},  // { s1: { bestAcc: 91, attempts: 1 } }
  mistakes: [],          // array of mcq IDs
  bookmarks: [],         // array of mcq IDs
  reviewSubTab: 'mistakes',
  notesSearch: '',
  // Mock exam config & session
  mockConfig: {
    modules: ['shomash', 'bakyo', 'pod'],
    count: 20,
    negativeMarking: true,
    useTimer: true
  },
  mockSession: null
};

let state = loadState();

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return structuredClone(DEFAULT_STATE);
    const parsed = JSON.parse(raw);
    return {
      ...structuredClone(DEFAULT_STATE),
      ...parsed,
      mockConfig: { ...DEFAULT_STATE.mockConfig, ...(parsed.mockConfig || {}) },
      mockSession: null // always start fresh on reload
    };
  } catch (e) {
    return structuredClone(DEFAULT_STATE);
  }
}

const SYNC_API = 'https://du-b-grammar-sync.treytrewq61.workers.dev/sync/';
const SYNC_PROFILE_KEY = 'du_b_grammar_sync_profile';
let syncStatus = 'idle'; // idle | syncing | synced | offline | error
let lastSyncTime = 0;
let syncPushTimer = null;

function getSyncProfile() {
  try {
    const p = (localStorage.getItem(SYNC_PROFILE_KEY) || 'trewqChern-main').trim();
    return /^[a-zA-Z0-9_-]{2,64}$/.test(p) ? p : 'trewqChern-main';
  } catch (e) {
    return 'trewqChern-main';
  }
}

function setSyncProfile(profile) {
  const clean = String(profile || '').trim();
  if (!/^[a-zA-Z0-9_-]{2,64}$/.test(clean)) return false;
  try { localStorage.setItem(SYNC_PROFILE_KEY, clean); } catch (e) {}
  return true;
}

function getSyncPayload() {
  return {
    xp: state.xp,
    streak: state.streak,
    hearts: state.hearts,
    unlimitedHearts: state.unlimitedHearts,
    unlockAll: state.unlockAll,
    darkMode: state.darkMode,
    completedLessons: state.completedLessons,
    mistakes: state.mistakes,
    bookmarks: state.bookmarks,
    updatedAt: state.updatedAt || Date.now()
  };
}

function updateSyncBadge(status) {
  syncStatus = status;
  const btn = document.getElementById('btn-sync-status');
  const lbl = document.getElementById('stat-sync-label');
  if (!btn || !lbl) return;
  if (status === 'syncing') {
    lbl.textContent = 'সিঙ্ক...';
    btn.className = 'flex items-center gap-1 px-2 py-1 rounded-lg bg-blue-50 dark:bg-blue-950/50 border border-blue-200/70 dark:border-blue-800/60 text-blue-700 dark:text-blue-300 text-xs font-bold transition';
  } else if (status === 'synced') {
    lbl.textContent = 'সিঙ্কড';
    btn.className = 'flex items-center gap-1 px-2 py-1 rounded-lg bg-emerald-50 dark:bg-emerald-950/50 border border-emerald-200/70 dark:border-emerald-800/60 text-emerald-700 dark:text-emerald-300 text-xs font-bold hover:bg-emerald-100 dark:hover:bg-emerald-900/60 transition';
  } else if (status === 'offline' || status === 'error') {
    lbl.textContent = 'অফলাইন';
    btn.className = 'flex items-center gap-1 px-2 py-1 rounded-lg bg-amber-50 dark:bg-amber-950/50 border border-amber-200/70 dark:border-amber-800/60 text-amber-700 dark:text-amber-300 text-xs font-bold hover:bg-amber-100 dark:hover:bg-amber-900/60 transition';
  } else {
    lbl.textContent = 'ক্লাউড';
  }
}

function saveLocalOnly() {
  try {
    const toSave = { ...state, mockSession: null };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(toSave));
  } catch (e) {}
}

function saveState(skipCloudPush = false) {
  state.updatedAt = Date.now();
  saveLocalOnly();
  if (!skipCloudPush) {
    scheduleCloudPush();
  }
}

function scheduleCloudPush() {
  clearTimeout(syncPushTimer);
  syncPushTimer = setTimeout(() => {
    pushToCloud();
  }, 1100);
}

async function pushToCloud() {
  if (typeof navigator !== 'undefined' && navigator.onLine === false) {
    updateSyncBadge('offline');
    return false;
  }
  updateSyncBadge('syncing');
  const profile = getSyncProfile();
  const payload = getSyncPayload();
  try {
    const res = await fetch(SYNC_API + encodeURIComponent(profile), {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ state: payload, updatedAt: payload.updatedAt })
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    if (data && data.ok) {
      lastSyncTime = Date.now();
      updateSyncBadge('synced');
      return true;
    }
    throw new Error('Sync failed');
  } catch (e) {
    updateSyncBadge('offline');
    return false;
  }
}

async function pullFromCloud(showNotification = false) {
  if (typeof navigator !== 'undefined' && navigator.onLine === false) {
    updateSyncBadge('offline');
    return false;
  }
  updateSyncBadge('syncing');
  const profile = getSyncProfile();
  try {
    const res = await fetch(SYNC_API + encodeURIComponent(profile), { method: 'GET' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    if (data && data.ok) {
      const remoteTs = Number(data.updatedAt) || 0;
      const localTs = Number(state.updatedAt) || 0;
      if (data.exists && data.state && remoteTs > localTs) {
        const rs = data.state;
        state.xp = typeof rs.xp === 'number' ? rs.xp : state.xp;
        state.streak = typeof rs.streak === 'number' ? rs.streak : state.streak;
        state.hearts = typeof rs.hearts === 'number' ? rs.hearts : state.hearts;
        state.unlimitedHearts = typeof rs.unlimitedHearts === 'boolean' ? rs.unlimitedHearts : state.unlimitedHearts;
        state.unlockAll = typeof rs.unlockAll === 'boolean' ? rs.unlockAll : state.unlockAll;
        state.darkMode = typeof rs.darkMode === 'boolean' ? rs.darkMode : state.darkMode;
        state.completedLessons = rs.completedLessons && typeof rs.completedLessons === 'object' ? rs.completedLessons : state.completedLessons;
        state.mistakes = Array.isArray(rs.mistakes) ? rs.mistakes : state.mistakes;
        state.bookmarks = Array.isArray(rs.bookmarks) ? rs.bookmarks : state.bookmarks;
        state.updatedAt = remoteTs;
        saveLocalOnly();
        renderApp();
        if (showNotification) showToast('ক্লাউড থেকে সর্বশেষ অগ্রগতি লোড হয়েছে!');
      } else if (localTs > remoteTs && (state.xp > 0 || Object.keys(state.completedLessons).length > 0)) {
        await pushToCloud();
        if (showNotification) showToast('লোকাল অগ্রগতি ক্লাউডে সিঙ্ক হয়েছে!');
        return true;
      } else if (showNotification) {
        showToast('অগ্রগতি ইতিমধ্যেই আপ-টু-ডেট আছে!');
      }
      lastSyncTime = Date.now();
      updateSyncBadge('synced');
      return true;
    }
    throw new Error('Bad response');
  } catch (e) {
    updateSyncBadge('offline');
    if (showNotification) showToast('অফলাইন মোড — অনলাইনে এলে অটো সিঙ্ক হবে');
    return false;
  }
}

function toBnNum(n) {
  const digits = ['০', '১', '২', '৩', '৪', '৫', '৬', '৭', '৮', '৯'];
  return String(n).replace(/\d/g, (d) => digits[Number(d)]);
}

const OPT_LABELS = ['ক', 'খ', 'গ', 'ঘ'];

function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.remove('hidden');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => el.classList.add('hidden'), 2400);
}

function getRank(xp) {
  if (xp >= 1500) return { title: 'ঢাবি খ-ইউনিট টপার', icon: '👑' };
  if (xp >= 900) return { title: 'ব্যাকরণ পণ্ডিত', icon: '🏆' };
  if (xp >= 450) return { title: 'খ-ইউনিট যোদ্ধা', icon: '⚔️' };
  if (xp >= 150) return { title: 'ব্যাকরণ শিক্ষার্থী', icon: '📘' };
  return { title: 'নবীন অভিযাত্রী', icon: '🌱' };
}

                      }">
                        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                          <div class="min-w-0">
                            <div class="flex flex-wrap items-center gap-1.5 mb-1">
                              <span class="text-[11px] font-bold px-2 py-0.5 rounded-md ${mod.badgeBg}">লেসন ${les.code}</span>
                              <span class="text-[11px] font-medium text-slate-500 dark:text-slate-400">${toBnNum(les.cards.length)}টি নোট কার্ড • ${toBnNum(les.mcqs.length)}টি MCQ</span>
                              ${done ? `<span class="text-[11px] font-bold text-emerald-600 dark:text-emerald-400 bg-emerald-100 dark:bg-emerald-900/40 px-2 py-0.5 rounded-md">সর্বোচ্চ: ${toBnNum(done.bestAcc)}%</span>` : ''}
                            </div>
                            <h3 class="font-bold text-slate-900 dark:text-white text-sm sm:text-base">${les.title}</h3>

                                  : done
                                    ? 'bg-emerald-600 hover:bg-emerald-700 text-white shadow-sm'
                                    : 'bg-blue-600 hover:bg-blue-700 text-white shadow-sm'
                              }"
                            >
                              <i data-lucide="play" class="w-3.5 h-3.5 fill-current"></i>
                              ${done ? 'পুনরায় পড়ুন' : 'শিখুন + MCQ'}
                            </button>
                            <button
                              data-start-lesson="${les.id}"
                              data-mode="quiz"
                              ${unlocked ? '' : 'disabled'}
                              title="শুধু এই লেসনের MCQ প্র্যাকটিস করুন"
                              class="btn-start-lesson px-3 py-2 rounded-xl text-xs sm:text-sm font-semibold border transition ${
                                !unlocked
                                  ? 'border-slate-200 dark:border-slate-800 text-slate-400 cursor-not-allowed'
                                  : 'border-slate-300 dark:border-slate-600 text-slate-700 dark:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-700'
                              }"
                            >
                              শুধু MCQ
                            </button>
                          </div>
                        </div>
                      </div>
                    </div>
                  `;
                }).join('')}
              </div>
            </div>
          </section>
        `;
      }).join('')}
    </div>
  `;
}

function renderMockActive() {
  const s = state.mockSession;
  const q = s.questions[s.idx];
  const chosen = s.answers[q.id];

  const mins = Math.floor(s.timeLeft / 60);
  const secs = s.timeLeft % 60;
  const timeStr = `${toBnNum(String(mins).padStart(2, '0'))}:${toBnNum(String(secs).padStart(2, '0'))}`;

  return `
    <div class="max-w-3xl mx-auto space-y-4">
      <!-- Top Status Bar -->
      <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-3.5 flex flex-wrap items-center justify-between gap-2 shadow-sm">
        <div class="flex items-center gap-2">
          <span class="text-xs font-bold px-2.5 py-1 rounded-lg bg-blue-100 text-blue-700 dark:bg-blue-900/50 dark:text-blue-300">
            প্রশ্ন ${toBnNum(s.idx + 1)} / ${toBnNum(s.questions.length)}
          </span>
          <span class="text-xs font-semibold text-slate-500 dark:text-slate-400">

        </div>
        <div class="flex items-center gap-2">
          ${s.useTimer ? `
            <span id="mock-timer-display" class="text-sm font-bold px-3 py-1 rounded-lg ${s.timeLeft < 60 ? 'bg-rose-100 text-rose-700 animate-pulse' : 'bg-slate-100 dark:bg-slate-800 text-slate-800 dark:text-slate-200'}">
              ⏱ ${timeStr}
            </span>
          ` : ''}
          <button id="btn-submit-mock" class="px-3.5 py-1.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-xs sm:text-sm font-bold transition">
            জমা দিন
          </button>
        </div>
      </div>

      <!-- Question Card -->
      <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-5 sm:p-6 shadow-sm">
        <div class="flex items-center justify-between gap-2 mb-3">
          <span class="text-xs font-semibold text-slate-500 dark:text-slate-400">${q.moduleTitle.split(' ')[0]} • ${q.lessonTitle}</span>
          ${chosen !== undefined ? `<button id="btn-mock-clear" class="text-xs text-rose-500 hover:underline font-semibold">উত্তর মুছুন</button>` : ''}
        </div>
        <h2 class="text-base sm:text-lg font-bold text-slate-900 dark:text-white leading-relaxed mb-5">
          ${toBnNum(s.idx + 1)}. ${q.q}
        </h2>
        <div class="space-y-2.5">
          ${q.opts.map((opt, i) => `
            <button data-mock-opt="${i}" class="mock-opt-btn w-full text-left p-3.5 rounded-xl border-2 transition flex items-center gap-3 ${
              chosen === i
                ? 'border-blue-600 bg-blue-50 dark:bg-blue-950/50 text-blue-900 dark:text-blue-100 font-semibold'
                : 'border-slate-200 dark:border-slate-700 hover:border-blue-300 dark:hover:border-blue-700'
            }">
              <span class="w-7 h-7 rounded-lg flex items-center justify-center text-xs font-bold shrink-0 ${
                chosen === i ? 'bg-blue-600 text-white' : 'bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300'

        <!-- Prev / Next -->
        <div class="flex items-center justify-between mt-6 pt-4 border-t border-slate-200 dark:border-slate-800">
          <button id="btn-mock-prev" ${s.idx === 0 ? 'disabled' : ''} class="px-4 py-2 rounded-xl border border-slate-300 dark:border-slate-700 text-sm font-semibold disabled:opacity-40 hover:bg-slate-100 dark:hover:bg-slate-800">
            ← পূর্ববর্তী
          </button>
          <button id="btn-mock-next" class="px-5 py-2 rounded-xl bg-blue-600 hover:bg-blue-700 text-white text-sm font-bold">
            ${s.idx === s.questions.length - 1 ? 'সাবমিট করুন ✓' : 'পরবর্তী →'}
          </button>
        </div>
      </div>

      <!-- Quick Navigator -->
      <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-4">
        <div class="text-xs font-bold text-slate-500 dark:text-slate-400 mb-2.5">প্রশ্ন নেভিগেটর:</div>
        <div class="flex flex-wrap gap-1.5">
          ${s.questions.map((qq, idx) => {
            const isAns = s.answers[qq.id] !== undefined;
            const isCur = idx === s.idx;
            return `
              <button data-mock-jump="${idx}" class="mock-jump-btn w-8 h-8 rounded-lg text-xs font-bold transition ${
                isCur

                    ? 'bg-emerald-100 dark:bg-emerald-900/40 text-emerald-700 dark:text-emerald-300'
                    : 'bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-400'

function renderMockResults() {
  const s = state.mockSession;
  let correct = 0, wrong = 0, skipped = 0;
  s.questions.forEach((q) => {
    const a = s.answers[q.id];
    if (a === undefined) skipped++;
    else if (a === q.ans) correct++;
    else wrong++;
  });
  const penalty = s.negativeMarking ? wrong * 0.25 : 0;
  const netScore = Math.max(0, correct - penalty);
  const pct = Math.round((correct / s.questions.length) * 100);

  return `
    <div class="max-w-3xl mx-auto space-y-5">
      <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-6 text-center shadow-sm">
        <div class="text-4xl mb-2">${pct >= 80 ? '🏆' : pct >= 55 ? '🎯' : '📚'}</div>
        <h2 class="text-xl font-bold">মক টেস্ট ফলাফল</h2>
        <div class="text-3xl font-extrabold text-blue-600 dark:text-blue-400 mt-2">
          ${toBnNum(netScore.toFixed(2))} / ${toBnNum(s.questions.length)}
        </div>
        <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">
          ${s.negativeMarking ? `নেগেটিভ মার্কিং কাটা গেছে: -${toBnNum(penalty.toFixed(2))}` : 'নেগেটিভ মার্কিং বন্ধ ছিল'}
        </p>

        <div class="grid grid-cols-3 gap-3 mt-5">
          <div class="p-3 rounded-xl bg-emerald-50 dark:bg-emerald-950/40">
            <div class="text-lg font-bold text-emerald-600 dark:text-emerald-400">${toBnNum(correct)}</div>
            <div class="text-xs text-slate-600 dark:text-slate-400">সঠিক</div>
          </div>
          <div class="p-3 rounded-xl bg-rose-50 dark:bg-rose-950/40">
            <div class="text-lg font-bold text-rose-600 dark:text-rose-400">${toBnNum(wrong)}</div>
            <div class="text-xs text-slate-600 dark:text-slate-400">ভুল</div>
          </div>
          <div class="p-3 rounded-xl bg-slate-100 dark:bg-slate-800">
            <div class="text-lg font-bold text-slate-700 dark:text-slate-300">${toBnNum(skipped)}</div>
            <div class="text-xs text-slate-600 dark:text-slate-400">উত্তরহীন</div>
          </div>
        </div>

        <div class="mt-5 flex flex-wrap justify-center gap-2.5">
          <button id="btn-mock-new" class="px-5 py-2.5 rounded-xl bg-blue-600 hover:bg-blue-700 text-white text-sm font-bold">নতুন মক টেস্ট</button>
          <button id="btn-mock-to-learn" class="px-5 py-2.5 rounded-xl border border-slate-300 dark:border-slate-700 text-sm font-semibold hover:bg-slate-100 dark:hover:bg-slate-800">কোর্স পাথে ফিরুন</button>
        </div>
      </div>

      <!-- Detailed Answer Review -->
      <div class="space-y-3">
        <h3 class="font-bold text-base">বিস্তারিত উত্তর ও ব্যাখ্যা</h3>
        ${s.questions.map((q, i) => {
          const a = s.answers[q.id];
          const isOk = a === q.ans;
          const isSkip = a === undefined;
          return `
            <div class="bg-white dark:bg-slate-900 border rounded-xl p-4 ${
              isOk ? 'border-emerald-200 dark:border-emerald-900/60' : isSkip ? 'border-slate-200 dark:border-slate-800' : 'border-rose-200 dark:border-rose-900/60'
            }">
              <div class="flex items-start justify-between gap-2 mb-2">
                <div class="font-bold text-sm sm:text-base">${toBnNum(i + 1)}. ${q.q}</div>
                <span class="shrink-0 text-xs font-bold px-2 py-0.5 rounded ${
                  isOk ? 'bg-emerald-100 text-emerald-700 dark:bg-emerald-900/50 dark:text-emerald-300' : isSkip ? 'bg-slate-100 text-slate-600 dark:bg-slate-800 dark:text-slate-400' : 'bg-rose-100 text-rose-700 dark:bg-rose-900/50 dark:text-rose-300'
                }">${isOk ? 'সঠিক' : isSkip ? 'উত্তরহীন' : 'ভুল'}</span>
              </div>
              <div class="text-xs sm:text-sm space-y-1">
                ${!isSkip && !isOk ? `<div class="text-rose-600 dark:text-rose-400">আপনার উত্তর: <strong>${OPT_LABELS[a]}. ${q.opts[a]}</strong></div>` : ''}
                <div class="text-emerald-700 dark:text-emerald-400">সঠিক উত্তর: <strong>${OPT_LABELS[q.ans]}. ${q.opts[q.ans]}</strong></div>
                <div class="text-slate-600 dark:text-slate-400 pt-1">💡 ${q.exp}</div>
              </div>
            </div>
          `;
        }).join('')}
      </div>
    </div>
  `;
}

  const bookmarkMcqs = state.bookmarks.map((id) => ALL_MCQS.find((q) => q.id === id)).filter(Boolean);
  const activeList = state.reviewSubTab === 'mistakes' ? mistakeMcqs : bookmarkMcqs;

  return `
    <div class="max-w-3xl mx-auto space-y-4">
      <div class="flex flex-wrap items-center justify-between gap-3">
        <div class="flex gap-1.5 bg-slate-200/70 dark:bg-slate-800 p-1 rounded-xl">
          <button data-rev-tab="mistakes" class="rev-subtab px-4 py-1.5 rounded-lg text-sm font-bold transition ${
            state.reviewSubTab === 'mistakes' ? 'bg-white dark:bg-slate-900 text-rose-600 dark:text-rose-400 shadow-sm' : 'text-slate-600 dark:text-slate-400'

        ${activeList.length > 0 ? `
          <button id="btn-practice-review" class="btn-3d px-4 py-2 rounded-xl bg-blue-600 hover:bg-blue-700 text-white text-xs sm:text-sm font-bold shadow-sm">
            এগুলো কুইজ হিসেবে প্র্যাকটিস করুন →
          </button>

      </div>

      ${activeList.length === 0 ? `
        <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-10 text-center">
          <div class="text-4xl mb-2">${state.reviewSubTab === 'mistakes' ? '🎉' : '🔖'}</div>
          <h3 class="font-bold text-base">${state.reviewSubTab === 'mistakes' ? 'কোনো ভুল প্রশ্ন জমে নেই!' : 'এখনও কোনো প্রশ্ন বুকমার্ক করা হয়নি'}</h3>
          <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">

        <div class="space-y-3">
          ${activeList.map((q, i) => `
            <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl p-4">

                <button data-remove-rev="${q.id}" class="btn-remove-rev text-xs text-slate-400 hover:text-rose-500 font-semibold">সরান ✕</button>
              </div>
              <div class="font-bold text-sm sm:text-base mb-2">${toBnNum(i + 1)}. ${q.q}</div>
              <div class="text-xs sm:text-sm text-emerald-700 dark:text-emerald-400 font-semibold mb-1">
                সঠিক উত্তর: ${OPT_LABELS[q.ans]}. ${q.opts[q.ans]}
              </div>
              <div class="text-xs text-slate-600 dark:text-slate-400">💡 ${q.exp}</div>
            </div>
          `).join('')}
        </div>
      `}
    </div>
  `;
}

// ============================================================================
// INTERACTIVE SOLOLEARN LESSON & QUIZ PLAYER

function startLessonPlayer(lessonId, mode = 'full') {
  const les = ALL_LESSONS.find((l) => l.id === lessonId);
  if (!les) return;

  if (!state.unlimitedHearts && state.hearts <= 0) {
    openHeartsModal();
    return;
  }

  const steps = [];
  if (mode === 'full') {
    // Interleave theory cards then full MCQ set (SoloLearn style)
    les.cards.forEach((c) => steps.push({ type: 'card', data: c, revealed: false }));
  }
  les.mcqs.forEach((m) => steps.push({ type: 'mcq', data: m }));

  player = {
    sourceType: 'lesson',
    lessonId: les.id,
    title: `লেসন ${les.code}: ${les.title}`,
    steps,
    idx: 0,
    selectedOpt: null,
    checked: false,
    correctCount: 0,
    mcqTotal: les.mcqs.length,
    xpEarned: 0,
    sessionMistakes: [],
    finished: false
  };

  openPlayerOverlay();
}

function startCustomQuizPlayer(title, mcqs, sourceType = 'custom') {
  if (!mcqs || mcqs.length === 0) return;
  if (!state.unlimitedHearts && state.hearts <= 0) {
    openHeartsModal();
    return;
  }

  const shuffled = [...mcqs].sort(() => Math.random() - 0.5);
  player = {
    sourceType,
    lessonId: null,
    title,
    steps: shuffled.map((m) => ({ type: 'mcq', data: m })),
    idx: 0,
    selectedOpt: null,
    checked: false,
    correctCount: 0,
    mcqTotal: shuffled.length,
    xpEarned: 0,
    sessionMistakes: [],
    finished: false
  };

  openPlayerOverlay();
}

function openPlayerOverlay() {
  document.getElementById('player-overlay').classList.remove('hidden');
  document.body.style.overflow = 'hidden';
  renderPlayerStep();
}

function closePlayerOverlay() {
  document.getElementById('player-overlay').classList.add('hidden');
  document.body.style.overflow = '';
  player = null;
  renderApp();
}

        state.bookmarks.push(q.id);

      }
      saveState();
      renderPlayerStep();
    });

    document.getElementById('btn-check-ans')?.addEventListener('click', checkCurrentMcq);

function checkCurrentMcq() {
  if (!player || player.checked || player.selectedOpt === null) return;
  const q = player.steps[player.idx].data;
  player.checked = true;

  if (player.selectedOpt === q.ans) {
    player.correctCount++;
    player.xpEarned += 10;
    state.xp += 10;
    // If practicing mistakes, remove from mistake bank once mastered!
    if (player.sourceType === 'mistakes') {
      state.mistakes = state.mistakes.filter((id) => id !== q.id);
    }
  } else {
    player.sessionMistakes.push(q);
    if (!state.mistakes.includes(q.id)) {
      state.mistakes.push(q.id);
    }
    if (!state.unlimitedHearts) {
      state.hearts = Math.max(0, state.hearts - 1);
    }
  }
  saveState();
  updateHeaderStats();
  renderPlayerStep();
}

function advancePlayerStep() {
  if (!player) return;

  if (!state.unlimitedHearts && state.hearts <= 0) {
    closePlayerOverlay();
    openHeartsModal();
    return;
  }

  if (player.idx < player.steps.length - 1) {
    player.idx++;
    player.selectedOpt = null;
    player.checked = false;
    renderPlayerStep();
  } else {
    // Finish lesson
    player.finished = true;
    const acc = player.mcqTotal > 0 ? Math.round((player.correctCount / player.mcqTotal) * 100) : 100;
    if (player.lessonId) {
      const prev = state.completedLessons[player.lessonId];
      state.completedLessons[player.lessonId] = {
        bestAcc: prev ? Math.max(prev.bestAcc, acc) : acc,
        attempts: prev ? prev.attempts + 1 : 1
      };
      // Bonus XP for lesson completion
      player.xpEarned += 20;
      state.xp += 20;
    }
    saveState();
    updateHeaderStats();
    renderPlayerStep();
    if (acc >= 70 && typeof confetti === 'function') {
      confetti({ particleCount: 70, spread: 65, origin: { y: 0.6 } });
    }
  }
}

// ============================================================================
// MOCK EXAM LOGIC
// ============================================================================
function startMockExam() {
  const cfg = state.mockConfig;
  const pool = ALL_MCQS.filter((q) => cfg.modules.includes(q.moduleId));
  if (pool.length === 0) return;

  const shuffled = [...pool].sort(() => Math.random() - 0.5);
  const selected = shuffled.slice(0, Math.min(cfg.count, shuffled.length));

  clearInterval(mockTimerInterval);
  state.mockSession = {
    questions: selected,
    idx: 0,
    answers: {},
    negativeMarking: cfg.negativeMarking,
    useTimer: cfg.useTimer,
    timeLeft: selected.length * 45,
    finished: false
  };

  if (cfg.useTimer) {
    mockTimerInterval = setInterval(() => {
      if (!state.mockSession || state.mockSession.finished) {
        clearInterval(mockTimerInterval);
        return;
      }
      state.mockSession.timeLeft--;
      const disp = document.getElementById('mock-timer-display');
      if (disp) {
        const m = Math.floor(state.mockSession.timeLeft / 60);
        const s = state.mockSession.timeLeft % 60;
        disp.textContent = `⏱ ${toBnNum(String(m).padStart(2, '0'))}:${toBnNum(String(s).padStart(2, '0'))}`;
      }
      if (state.mockSession.timeLeft <= 0) {
        finishMockExam();
      }
    }, 1000);
  }

  renderApp();
}

function finishMockExam() {
  clearInterval(mockTimerInterval);
  if (!state.mockSession) return;
  state.mockSession.finished = true;

  let correct = 0;
  state.mockSession.questions.forEach((q) => {
    const a = state.mockSession.answers[q.id];
    if (a === q.ans) {
      correct++;
    } else if (a !== undefined) {
      if (!state.mistakes.includes(q.id)) state.mistakes.push(q.id);
    }
  });
  state.xp += correct * 10;
  saveState();
  renderApp();

  if (correct / state.mockSession.questions.length >= 0.7 && typeof confetti === 'function') {
    confetti({ particleCount: 75, spread: 70, origin: { y: 0.6 } });
  }
}

      renderApp();
    });
  });

  document.querySelectorAll('.btn-remove-rev').forEach((btn) => {
    btn.addEventListener('click', () => {
      const id = btn.dataset.removeRev;
      if (state.reviewSubTab === 'mistakes') {
        state.mistakes = state.mistakes.filter((x) => x !== id);
      } else {
        state.bookmarks = state.bookmarks.filter((x) => x !== id);
      }
      saveState();
      renderApp();
    });
  });

  document.getElementById('btn-practice-review')?.addEventListener('click', () => {
    const ids = state.reviewSubTab === 'mistakes' ? state.mistakes : state.bookmarks;
    const list = ids.map((id) => ALL_MCQS.find((q) => q.id === id)).filter(Boolean);
    startCustomQuizPlayer(
      state.reviewSubTab === 'mistakes' ? 'ভুল উত্তর প্র্যাকটিস' : 'বুকমার্ক প্র্যাকটিস',
      list,
      state.reviewSubTab
    );
  });

  // Notes View listeners
  const searchInput = document.getElementById('input-notes-search');
  if (searchInput) {
    searchInput.addEventListener('input', (e) => {
      const pos = e.target.selectionStart;
      state.notesSearch = e.target.value;
      renderApp();
      const el = document.getElementById('input-notes-search');
      if (el) {
        el.focus();
        el.setSelectionRange(pos, pos);
      }
    });
  }

  document.getElementById('btn-print-notes')?.addEventListener('click', () => window.print());
}

// Global Static Listeners
document.querySelectorAll('[data-tab]').forEach((btn) => {
  btn.addEventListener('click', () => {
    state.tab = btn.dataset.tab;
    renderApp();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
});

document.getElementById('btn-home-logo').addEventListener('click', () => {
  state.tab = 'learn';
  renderApp();
  window.scrollTo({ top: 0, behavior: 'smooth' });
});

document.getElementById('btn-theme-toggle').addEventListener('click', () => {
  state.darkMode = !state.darkMode;
  saveState();
  applyTheme();
});

document.getElementById('btn-hearts-modal').addEventListener('click', openHeartsModal);
document.getElementById('btn-sync-status').addEventListener('click', openHeartsModal);
document.getElementById('btn-player-close').addEventListener('click', closePlayerOverlay);
window.addEventListener('online', () => { pullFromCloud(false); });

document.getElementById('modal-backdrop').addEventListener('click', (e) => {
  if (e.target.id === 'modal-backdrop') {
    e.currentTarget.classList.add('hidden');
  }
});

// Keyboard shortcuts inside Lesson Player
document.addEventListener('keydown', (e) => {
  if (!player || player.finished) return;
  const step = player.steps[player.idx];
  if (step.type === 'mcq' && !player.checked) {
    if (['1', '2', '3', '4'].includes(e.key)) {
      player.selectedOpt = Number(e.key) - 1;
      renderPlayerStep();
    } else if (e.key === 'Enter' && player.selectedOpt !== null) {
      checkCurrentMcq();
    }
  } else if (e.key === 'Enter') {
    advancePlayerStep();
  }
});

// Boot App
renderApp();
pullFromCloud(false);
</script>
</body>
</html>
