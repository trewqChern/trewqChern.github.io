  <style>
    @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap');

    :root {
      --font-sans: 'Hind Siliguri', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    body {
      font-family: var(--font-sans);
      -webkit-tap-highlight-color: transparent;
    }

    /* Smooth custom scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.4); border-radius: 9999px; }

    /* SoloLearn-style 3D button press */
    .btn-3d {
      transition: transform 0.08s ease, box-shadow 0.08s ease, background-color 0.15s ease;
    }
    .btn-3d:active:not(:disabled) {
      transform: translateY(2px);
    }

    /* Node connector line */
    .path-line {
      background: repeating-linear-gradient(
        to bottom,
        #cbd5e1 0px,
        #cbd5e1 6px,
        transparent 6px,
        transparent 12px
      );
    }
    .dark .path-line {
      background: repeating-linear-gradient(
        to bottom,
        #334155 0px,
        #334155 6px,
        transparent 6px,
        transparent 12px
      );
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-slide-up {
      animation: slideUp 0.24s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes popIn {
      0% { transform: scale(0.92); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    .animate-pop {
      animation: popIn 0.2s ease-out forwards;
    }

    @media print {
      header, nav, .no-print { display: none !important; }
      body { background: #ffffff !important; color: #000000 !important; }
      .print-break { break-inside: avoid; }
    }
  </style>
  <script>
    tailwind.config = {

function toEnDigits(str) {
  const bn = '০১২৩৪৫৬৭৮৯';
  return String(str || '').replace(/[০-৯]/g, (ch) => String(bn.indexOf(ch)));
}

function normalizePhoneToProfile(raw) {
  const ascii = toEnDigits(raw).trim();
  if (!ascii) return null;
  if (/^phone_[0-9]{8,15}$/.test(ascii)) return ascii;
  let digits = ascii.replace(/[^0-9]/g, '');
  if (digits.startsWith('00')) digits = digits.slice(2);
  // Normalize Bangladeshi local 11-digit mobile numbers (01XXXXXXXXX -> 8801XXXXXXXXX)
  if (digits.length === 11 && digits.startsWith('01')) {
    digits = '88' + digits;
  }
  if (digits.length < 8 || digits.length > 15) return null;
  return 'phone_' + digits;
}

function formatProfileDisplay(profile) {
  if (!profile) return 'লিংক করা নেই';
  if (profile.startsWith('phone_')) return '+' + profile.slice(6);
  return profile;
}

// ============================================================================
// COMPREHENSIVE EVENT LOGGING (Local Ring Buffer + Cloudflare KV Batch Flush)
// ============================================================================
let pendingLogs = [];
let logFlushTimer = null;

function getLocalLogs() {
  try {
    const raw = localStorage.getItem(LOGS_STORAGE_KEY);
    return raw ? JSON.parse(raw) : [];
  } catch (e) {
    return [];
  }
}

function logEvent(type, data = {}, immediate = false) {
  const entry = {
    ts: Date.now(),
    type: String(type || 'event'),
    profile: getSyncProfile() || 'guest',
    sessionId: SESSION_ID,
    data: data && typeof data === 'object' ? data : {}
  };
  try {
    const existing = getLocalLogs();
    existing.unshift(entry);
    localStorage.setItem(LOGS_STORAGE_KEY, JSON.stringify(existing.slice(0, 250)));
  } catch (e) {}

  pendingLogs.push(entry);
  if (immediate || pendingLogs.length >= 8) {
    flushLogs();
  } else {
    clearTimeout(logFlushTimer);
    logFlushTimer = setTimeout(flushLogs, 2500);
  }
}

async function flushLogs() {
  clearTimeout(logFlushTimer);
  if (pendingLogs.length === 0) return;
  if (typeof navigator !== 'undefined' && navigator.onLine === false) return;
  const batch = pendingLogs.splice(0, 25);
  try {
    await fetch(LOGS_API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ entries: batch }),
      keepalive: true
    });
  } catch (e) {
    // Re-queue up to 50 entries on transient failure
    pendingLogs = [...batch, ...pendingLogs].slice(0, 50);
  }
}

window.addEventListener('error', (ev) => {
  logEvent('client_error', { msg: String(ev.message || 'error').slice(0, 180), line: ev.lineno || 0 });
});
window.addEventListener('unhandledrejection', (ev) => {
  logEvent('client_error', { msg: String(ev.reason || 'rejection').slice(0, 180) });
});
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') flushLogs();
});

function saveLocalOnly() {

    const toSave = { ...state, mockSession: null };

}

function saveState(skipCloudPush = false) {
  state.updatedAt = Date.now();
  saveLocalOnly();
  if (!skipCloudPush) {
    scheduleCloudPush();
  }
}

function scheduleCloudPush() {
  clearTimeout(syncPushTimer);
  syncPushTimer = setTimeout(() => {
    pushToCloud();
  }, 1100);
}

async function pushToCloud() {
  const profile = getSyncProfile();
  if (!profile) {
    updateSyncBadge('unlinked');
    return false;
  }
  if (typeof navigator !== 'undefined' && navigator.onLine === false) {
    updateSyncBadge('offline');
    return false;
  }
  updateSyncBadge('syncing');
  const payload = getSyncPayload();
  try {
    const res = await fetch(SYNC_API + encodeURIComponent(profile), {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ state: payload, updatedAt: payload.updatedAt })
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    if (data && data.ok) {
      lastSyncTime = Date.now();
      updateSyncBadge('synced');
      return true;
    }
    throw new Error('Sync failed');
  } catch (e) {
    updateSyncBadge('offline');
    return false;
  }
}

async function pullFromCloud(showNotification = false) {
  const profile = getSyncProfile();
  if (!profile) {
    updateSyncBadge('unlinked');
    return false;
  }
  if (typeof navigator !== 'undefined' && navigator.onLine === false) {
    updateSyncBadge('offline');
    return false;
  }
  updateSyncBadge('syncing');
  try {
    const res = await fetch(SYNC_API + encodeURIComponent(profile), { method: 'GET' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    if (data && data.ok) {
      const remoteTs = Number(data.updatedAt) || 0;
      const localTs = Number(state.updatedAt) || 0;
      if (data.exists && data.state && remoteTs > localTs) {
        const rs = data.state;
        state.xp = typeof rs.xp === 'number' ? rs.xp : state.xp;
        state.streak = typeof rs.streak === 'number' ? rs.streak : state.streak;
        state.hearts = typeof rs.hearts === 'number' ? rs.hearts : state.hearts;
        state.unlimitedHearts = typeof rs.unlimitedHearts === 'boolean' ? rs.unlimitedHearts : state.unlimitedHearts;
        state.unlockAll = typeof rs.unlockAll === 'boolean' ? rs.unlockAll : state.unlockAll;
        state.darkMode = typeof rs.darkMode === 'boolean' ? rs.darkMode : state.darkMode;
        state.completedLessons = rs.completedLessons && typeof rs.completedLessons === 'object' ? rs.completedLessons : state.completedLessons;
        state.mistakes = Array.isArray(rs.mistakes) ? rs.mistakes : state.mistakes;
        state.bookmarks = Array.isArray(rs.bookmarks) ? rs.bookmarks : state.bookmarks;
        state.customLessons = Array.isArray(rs.customLessons) ? rs.customLessons : (state.customLessons || []);
        state.aiChatHistory = Array.isArray(rs.aiChatHistory) ? rs.aiChatHistory : (state.aiChatHistory || []);
        state.updatedAt = remoteTs;
        rebuildDynamicIndex();
        saveLocalOnly();
        renderApp();
        if (showNotification) showToast('ক্লাউড থেকে সর্বশেষ অগ্রগতি লোড হয়েছে!');
      } else if (localTs > remoteTs && (state.xp > 0 || Object.keys(state.completedLessons).length > 0)) {
        await pushToCloud();
        if (showNotification) showToast('লোকাল অগ্রগতি ক্লাউডে সিঙ্ক হয়েছে!');
        return true;
      } else if (showNotification) {
        showToast('অগ্রগতি ইতিমধ্যেই আপ-টু-ডেট আছে!');
      }
      lastSyncTime = Date.now();
      updateSyncBadge('synced');
      return true;
    }
    throw new Error('Bad response');
  } catch (e) {
    updateSyncBadge('offline');
    if (showNotification) showToast('অফলাইন মোড — অনলাইনে এলে অটো সিঙ্ক হবে');
    return false;
  }
}

                    ${done ? `<span class="text-[11px] font-bold text-emerald-600 dark:text-emerald-400 bg-emerald-100 dark:bg-emerald-900/40 px-2 py-0.5 rounded-md">সর্বোচ্চ: ${toBnNum(done.bestAcc)}%</span>` : ''}

                </div>
                <div class="flex items-center gap-2 shrink-0">
                  <button data-start-lesson="${les.id}" data-mode="full" class="btn-start-lesson btn-3d px-3.5 py-2 rounded-xl text-xs sm:text-sm font-bold bg-amber-500 hover:bg-amber-600 text-slate-950 flex items-center gap-1.5 shadow-sm">
                    <i data-lucide="play" class="w-3.5 h-3.5 fill-current"></i> শিখুন + MCQ
                  </button>
                  <button data-start-lesson="${les.id}" data-mode="quiz" class="btn-start-lesson px-3 py-2 rounded-xl text-xs sm:text-sm font-semibold border border-slate-300 dark:border-slate-600 hover:bg-slate-100 dark:hover:bg-slate-800">
                    শুধু MCQ
                  </button>
                  <button data-del-custom="${les.id}" title="লেসন মুছুন" class="btn-del-custom p-2 rounded-xl text-slate-400 hover:text-rose-500 hover:bg-rose-50 dark:hover:bg-rose-950/40 transition">
                    <i data-lucide="trash-2" class="w-4 h-4"></i>
                  </button>
                </div>
              </div>
            `;
          }).join('')}
        </div>
      </section>
    ` : ''}

    <!-- Modules & SoloLearn Path -->
    <div class="space-y-8">
      ${visibleModules.map((mod, mIdx) => {
        const modDone = mod.lessons.filter((l) => state.completedLessons[l.id]).length;
        const modMcqCount = mod.lessons.reduce((a, l) => a + l.mcqs.length, 0);
        return `
          <section class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl overflow-hidden shadow-sm">

                <div>
                  <div class="text-xs font-semibold uppercase tracking-wider text-white/80">মডিউল ${toBnNum(mIdx + 1)} • ${toBnNum(mod.lessons.length)}টি লেসন • ${toBnNum(modMcqCount)}টি MCQ</div>
                  <h2 class="text-lg font-bold">${mod.title}</h2>
                  <p class="text-xs text-white/85 mt-0.5">${mod.subtitle}</p>

            <!-- Vertical SoloLearn Nodes -->
            <div class="p-4 sm:p-6 relative">
              <div class="space-y-3.5">
                ${mod.lessons.map((les, idx) => {
                  const done = state.completedLessons[les.id];
                  const prevLesson = les.globalIndex > 0 ? ALL_LESSONS[les.globalIndex - 1] : null;
                  const unlocked = state.unlockAll || les.globalIndex === 0 || !!done || (prevLesson && !!state.completedLessons[prevLesson.id]);
                  const isNext = unlocked && !done;

                  return `
                    <div class="relative flex items-stretch gap-3 sm:gap-4">

                      <div class="flex flex-col items-center shrink-0 w-10">
                        <div class="w-10 h-10 rounded-full flex items-center justify-center font-bold text-sm border-2 transition ${

                            ? 'bg-emerald-500 border-emerald-500 text-white shadow-sm'

                              ? 'bg-blue-600 border-blue-600 text-white ring-4 ring-blue-100 dark:ring-blue-900/50'

                          <div class="min-w-0">
                            <div class="flex flex-wrap items-center gap-1.5 mb-1">
                              <span class="text-[11px] font-bold px-2 py-0.5 rounded-md ${mod.badgeBg}">লেসন ${les.code}</span>
                              <span class="text-[11px] font-medium text-slate-500 dark:text-slate-400">${toBnNum(les.cards.length)}টি নোট কার্ড • ${toBnNum(les.mcqs.length)}টি MCQ</span>
                              ${done ? `<span class="text-[11px] font-bold text-emerald-600 dark:text-emerald-400 bg-emerald-100 dark:bg-emerald-900/40 px-2 py-0.5 rounded-md">সর্বোচ্চ: ${toBnNum(done.bestAcc)}%</span>` : ''}

                                !unlocked
                                  ? 'bg-slate-200 dark:bg-slate-800 text-slate-400 cursor-not-allowed'
                                  : done
                                    ? 'bg-emerald-600 hover:bg-emerald-700 text-white shadow-sm'
                                    : 'bg-blue-600 hover:bg-blue-700 text-white shadow-sm'
                              }"
                            >
                              <i data-lucide="play" class="w-3.5 h-3.5 fill-current"></i>
                              ${done ? 'পুনরায় পড়ুন' : 'শিখুন + MCQ'}
                            </button>
                            <button
                              data-start-lesson="${les.id}"
                              data-mode="quiz"
                              ${unlocked ? '' : 'disabled'}
                              title="শুধু এই লেসনের MCQ প্র্যাকটিস করুন"
                              class="btn-start-lesson px-3 py-2 rounded-xl text-xs sm:text-sm font-semibold border transition ${
                                !unlocked
                                  ? 'border-slate-200 dark:border-slate-800 text-slate-400 cursor-not-allowed'
                                  : 'border-slate-300 dark:border-slate-600 text-slate-700 dark:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-700'
                              }"
                            >
                              শুধু MCQ
                            </button>
                          </div>
                        </div>
                      </div>

                  `;

              </div>
            </div>
          </section>
        `;
      }).join('')}
    </div>
  `;
}

  return `

function renderMockActive() {
  const s = state.mockSession;
  const q = s.questions[s.idx];
  const chosen = s.answers[q.id];
  const answeredCount = Object.keys(s.answers).length;
  const mins = Math.floor(s.timeLeft / 60);
  const secs = s.timeLeft % 60;
  const timeStr = `${toBnNum(String(mins).padStart(2, '0'))}:${toBnNum(String(secs).padStart(2, '0'))}`;

  return `
    <div class="max-w-3xl mx-auto space-y-4">
      <!-- Top Status Bar -->
      <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-3.5 flex flex-wrap items-center justify-between gap-2 shadow-sm">
        <div class="flex items-center gap-2">
          <span class="text-xs font-bold px-2.5 py-1 rounded-lg bg-blue-100 text-blue-700 dark:bg-blue-900/50 dark:text-blue-300">
            প্রশ্ন ${toBnNum(s.idx + 1)} / ${toBnNum(s.questions.length)}
          </span>
          <span class="text-xs font-semibold text-slate-500 dark:text-slate-400">
            উত্তর দেওয়া হয়েছে: ${toBnNum(answeredCount)}
          </span>
        </div>
        <div class="flex items-center gap-2">
          ${s.useTimer ? `
            <span id="mock-timer-display" class="text-sm font-bold px-3 py-1 rounded-lg ${s.timeLeft < 60 ? 'bg-rose-100 text-rose-700 animate-pulse' : 'bg-slate-100 dark:bg-slate-800 text-slate-800 dark:text-slate-200'}">
              ⏱ ${timeStr}
            </span>
          ` : ''}
          <button id="btn-submit-mock" class="px-3.5 py-1.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-xs sm:text-sm font-bold transition">
            জমা দিন
          </button>
        </div>
      </div>

      <!-- Question Card -->
      <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-5 sm:p-6 shadow-sm">
        <div class="flex items-center justify-between gap-2 mb-3">
          <span class="text-xs font-semibold text-slate-500 dark:text-slate-400">${q.moduleTitle.split(' ')[0]} • ${q.lessonTitle}</span>
          ${chosen !== undefined ? `<button id="btn-mock-clear" class="text-xs text-rose-500 hover:underline font-semibold">উত্তর মুছুন</button>` : ''}
        </div>
        <h2 class="text-base sm:text-lg font-bold text-slate-900 dark:text-white leading-relaxed mb-5">
          ${toBnNum(s.idx + 1)}. ${q.q}
        </h2>
        <div class="space-y-2.5">
          ${q.opts.map((opt, i) => `
            <button data-mock-opt="${i}" class="mock-opt-btn w-full text-left p-3.5 rounded-xl border-2 transition flex items-center gap-3 ${
              chosen === i
                ? 'border-blue-600 bg-blue-50 dark:bg-blue-950/50 text-blue-900 dark:text-blue-100 font-semibold'
                : 'border-slate-200 dark:border-slate-700 hover:border-blue-300 dark:hover:border-blue-700'
            }">
              <span class="w-7 h-7 rounded-lg flex items-center justify-center text-xs font-bold shrink-0 ${
                chosen === i ? 'bg-blue-600 text-white' : 'bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300'
              }">${OPT_LABELS[i]}</span>
              <span class="text-sm sm:text-base">${opt}</span>
            </button>
          `).join('')}
        </div>

        <!-- Prev / Next -->
        <div class="flex items-center justify-between mt-6 pt-4 border-t border-slate-200 dark:border-slate-800">
          <button id="btn-mock-prev" ${s.idx === 0 ? 'disabled' : ''} class="px-4 py-2 rounded-xl border border-slate-300 dark:border-slate-700 text-sm font-semibold disabled:opacity-40 hover:bg-slate-100 dark:hover:bg-slate-800">
            ← পূর্ববর্তী
          </button>
          <button id="btn-mock-next" class="px-5 py-2 rounded-xl bg-blue-600 hover:bg-blue-700 text-white text-sm font-bold">
            ${s.idx === s.questions.length - 1 ? 'সাবমিট করুন ✓' : 'পরবর্তী →'}
          </button>
        </div>
      </div>

      <!-- Quick Navigator -->
      <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-4">
        <div class="text-xs font-bold text-slate-500 dark:text-slate-400 mb-2.5">প্রশ্ন নেভিগেটর:</div>
        <div class="flex flex-wrap gap-1.5">
          ${s.questions.map((qq, idx) => {
            const isAns = s.answers[qq.id] !== undefined;
            const isCur = idx === s.idx;
            return `
              <button data-mock-jump="${idx}" class="mock-jump-btn w-8 h-8 rounded-lg text-xs font-bold transition ${
                isCur
                  ? 'bg-blue-600 text-white ring-2 ring-blue-300'
                  : isAns
                    ? 'bg-emerald-100 dark:bg-emerald-900/40 text-emerald-700 dark:text-emerald-300'
                    : 'bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-400'
              }">${toBnNum(idx + 1)}</button>
            `;
          }).join('')}
        </div>
      </div>
    </div>
  `;
}

function renderMockResults() {
  const s = state.mockSession;
  let correct = 0, wrong = 0, skipped = 0;
  s.questions.forEach((q) => {
    const a = s.answers[q.id];
    if (a === undefined) skipped++;
    else if (a === q.ans) correct++;
    else wrong++;
  });
  const penalty = s.negativeMarking ? wrong * 0.25 : 0;
  const netScore = Math.max(0, correct - penalty);
  const pct = Math.round((correct / s.questions.length) * 100);

  return `
    <div class="max-w-3xl mx-auto space-y-5">
      <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-6 text-center shadow-sm">
        <div class="text-4xl mb-2">${pct >= 80 ? '🏆' : pct >= 55 ? '🎯' : '📚'}</div>
        <h2 class="text-xl font-bold">মক টেস্ট ফলাফল</h2>
        <div class="text-3xl font-extrabold text-blue-600 dark:text-blue-400 mt-2">
          ${toBnNum(netScore.toFixed(2))} / ${toBnNum(s.questions.length)}
        </div>
        <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">
          ${s.negativeMarking ? `নেগেটিভ মার্কিং কাটা গেছে: -${toBnNum(penalty.toFixed(2))}` : 'নেগেটিভ মার্কিং বন্ধ ছিল'}
        </p>

        <div class="grid grid-cols-3 gap-3 mt-5">
          <div class="p-3 rounded-xl bg-emerald-50 dark:bg-emerald-950/40">
            <div class="text-lg font-bold text-emerald-600 dark:text-emerald-400">${toBnNum(correct)}</div>
            <div class="text-xs text-slate-600 dark:text-slate-400">সঠিক</div>
          </div>
          <div class="p-3 rounded-xl bg-rose-50 dark:bg-rose-950/40">
            <div class="text-lg font-bold text-rose-600 dark:text-rose-400">${toBnNum(wrong)}</div>
            <div class="text-xs text-slate-600 dark:text-slate-400">ভুল</div>
          </div>
          <div class="p-3 rounded-xl bg-slate-100 dark:bg-slate-800">
            <div class="text-lg font-bold text-slate-700 dark:text-slate-300">${toBnNum(skipped)}</div>
            <div class="text-xs text-slate-600 dark:text-slate-400">উত্তরহীন</div>
          </div>
        </div>

        <div class="mt-5 flex flex-wrap justify-center gap-2.5">
          <button id="btn-mock-new" class="px-5 py-2.5 rounded-xl bg-blue-600 hover:bg-blue-700 text-white text-sm font-bold">নতুন মক টেস্ট</button>
          <button id="btn-mock-to-learn" class="px-5 py-2.5 rounded-xl border border-slate-300 dark:border-slate-700 text-sm font-semibold hover:bg-slate-100 dark:hover:bg-slate-800">কোর্স পাথে ফিরুন</button>
        </div>
      </div>

      <!-- Detailed Answer Review -->

function formatChatText(txt) {
  const esc = String(txt || '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
  return esc
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/`([^`]+)`/g, '<code class="px-1 py-0.5 rounded bg-slate-200/70 dark:bg-slate-800 text-xs font-mono">$1</code>')
    .replace(/\n/g, '<br>');
}

async function sendAiChatMessage(text, forceLessonOverride = null) {
  const clean = String(text || '').trim();
  if (!clean || aiChatBusy) return;
  const shouldForce = forceLessonOverride !== null ? forceLessonOverride : chatForceLesson;

  state.aiChatHistory = [...(state.aiChatHistory || []), { role: 'user', text: clean, ts: Date.now() }].slice(-30);
  aiChatBusy = true;
  saveLocalOnly();
  renderApp();
  const box = document.getElementById('chat-messages-box');
  if (box) box.scrollTop = box.scrollHeight;

  const t0 = Date.now();
  const recentMistakes = (state.mistakes || [])
    .map((id) => ALL_MCQS.find((q) => q.id === id)?.q)
    .filter(Boolean)
    .slice(0, 6);

  try {
    const resp = await fetch(AI_CHAT_API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        messages: state.aiChatHistory.slice(-10).map((m) => ({ role: m.role, text: m.text })),
        forceLesson: shouldForce,
        context: {
          xp: state.xp,
          completedCount: Object.keys(state.completedLessons || {}).length,
          recentMistakes
        }
      })
    });
    const data = await resp.json();
    if (!resp.ok || !data.ok) {
      throw new Error(data.error || 'AI চ্যাট থেকে উত্তর পাওয়া যায়নি');
    }

    let createdLessonId = null;
    if (data.lesson && Array.isArray(data.lesson.mcqs) && data.lesson.mcqs.length > 0) {
      createdLessonId = 'ai_' + Date.now().toString(36);
      const created = {
        id: createdLessonId,
        title: data.lesson.title,
        subtitle: data.lesson.subtitle,
        moduleId: data.lesson.moduleId || 'custom',
        cards: data.lesson.cards || [],
        mcqs: data.lesson.mcqs.map((m, i) => ({ ...m, id: `${createdLessonId}_q${i + 1}` })),
        nextSuggestions: data.lesson.nextSuggestions || [],
        createdAt: Date.now(),
        model: data.model || 'gemini-3.8-flash'
      };
      state.customLessons = [created, ...(state.customLessons || [])];
      rebuildDynamicIndex();
      showToast(`চ্যাট থেকে নতুন AI লেসন তৈরি হয়েছে (${toBnNum(created.mcqs.length)}টি MCQ)!`);
    }

    state.aiChatHistory = [
      ...state.aiChatHistory,
      {
        role: 'assistant',
        text: data.reply || 'সম্পন্ন হয়েছে!',
        lessonId: createdLessonId,
        suggestedPrompts: data.suggestedPrompts || [],
        ts: Date.now()
      }
    ].slice(-30);

    chatForceLesson = false;
    aiChatBusy = false;
    saveState();
    logEvent('ai_chat_message', {
      promptPreview: clean.slice(0, 80),
      createdLesson: !!createdLessonId,
      forceLesson: shouldForce,
      latencyMs: Date.now() - t0
    }, true);
    renderApp();
    const box2 = document.getElementById('chat-messages-box');
    if (box2) box2.scrollTop = box2.scrollHeight;
  } catch (err) {
    aiChatBusy = false;
    state.aiChatHistory = [
      ...state.aiChatHistory,
      { role: 'assistant', text: '⚠️ ' + (err.message || 'সংযোগ সমস্যা হয়েছে। আবার চেষ্টা করুন।'), ts: Date.now() }
    ].slice(-30);
    saveLocalOnly();
    logEvent('ai_chat_error', { error: String(err.message || err).slice(0, 140), latencyMs: Date.now() - t0 }, true);
    renderApp();
  }
}

      ta.select();
      document.execCommand('copy');
      ta.remove();
      showToast('লগ JSON কপি হয়েছে!');
    }
  });
}

function startLessonPlayer(lessonId, mode = 'full') {
  const les = ALL_LESSONS.find((l) => l.id === lessonId);
  if (!les) return;

  if (!state.unlimitedHearts && state.hearts <= 0) {
    openHeartsModal();
    return;
  }

  const steps = [];
  if (mode === 'full') {
    // Interleave theory cards then full MCQ set (SoloLearn style)
    les.cards.forEach((c) => steps.push({ type: 'card', data: c, revealed: false }));
  }
  les.mcqs.forEach((m) => steps.push({ type: 'mcq', data: m }));

  player = {
    sourceType: 'lesson',
    lessonId: les.id,
    title: `লেসন ${les.code}: ${les.title}`,
    steps,
    idx: 0,
    selectedOpt: null,
    checked: false,
    correctCount: 0,
    mcqTotal: les.mcqs.length,
    xpEarned: 0,
    sessionMistakes: [],
    finished: false
  };

  logEvent('lesson_start', { lessonId: les.id, mode, mcqs: les.mcqs.length });
  openPlayerOverlay();
}

function startCustomQuizPlayer(title, mcqs, sourceType = 'custom') {
  if (!mcqs || mcqs.length === 0) return;
  if (!state.unlimitedHearts && state.hearts <= 0) {
    openHeartsModal();
    return;
  }

  const shuffled = [...mcqs].sort(() => Math.random() - 0.5);
  player = {
    sourceType,
    lessonId: null,
    title,
    steps: shuffled.map((m) => ({ type: 'mcq', data: m })),
    idx: 0,
    selectedOpt: null,
    checked: false,
    correctCount: 0,
    mcqTotal: shuffled.length,
    xpEarned: 0,
    sessionMistakes: [],
    finished: false
  };

  openPlayerOverlay();
}

function checkCurrentMcq() {
  if (!player || player.checked || player.selectedOpt === null) return;
  const q = player.steps[player.idx].data;
  player.checked = true;

  if (player.selectedOpt === q.ans) {
    player.correctCount++;
    player.xpEarned += 10;
    state.xp += 10;
    // If practicing mistakes, remove from mistake bank once mastered!
    if (player.sourceType === 'mistakes') {
      state.mistakes = state.mistakes.filter((id) => id !== q.id);
    }
  } else {
    player.sessionMistakes.push(q);
    if (!state.mistakes.includes(q.id)) {
      state.mistakes.push(q.id);
    }
    if (!state.unlimitedHearts) {
      state.hearts = Math.max(0, state.hearts - 1);
    }
  }
  saveState();
  updateHeaderStats();
  renderPlayerStep();
}

function advancePlayerStep() {
  if (!player) return;

  if (!state.unlimitedHearts && state.hearts <= 0) {
    closePlayerOverlay();
    openHeartsModal();
    return;
  }

  if (player.idx < player.steps.length - 1) {
    player.idx++;
    player.selectedOpt = null;
    player.checked = false;
    renderPlayerStep();
  } else {
    // Finish lesson
    player.finished = true;
    const acc = player.mcqTotal > 0 ? Math.round((player.correctCount / player.mcqTotal) * 100) : 100;
    if (player.lessonId) {
      const prev = state.completedLessons[player.lessonId];
      state.completedLessons[player.lessonId] = {
        bestAcc: prev ? Math.max(prev.bestAcc, acc) : acc,
        attempts: prev ? prev.attempts + 1 : 1
      };
      // Bonus XP for lesson completion
      player.xpEarned += 20;
      state.xp += 20;
    }
    saveState();
    logEvent('lesson_complete', { lessonId: player.lessonId || player.sourceType, acc, correct: player.correctCount, total: player.mcqTotal, xp: player.xpEarned }, true);
    updateHeaderStats();
    renderPlayerStep();
    if (acc >= 70 && typeof confetti === 'function') {
      confetti({ particleCount: 70, spread: 65, origin: { y: 0.6 } });
    }
  }
}

// MOCK EXAM LOGIC
// ============================================================================
function startMockExam() {
  const cfg = state.mockConfig;
  const pool = ALL_MCQS.filter((q) => cfg.modules.includes(q.moduleId));
  if (pool.length === 0) return;

  const shuffled = [...pool].sort(() => Math.random() - 0.5);
  const selected = shuffled.slice(0, Math.min(cfg.count, shuffled.length));

  clearInterval(mockTimerInterval);
  logEvent('mock_start', { count: selected.length, modules: cfg.modules, neg: cfg.negativeMarking, timer: cfg.useTimer });
  state.mockSession = {
    questions: selected,
    idx: 0,
    answers: {},
    negativeMarking: cfg.negativeMarking,
    useTimer: cfg.useTimer,
    timeLeft: selected.length * 45,
    finished: false
  };

  if (cfg.useTimer) {
    mockTimerInterval = setInterval(() => {
      if (!state.mockSession || state.mockSession.finished) {
        clearInterval(mockTimerInterval);
        return;
      }
      state.mockSession.timeLeft--;
      const disp = document.getElementById('mock-timer-display');
      if (disp) {
        const m = Math.floor(state.mockSession.timeLeft / 60);
        const s = state.mockSession.timeLeft % 60;
        disp.textContent = `⏱ ${toBnNum(String(m).padStart(2, '0'))}:${toBnNum(String(s).padStart(2, '0'))}`;
      }
      if (state.mockSession.timeLeft <= 0) {
        finishMockExam();
      }
    }, 1000);
  }

  renderApp();
}

function finishMockExam() {
  clearInterval(mockTimerInterval);
  if (!state.mockSession) return;
  state.mockSession.finished = true;

  let correct = 0;
  state.mockSession.questions.forEach((q) => {
    const a = state.mockSession.answers[q.id];
    if (a === q.ans) {
      correct++;
    } else if (a !== undefined) {
      if (!state.mistakes.includes(q.id)) state.mistakes.push(q.id);
    }
  });
  state.xp += correct * 10;
  saveState();
  logEvent('mock_complete', { correct, total: state.mockSession.questions.length, neg: state.mockSession.negativeMarking }, true);
  renderApp();

  if (correct / state.mockSession.questions.length >= 0.7 && typeof confetti === 'function') {
    confetti({ particleCount: 75, spread: 70, origin: { y: 0.6 } });
  }
}

      return;
    }
    runAiLessonGeneration(val, moduleHint, sampleMistakes);
  };

  document.getElementById('btn-submit-ai')?.addEventListener('click', trigger);

  if (autoStart && (prefill || sampleMistakes.length > 0)) {
    trigger();
  }
}

async function runAiLessonGeneration(confusion, moduleHint, sampleMistakes) {
  if (aiGenBusy) return;
  aiGenBusy = true;

  const statusEl = document.getElementById('ai-gen-status');
  const submitBtn = document.getElementById('btn-submit-ai');
  const cancelBtn = document.getElementById('btn-cancel-ai');

  if (submitBtn) {
    submitBtn.disabled = true;
    submitBtn.textContent = 'তৈরি হচ্ছে...';
  }
  if (cancelBtn) cancelBtn.disabled = true;

  if (statusEl) {
    statusEl.className = 'p-3.5 rounded-xl bg-blue-50 dark:bg-blue-950/40 border border-blue-200 dark:border-blue-800/60 text-xs sm:text-sm text-blue-800 dark:text-blue-200 flex items-center gap-2.5';
    statusEl.innerHTML = `<span class="inline-block w-4 h-4 border-2 border-blue-600 border-t-transparent rounded-full animate-spin shrink-0"></span><span><strong>Gemini 3.8 Flash (High)</strong> আপনার কনফিউশন বিশ্লেষণ করে নোট কার্ড ও পর্যাপ্ত MCQ তৈরি করছে... (১৫–৩০ সেকেন্ড লাগতে পারে)</span>`;
  }

  try {
    const resp = await fetch(AI_LESSON_API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ confusion, moduleHint, sampleMistakes })
    });
    const data = await resp.json();
    if (!resp.ok || !data.ok || !data.lesson) {
      throw new Error(data.error || 'লেসন তৈরি করা যায়নি');
    }

    const newId = 'ai_' + Date.now().toString(36);
    const created = {
      id: newId,
      title: data.lesson.title,
      subtitle: data.lesson.subtitle,
      moduleId: data.lesson.moduleId || 'custom',
      cards: data.lesson.cards || [],
      mcqs: (data.lesson.mcqs || []).map((m, i) => ({ ...m, id: `${newId}_q${i + 1}` })),
      nextSuggestions: data.lesson.nextSuggestions || [],
      createdAt: Date.now(),
      model: data.model || 'gemini-3.8-flash'
    };

    state.customLessons = [created, ...(state.customLessons || [])];
    rebuildDynamicIndex();
    saveState();
    logEvent('ai_lesson_generate', { confusion: confusion.slice(0, 80), mcqs: created.mcqs.length, model: created.model }, true);

    aiGenBusy = false;
    document.getElementById('modal-backdrop').classList.add('hidden');
    showToast(`নতুন AI লেসন তৈরি হয়েছে (${toBnNum(created.mcqs.length)}টি MCQ)!`);
    renderApp();
    startLessonPlayer(newId, 'full');
  } catch (err) {
    aiGenBusy = false;
    if (submitBtn) {
      submitBtn.disabled = false;
      submitBtn.textContent = '↻ পুনরায় চেষ্টা করুন';
    }
    if (cancelBtn) cancelBtn.disabled = false;
    if (statusEl) {
      statusEl.className = 'p-3.5 rounded-xl bg-rose-50 dark:bg-rose-950/40 border border-rose-200 dark:border-rose-800/60 text-xs sm:text-sm text-rose-700 dark:text-rose-300';
      statusEl.textContent = '⚠️ ' + (err.message || 'সার্ভারে সংযোগ করা যায়নি। আবার চেষ্টা করুন।');
    }
  }
}

      <h3 class="text-lg font-extrabold text-slate-900 dark:text-white">অগ্রগতি সেভ করতে ফোন নম্বর দিন</h3>
      <p class="text-xs sm:text-sm text-slate-500 dark:text-slate-400 mt-1">
        আপনার XP, সম্পন্ন লেসন, ভুল উত্তর ও AI লেসন ক্লাউডে সেভ থাকবে—একই নম্বর দিয়ে যেকোনো ফোন বা পিসি থেকে ফিরে পাবেন।
      </p>
    </div>

    <form id="form-phone-onboard" class="space-y-3">
      <div>
        <label class="block text-xs font-bold mb-1 text-slate-700 dark:text-slate-300">মোবাইল নম্বর</label>
        <input id="input-onboard-phone" type="tel" autocomplete="tel" required placeholder="01XXXXXXXXX বা +8801XXXXXXXXX" class="w-full px-3.5 py-2.5 rounded-xl border-2 border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-950 text-base font-mono focus:outline-none focus:border-blue-600" />
        <div id="onboard-phone-err" class="hidden text-xs text-rose-600 dark:text-rose-400 font-semibold mt-1"></div>
      </div>

      <button type="submit" class="btn-3d w-full py-3 rounded-xl bg-gradient-to-r from-blue-600 to-teal-500 hover:from-blue-700 hover:to-teal-600 text-white font-extrabold text-sm sm:text-base shadow-md">
        সেভ করুন ও পড়া শুরু করুন →
      </button>

      <button type="button" id="btn-skip-phone" class="w-full py-2 text-xs font-semibold text-slate-500 dark:text-slate-400 hover:text-slate-700 dark:hover:text-slate-200 transition">
        পরে দেব (শুধু এই ডিভাইসে প্র্যাকটিস করুন)
      </button>
    </form>
  `;

  setTimeout(() => document.getElementById('input-onboard-phone')?.focus(), 80);

  document.getElementById('form-phone-onboard')?.addEventListener('submit', async (e) => {
    e.preventDefault();
    const raw = document.getElementById('input-onboard-phone')?.value || '';
    const errEl = document.getElementById('onboard-phone-err');
    const norm = setSyncPhone(raw);
    if (!norm) {
      if (errEl) {
        errEl.textContent = 'সঠিক মোবাইল নম্বর দিন (যেমন: 01712345678 বা +8801712345678)';
        errEl.classList.remove('hidden');
      }
      return;
    }
    backdrop.classList.add('hidden');
    logEvent('phone_linked', { profile: norm }, true);
    showToast(`নম্বর ${formatProfileDisplay(norm)} যুক্ত হয়েছে!`);
    await pullFromCloud(true);
  });

  document.getElementById('btn-skip-phone')?.addEventListener('click', () => {
    try { localStorage.setItem(SYNC_SKIP_KEY, '1'); } catch (e) {}
    logEvent('phone_skipped', {});
    backdrop.classList.add('hidden');
    updateSyncBadge('unlinked');
  });
}

// Boot App
renderApp();
logEvent('app_open', { w: window.innerWidth, h: window.innerHeight, dark: !!state.darkMode, online: navigator.onLine !== false });
if (getSyncProfile()) {
  pullFromCloud(false);
} else {
  updateSyncBadge('unlinked');
  let skipped = false;
  try { skipped = localStorage.getItem(SYNC_SKIP_KEY) === '1'; } catch (e) {}
  if (!skipped) {
    openPhoneOnboardingModal();
  }
}
</script>
</body>
</html>
